<script id="D" type="application/json">[{"i":"5332013130973535","t":"二月龄宝宝刚经历了此生最大的挫折——打疫苗💉。现在变得极度melodramatic，换个尿布都能大吼大哭到两个鬓角湿透🥹\n\n湿巾擦屁股：这么凉，肯定是针头！为什么你又要ju我！\n换尿布：把我抬起来，肯定是在找角度ju我。苍天啊——\n换衣服（因为太沮丧尿了自己一身）：不要摸我的腿，不要摸我的手，你摸我就是要ju我！\n抱起来：你要抱我去哪儿？！肯定是抱去ju我！救命！\n\n（我知道他哭是因为疫苗反应不舒服。早上他被ju的时候，我也差点哭了。）","d":"2026.08.15","y":2026,"mo":8,"l":2,"g":"发布于 美国"},{"i":"5331940433464159","t":"压力把我变成晨型人，锻炼让EM变成晨型人。宝宝呢？既不需要上班又不需要增肌，到底是什么让他每天早上五点五十八睁眼开始咿咿呀呀啊！","d":"2026.08.14","y":2026,"mo":8,"l":1,"c":2,"g":"发布于 美国"},{"i":"5331259402486843","t":"娃满两个月啦。出生时是我体重的二十几分之一，如今长到十几分之一，越来越不像小猴子了😂他还发展了新技能：会笑了，偶尔还咿咿呀呀说一两句婴语。\n唯一还留着胎儿痕迹的，是喜欢挂在我或者EM身上，假装自己还没被剪断，仍旧是我们心跳和体温的延伸。","d":"2026.08.13","y":2026,"mo":8,"l":12,"g":"发布于 美国"},{"i":"5331133542700163","t":"喂完夜奶我（只）竖抱娃八分钟就去bassinet transfer，而不是持续几周的十五分钟。娃扭动蹬腿，但还好没醒。他哼唧了两声，仿佛在说：我妈（又）偷懒了，但算了算了，看在奶得及时，我小人不记大人过吧。😂","d":"2026.08.12","y":2026,"mo":8,"l":3,"g":"发布于 美国"},{"i":"5328651233267253","t":"A shared milestone tonight.\n\nBaby: “I’ve never been this hungry in my life.”\n\nFact check: True. He just slept a record 5.5-hour stretch.\n\nMe: “I’ve never had to hold this much milk in my life.”\n\nFact check: Also true. One breast leaked onto the bed. The other reached the structural integrity of concrete.\n\nStatistically, we were both having the most extreme night of our entire lives—his after 7.5 weeks, mine after 32 years. This has become the most unexpected bonding experience with my baby. 😂","d":"2026.08.05","y":2026,"mo":8,"l":6,"c":2,"g":"发布于 美国"},{"i":"5327871860016745","t":"每次bassinet transfer 都是开盲盒——永远不知道娃是会落地醒还是继续睡过去。\n\n（我之所以在这个点发微博，就是又一次transfer失败了…）","d":"2026.08.03","y":2026,"mo":8,"l":1,"c":5,"g":"发布于 美国"},{"i":"5327443646746011","t":"产后焦虑真的对我影响很大。\n\n即便理智上我知道，娃的行为一定有 variance，不可能每天按照American Academy of Pediatrions (AAP)的参考区间精准运行。但是情感上我焦虑得不行。\n\n我的大脑每天都在高速计算：他的睡眠离14小时差多少？今天某表现是不是 anomaly？这个💩颜色是不是正常？我是不是哪里做错了？\n\n即便知道自己已经overthinking了，我也完全停不下来，总怕会漏掉什么。\n\n前几天去看儿医，白人老爷爷医生用中国俗话安慰我：“老大照书养，老二照猪养。”\n\n他说“照猪养”没有问题。婴儿没有说明书，也不也不会去主动fit AAP的曲线😂他们每天都会有各种各样的表现，自由自在，随机波动，大部分都是正常的。\n\n新手爸妈可以把心放进肚子里，真正需要担心的只有 medical problems。\n\n他说，比如宝宝吐奶：\n如果宝宝吐完还是很平静，那你面对的可能只是 laundry problem。\n但如果吐奶的时候明显痛苦、哭闹，那才需要联系医生。\n\n宝宝哭也是一样。有时候有原因，有时候没有明显原因，这都正常。真正需要处理的问题不是“宝宝老是哭，宝宝无缘由哭”，而是那种持续大哭，怎么哄都停不下来，超过两小时的歇斯底里哭。\n\n如果抱一下能哄好，一会儿又再哭，像开关灯一样忽明忽暗，那就是婴儿正常表现。\n\n我也在刻意练习，不要天天spiral睡不着：我不需要把宝宝每一个行为都debug出来，也不必把书翻烂，24小时扫描宝宝可能的问题。\n\n我需要做的是两件事：配合他，看大趋势。饿了就喂，哭了就哄，打哈欠了就试试能不能抱着睡着。观察他有没有长大，有没有吃饱，有没有精神，这些就够了。\n\n接受宝宝有variability，也接受自己作为妈妈的不确定感。好难啊，但我要试试！","d":"2026.08.02","y":2026,"mo":8,"l":15,"c":14,"g":"发布于 美国"},{"i":"5326066111482959","t":"半夜灵感：\n\n爸妈哄睡，其实就是在给娃打装备。装备穿齐了，娃才能在睡梦里打怪升级、过关斩将，解锁一个又一个新的 development feature。","d":"2026.07.29","y":2026,"mo":7,"l":4,"g":"发布于 美国"},{"i":"5324681768077035","t":"娃的迷惑行为：\n\n大半夜全音量大哭五分钟，但吃奶也只吃五分钟（我被从深度睡眠里掺起来就为了这？）\n\n好不容易从大哭哄睡，没想到这是娃的power nap，三分钟后他睡醒过来继续大哭\n\nHalf-swaddled 终于奶睡了，竖抱完打算放小床，娃居然在屁股接触床垫的一瞬间双手抻出来伸懒腰，跟我（他的清醒）大眼瞪（我的困顿）小眼\n\n把wet fart当回事给他换了尿布，新尿布刚垫上他就拉了个大的\n\n从IG上学的，给男孩换尿布要用湿巾擦一下肚脐下面催尿，等五分钟打开尿布来换。娃在第六分钟尿了个喷泉，把睡眼惺忪的我浇醒了","d":"2026.07.25","y":2026,"mo":7,"l":4,"c":5,"g":"发布于 美国"},{"i":"5322617356814230","t":"现在是下午1:49，Boss baby依然只接受喂奶时的micro nap，一点喘息时间都不给。两个长工已经🤪🤯😖，开始互相甩锅：\n\n“It’s your genes 🧬. He likes cars so much and only wants to nap in a moving car.”\n\n“No, it’s definitely your genes 🧬. He only likes live entertainment where we both have to sing, bounce, and walk around together just to stop him from screaming.”","d":"2026.07.20","y":2026,"mo":7,"l":5,"g":"发布于 美国"},{"i":"5321834503078952","t":"昨晚宝宝睡蛮好，我却失眠，因此反复想我每天用几十次的baby activity tracking app有哪些优化空间。在晚上十点稍微清醒的时候想出来的功能还稍微靠谱，两点和四点喂奶时想出来的新功能就是屎上雕花了。早上七点再一次醒过来，复盘一遍觉得不太对劲，让ChatGPT给我辨一辨和辩一辩，我不睡觉想的这三个产品方向是不是合理。\n\nChatGPT（在被我折腾了一晚上，thinking with high capacity and maximum effort），终于找到机会来非常礼貌地批评我：你把一个高用户量应用的简洁交互，扭曲成data labeler 的苦力活，完全跟产品给新手爸妈减负的初衷背道而驰。这三个主意有两个都糟透了，千万别放到你的GitHub，显得你的product judgement 有问题…\n\n所以失眠搞product concept离大谱，以后别再搞了…🤪🤪🤪","d":"2026.07.18","y":2026,"mo":7,"l":4,"c":11,"g":"发布于 美国"},{"i":"5320248929553325","t":"婴儿睡觉迷思：\n\n在怀里睡14:59 然后放婴儿床，一秒钟眼睛就蹬得铜铃大，落地醒。\n但如果等两秒，在15:01再去放，十有八九宝宝就能继续睡着…\n\n两秒钟的差距，半小时的rework…","d":"2026.07.13","y":2026,"mo":7,"l":2,"c":6,"g":"发布于 美国"},{"i":"5314256157540407","t":"@蓝直叔叔：“没有的，宝宝和你都在学习抵达对方，慢慢来”\n\n🫂","d":"2026.06.27","y":2026,"mo":6,"l":5,"c":1,"g":"发布于 美国"},{"i":"5312031785750139","t":"Mom math:\n🥳 yesterday: 45-min nursing = 3 hours of sleep\n😫 today: 1.5-hour nursing = 30 mins of active swallowing","d":"2026.06.20","y":2026,"mo":6,"l":7,"c":1,"g":"发布于 美国"},{"i":"5308020710180841","t":"我的 doula 是俄罗斯人，但意外地非常温柔。\n\n她让我写 “Thank you, contraction” affirmation note 来骗过大脑，疼的时候别紧张收缩，而是 try to open up and work with it.\n\n她也很反对 information overload。\n\n今天她吐槽说很多家长总想一次性知道未来所有步骤：\n\n“What’s next? Then what?”\n\n然后一本正经地说：\n\n“If baby is feeding correctly, probably start them with algebra.”\n\n“So they can learn something before turning six months and get ready for Harvard.”\n\n😂","d":"2026.06.09","y":2026,"mo":6,"l":6,"c":8,"g":"发布于 美国"},{"i":"5307830895904199","t":"【在人生和职业的绝大多数领域，我们应该致力于无脑地获取 Beta，然后仅仅在极少数、我们真正拥有绝对优势和热情的地带，去审慎地追求 Alpha。】网页链接","d":"2026.06.09","y":2026,"mo":6,"l":5,"g":"发布于 美国"},{"i":"5307499315727520","t":"【一个 AI 创业者要问自己的问题不是“我能不能做一个工具”，而是“我能不能把客户带进来，并且把客户要的结果交出去”。这两个动作连起来，才叫闭环。】网页链接","d":"2026.06.08","y":2026,"mo":6,"l":3,"g":"发布于 美国"},{"i":"5304877372932770","t":"“Impatience with actions. Patience with results.”","d":"2026.06.01","y":2026,"mo":6,"l":10,"g":"发布于 美国"},{"i":"5304101596561809","t":"“You can outsource your thinking but you cannot outsource your understanding.”","d":"2026.05.30","y":2026,"mo":5,"l":8,"c":1,"g":"发布于 美国"},{"i":"5303304276939384","t":"最近写了一篇关于 AI 时代 T/PM role 变化的长文。\n\n一开始只是 hackathon 里拿 AI 当 execution layer 写了个小工具，结果真正让我震惊的不是“生成有多快”，而是我第一次很强烈地感觉到：\n\n很多组织机构的问题，本质上不是 execution 慢，而是“离真实问题太远”。\n\n以前 building 很贵，所以 T/PM 的价值很多在 orchestration，在 abstraction management，在 layer above the work。\n\n但 AI 开始把 construction cost 压低之后，我越来越觉得：未来高杠杆的产品人，将会是能够 descend into the system、亲手碰到 friction、再带着更真实的理解回到 orchestration 的人。\n\n但这里还有一个我后来越想越重要的点：\n技术 proximity 本身不够。\n\n如果团队觉得你靠近系统只是为了 perform competence、抢 ownership、提前 justify decision，大家会自动把“真实 friction”藏起来。你看到的是 polished version，不是真相。\n\n所以最后拼的可能不是“谁更懂 AI”，而是谁能在更近距离接触 reality 的同时，还不让人开始 defensive。\n\n写完以后我自己都有点感慨：\nAI 可能不是在把 humans 拿出 loop。\n而是在逼我们重新学习，怎么更真诚、更少 abstraction 地一起工作。\n\n文章在评论——","d":"2026.05.27","y":2026,"mo":5,"l":16,"c":1,"g":"发布于 美国"},{"i":"5296256177409144","t":"看完了《The Devil Wears Prada 2》——好看，娱乐性很强。作为一个第一部看了十遍以上的死忠粉，我还蛮喜欢这个续集的。\n\n故事线其实很简单，时装也还是很好看。第一部是我的职场启蒙：you should understand the bigger picture，别带着一身 entitled 的学生气进 entry level job，是真的要去学、去吸收、去贡献。第二部也有闪光点，比如：你到底需不需要这份工作？你到底想不想把它做好？如果想，那就认真去做，make it work。我每天打工打到想屎，这样的鸡血我真能用上。\n\n我其实很开心这部里的人物状态，不是那种“二十年后伤痕累累、战功赫赫”地回归，而更像是从二十年前平移过来的人。他们还是轻快的、鲜活的、很有生命力地在讲一个致敬时尚、致敬经典的故事。没有上价值也没有故意深刻。是快乐的！","d":"2026.05.08","y":2026,"mo":5,"l":5,"g":"发布于 美国"},{"i":"5291696662512940","t":"我外婆小学没读完就从富顺跑去昆明当铁路工人。我小时候是她带的，她老说我“不停乱动像蛆一样”“吃东西像蝗虫一样”。我其实也没见过蛆和蝗虫，但一想到这两个动作就会自动想到她的话（而不是那蛆和蝗虫）。\n\n有时候会想，那我以后会怎么跟儿子打比喻？反正肯定不会说蛆和蝗虫，因为我根本说不来这两个词的英文😂。可能会说像跳跳糖一样停不下来，或者像扫地机器人、Ctrl+K一样，迅速把食物清空？","d":"2026.04.25","y":2026,"mo":4,"l":3,"g":"发布于 美国"},{"i":"5290692499996781","t":"在亚麻买菜，每次送过来我都要仔仔细细debug看它们到底是丑还是坏。\n——基本每次都是丑得像坏了\n——即便如此我还是继续买，而不是走十分钟去Safeway😂","d":"2026.04.23","y":2026,"mo":4,"l":2,"g":"发布于 美国"},{"i":"5290673664427120","t":"EM爸妈要来帮忙照顾我坐月子，我让EM提醒他们从印度买点印地语教材。\n他妈直接懵了：婴儿距离学说话至少还有一年吧？\nEM一本正经地说：“因为中国家庭一般在小孩出生当天就已经规划好大学和婚姻嫁娶了，学第二外语是必须的。”\n我大笑：对，老中魂。","d":"2026.04.23","y":2026,"mo":4,"l":27,"c":9,"g":"发布于 美国"},{"i":"5286047945850988","t":"自己用AI：不付费，但不乱用——每个工具都有明确分工。\nGemini 做图，Perplexity 负责“问世界”，ChatGPT 做 idea 的回声壁。\n\n上班用AI：已经不是工具，是 team 了——\nManus：月初即耗尽 quota；\nClaude Code：同时开三个 session：\n一个做🟡项目 tracking + dependency，\n一个写 doc + 一口气读 13 篇 reference 帮我摘数据点，\n一个当 reviewer，专门挑错改稿；\n再加一个 MyClaw，前前后后帮我盯梢、做总结，随时提醒我该在哪里 chime in、怎么 push。","d":"2026.04.10","y":2026,"mo":4,"l":22,"g":"发布于 美国"},{"i":"5283502618577072","t":"我依然是 Manus 的周活用户，但在 agentic delegation 之外，我也被赶鸭子上架开始用 Claude Code 写代码。对，连 TPM 这个工种也逃不掉升级的写代码鱿鱼游戏！这个新的KPI倒逼我在牙缝里寻找 AI productivity 的 use case。\n\n我不想动 production code 😅，最近找到一个新的写代码切入点：把 execution tracking 全部 agent 化。\n\n这种“脏活”其实在大多数公司都存在——workstream 一多、参与的人一多，各种状态更新就碎片化。TPM 还得在这些不完整的信息上整合、判断、推进。以前基本靠手动 check + remind，即使大家都有最好的意图，还是会 drop the ball。\n\n现在我用 Claude Code 在自己的 dev server 上搭了一个小工具，本质就是两件事：\n • cron job 定时提醒\n • cron job 定时检查状态\n\n把“谁该跟进、有没有掉链子”交给 agent。\n\n但更关键的，不是省时间，而是——省 mental bandwidth。\n\n以前这些事一直挂在脑子里：要记、要盯、要担心有没有漏。现在这些负担被转走，我只需看 MyClaw 给的结果，再做判断；甚至可以让 MyClaw 自己开新的对话去跟人跟进。\n\n某种程度上，我多了一点自由。即便短期代价是搭 MyClaw + dev server，比我手动做还花时间。\n\n但我赌一件事：这些投入会在后面开始“利滚利”。\n\n当越来越多这种“人盯人”的环节被系统接管，效率提升可能不是线性的，而是复利式的。短期看，是多做事；长期看，是慢慢把自己从这些事里抽出来。\n\n滴水成涓。","d":"2026.04.03","y":2026,"mo":4,"l":13,"c":3,"g":"发布于 美国"},{"i":"5277790435806925","t":"鱿鱼厂一周年纪念！老板写了一条很细腻的文案表扬我，虽然知道是套路，但他引用的细节还是让我挺开心也挺有成就感的。\n\n– Building trust in ambiguous, fast-moving environments\n– Turning ambiguity into clear, actionable plans\n– Creating alignment without adding friction\n– Driving execution with calm confidence\n\n我也觉得我这一年成长了很多！","d":"2026.03.18","y":2026,"mo":3,"l":29,"c":2,"g":"发布于 美国"},{"i":"5277269505607085","t":"裁神已经被预言，TL给我们打鸡血：“朕知你们难，朕也难，我们都勉为其难”","d":"2026.03.17","y":2026,"mo":3,"l":4,"g":"发布于 美国"},{"i":"5275845035819243","t":"内服caffeine, 外用token. 横批：真正意义上的一个人当一个团队用。","d":"2026.03.13","y":2026,"mo":3,"l":18,"g":"发布于 美国"},{"i":"5275507046220018","t":"厂妹日常：work is shitty, but people are great。和我一样的小土豆们都很努力也很厉害，和他们一起合作，至少能回血一半工作对我造成的摧残。","d":"2026.03.12","y":2026,"mo":3,"l":9,"g":"发布于 美国"},{"i":"5273448723254959","t":"如果只是要冲更高的商业目标，我其实可以拼一拼。 但现在同时还要求我们彻底改变工作方式——在 AI native的模式下新出new AI productivity use cases。  这就像是一边要跑得更远，一边还得换跑姿，而且要立刻跑、还要跑得更快。  \n\n我对这种多重消耗，主次不分，感到特别demoralized。","d":"2026.03.06","y":2026,"mo":3,"l":5,"c":7,"g":"发布于 美国"},{"i":"5273301439217864","t":"商务英语翻译：big hairy audacious goals = AI大跃进以及对牛马的进一步压榨","d":"2026.03.06","y":2026,"mo":3,"l":5,"c":1,"g":"发布于 美国"},{"i":"5272397754405855","t":"最近一次最神奇的购物体验：一位印度朋友告诉我们，东雅图这边的印度教寺庙 ISKCON Temple 有一个自己的牧场，而且他们卖牛奶！不是美国常见的 3.25% 脂肪 whole milk，而是印度的 6% 脂肪 whole milk。周末 EM 特地去买了一加仑回来，$17 比平常稍微更贵。但今晚失眠的我终于喝上了——浓香醇厚，简直像在喝奶油一样幸福！","d":"2026.03.03","y":2026,"mo":3,"l":8,"c":4,"g":"发布于 美国"},{"i":"5265050623541555","t":"我在内网上看到一条挺犀利的 hot take：PM 可以 vibe code，但最好别去折腾 production code。\n\n他的论证我觉得说得非常到位——PM 的核心价值跟写代码无关，而是识别什么才是真正重要的事，并确保这些事能被高质量地执行、落地成产品。\n\nPM 的工作，本质是在运行一个协作系统：做优先级排序、对齐上下游、让不同工种高效配合，从而实现团队产出，而不是走个人英雄主义路线。\n\n现实也很残酷：我们写代码，绝对比初级工程师还慢；如果硬要去 land production code，往往得拜托senior TL 提供大量 review 和支持；更关键的是，这些 code 和 feature 后续我们自己几乎不可能长期维护。\n\n在一家成熟公司里，PM 挑灯写码，坦白说是性价比极低的事情——尤其从公司 ROI 的角度来看。\n\n所以我其实挺认同这个观点的 😂\n当然，也不排除我是在给自己“没去追写 diff 的潮流”找一点心理安慰。","d":"2026.02.11","y":2026,"mo":2,"l":13,"c":3,"g":"发布于 美国"},{"i":"5264704855605716","t":"同事甲：爸妈来过年会呆三周…我和partner 都很害怕…\n同事乙：哈哈我懂！爸妈以为自己是来当家长的，不知道自己其实是来做客的…","d":"2026.02.10","y":2026,"mo":2,"l":16,"g":"发布于 美国"},{"i":"5264383512937667","t":"I’m genuinely shocked that so few normal, culturally central brands showed up to the Super Bowl this year.\n\nThis is supposed to be America’s biggest shared moment — football is practically a national ritual. Super Bowl ads used to mean something. Brands poured millions into these $5M+ 30-second slots because it was a statement: we’re investing in America, we’re celebrating ambition, lifestyle, and the future.\n\nNow? It feels like we’re left with tail brands — plus an overwhelming wave of pharma. Commercial after commercial for medical conditions, including oral GLP-1 pills. It’s like the cultural center of gravity shifted from aspiration to symptom management.\n\nThe only semi-fun moments came from AI companies. Anthropic roasting OpenAI was genuinely funny. Google Photos delivered something human and intimate. But most of the rest felt like brands had already given up.\n\nAnd why do they all look the same?\nEverything lands in the same recycled aesthetic — 70s sci-fi, 80s punk, 90s nostalgia — yet somehow feels homogeneously bland. Not retro in a thoughtful way. Just safe. Cheap. Uninspired.\n\nI don’t mean luxury — I mean comfort, confidence, optimism. Instead, it feels like the opposite of comfortable living.\n\nWhat unsettles me most is the contrast: AI companies — some barely real yet, like ai.com being more a domain flex than a product — are aggressively claiming cultural territory. Meanwhile, the brands we actually live with and depend on have gone quiet, small, and uninspiring.\n\nThis doesn’t feel like just a bad ad year.\nIt feels like a bad economic year, a bad imagination year, and a bad cultural signal.\n\nSo many companies had the biggest stage in America — a rare chance to say something hopeful, aspirational, or meaningful — and instead they said almost nothing.\nNot even offensive.\nJust empty.\nLike no one believes in a better version of everyday life anymore.\n\nThat’s what shocked me.","d":"2026.02.09","y":2026,"mo":2,"l":18,"c":4,"g":"发布于 美国"},{"i":"5264372881690077","t":"The real recession indicator isn’t the economy — it’s the Super Bowl ads.\nWe used to get ambition, lifestyle, “dream bigger.”\nNow it feels like a societal performance review… and we did not meet expectations.\n\nWhere’s Amazon? Airbnb? Anything aspirational?\nAmazon is literally the biggest advertiser in the world, and all we got was one sad Alexa cameo.\nAirbnb used to sell adventure — now it’s just vibes of “stay home and cope.”\n\nEven soda gave up. It’s just Pepsi.\nPepsi isn’t even culturally relevant anymore — it’s like the official beverage of economic anxiety.\n\nIf ads reflect the future, we’re not in a growth era.\nWe’re in a “budget cuts and emotional austerity” era.","d":"2026.02.09","y":2026,"mo":2,"l":10,"g":"发布于 美国"},{"i":"5264365855181878","t":"Super Bowl commercials are proof we don’t deserve nice things anymore.\nCheap cars, drugs, junk food, alcohol, and chatbots—wrapped in lazy nostalgia and somehow worse than the originals.","d":"2026.02.09","y":2026,"mo":2,"l":5,"g":"发布于 美国"},{"i":"5263499001595570","t":"Why did the config go to therapy?\nToo many issues, poor traffic management, and zero emotional load balancing.","d":"2026.02.07","y":2026,"mo":2,"l":1,"g":"发布于 美国"},{"i":"5262789683447071","t":"Every morning I run a risk assessment in the mirror:\nAm I visibly pregnant yet, or just fat?\nFat means I can still go to work unnoticed.\n\nI’m still ✅ green ✅ on “just fat” for now — thankfully.","d":"2026.02.05","y":2026,"mo":2,"l":6,"g":"发布于 美国"},{"i":"5261473467337980","t":"高胤禎和赵露思也太像了吧！","d":"2026.02.01","y":2026,"mo":2,"g":"发布于 美国"},{"i":"5260628654555711","t":"Communication *is* collaboration.","d":"2026.01.30","y":2026,"mo":1,"l":3,"g":"发布于 美国"},{"i":"5260347936343087","t":"开年就是天崩局：sev + attrition + a lot more issues…\n\nMe in 1:1: “I’m so sorry—I feel like I got you into so many problems right at the start of the new year.”\nEng director: “No, no. We’re in this together. We solve some problems, pick up a few more, and get something even bigger in return. That’s our job.”","d":"2026.01.29","y":2026,"mo":1,"l":3,"g":"发布于 美国"},{"i":"5255252900841352","t":"养娃到底有多贵？\n\n同事：I took my family to Disney World, and half of my net worth was wiped out on this three-day trip.","d":"2026.01.15","y":2026,"mo":1,"l":14,"c":9,"g":"发布于 美国"},{"i":"5254208391480297","t":"Stop prompting for prose. Prompt for structure + deltas.","d":"2026.01.12","y":2026,"mo":1,"l":1,"g":"发布于 美国"},{"i":"5253901028689699","t":"刚点开 The Pradeeps of Pittsburgh，因为EM 的强烈反对我们第一集都没看完。\n\n我觉得这类印度喜剧其实是自嘲，调侃文化里的荒诞，也没恶意。EM 完全不行，他觉得这些人像是在“把印度人当成外人眼里的笑料”，让人不舒服，有点居高临下，像在说 “我已经超越了这些，让我来告诉你们印度人多荒唐”。我能理解，也能笑，但同时我看EM很喜欢的 Fleabag 反而被冒犯——这姑娘完全失控，做什么都不在乎，也不想控制自己，我真的受不了。\n\n同样是喜剧，我们被刺激的点完全不同。EM 敏感，是因为文化身份和历史经验让他对外界的视角特别警觉；他看到的更多是“表演给别人看”的姿态。而我被 Fleabag 惹恼，是因为它和我看中的负责任有担当这种价值的冲突。\n\n笑点背后可能比笑点本身更有意思。","d":"2026.01.11","y":2026,"mo":1,"l":2,"g":"发布于 美国"},{"i":"5253476170859471","t":"太好笑了😂\n\n我们今天去做产检，EM（我们家的 nutrition police）终于找到了告老师的机会。\n\n我有点心虚地问医生：\n“我是不是最近长太胖了？”\n医生看了看数据，说：\n“体重曲线是有点陡，但还在正常范围内。”\n\nEM立刻接话：“But she actually eats a lot.”\n医生点头。\n\nEM继续补刀：“She eats 6 meals a day.”\n医生笑了。\n\nEM毫不留情地补上致命一击：“She also eats at 3am too.”\n医生非常淡定：“Well, hormones do those things to you. It’s normal.”\n\n我大笑😂 nutrition police 被当场驳回！","d":"2026.01.10","y":2026,"mo":1,"l":20,"c":10,"g":"发布于 美国"},{"i":"5249183789089004","t":"Culinary class wars实在是太好看了！\n\n精彩的厨艺比拼，杰出的舞台和节目设置，既色香味俱全又有人味儿！","d":"2025.12.29","y":2025,"mo":12,"l":2,"c":3,"g":"发布于 美国"},{"i":"5248837448893751","t":"昨晚看了一部 Ayushmann Khurrana 的喜剧 / 社会议题电影《Shubh Mangal Zyada Saavdhan》，中文译名《真雄起》。这一类型的印度片我其实看过不少，心中标杆是《OMG》《Badhaai Ho》，所以并不觉得这部片子本身有多出彩。\n\n电影创作背景是印度同=性=恋=去=罪=化这一当时的社会热点，立意当然是好的：讲的是父母与儿子两代人之间的误解、对抗与最终的和解。但在执行和故事层面，我始终觉得差强人意。父母的“古板”并没有扎根于朴素而真实的价值体系，儿子的“真爱”也缺乏足够的情感积累；双方更像是为了对抗而对抗。情节推进大量依赖亲戚举着 iPad 朗读搜索结果、以及一段又一段直白的长篇台词，而不是通过更细腻、渐进的互动去生成真正的理解。\n\n所以我几乎是一路不太 convinced 地看到了最后。\n\n直到最后的最后——父亲送儿子和他的伴侣去火车站，临别时他说了一句：“I’ll probably never understand this (homosexuality), but I don’t want to stop you living your life to the fullest.”\n我可能永远都无法理解，但我不想阻止你去过自己的人生。\n\n那一刻我是真的被击中了。\n原来在这种处境里，重要的并不是“说服”，不是观念的彻底一致，而是承认自己的不理解，同时选择不去否定、不去阻拦——选择成全。\n这种接纳，本身就已经是一种很大的爱。\n\n印度电影","d":"2025.12.28","y":2025,"mo":12,"l":2,"g":"发布于 美国"},{"i":"5244665034703915","t":"“Name it to tame it”","d":"2025.12.17","y":2025,"mo":12,"l":3,"g":"发布于 美国"},{"i":"5244107372888539","t":"终于看了 Zootopia 2！在已经看过不少评论的情况下，我的期望值其实并不高——but it’s a blast。\n\n我一直很喜欢迪士尼电影那种包罗万象的万花筒感：不同年龄、不同背景的人，都能从自己的视角里找到乐趣。比如只有大人才会会心一笑的 Burning Man 梗，小孩熟悉的 Ratatouille 式致敬，移民很容易 connect 的封闭 reptile city（像 Chinatown 或 Little Italy），还有影迷时隔多年依然瞬间 click 的 Shakira 歌声与舞姿。每个人各取所需，在一条清晰主线之下，背景丰富、节奏明快，绝不单调。\n\n但也有点可惜，这一部的情感叙事并不真正动人，而且走向太过意料之中。更多是被精心设计的刺激、动作、打斗与追逐推动，却缺少真正的情感冲突。无论是渴望父亲认可的局外人 lynx、需要真正理解彼此差异的搭档关系，还是从傀儡走向英雄的马市长，这些线索其实都很有潜力被挖得更深，却都点到即止。\n\n它有点像一盘食材多样且健康的有机快餐，但调味却是偷偷加糖且重盐的酱料。作为假期和 holiday 的消遣，它当然很合格；而且我也注意到 credits 里有不少亚裔名字，甚至包括 head of story——这一点本身就值得庆祝。\n\n只是，它不是 The Zootopia：那个让人哭了笑、笑了又哭、每年都想重温的经典。\n它是一场不错的体验，仅此而已。","d":"2025.12.15","y":2025,"mo":12,"l":7,"g":"发布于 美国"},{"i":"5216819430293775","t":"鱿鱼厂典中典（真事）：\n\n“I’m escalating because person-A is not responsive to work messages.”\n\n“Ok what happened?”\n\n“I sent him a message at 5pm and didn’t hear back until 8am the next day. This kind of slow turnaround is blocking me.”","d":"2025.10.01","y":2025,"mo":10,"l":8,"c":6,"g":"发布于 美国"},{"i":"5215047287833361","t":"At work, you may not always have the conversation you planned, but by being well-prepared and open to change, you can still have the conversation you need—the one that drives progress and clarity.","d":"2025.09.26","y":2025,"mo":9,"l":11,"g":"发布于 美国"},{"i":"5210236014561122","t":"我每天的工作就是把大象放进冰箱 。","d":"2025.09.13","y":2025,"mo":9,"l":5,"g":"发布于 美国"},{"i":"5209306862977298","t":"我的梦想是当皇帝的试菜专员。","d":"2025.09.10","y":2025,"mo":9,"l":4,"g":"发布于 美国"},{"i":"5204844555534834","t":"同样是bias for action，🍌和🦑不在一个量级。\n\n香蕉厂：“It’s lower priority, let’s revisit next quarter.”\n鱿鱼厂：”It’s lower priority, but please share a plan in 2 weeks. We still need to land impact later this quarter and cannot wait until the end of the half.”","d":"2025.08.29","y":2025,"mo":8,"l":3,"c":13,"g":"发布于 美国"},{"i":"5204526619427686","t":"The difference between an ask and a task is the ‘T’—and that ‘T’ is the TPM. The ‘T’ stands for attacking ambiguity, translating business asks into clear engineering tasks so both sides actually get what they need.","d":"2025.08.28","y":2025,"mo":8,"l":1,"c":2,"g":"发布于 美国"},{"i":"5202421887274069","t":"我终于适应了鱿鱼厂 disorienting 的节奏了。\n\n一开始我只觉得乱，像是眉毛胡子一把抓。\n现在才明白，这是对 local optimal 的极致追求。\n\n而且是各种层面的 local：\n大小 project、大小 program、大小 org……\n不存在全局对齐，也没人想全局对齐，\n只要在局部对齐，就能快速往前跑。","d":"2025.08.22","y":2025,"mo":8,"l":8,"c":1,"g":"发布于 美国"},{"i":"5200131898474509","t":"Feels like an asshole pushing back on integrity metrics validation (integrity as in content safety, not data), but if I don’t ship this, my own integrity’s on the line.","d":"2025.08.16","y":2025,"mo":8,"l":5,"g":"发布于 美国"},{"i":"5199450134022354","t":"鱿鱼厂越来越险，job security 有两种路径——\n1️⃣ 同时参与多个项目，忙碌且全能，某个项目出问题也不至于全盘受损，这是大家都选的安全策略。\n2️⃣ Be on the critical path of something，它可能 fail，也可能成就你。\n\n富贵险中求、谋事在人——make your best effort, and let people see it.","d":"2025.08.14","y":2025,"mo":8,"l":13,"g":"发布于 美国"},{"i":"5196461302352701","t":"“Don’t react, absorb the feedback.”\n\n→ Reacting defensively might damage trust. Absorbing the feedback doesn’t mean agreeing with it — it means listening, reflecting, and deciding how to respond strategically.","d":"2025.08.06","y":2025,"mo":8,"l":10,"c":1,"g":"发布于 美国"},{"i":"5195097975294313","t":"今天跟心理咨询师聊到一个挺有意思的点：\n\n担心工作本身，其实不算在“工作”——它既不会让我更有效率，也不会真的改变什么。\n\n但调整状态、让自己重新充好电，这些才是真的“时刻准备着”。","d":"2025.08.02","y":2025,"mo":8,"l":26,"g":"发布于 美国"},{"i":"5191835699380990","t":"在职场，反对的强度有三档：\n1️⃣ 弱：Yes, but…（嘴上答应，心里反对）\n2️⃣ 中：Can we take this offline?（这是在 politely disagree，但不公开发表）\n3️⃣ 强：“Wait, I’m confused.”（这已经是会议室里最大的反对声音了）","d":"2025.07.24","y":2025,"mo":7,"l":24,"c":1,"g":"发布于 美国"},{"i":"5185964897206373","t":"讲了一星期中文，回来上班写 Google Doc，一段话里标注一个红色下划线和三个蓝色波浪线。英语和我已经没什么关系了…","d":"2025.07.08","y":2025,"mo":7,"l":4,"c":1,"g":"发布于 美国"},{"i":"5185848297652569","t":"这次回国后劲好大。每个城市我呆36个小时，马不停蹄，居然也在暴雨和高温天气里顺利跑下来了。回到西雅图的时候我想：到底哪里是真实？是此刻的蓝天湖泊和雪山，还是不到几天前跟老爸一起骑单车去喝奶茶，跟我妈坐在发廊一起把白发染黑，还是跟外婆坐在家里点烤饵块外卖。\n\n好难得我又度过一个典型的暑假一周。这一次我更是很珍惜，毕竟是30+的独自旅行，知道这种经历在中年会越来越少——大部分时候可能会带着老公，未来可能还要按小孩的时间表安排，上班的日子只有不方便和更不方便两种时刻。\n\n所以这次我是想感官都打开，真的去记住，然后让这记忆变成养料，去供给意义感。\n\n我这次觉得自己真的看到了家人。我意识到小时候老爸在新疆工作，我和我妈也住在外婆家。外婆几乎是在给我和我妈当妈，照顾我们俩。现在我外婆很难照顾自己了，她有一位住家保姆陪着。保姆和我小舅舅一样大，七零后，但孙子都十岁了，是能做适合外婆口味的川菜的自贡老乡。看着她们俩，我想起之前看过的一本韩国小说《拼团人生》，不过不是两个朋友建立生活相依为命。外婆因为腿脚问题很少出门，保姆能陪她说话，督促她吃药和做检查，给她做饭和打扫卫生。\n\n我外公年初在敬老院得了流感，一时状况很不好，去抢救以后切了器官接了鼻管，现在一直在康复医院。他本来是瘦高，现在更瘦弱。他在我小时候就是戴假牙，连着他的生肖，我小时候叫他“没牙的老虎”。现在老虎更是没牙，薄薄的嘴唇变成了轻轻的两片皮肉，接着一根粗管子吸痰。我摸着他的肩膀，拉着他的手。能跟他说的是小时候他跟我抢电视机遥控器，他退休学驾照买车以后带我去海埂边上玩。他有一点反应，最有反应的是外婆拉他的手，他紧紧抓着不放。\n\n我爸妈住在成都“艰难大道”附近的刚需房。是我去美国以后他们买的房子，当是以备万一我要回国，我的小孩要上学，他们还看了小学学区。因为是刚需房，这一小区里大部分的住户都是在城南软件园工作的我的同龄人。早上我们仨出门的时候，都会遇到邻居出门挤电梯：一半是老人带着小孩送小孩去上暑假星期班，另一半是上班。我妈认识一个邻居外婆就是这样，卖了农村的房子给孩子付首付，住在城里帮他们带小孩。这个外婆还给自己找了个事情干：附近开发商拿了几年还没开建的地，她偷偷去挖了一小片菜园，种玉米和青菜。我妈喜欢吃糯包谷，晚上跟她说，早上她一大早就去掰来，和菜场同价，无比新鲜。还有另一个邻居外婆在家里自制盐帮菜，红油兔丁、泡椒鱼，给小区里邻居送家里做的美味，和外卖竞争。\n\n这些都是生命力啊。勃勃生机。找个方法活下去，在活下去的时候尽量又要活得好一点。这给我打了一剂强心针，让我反思我自己的生活。","d":"2025.07.07","y":2025,"mo":7,"l":49,"c":1,"g":"发布于 美国"},{"i":"5185103220706504","t":"我想，我一直没意识到外婆是“事业女性”，可能因为她从来不是我认知里的潇洒的大女主。\n\n她善良、能干，但也长期压抑、易怒。她的日常语气，是抱怨。\n\n她抱怨老外不着家，心里只有工作，跟三个孩子都不亲。每天早出晚归，回家只剩下吃饭睡觉。我小时候去过一次老外办公室，记得那些量尺、蓝图和一摞摞工程图纸。绿皮火车成昆线上的桥隧、昆明靠近火车南站的北京路上的人行天桥，他在这些钢筋水泥上花的时间远远超过在家庭里。\n\n外婆一边抱怨“他害苦了我”，一边又无比照顾他。每天饭桌上先给老外盛一大碗，再轮到我和爸妈，自己最后吃点汤汤水水。她让我打电话到老外的BB机问他啥时候回来。洗衣做饭照顾三娃，让他们都能上大学——她什么都扛下来。\n\n老外的事业留下了真正的 legacy。外婆的事业，她从不提，只说“在机关上班”。\n\n她也会埋怨子女，也埋怨命运，甚至埋怨我还不生孩子。她不喜欢社交，经常自己抹眼泪。今年开始常说“我快死了”，我们听了都怕。但她的确是一个不太容易相处的人。\n\n我有时觉得她很可怜，也有时觉得她很可恨。她不记人恩，只念自己苦，觉得命不好。她的样子和“又当又立”的女强人形象一点也不沾边。她说自己渺小命苦、可怜。谁会想到她年轻时梳着粗粗的麻花辫，眼睛亮亮的，自学识字，从八块钱月薪干到三十八年工龄的岗位上，是个真正有能力的铁路人？\n\n越是复杂和矛盾，可能也越是真实吧。\n\n我现在还不懂外婆，只能做一件事：听她说，让她被听见。她真的很可怜，有很多层的可怜。 上海·虹桥机场1号航站楼","d":"2025.07.05","y":2025,"mo":7,"l":16,"c":3,"g":"发布于 美国"},{"i":"5182297139317022","t":"中年人的睡眠问题：当初买房，是为了踏实睡个整觉，不用再担心寄人篱下。结果现在睡不着，也是因为买了房——每个月赚多少，几乎都还给了银行，paycheck by paycheck。自由没换来，反倒多了压力。苦啊，梦里都在算利息。","d":"2025.06.27","y":2025,"mo":6,"l":15,"c":1,"g":"发布于 美国"},{"i":"5182230252491498","t":"大半夜睡不着，就当作提前倒时差了。\n\n我最近一个观察，是鱿鱼厂和香蕉厂在技术团队分工上一个很大的区别：谁是这个团队的 API。\n\n在香蕉厂，工程经理有很大的权力，也有很大的责任，既要对人负责，也要对自己团队的技术栈负责。一亩三分地分得很清楚，团队里的高级工程师负责提供建议，但真正的负责人是经理。经理在很大程度上就是团队之间沟通的大接口，大事小事几乎都需要manager to manager，再落实到不同级别的工程师手上。经理的IC work，是把关团队的设计和交付、对接跨职能团队，尤其需要完全承担高层沟通。\n\n而在鱿鱼厂，这种大包大揽的经理基本不存在。各种级别的技术负责人（tech leads）是系统之间的 API。组与组之间的边界没有那么清楚，更多是根据产品需求来推动，（跨或不跨）系统一起实现。表面上人挂在经理名下，实际上是技术负责人掌握实际进度。沟通和交付也主要是由技术负责人和工程师直接完成，在真正推进事情的时候，基本不需要经理出面去斡旋。","d":"2025.06.27","y":2025,"mo":6,"l":7,"g":"发布于 美国"},{"i":"5178349472449967","t":"我来鱿鱼厂上班九十天了，每天我都鬼哭狼嚎，抱怨声超大。但翻翻微博，发现以前在香蕉厂也是这样。这两家公司一个是龙潭，另一个是虎穴。我都得提心吊胆，数着日子熬。\n\n真正能控制的，其实就是每天别想太多。有活就干，能做多少做多少，尽量努力。\n\nYup. Avoid getting overwhelmed, stay focused, show up, and reflect.","d":"2025.06.17","y":2025,"mo":6,"l":43,"c":3,"g":"发布于 美国"},{"i":"5174719611668355","t":"大家有什么给外婆送礼物的建议吗？谢谢！","d":"2025.06.07","y":2025,"mo":6,"l":1,"c":2,"g":"发布于 美国"},{"i":"5174416468082793","t":"Don’t confuse busy work with true productivity.\nDon’t mistake rushing for genuine momentum.\nDon’t equate repeated churns and rework with real progress.","d":"2025.06.06","y":2025,"mo":6,"l":14,"g":"发布于 美国"},{"i":"5170177177556699","t":"2014年是我上一次在暑假回国，这次是11年后第一次在夏天回去。我给自己放的这个暑假，去上海和成都。请给我推荐好吃好喝好玩！","d":"2025.05.25","y":2025,"mo":5,"l":11,"c":4,"g":"发布于 美国"},{"i":"5169080987290752","t":"我被AI夸夸了，它这样connect dots 帮我总结我的履历我也没想到\n\n（不过我并没有在亚麻呆五年，毕业后总共工作了9.5年） duree的微博音频","d":"2025.05.22","y":2025,"mo":5,"l":7,"c":2,"g":"发布于 美国"},{"i":"5168218148439101","t":"Nit, SG, PTAL, LGTM. 从corporate speak进化到hacker speak.","d":"2025.05.20","y":2025,"mo":5,"l":1,"c":4,"g":"发布于 美国"},{"i":"5167491091006721","t":"今天是我加入鱿鱼厂的第60天，当然要用“周末加班”这种典中典的方式来纪念一下。虽然我这周一直努力避免傍晚工作，但周五下午突然被扔来一个周日的 deadline，只能一早爬起来打开电脑。\n\n这60天情绪和认知真的是过山车：从最初的 shock & denial，到现在的阶段性理解与和解，花了我很大力气。我意识到，自己其实在经历一次底层认知的更新。认知没转过来，行为自然难以协调。\n\n我目前看到的核心问题是「Effectiveness vs. Efficiency」。Jeff Bezos 有句名言：“Good intentions don’t work. Mechanisms do.” 这句话深深刻进了香蕉厂的机制驱动文化。什么是 mechanism？它是一套 repeatable process for decisions & actions，从长期目标反推当下行动，不仅追求做对（effectiveness），还要求做得高效（efficiency），因为不可复现的成功无法规模化。落地执行时，香蕉厂是 organized chaos。\n\n而鱿鱼厂的流程则呈现出另一种极端：不是没有 process，而是 process 更多是为具体 tech project 临时搭建的 patch，难以形成稳定的协作支撑。一切围绕项目运转，每个项目都是一个临时节点：拉人、建流程、做完、解散。好处是技术主导、探索空间大；但代价是流程难以复用、组织积累有限，导致做事高度 churn，时间极紧，团队长期处于压缩状态。在这种环境下，TPM 的两个主要作用是：1）manage up，写各种汇报，让不同维度的领导都能从他们关心的角度了解项目进展；2）解决不写码但技术性强的问题，比如跨团队协作、依赖对齐、假设建模等。\n\n我来鱿鱼厂的初衷之一，是想学习一个更 tech-oriented 的组织是怎么运作的。从这个角度看，我确实是在学习。以前我更多是在“解决商业问题”这层，把技术当作实现手段；现在我被迫深入到“解决技术问题”的层次里，有时甚至要把“人”当作方法。\n\n昨天见到香蕉厂的老朋友，我跟他讲笑话：在鱿鱼厂，我们不能把自己当人，要把自己当成软件。最好是做一个 stateless server。没有上下文、没有 persistent memory，大家靠状态同步协作，追求的是最大的 availability 来实现 effectiveness。","d":"2025.05.18","y":2025,"mo":5,"l":22,"c":4,"g":"发布于 美国"},{"i":"5166537565277907","t":"The first thing I built for myself after joining 鱿鱼厂 was a load balancer.\n\nThe culture here is very “everything is a ping.” Messages come flying in from all directions, and at first, I felt completely bombarded—overwhelmed and honestly a little defeated.\n\nThen I realized: it’s not personal. People aren’t trying to overload me; they’re just redirecting what’s being asked of them. It’s the system.\n\nSo I stopped trying to absorb it all at once. I built an API gateway for myself, threw all the pings into a message queue, and started processing them one by one.\n\nThat shift made all the difference. I became my own load balancer—and my own queue handler.\n\nJust my way of starting to interoperate with this new job.","d":"2025.05.15","y":2025,"mo":5,"l":15,"c":1,"g":"发布于 美国"},{"i":"5164886403063409","t":"What’s been even more disheartening is seeing how distant and casual this war feels to many people. Weibo/online, it’s talked about like a video game—who gained, who lost, whose weapons were better. It’s easy to take sides when it’s not your home, your family, your life on the line. But imagine if you had loved ones there. Imagine watching the news, not for headlines, but to see if your parents are safe.\n\nChandigarh is a city built as a symbol of peace—modern, calm, and planned with hope. Yet now, because of geography, it could so easily become the frontline. That contrast feels surreal. And it reminds me just how absurd it is to treat any war like it’s entertainment. Peace should never be taken for granted.","d":"2025.05.10","y":2025,"mo":5,"l":21,"c":2,"g":"发布于 美国"},{"i":"5164590385070149","t":"A problem understood is a problem half solved.","d":"2025.05.10","y":2025,"mo":5,"l":9,"g":"发布于 美国"},{"i":"5162113078133045","t":"Google Doc 问我：“the ask is XYZ”是不是打错了，我是不是想说“the task is XYZ”。\n\n我：哎，现在我们能搞清楚的就只有ask了，离真正搞明白task，我还有requirement、resource planning之类的十万八千里路要走呢…","d":"2025.05.03","y":2025,"mo":5,"l":4,"g":"发布于 美国"},{"i":"5161452697816645","t":"刚听“If Books Could Kill”播客，主持人说自助类书籍最常被诟病的一点是：它们几乎毫无新意——大多只是小时候就听过的道理，被重新包装、润色后再卖一次。仔细想想，还真是。很多这类书充斥着为了凑字数的重复性的小故事，把一些非常简单、直白、intuitive 的道理来回重复。这些道理小时候第一次在童书里读到时是好故事，长大后再读，则更像是一种提醒。\n\n我自己其实摄取非常多self-help p*rn. ，我读这些书还有另一层感受：有些道理我确实没在这个语境下听过。它们在英文表达中，像是和我中文的记忆和理解对上了某种频率，让我有种click的感觉。而听那些从方方面面抓过来强调中心思想的小故事，则是搭配按摩手法促进吸收。It does help, I guess?","d":"2025.05.01","y":2025,"mo":5,"l":14,"g":"发布于 美国"},{"i":"5161353729278702","t":"我：听说senior的工作是做shit umbrella\n我（一个月后）：原来senior is new junior, 挡不住💩，但可以直接、主动和全面地服用💩","d":"2025.05.01","y":2025,"mo":5,"l":15,"g":"发布于 美国"},{"i":"5155543111172880","t":"“Hear everyone out but you don’t have to listen to all of them.” 先收集，再听取，这是EM之前跟我说的一句话，我一直记得。他在人际交往上有挺好的intuition，我也常常想到这点。\n\n这句话是我们在印度的时候他说的。那时候人多，声音杂，关于婚礼各种细节大家都有意见，乱哄哄的。他跟我说，你先都听着，左耳进右耳出，别急着反应。我当时就觉得这挺对的，也开始练习这么做，结果发现居然还真能handle住。\n\n后来在工作里，这种方式也变得特别重要。大家想法都多，我得先张罗着把意见都听一遍，别漏了，然后再在这些想法上拿主意。不听，方向容易偏；但全听也不可能，因为不同人的目的和理由经常是冲突的，只有我有全貌。","d":"2025.04.15","y":2025,"mo":4,"l":23,"c":2,"g":"发布于 美国"},{"i":"5154968367010235","t":"Cynicism is easy. Mimicry is easy. Optimistic contrarians are the rarest breed. - Naval Ravikant","d":"2025.04.13","y":2025,"mo":4,"l":6,"g":"发布于 美国"},{"i":"5154950905597474","t":"黑镜S7E5是我目前最喜欢的一集。\n\n有剧透，建议看完剧再读。\n\n-\n\n-\n\n-\n\n-\n\n-\n\n-\n\n-\n\n-\n\n这一集剧情和情感都非常丰富，尤其迷人的是 high tech 和 low tech 的交汇。\n\nLow tech 是八九十年代的拍立得、磁带、一次性胶片相机，那些不完美又模糊的记录——闭着眼的照片、声音模糊的录音——但恰恰是这些不确切的片段，后来被大脑一遍遍回放、改写、赋予意义。\n\nHigh tech 是女儿借助人工智能生成一个 avatar，去“采访”妈妈生前的旧人。这种技术模拟不仅能引导对方深入记忆深处，还能让女儿与母亲的过去保持距离——她只接收母亲愿意传达的故事，而不必触碰那些复杂的人性细节。high tech 在这里并不只是工具，它变成了处理、补全、乃至显化 low tech 记忆的手段。\n\n说实话，这个设定太酷了，我真的好想把这个东西实现。只需要一个小小的装置贴在太阳穴，就能通过眼睛扫描照片、聆听录音、识别对话，生成模拟场景。所有被“看见”的画面都能被3D重现，再根据记忆去扩展照片之外未被捕捉的空间。记忆变得具体、可视、可以交互——literally 进入回忆。\n\n妈妈的前男友在这个过程中重新忆起那个他用十几年刻意遗忘的旧人，一步步走进那段埋藏的过去：从相识、相恋、到背叛与分离。科技帮助他重新整理这段关系，也让他意识到过去未曾察觉的真相——比如妈妈其实在加入公社前已订婚（却还是陷入了情网）；比如她对大提琴的执着，意味着她从没真正把乐队当作归属；比如他们为了个人前途也为了共同未来争执，错过了彼此。\n\n那时的妈妈，还不是“妈妈”，只是一个在成长、在寻找自我的年轻女人。而这段长达三年的恋情，她从未对女儿讲起。于是女儿通过 avatar，一个个走访母亲生命中的旧人，拼出一个“妈妈之外”的、那个完整的她。\n\n最打动我的是最后这位男人在 relive 整段甜苦交织的经历之后，自己也终于真正获得了 closure。他曾将这段失恋深埋心底，而在为追悼会准备 eulogy 的过程中，他第一次真正面对这段关系，看见自己的问题、两人之间的核心矛盾，也终于理解时间和距离怎样让两个人走散。他不再责怪她，也不再惩罚自己。\n\n太美、太深刻、太细腻的一集。它讨论记忆、身份、技术、人性，层层递进，情感丰沛。我为这一集对科技的想象叹服。这是一种对情感的考古，用技术帮人找回时间，更深入地“看见”那些被岁月掩埋的真相。也许在未来某一天，在科技的辅助下，我们每个人都将有机会重新走入时间——不是为了重写经历，而是为了从那些甜蜜与苦涩的过往中提炼意义。与自己的过去、与那些故人和故事真正和解，获得理解、成长，最终抵达一种平静的、温柔的安顿。","d":"2025.04.13","y":2025,"mo":4,"l":74,"c":4,"g":"发布于 美国"},{"i":"5154889971008071","t":"Knowledge workers are basically operating in a memory-bandwidth bound regime — we spend all day optimizing at work, and by the time we get home, there’s no compute left for ourselves. Just cache misses and emotional out-of-memory errors.\n\n- Status: Still feeling tired after a two-hour 💤 this Saturday afternoon.","d":"2025.04.13","y":2025,"mo":4,"l":8,"g":"发布于 美国"},{"i":"5154553537237607","t":"黑镜S7E3是神作：AI幻境假作真时真亦假，剧本真人无为有处有还无。","d":"2025.04.12","y":2025,"mo":4,"l":4,"g":"发布于 美国"},{"i":"5154372452096806","t":"黑镜S7E1: 付越来越高的价格，来deserve和承担曾经无比普通的生活。","d":"2025.04.11","y":2025,"mo":4,"l":21,"c":1,"g":"发布于 美国"},{"i":"5154233877533310","t":"Onboarding 对我来说，是真·机器学习。\n\n每天处理海量信息，input 是各种商业逻辑和目标，output 是技术设计、架构文档、还有那些永远写不完的 PPT。我像在信息海洋里漂泊，只能一边踩水一边猜——这里到底有什么 pattern。\n\n传统的软件系统是：input + pattern = output。\n而我的 onboarding 更像是：input + output ≈ pattern。\n\n所以我现在不是在 onboarding，我是在被训练。\n而且我还不是大模型，是个方脑壳的小模型，完全没收敛。","d":"2025.04.11","y":2025,"mo":4,"l":10,"g":"发布于 美国"},{"i":"5153091464725304","t":"“Actions absorb anxiety.”","d":"2025.04.08","y":2025,"mo":4,"l":14,"g":"发布于 美国"},{"i":"5152746140602588","t":"“I don’t need religion or god to give my life meaning, because time gives it meaning.”","d":"2025.04.07","y":2025,"mo":4,"l":13,"c":2,"g":"发布于 美国"},{"i":"5148266804019598","t":"LinkedIn把我在前东家的backfill职位推荐给我，理由是——我是top candidate 😂","d":"2025.03.26","y":2025,"mo":3,"l":5,"c":2,"g":"发布于 美国"},{"i":"5147940356620311","t":"“The mind adapts and converts to its purposes the obstacle to our acting. The impediment to action advances action. What stands in the way becomes the way.” - Marcus Aurelius","d":"2025.03.25","y":2025,"mo":3,"l":3,"g":"发布于 美国"},{"i":"5147234498249024","t":"这周干了两件高危操作：\n\n1️⃣ 坐飞机——刚起飞前舱就飘来一股怪味，机长果断返航，落地后直接被消防车和维修车包围，航班取消。\n\n2️⃣ 吃鱼吐刺——点了条紫苏鱼，大碗挑刺、小碗吃肉，零失误，未被卡住。\n\n2025年平平无奇的日常也不敢小觑。","d":"2025.03.23","y":2025,"mo":3,"l":6,"g":"发布于 美国"},{"i":"5147213375210371","t":"🌍✨📈\n\nTwo new prompts to try with ChatGPT:\n1. Tell me something about me which I may not realize.\n2. Summarize me in three emojis","d":"2025.03.23","y":2025,"mo":3,"l":9,"c":1,"g":"发布于 美国"},{"i":"5147191355376627","t":"《Careless People》📖 我听到一半，感觉鬼故事一半是 quid pro quo，另一半是 hostile work environment。或许这近十年间（也就是我们这些 young millennials 开始上班的这段时间），workplace harassment training 确实见效了。但另一半嘛……大概“刑不上大夫”，权力中心可能还是老样子。","d":"2025.03.23","y":2025,"mo":3,"l":1,"g":"发布于 美国"},{"i":"5146915188769515","t":"Trust the wait. Embrace the uncertainty. Enjoy the beauty of becoming. When nothing is certain, anything is possible - Mandy Hale","d":"2025.03.22","y":2025,"mo":3,"l":20,"g":"发布于 美国"},{"i":"5146104523391994","t":"加入”The” Social Network可能是我热爱/上瘾社媒的终点以及anti-social的起点😂","d":"2025.03.20","y":2025,"mo":3,"l":3,"c":1,"g":"发布于 美国"},{"i":"5144415195892547","t":"三本Debunk硅谷的业内人自传：\n\n1. 《Uncanny Valley》：Anna Wiener 以亲身经历描绘了年轻人涌入科技行业，在光环与无序中迷茫挣扎。我的感受与她相似——本科毕业后，我也为了初创公司从东岸搬到湾区，毫无经验地闯入这个世界。像我这样的年轻人，就像小孩过家家一样，假装自己懂得如何融入Corporate America。\n2. 《Chaos Monkeys》：前 Facebook 员工 Antonio García Martínez 犀利揭露硅谷逐利和利己的激进文化，展现了不择手段的竞争环境。这本书我记得不太清楚，打算重新读一遍。刚发现新版还增加了对 Cambridge Analytica 丑闻的评论。\n3. 《Careless People》：这是一本新书，我还没读，也是由前 Facebook 员工撰写。从介绍来看，Sarah Wynn-Williams 探讨了在极致执行力背后，硅谷文化的混乱与失控。","d":"2025.03.15","y":2025,"mo":3,"l":36,"c":3,"g":"发布于 美国"},{"i":"5144365966034322","t":"洛杉矶最安分守己、循规蹈矩的司机：Waymo。除此以外全城恶人。","d":"2025.03.15","y":2025,"mo":3,"l":5,"g":"发布于 美国"},{"i":"5144363956964572","t":"西雅图来洛杉矶的三大俗被重新定义了：Deisgn Within Reach Outlet, Erewhon, Philz Coffee.","d":"2025.03.15","y":2025,"mo":3,"l":1,"c":2,"g":"发布于 美国"},{"i":"5141765784338735","t":"The adaptability is the new stability. - Reid Hoffman","d":"2025.03.08","y":2025,"mo":3,"l":8,"g":"发布于 美国"},{"i":"5140767493064337","t":"I write entirely to find out what I'm thinking, what I'm looking at, what I see and what it means. What I want and what I fear. - Joan Didion","d":"2025.03.05","y":2025,"mo":3,"l":5,"g":"发布于 美国"},{"i":"5139563963483827","t":"英文版的Thoughts on TPMing 在这里：网页链接 ❤️","d":"2025.03.02","y":2025,"mo":3,"l":6,"g":"发布于 美国"},{"i":"5138070603566184","t":"下载📕\n\n我：这是为了研究某个产品、经验\n还是我：看各地美食视频根本停不下来","d":"2025.02.25","y":2025,"mo":2,"l":6,"c":1,"g":"发布于 美国"},{"i":"5133763505294023","t":"我要从卷厂甲跳到卷厂乙。知道卷厂乙最近的裁员惨状，因此我在交接这两个星期尤其努力。如果在新的环境卷不过卷王们，还能再回来😂","d":"2025.02.14","y":2025,"mo":2,"l":14,"c":3,"g":"发布于 美国"},{"i":"5132464954281917","t":"因为 Elsbeth 第二季正在周播，我又开始重刷 The Good Fight。2017 年的我们是多么 feisty！川普的任何举动都会让我尖叫：“This can’t be!” 但现在的我只想埋头躲起来。","d":"2025.02.10","y":2025,"mo":2,"l":17,"g":"发布于 美国"},{"i":"5131768349067311","t":"我每天刷小红书看中华各地美食，非常需要一个脑机接口。假设有一个AR VR设备，在博主咀嚼时同步解析脑电波，把那种酸甜苦辣直接转化成味觉信号，激活我这一端的各种感知。\n\n这样一来，眼睛看到的油泼辣子也能在舌尖炸开，望梅止渴通过神经编码变成真正的丰富体验，那该多好啊！","d":"2025.02.08","y":2025,"mo":2,"l":2,"g":"发布于 美国"},{"i":"5131586745402398","t":"人到中年，面试是坦白局，双方都只打直球，no filter：\n我：Let's address the elephant in the room - I don't have a CS degree. Is that a dealbreaker?\nHiring manager: I want to be upfront about layoff concerns.","d":"2025.02.08","y":2025,"mo":2,"l":28,"c":4,"g":"发布于 美国"},{"i":"5131036385870612","t":"今日和一位Principal TPM头脑风暴，我有很多收获。他刚接手的新团队有3个dev team+4个PM，既要扛大小goal，跑实验上新新功能，日常还要维护平台运营，以及支持合作团队的实验。明明人不少，但busy work太多导致效率卡顿——尤其项目进展汇报这个黑洞！每个PM周报格式参差，开发经理和我这种TPM要花大量时间反复确认细节，一来一回全员陪跑。\n\nPrincipal的解法很硬核：从底层重构engagement contract！第一步先重新定义nomenclature，手把手教团队理解工作的颗粒度：从目标到任务怎么分层累加，每层汇报该展现哪些关键指标。更有意思的是他创作了AI chatbots：现在所有进展直接丢给bot，自动完成纠错/追问/bar raise，最终输出可直接整合成月报季报。结果真的事半功倍！团队成员看到自己的分享被直接应用于报告，并和商业目标直接联动后，他们的配合度和输入达标率有很大提升。\n\n这很戳我的痛点！虽然我每年带新团队都会重新定义engagement contract，但始终陷在「人工整合进展-反复对齐-制作领导层汇报」的循环里。他的方法论妙在让团队直接和LLM交互，既实现类似TPM给feedback的coaching效果，让我们真的能腾出手不再困于汇报。我们现在正联手把这套系统推广到更大的规模，纳入更多团队测试。","d":"2025.02.06","y":2025,"mo":2,"l":29,"c":3,"g":"发布于 美国"},{"i":"5130308703224002","t":"西雅图的冬天真是漫长，去年年底我和EM开始看韩剧，选了《眼泪女王》。这可是EM（一个印度直男）的韩剧初体验，结果他直接被震撼到了——世界上居然有这么纯粹的爱情？！他彻底沦陷，连OST都循环播放了无数遍。我看他这么上头，忍不住想戳破他的“韩剧滤镜”，告诉他韩剧其实有很多套路，很多情节都很cliché。他听完有点小失落，但并没有放弃，反而越战越勇，一口气又追了好几部。现在他已经可以举一反三了！首先，他从演员的角度分析角色，发现演员们总是在不同剧里重复演同一种套路人物，比如“刁蛮大小姐”和“贫民窟白马王子”。接着，他开始用言情小说的套路来预测剧情，比如“enemy to lover”“grumpy sunshine”之类的。这位工程师从system design的角度把韩剧给摸透了啊！😂","d":"2025.02.04","y":2025,"mo":2,"l":30,"c":6,"g":"发布于 美国"},{"i":"5130114288846147","t":"Constraints inspire creativity.","d":"2025.02.03","y":2025,"mo":2,"l":4,"g":"发布于 美国"},{"i":"5129756179436371","t":"“Pressure is privilege.”\n\n“Learning through suffering.”","d":"2025.02.03","y":2025,"mo":2,"l":16,"g":"发布于 美国"},{"i":"5127965023934114","t":"香蕉厂卖香蕉单位的All Hands取代了春晚。看keynote 学到了一种新的表达方式。\n\n同样是每年减少Y的缺陷，面对领导时我们会说：“我们现在是X，但我们坚持最高标准，目标要定到0。如果从X到0是线性下降，每年需要实现Y，至少需要Z年。”而在跟团队确认路线图时，我们会更注重实际成果，定目标时会说：“基于X，每年减少Y是合理且现实的。”\n\n两种说法，数据一样，但听起来完全不同。果然，Framing很重要啊！","d":"2025.01.29","y":2025,"mo":1,"l":6,"g":"发布于 美国"},{"i":"5127256202282473","t":"EM一大早打开了抽油烟机：厨房里不知道是什么东西很臭\n我：不好意思是我解冻了一晚的榴莲","d":"2025.01.27","y":2025,"mo":1,"l":2,"g":"发布于 美国"},{"i":"5126986544447515","t":"被韩国大妈暴力搓澡一小时：我不是我，我是一团面剂子。","d":"2025.01.26","y":2025,"mo":1,"l":4,"c":2,"g":"发布于 美国"},{"i":"5126180519281895","t":"同龄的美国朋友：TikTok真好，都是快快乐乐认认真真的年轻人。不像Instagram，全是同温层里的bitter Millennials.\n\n我：ouch!","d":"2025.01.24","y":2025,"mo":1,"l":20,"g":"发布于 美国"},{"i":"5125938717395132","t":"每个月总有几天表达欲特别旺盛，feeling prompty","d":"2025.01.23","y":2025,"mo":1,"l":5,"c":3,"g":"发布于 美国"},{"i":"5125154710225157","t":"致信Meta AI：\n\n与其把AI chatbot的入口做得满地都是，不如专注做好一件事：打通search和agent之间的墙，让回答问题的同时也能完成任务。比如，我想屏蔽所有跟川普有关的关键词，现在得先搜索方法，再自己去设置里一个个添加修改。试想一下，如果能一键搜索、一键添加，该多省心。更灵光的的功能是，如果系统根据我的关注和互动记录，主动建议我未来四年是不是少看川普及其朋党伥鬼的阴间新闻，那就更好了。","d":"2025.01.21","y":2025,"mo":1,"l":13,"c":3,"g":"发布于 美国"},{"i":"5123581408710576","t":"在Lenny’s podcast, Salesforce 的创始人Marc Benioff 回忆和Steve Jobs病重之后的最后一次邮件对话。\n\nBenioff: Wow. This (buying a house, etc.) has worked out better than I thought.\nJobs: Marc, everything med me, which was unusual since we don’t normally talk on weekdays—my workdays are typically stressful. Lately, though, we’ve been talking more because we’re finalizing my parents’ visa application for my wedding in India. Just last night, we had finished collecting all the necessary documents, so I wasn’t sure why she was calling now.\n\nI answered, and there she was, in her pajamas, with my dad by her side—it was bedtime in China. She handed the phone to my dad and said, “You talk to her.”\n\nMy dad, in his usual calm tone, said, “Yeah, all the documents are ready, but I don’t feel like going.”\n\nI was stunned. “Why?” I asked.\n\n“No real reason, I just don’t want to go,” he replied casually.\n\nI was speechless. Tears welled up immediately, and before I knew it, I had hung up. My parents kept calling back, but I couldn’t bring myself to talk. EM noticed my tears and asked what had happened. All I could manage to say, through my sobs, was, “My parents don’t want to come to the wedding anymore.”\n\n“Did they say why?” he asked, but I couldn’t explain—I just cried.\n\nMy mom texted me, “We were just discussing whether we should go.” I finally responded, typing, “You’re so cruel.” That was all I could say.\n\nI went to work, but I only managed to get through one meeting. As the day dragged on, the heaviness in my chest grew stronger, and I felt like I couldn’t breathe. I was confused, hurt, and completely overwhelmed. I texted my therapist for an emergency session—I couldn’t wait until our usual Friday afternoon slot. Thankfully, she was able to squeeze me in at 3 p.m.\n\nThe moment I saw her, I broke down. I told her how abandoned and hurt I felt, how shocked I was that my parents had dropped such a cruel statement without any context. I sobbed so hard I could barely catch my breath. Just last week, we had been working together on the visa documents, and now they were casually telling me they didn’t want to come anymore. It felt like they had given up on our relationship, like they hadn’t even considered how much this would hurt me. I felt completely overlooked.\n\nMy therapist comforted me, reminding me that I had done everything I could to invite them, and that their decision to participate or not was theirs to make. I didn’t need to feel guilty about it. She also pointed out that I wasn’t abandoned—I had been living my life independently for a long time. I wasn’t being left behind; I had simply grown up and made my own choices. By the end of the session, I felt a little calmer, though still too sad to attend my yoga class.\n\nAround 5 p.m., my mom started calling me again, repeatedly. I wasn’t ready to talk, so I texted her, saying, “I felt hurt by what you said.” After an hour or two, during dinner, I finally took a moment to look at my phone. To my surprise, I saw that they had booked the visa appointment and tickets without talking to me. I guess that was their way of apologizing.\n\nIt all happened so quickly, and I wasn’t sure how to react. I realized how much I am like my parents—awkward about feelings, quick to act instead of talk. I understood why they did what they did, but it still felt hard. I recognized their actions as an attempt to smooth things over, but it didn’t feel like a real resolution. There was no bond or connection, just a strange, complicated mix of understanding and lingering hurt. By the end of the day, I felt drained—emotionally exhausted from everything that had unfolded. I understood them, but at the same time, I didn’t.","d":"2024.09.18","y":2024,"mo":9,"l":24,"c":9,"g":"发布于 美国"},{"i":"5079412384727649","t":"别的公司：登内网看看有啥组织机构变动的大新闻\n香蕉厂：内网文章发布半小时即被删除，但是对外开放的网站还能继续访问，同时在各大新闻媒体读到变化","d":"2024.09.17","y":2024,"mo":9,"l":6,"g":"发布于 美国"},{"i":"5079011087090937","t":"我（长期以来）：Open AI怎么还不开始招TPM，好想去那里工作，赚钱好多！\n我（昨晚和朋友吃饭，真正了解member of technical staff 的状况之后）：Open AI怎么能没有TPM？听他讲自己的疯狂的工作量和非常不平缓的工作经历（频繁oncall，频繁sev 2，理论上要平衡oncall and project work但事实上没有机制，一切都是突发，每件事都是重要且紧急），Open AI简直太需要我/TPM了。","d":"2024.09.15","y":2024,"mo":9,"l":9,"c":2,"g":"发布于 美国"},{"i":"5077958786023783","t":"我今天参加了一个论坛，特别同意一位与会嘉宾的观点：The TPM job is thinking through tech in a business context and bringing tech context forward to the business.\n\n非常怪，没有什么标准操作，但也挺有意思的。","d":"2024.09.13","y":2024,"mo":9,"l":7,"g":"发布于 美国"},{"i":"5077950055580155","t":"行百里者半九十。为了保证产品上线时间线不（再）推迟，我（又）得硬着头皮顶上，强行把bug圆成feature。","d":"2024.09.13","y":2024,"mo":9,"l":10,"g":"发布于 美国"},{"i":"5076179486769706","t":"我一直知道自己在用英文表达情感时有些不足。以前，我尤其觉得自己用中文时思绪能够飞扬，情感也更加丰沛，而用英文时总是显得干巴巴的，难以具体表达。后来我意识到，这不仅仅是语言和词汇的问题，也是表达能力需要训练。三年前，我曾对前任坦诚，我的情感表达基本上只局限于三种：开心、难过、和愤怒。我知道自己能够表达的情感是不够全面的，就像冰山的大部分都藏在水下。然而，前任对这种坦诚回应的是蔑视，认为我不配，还和他出轨的对象一起嘲笑我，说我荒唐、情感不健全、是个疯婆子。我是在争取离婚时，从他的出轨对象口中得知这些的。当时我真的觉得自己太笨拙了。后来通过和心理咨询师的复盘，我才意识到：fuck it，我当时是在表达脆弱，他却完全漠不关心。\n\n如今，我发现连中文的表达也有些退化了，中英文的情感表达都勉强还算够用。","d":"2024.09.08","y":2024,"mo":9,"l":17,"c":1,"g":"发布于 美国"},{"i":"5072924731769244","t":"人到中年两个症状：\n1) PMS 比大姨妈还要长还要难受。\n2）饿着肚子在饭点开会，肚子叫得好大声，比我按麦克风发言还勤快，好尴尬。","d":"2024.08.30","y":2024,"mo":8,"l":11,"c":1,"g":"发布于 美国"},{"i":"5069721457659516","t":"正在减肥但吃了几大块同事自己烤的chocolate zucchini bread的我: “It tastes like a brownie but it has vegetables in it, so it must be healthy!” 👩🍳","d":"2024.08.21","y":2024,"mo":8,"l":7,"g":"发布于 美国"},{"i":"5069631314985032","t":"2022年大厂升职：高筑墙（画大饼），广积粮（疯狂招人），急称王（座位上的屁股butts in the seats不重要，纸上的headcount就够了）。\n2024年大厂升职：老员工和领导走了给低位的人腾位置，拉拉扯扯往上顶包。","d":"2024.08.21","y":2024,"mo":8,"l":10,"g":"发布于 美国"},{"i":"5069062366037444","t":"Possible -> plausible-> probable","d":"2024.08.19","y":2024,"mo":8,"l":4,"g":"发布于 美国"},{"i":"5066463653661059","t":"刚看完电影《It Ends With Us》，我主要是冲着Blake Lively去看的。之前没读完原著，虽然知道这本言情小说很火，但用粉丝日记推进情节的方式让我很难继续读下去。\n\n这本书被Blake选中来出演，真是绝了。虽然她不是原著中那个初涉社会的小女孩，也不是红发，更不是那种碎碎念的小心思的设定，但她在恋爱中的迷离星星眼，和遇事后的坚定与坚强，真的是太好的表演了。她的幽默感和表演化解了原著中尴尬的对话和受害者形象的稚嫩，让我觉得非常振奋。每一幕我都忍不住想： ”she’s got this!”\n\nBlake演出的Lily Bloom是被爱塑造的，而不是被爱牵着鼻子走的。这部电影改编得比原著还要好看，我太喜欢了！","d":"2024.08.12","y":2024,"mo":8,"l":50,"c":2,"g":"发布于 美国"},{"i":"5064676450766236","t":"同事买了辆新车，是顶配的定制款，等了整整十个月。她老公精挑细选的结果。\n\n同事：我们上周六终于提车回家了。我老公高兴得像是自己生了个孩子。你猜这六天里他在我们后院洗了几次车？\n我：超过一次吗？\n同事翻了个大白眼：不，是三次！现在不管去哪儿都要花双倍时间，因为他总是想走更长的路。","d":"2024.08.07","y":2024,"mo":8,"l":11,"c":2,"g":"发布于 美国"},{"i":"5058754489353145","t":"昨天，我经历了一个难以理解的瞬间。我的朋友怀孕36周，我们在一起庆祝她的产前休假。她说宝宝刚刚动了，问我要不要摸一下。我非常高兴地坐在她旁边，把手放在她的肚子上。她的肚子很软，但里面有一股劲儿在动来动去，我立刻感受到了。然后，眼泪突然涌了出来…真是出乎意料！","d":"2024.07.22","y":2024,"mo":7,"l":19,"c":3,"g":"发布于 美国"},{"i":"5056554500101669","t":"朋友的阿拉斯加游轮旅行，为了四个大人和一个小孩花了三万块钱。\n被贫穷限制了想象力的我：阿拉斯加是搬到南极去了吗？为什么会这么贵？！","d":"2024.07.16","y":2024,"mo":7,"l":16,"c":11,"g":"发布于 美国"},{"i":"5056291326132710","t":"此别应须各努力，故乡犹恐未同归。","d":"2024.07.15","y":2024,"mo":7,"l":11,"g":"发布于 美国"},{"i":"5055495008683010","t":"老板和PM打配合。\n\n老板🙊: Please complete X by Y date. If not, you’ll be hammered by Z (project lead).\nZ 🙈: I prefer to call it “experiencing the finesse of Z’s project management skills.” But sure, hammer 🔨 works too.\n老板🐒: Just helping everyone visualize the consequences. And remember, we’ve got plenty of hammers in the office.","d":"2024.07.13","y":2024,"mo":7,"l":6,"c":4,"g":"发布于 美国"},{"i":"5054524987805428","t":"As a TPM, I’ve discovered the trick to driving alignment in meetings: do all the work myself and just ask for a yes/no. If I ask others to do the work, it’s a battle. But if I do it and seek sign-off, it’s much smoother. For example, I can handle prioritization rankings or estimates and simply ask for updates or approval. I can step into the roles of product manager or engineering manager if needed. Sad but true.","d":"2024.07.10","y":2024,"mo":7,"l":7,"c":3,"g":"发布于 美国"},{"i":"5047615546197145","t":"香蕉厂的职级：\n1️⃣ L4 每天只用开四个小时会。\n2️⃣ L5: 干活到五点，吐槽吐到半夜。\n3️⃣ L6：午饭时间有六分钟——在11:57早退上一个会去热饭，然后12:03吞下食物接入下一个会。\n4️⃣ L7：七点到办公室，但下午早退。\n5️⃣ L8: 每天在八个会议上开视频录脸，一半是表态另一半是感谢大家干活。\n6️⃣ L10 - L11: 活在PRFAQ的引用语录里。","d":"2024.06.21","y":2024,"mo":6,"l":17,"c":1,"g":"发布于 美国"},{"i":"5047575887478962","t":"Dev effort estimate 有三种情况：\n\n1️⃣ 理想情况：把自己关在房间里，上锁，不开IM软件和邮件，一气呵成。\n   - 完全不可能发生，只能在黑客马拉松周稍微试一试，而且只适用于原型创作。\n\n2️⃣ 日历时间：正常估计。\n   - 最可能的情况，但会被所有人反对，因为看起来不够短。\n\n3️⃣ 香蕉厂时间：从天上掉一个时间线，根据时间线来决定哪些P0是真正的P0（对，0后面至少有一位小数点），其他全部省略或推后，造成巨大的技术债，留给下一任接盘。","d":"2024.06.21","y":2024,"mo":6,"l":9,"g":"发布于 美国"},{"i":"5042851906060583","t":"Everlane现在有多差劲呢？发货极慢，打折极多。在下单到发货之间，我就已经收到邮件他们打折了。打折邮件又收了二十几封，五月份买的衣服都还没有收到。","d":"2024.06.08","y":2024,"mo":6,"l":6,"c":1,"g":"发布于 美国"},{"i":"5038993469086061","t":"If you thrive on stress, anxiety, and the occasional existential crisis, then TPM might be your dream job! 50% planning for the worst, 50% facing the reality that it wasn't even the worst you could have imagined.","d":"2024.05.28","y":2024,"mo":5,"l":11,"c":1,"g":"发布于 美国"},{"i":"5036985532550479","t":"西雅图的冬天基本上有十二个月那么漫长。每次下雨，不管是什么季节，都是秒回冬天——气温十度以下，下午四点就开始天灰灰。","d":"2024.05.23","y":2024,"mo":5,"l":5,"g":"发布于 美国"},{"i":"5036975621145550","t":"在香蕉厂，人们对项目复杂性的理解是这个项目必须🔴🟢🟡三个状态都来上好几轮。如果项目一直是🟢，大家会觉得这太简单了，顺利完成是理所应当。必须得是九九八十一难都走一遭才算do your job well。","d":"2024.05.22","y":2024,"mo":5,"l":7,"c":2,"g":"发布于 美国"},{"i":"5035754122641616","t":"当代买床垫：花三千块钱买床垫，还要每个月花24块钱的订阅费才能使用。为什么不直接去抢啊！","d":"2024.05.19","y":2024,"mo":5,"l":10,"c":3,"g":"发布于 美国"},{"i":"5030500918100176","t":"关于“听话”，EM又给了我一个新的角度。\n\n印度家庭和文化也是这样的，规训人要听话。但EM说他爸爸总是说：Hear everyone but do what you have to do.\n\nHear everyone 是1）Active listening 以及2）收集各方意见。Active listening 是维持关系的需要。好好听，好好沟通。收集各方意见帮助你兼听则明，因此知道大家不同的生活轨迹所集成的观点。\n\n但是决策是你的，生活是你的。做自己的决定。","d":"2024.05.05","y":2024,"mo":5,"l":33,"c":1,"g":"发布于 美国"},{"i":"5030496063455288","t":"叫你“听话”的人是叫你一起承担失败的风险，但不和你分享胜利的果实。\n\n如果失败，那是因为“你自己不会去trust but verify.”\n如果成功，那是因为“我英明，我有经验，你就是跑个腿”。\n\n不要让你的人生被“听话”给绑住了。","d":"2024.05.05","y":2024,"mo":5,"l":38,"g":"发布于 美国"},{"i":"5030492458189732","t":"Mentor跟我说的一番话，让我觉得工作受益，生活也受益。\n\n老板的话你要理解意图，然后自己找执行方法。听老板的话，并来直接拿来应用是危险的——如果结果好当然没问题，但如果结果不好那老板是不会帮你背锅的。因为老板只看结果不看过程，结果是公司的利益，你的工作是“过程”，是衡量各种方案，找能出结果且利益最大化的那一种来应用。“听话”执行无用，“听话”但衡量才是应该做的。\n\n这也让我想到生活里我和我妈的冲突。在心理咨询师的支持下，我稍微给自己的生活开了一个小口，告诉她我最近在考量的一个生活项目。这不是她了解的领域，我也没想要她支持或者同意，纯粹只是告知。她听到以后暴怒，发了很多很多短信劝阻我，在我睡觉前或者上班前连环打视频电话阻挠我。我特别窒息，因此更深地往回回退到自己的壳子里，只想经营自己的生活，做自己满意的事情，而不告诉她也不考虑她的任何意见。\n\n我妈会觉得这是为我好，要我听话。她自认为理由充分，而我自己做的研究都是愚蠢和胡闹。我知道她“为我好”，但“为我好”不代表要我屈服和按她说的做，尤其在我不依赖于她的认可或者支持的情况下。\n\n我不听话。","d":"2024.05.05","y":2024,"mo":5,"l":44,"c":5,"g":"发布于 美国"},{"i":"5029932558977438","t":"我刚听说了一个目前求职市场的真事。\n\n人力推荐一个已经通过OA，正在等待team match的SDE I候选人给用人经理。用人经理和团队面试之后确认可以招进这个组。人力为了能把这个人招进来，需要开设一个对外开放的SDE I招聘岗位。把这个岗位挂出来的两个小时内，人力收到了两千份申请。用人经理也（在毫不知情的情况下）被四个内部员工联络，要给自己的亲朋好友内推。其中还有一个总监，请用人经理看一下自己侄子的简历。\n\n太惨烈了…","d":"2024.05.03","y":2024,"mo":5,"l":17,"c":4,"g":"发布于 美国"},{"i":"5029843163154560","t":"同事拿了一大堆吃的来办公室准备Happy Hour.\n\n我：你们是从哪搞的这么一大盆爆米花？（巨大，一整个baking sheet）\n同事A （女生）：Oh it’s the magic from X. (X是一个隔壁组的男老板）X had his wife coming over and brought all the food. \n同事B（女生）：I need X’s wife in my life. I guess I’ll have to mary her somehow.\n我：I need a wife in my life, period.","d":"2024.05.03","y":2024,"mo":5,"l":5,"g":"发布于 美国"},{"i":"5029100144034878","t":"登上视频会议。\n我：XX - How are you doing?\n同事：Not too bad.\n我：That’s great to hear. You’re doing better than most folks that I’m talking to today. It seems like everyone else is barely surviving.\n同事：Oh, not quite. I'm Australian, so when we say 'not too bad', it's more like saying 'hang in there'! Sadly, I'm also barely surviving.","d":"2024.05.01","y":2024,"mo":5,"l":17,"g":"发布于 美国"},{"i":"5029068951519257","t":"和同组小姐妹吃饭。\n她：我最近一次1:1 完哭了三个小时。\n我：Nice! Processing everything at once is definitely smarter. I schedule my crying breaks now – it's an upgrade from the whole 'burst into tears randomly' thing I had going on. No more awkward office breakdowns, at least!","d":"2024.05.01","y":2024,"mo":5,"l":11,"c":5,"g":"发布于 美国"},{"i":"5028154882133677","t":"今天在电视上看到一个厨房纸的广告，我特别留意是因为全员亚裔的演员。一对看起来是中国人的老年夫妇正在庆祝结婚五十周年，老爷爷对老奶奶说You’re my soulmate and best friend. 然后小孙子把饮料打翻，就连蛋糕上印的婚纱照（是典型的九十年代照片，哈哈！细节跟不上年纪设定，但还是挺好玩的）都被这大水冲龙王庙吓活了。当然是厨房纸救场，一切如常，大家都和和气气乐乐呵呵的。\n\n我看这三十秒的广告掉了眼泪。因为我知道广告里的剧情是完全不可能——面孔是我熟悉的，但文化内容完全对不上。在生活里，我看得见真正上一两辈人在婚姻里的挣扎和痛苦，以及几代人大家庭里互动尴尬多余温馨的现实。广告明亮的色调是美式叙事的假甜，我尝到了真的苦。","d":"2024.04.28","y":2024,"mo":4,"l":8,"c":3,"g":"发布于 美国"},{"i":"5026878748361892","t":"最近我的上工状态：How is the math mathing?!","d":"2024.04.25","y":2024,"mo":4,"g":"发布于 美国"},{"i":"5022562637316484","t":"我问同事：春假怎么样？去日本玩得好吗？\n同事甲：飞行时间太长了。我刚刚换好尿布他又吐了，还吐了我一身。\n同事乙：你还好啦！我的孩子吐了，我把他的衣服脱下来，他就直接尿在我身上然后就睡着了。还剩六个小时飞行时间，我就穿着被尿湿的衣服托着他不敢动，怕他被折腾醒了。\n同事丙：你这个也还好。我在换尿布的时候我儿子尿了直接尿了我一脸一嘴…\n\n我：traumatized","d":"2024.04.13","y":2024,"mo":4,"l":10,"c":1,"g":"发布于 美国"},{"i":"5022523918123808","t":"人到中年，使用频繁的应用从Lululemon变成Redfin.","d":"2024.04.13","y":2024,"mo":4,"l":4,"c":2,"g":"发布于 美国"},{"i":"5019579722235937","t":"“If you want money, ask for advice. If you want advice, ask for money.”","d":"2024.04.04","y":2024,"mo":4,"l":8,"g":"发布于 美国"},{"i":"5017141369897231","t":"Today marks my annual review release and discussion day. Unlike previous years, when managers would spring the report on me during a 30-minute call, this time I received my review ahead of our afternoon discussion. The change caught me off guard, and I admit I had high expectations.\n\nUpon reading the review, I was initially disappointed. The rating wasn't as high as I'd hoped. After all, I had stepped up as an acting engineering manager during my colleague's paternity leave, efficiently overseeing a big team of scientists and engineers with 10-15 concurrent projects. I also actively facilitated technical discussions among scientists and engineers. In my mind, I had done exceptionally well and deserved better recognition.\n\nHowever, reality didn't align with my perception. The review indicated that my promotion timeline wasn't as imminent as I'd anticipated. It stung, but I knew I needed to approach the discussion constructively.\n\nThankfully, I had a mentorship talk scheduled for the same day. My mentor, a respected principal who directly collaborates with me, provided valuable advice on navigating this situation:\n\n1. Surprising Feedback: Start the conversation by seeking surprising feedback. What aspects of my self-assessment did my peers or manager disagree with? This approach encourages a deeper understanding of their perspective.\n\n2. Specific Scenarios: During the discussion, ask my managers about specific growth areas they've identified for me. Instead of being defensive, I should listen with an open mind. Understanding their recommended behaviors will guide my professional development.\n\n3. Personal Growth Areas: Identify a couple of growth areas I want to focus on, whether they overlap with my managers' feedback or not. Clarify what success looks like—what exit criteria or scenarios I should aim for as I make progress.\n\nIn retrospect, this heartfelt conversation with my mentor was a silver lining. It reminded me that growth often arises from unexpected feedback and intentional self-improvement. I'm grateful for the opportunity to learn and evolve. 🌟","d":"2024.03.29","y":2024,"mo":3,"l":24,"c":1,"g":"发布于 美国"},{"i":"5016802133803089","t":"+3老板今天升职了。结果下午四点半，在这他升职的当天，他不能开香槟，而得带着我们画白板——因为某个项目跑偏了，科学家和程序员做了一个Q不出结果，他得亲自上阵带着大家想办法。😂","d":"2024.03.28","y":2024,"mo":3,"l":14,"g":"发布于 美国"},{"i":"5013553217801166","t":"同事讲自己的故事：几年前他作为分析师刚被录用，干活慢进展少，他老板在一对一时送了他一本书。他连声道谢，接过来一看封面：SQL for Dummies. \n\n他开完会抱着书在厕所里哭了半个小时，然后回家挑灯夜读，发现真的是本好书，而且书的内容真的能用上。\n\n这真的不是段子。","d":"2024.03.19","y":2024,"mo":3,"l":55,"c":7,"g":"发布于 美国"},{"i":"5012423636943445","t":"我花了两天写了一个方向都是错的的doc，但还是在一个小时的会议里产生了对的决议。真正的关关难过。","d":"2024.03.16","y":2024,"mo":3,"l":4,"c":1,"g":"发布于 美国"},{"i":"5012068459610426","t":"又学到了一个职场说话技巧：principal 级别的资深人士改我的稿件，不说这个要删掉(delete this)，而是说”let’s ‘lose’ this mention of X”.\n\n对，不是这个你要改，而是这个咱们不要。","d":"2024.03.15","y":2024,"mo":3,"l":80,"c":3,"g":"发布于 美国"},{"i":"5011373963086130","t":"#精神自救# 2024年3月12号\n\nMy colleague, a Gen AI superstar, took his innovation to the next level this year. After initially using ChatGPT as a therapist with a killer prompt that allowed the AI to understand his shared problems, acknowledge his feelings, and search the web for actionable advice, he has now evolved the concept into a user-friendly mobile application. This morning, he demonstrated the app's capabilities to me. He shared his stress from work, and the AI therapist promptly guided him through a calming breathing exercise. 🤯 This feature was part of the app's upgrade, which he achieved by adding speech-to-text, text-to-speech, and a virtual number functionalities. The upgrade was surprisingly simple, taking him no more than an hour to complete. It's impressive how accessible and helpful the AI therapist has become. Despite this, I confess that I still have a preference for human interaction, especially when my emotions run high, which could quickly consume the AI's token limit and turn out to be more expensive than my insurance copay. 😂","d":"2024.03.13","y":2024,"mo":3,"l":7,"c":4,"g":"发布于 美国"},{"i":"5009916349122798","t":"最近IG广告对我效力减弱：一缺场合（上班以外，没有其他生活场景），二缺身材（无肩带设计需要骨架上一层皮的极致身材），这帮我省下了很多钱。","d":"2024.03.09","y":2024,"mo":3,"g":"发布于 美国"},{"i":"5009581794921337","t":"记录办公室的一段对话：\n\n女同事：我家车很老，最近天气冷，不能成功启动…\n\n男同事：所以你买了一辆保时捷吗？\n\n女同事：（🙃我为什么要买保时捷？）所以需要每天打车上下班。结果今天上午我把手机忘在了Uber上，直到下午才发现（对，白天看手机的时间都没有）。\n\n男同事：我家车已经不新了，所以我买了保时捷。\n\n另外三个男同事：我也…","d":"2024.03.08","y":2024,"mo":3,"l":10,"c":7,"g":"发布于 美国"},{"i":"5009222385533606","t":"How PMs drive results, an example\n\n六个人的会，五个人已经读完了文档，剩一个人。\nPerson: Sorry, I’m a slow reader.\nPM: No rush! You have precisely one minute left to read.\nPerson: 🤯 Ok, that’s a little bit of pressure.\nPM: 50 seconds…\nPerson: 🤪 Ok let’s start.","d":"2024.03.07","y":2024,"mo":3,"l":9,"c":3,"g":"发布于 美国"},{"i":"5008761837584523","t":"给水管工付了一千块，换取一个能用的下水道和一些生活技巧：\n\n1️⃣ 我们的厨房下水道接了一个garbage disposals。用途是直接碾碎大块食物残渣然后排出去。但是我们不知道，每次用完这个disposal以后还有一个步骤，是要接一些水（大概半池子）然后漏下去，保证把食物残渣迅速地冲走。这个附加步骤能够延长garbage disposals这个机器的使用寿命。\n2️⃣ 厨房下水道的garbage disposals 几乎是新房的标配，但水管工自己非常不喜欢，因为它作为一个机器几乎只有“完好”或者”全坏”这两个选项，难以疏通维修。这个机器的使用寿命通常只有五到十年，保修期通常三到五年。如果超过保修期，电机不运作，唯一的选项就是把整个机器拆除换新。从买机器到安装，需要一千二百块钱。（这就是我今天花的钱😭）\n3️⃣ 厨房下水道更便宜的解决方案是直接用管道。管道可以通，可以换，更少添麻烦。管道保养起来也很方便：每个月一次，浇上盐和柠檬勾兑的溶液，就可以把附着的油渍清一清。\n4️⃣ 浴室浴缸经常会因为头发堵塞，一般情况下堵塞都发生在栓塞部位，所以只要把它扭下来，头发拿出来就能缓解，不需要买化学溶液去冲去化头发。为了保证栓塞工作正常，我们可以买一个叫plumber’s grease的东西。每个星期一次，我们要把栓塞掏出来，头发撸到垃圾桶，再把栓塞上一层这个grease。这种保养可以帮助栓塞更顺滑地把其他会造成堵塞的东西滑下去，不会积攒附着。\n5️⃣ 金属的水龙头上经常会有水渍残留，最有效的清理是买一个便宜的Eagle One Never Dull的膏体，蘸着擦一下就能去除。这个膏体还可以用来给汽车的刮擦来抛光。","d":"2024.03.06","y":2024,"mo":3,"l":73,"c":13,"g":"发布于 美国"},{"i":"5008507076609324","t":"补全亚麻的领导力原则, you’re welcome：\n1/ Earn trust **with your manager**.\n2/ Insist on the highest standards **on other people’s work**.","d":"2024.03.05","y":2024,"mo":3,"l":10,"c":5,"g":"发布于 美国"},{"i":"5007411635030898","t":"我就像攒钱一样攒觉。白天不敢睡，希望所以疲惫能加总到晚上，一起睡过去。但一般不成功…","d":"2024.03.02","y":2024,"mo":3,"l":5,"g":"发布于 美国"},{"i":"5007370042999375","t":"Slack改版以后，”flag this message”被挪到了”edit message”的上面，让用户很容易误点。\n\n不知道Slack有没有监测到举报按钮的活跃度大幅提升…","d":"2024.03.02","y":2024,"mo":3,"l":1,"g":"发布于 美国"},{"i":"5007027126669199","t":"办公室修辞学：管人要活说action required, 还是说action requested? 大家品一品。","d":"2024.03.01","y":2024,"mo":3,"l":7,"c":8,"g":"发布于 美国"},{"i":"5006728582139403","t":"我终于买了心心念念好几天的梦龙冰棍。但是怕胖，没敢吃。我把冰棍放桌子中心，目不转睛地盯着它，然后打一杯蛋白粉奶昔。我一边饱足眼瘾，一边吞下25克植物蛋白。\n\n这是咱们都市丽人版“花生米与豆腐干同嚼，有火腿味”。","d":"2024.02.29","y":2024,"mo":2,"l":5,"c":1,"g":"发布于 美国"},{"i":"5006637454590190","t":"今天和同事聊，才发现我们都编造一个back story然后去豪宅open house长见识。\n\n同事的是俄勒冈老钱，需要找一个提前退休的新家，满足既运动又优美的生活方式。\n我的是比特币新富，不需要通勤，想在山高水长人烟稀少的远处隐居。\n\n😂","d":"2024.02.29","y":2024,"mo":2,"l":14,"c":1,"g":"发布于 美国"},{"i":"5005957236527771","t":"I found something super sad today. I'm too old to have any product intuition about Gen Z, because I'm a millennial. But I'm not old enough to be an old millennial like my bosses. They have Gen Z kids, so they can better relate to them. 😂","d":"2024.02.27","y":2024,"mo":2,"l":13,"c":2,"g":"发布于 美国"},{"i":"5005556737901771","t":"SDEs are awkward people who **know** they are awkward. \nSDMs are still awkward people, but they **think** they are smooth. (No.)","d":"2024.02.26","y":2 estyle of a working dad of a 4 year old. My son consistently wake me up at 5am so here I am!","d":"2023.09.21","y":2023,"mo":9,"l":9,"g":"发布于 美国"},{"i":"4946949369496639","t":"跟小姐妹聊天说起我跟我爸妈的问题，我才看到这个新的角度：拨开爸妈刻薄的言语，看到他们担忧的心。\n\n因为我每次跟爸妈讲电话以后，都要花一段时间才能振作精神。他们的恶言恶语让我痛苦，导致我越来越没办法跟他们说话，就说得越来越少，不向他们透露任何生活状态。这是我和我的咨询师沟通后的一种应对方式。我生活里太多需要操心的事情，工作非常费心，我的亲密关系也需要经营。我没有心力去真正解决我和爸妈的沟通问题，因此只想放在一边。\n小姐妹说，中国爸妈习惯用最狠最痛的话来打压子女，因为他们心急心忧。我越不说，他们越胡思乱想，越是一有机会劈头盖脸乱骂。这是一个负面的螺旋。他们越不了解我，越误会我，越进一步用更狠更恨的言语攻击我。这样我越来越封闭，他们就越来越逼进。\n如果理解他们的这个出发点，相信他们没有恶意，并且忽略他们的表达方式（屏蔽伤人的话），我可能可以听到他们true intention. 我也可以开始分享我的生活，不至于让我们对彼此的认知更脱节。\n\n但谈何容易？一想到我真正需要去应对的这些言语暴力我大脑就不转了，只想躲起来躲得越远越好。","d":"2023.09.17","y":2023,"mo":9,"l":44,"c":24,"g":"发布于 美国"},{"i":"4946427768996394","t":"【OB年检】👩⚕️: “You have very nice cervix! I’m happy for you!”\n\nMe: ☺️Probably my first time getting compliments on this particular organ. Thank you!","d":"2023.09.16","y":2023,"mo":9,"l":7,"g":"发布于 美国"},{"i":"4945311472288919","t":"跟大老板讲了个好消息：他很开心，开完会回来又跑到我桌子前说：”I couldn't even focus on the last meeting because i was thinking about you. Imagine how great you created for yourself despite what life threw at you.\"","d":"2023.09.13","y":2023,"mo":9,"l":48,"c":1,"g":"发布于 美国"},{"i":"4942790586794234","t":"按照别人的经历或者期待去要求亲密关系“应该”怎样是徒劳无功的。\n\n能够一起建立新的体验，也一起有效解决纷争，对我来说是最重要的。","d":"2023.09.06","y":2023,"mo":9,"l":25,"c":1,"g":"发布于 美国"},{"i":"4937777424368030","t":"一年体检一次。医生在离开诊室之前跟我说: “You look much happier now!”\n\nMe: (⁎⁍̴̛ᴗ⁍̴̛⁎)","d":"2023.08.23","y":2023,"mo":8,"l":31,"c":2,"g":"发布于 美国"},{"i":"4937766942802082","t":"请程序员写个一页纸 (1 pager)的设计，他在Appendix之前就写了一百六十七行，不包含每个选项画的流程图。他解释：”This is a one-pager with an infinite scrolling feature.”","d":"2023.08.23","y":2023,"mo":8,"l":6,"g":"发布于 美国"},{"i":"4936991738954740","t":"我突然发现EM崇拜的神Hanuman很可能是孙悟空…","d":"2023.08.21","y":2023,"mo":8,"l":6,"c":1,"g":"发布于 美国"},{"i":"4935935592497172","t":"5个L7在线上开视频听我们一屋子人吵架。\n\n最后的最后，HIPPO (The Highest Paid Person’s Opinion) 拍板了：What I heard was we’re having some very pol  is your job security. ☠️","d":"2023.06.09","y":2023,"mo":6,"l":20,"c":3,"g":"发布于 美国"},{"i":"4907691795546392","t":"据说ChatGPT通过了我们单位的SDE III 面试。\n\n同事：Yes of course! Our interview loop over-indexes on confidence and articulation. ChatGPT is so good at making things up so it’s a natural fit.","d":"2023.06.01","y":2023,"mo":6,"l":13,"g":"发布于 美国"},{"i":"4888975388444588","t":"“A lot of individuals are giving advice from a bitter and hurt place. And they’re trying to disguise it as ‘I’m just looking out for you’. No! You haven’t healed, and you cannot properly guide them in a positive and loving manner.”\n\nJay Sherry新播客的嘉宾Stephan Labossiere说这段话在讲很多人给的很糟糕的亲密关系建议。这一段简直在说我妈和我外婆。","d":"2023.04.10","y":2023,"mo":4,"l":11,"g":"发布于 美国"},{"i":"4883776426999909","t":"有的时候我会觉得咨询师对我更像妈对女儿。她会经常说：You should be proud of yourself! You have a career. You can afford a good lifestyle. You live an interesting life!\n\n而我妈对我很像什么治疗师对病人：你工作这么多年也没存下钱，就是乱花钱。你搬来搬去也没买房子，租房子浪费钱，到时候流落街头。","d":"2023.03.27","y":2023,"mo":3,"l":29,"c":5,"g":"发布于 美国"},{"i":"4883681577278110","t":"我现在明确自己对伴侣的需求了。我所关注的三个重要品质是capable, communicative, and nurturing.\n\n在刚刚开始接触的阶段，我关注对方的工作背景，是否是有能力的社会人。在进一步的发展中，我关注对方是否有意愿和能力和我保持沟通。这两点我早有意识。\n\n第三点nurturing 是我最近才发现的。我想要伴侣关心我，照顾我。不是包办我的生活，不是有求必应；在我们彼此的都自给自足的情况下，我希望我们能伸长了手为对方多挡一挡。我之前找不到描述这一点的语言，以为我要找的是不自私的善良的人，但我发现不自私的善良的人在亲密关系里依然可能很残忍（比如把我放在较低的优先级）。我真正的需求是对方nurturing，把我当回事，做事为我着想，扩容自己来装下我和我们的感情、生活。","d":"2023.03.26","y":2023,"mo":3,"l":146,"c":3,"g":"发布于 美国"},{"i":"4878993848009949","t":"因为杨紫琼获奖，我妈很好奇Everything Everywhere All At Once. 我有一点害怕如果我带我妈一起看这个电影她会发火。大家有和妈妈一起看这部电影的经历吗？","d":"2023.03.14","y":2023,"mo":3,"l":14,"c":14,"g":"发布于 美国"},{"i":"4878807850814068","t":"“Occasionally, the point he wants to explicate magically lines up with the one I want resolved, but much of the time there is a decidedly unmagical lack of complementarity between his love of clarity and my love of confusion. Of course, we compromise: by taking turns, and by putting up with the fact that one of us is, to some degree, dragging the other along for the ride. But we can also tell that we are compromising, and that makes each of us feel sad, and somewhat alone.”\n\n网页链接","d":"2023.03.13","y":2023,"mo":3,"l":3,"g":"发布于 美国"},{"i":"4877665297501784","t":"主动选择进入某种生活的人少，半推半就的多。","d":"2023.03.10","y":2023,"mo":3,"l":42,"g":"发布于 美国"},{"i":"4877522229268918","t":"EM在生活中的时间观念就很好笑。他说的10 mins通常是指现在马上any time now. 他说的2 mins 却一般是“我也不知道要多久，估计等一小会儿或者等一大会儿”。","d":"2023.03.09","y":2023,"mo":3,"l":2,"c":1,"g":"发布于 美国"},{"i":"4876821390952339","t":"我订一个午餐会\n\n组里的hip 小同事：vegetarian please \n组里的hip 老同事：carbon-based only, please","d":"2023.03.08","y":2023,"mo":3,"l":10,"c":1,"g":"发布于 美国"},{"i":"4875125058699681","t":"我有一个很喜欢说yes的science manager. 我还有一个很喜欢说no的engineering manager. 我好苦。","d":"2023.03.03","y":2023,"mo":3,"l":8,"c":1,"g":"发布于 美国"},{"i":"4874768538405307","t":"在单位里说话的艺术：\n\nYes, I agree. BUT… = 我不同意\nI don’t disagree = 我不是不同意，但我也不同意\nI’m not against it = 我不反对，但我也不同意","d":"2023.03.02","y":2023,"mo":3,"l":48,"c":3,"g":"发布于 美国"},{"i":"4874406076090802","t":"工作分配的两种方式：Voluntold and escalation.","d":"2023.03.01","y":2023,"mo":3,"l":5,"g":"发布于 美国"},{"i":"4870655721346246","t":"有时候我想问问我妈：你想要一个听话的在你身边的孝女（结婚生子任你摆布，工资上交），还是要我？","d":"2023.02.19","y":2023,"mo":2,"l":23,"c":11,"g":"发布于 中国香港"},{"i":"4870554521179591","t":"我本来以为我是很有底气跟我妈去“对决”，要求平等对谈的。我有独立经营的生活和工作，不在金钱上依赖他们，也并没有什么（她眼中的）极端想法（比如独身或者丁克）。我也以为自己是有这个机会的（终于在四年之后重新见面，在经历了七天比较愉快的旅行）。\n\n我的诉求就是不要逼我，让我的亲密关系顺其自然地发展。当这份关系能被escalate 成婚姻和育儿同盟时，我双手支持。我只想在自己的控制里进行这个生活，不要整天听她打电话念叨。\n\n我们现在的电话让我非常害怕。我妈对我生活分享的细节毫不在意，出去玩是浪费钱，吃到好吃的是浪费钱，买东西更是不能提，即便这是我自己的钱而且我有实力负担优渥的物质生活。我觉得她的这种举动让我（像之前提过的那样）无法进行有效沟通，只能大吼和挂电话来保卫自己的情绪。EM经常看到我在跟她电话以后大哭。\n\n我本来也以为我妈作为知识分子应该会有接受新事物的好奇心，以及能够理性讨论，然后我们重新相处，像朋友一样。但到头来还是：“你根本不会想事情你的感受都是错的！你不听话！你有神经病你越看心理医生越疯！”\n\n不过我暂时还没想放弃。因为这个视频我们开了个讨论的头，如果她跟我去美国也会真正用自己的眼睛看到我的生活。希望这是不破不立的“破”，我们还能试一下。\n\n#北大宿舍聊天 上野千鹤子#","d":"2023.02.18","y":2023,"mo":2,"l":43,"c":20,"g":"发布于 中国香港"},{"i":"4870545135108473","t":"我跟@憨憨的闻兄 说我想带我妈看#北大宿舍聊天 上野千鹤子# 视频。他提醒我说：“不过我感觉你妈也可能不一定能接受。”\n\n刚刚我带我妈看了视频，然后开始破口大骂。她说：“不学好！女性主义妖言惑众！没良心！就是不想跟父母扯任何关系！”她还说：“退票！我不跟你去美国！你有神经病！”\n\n跟我想的完全不一样她一点都没看进去。","d":"2023.02.18","y":2023,"mo":2,"l":35,"c":13,"g":"发布于 中国香港"},{"i":"4868588144165682","t":"一起旅游估计是成年子女和爸妈相处一个比较好的方式。大家一起和平历险，建立新的经历和记忆。\n\n当然也要忍耐爸妈每天三次路过超市就想要去买锅回Airbnb煮粥不在外面吃的念叨😂","d":"2023.02.13","y":2023,"mo":2,"l":22,"c":5,"g":"发布于 中国香港"},{"i":"4868177845289195","t":"世界上最糟糕的体验香港夜生活的方式：我先因为时差半夜醒过来，然后被附近兰桂坊的卡拉OK吵得继续睡不着。时间是凌晨三点半到四点半…","d":"2023.02.12","y":2023,"mo":2,"l":6,"g":"发布于 中国香港"},{"i":"4867982389938067","t":"Google Maps餐厅评价：\n【美国】能吃，不太贵，五星好评 (家家餐厅4.0+)\n【香港】好吃，地到，三颗星 (餐厅平均3.7) 香港·香港国际机场","d":"2023.02.11","y":2023,"mo":2,"l":10,"c":1,"g":"发布于 美国"},{"i":"4865763012513854","t":"Jay Shetty 在播客Girls Gotta Eat被问到“你给出过的最好的和最糟的亲密关系建议是什么？”\n\n最好的建议：别等到你身上的变化已经发生，才向伴侣沟通。有的时候我们花费数年来实现一个变化，直到等变化完成，我们才告知伴侣。这样太晚了，因为他们只有几分钟来做出反应（很多时候只是惊吓，而很难去一瞬间接受或者做出更深刻的反馈），而不是在这几年里参与/见证和帮助。\n\n最坏的建议：经常有人说生个孩子就能解决亲密关系里的问题，但这是非常糟糕的建议。对于两个人来说，孩子确实是比一纸婚书更紧密的“绑定”，但是这种“绑定”并不是解决问题。尤其养育孩子是极为艰难的大事，需要两个人有稳固的情感，相互扶助并肩作战。\n\n他还在另外的一节话题说了另外一个建议，我觉得也非常好。对于大部分情侣来说，两个人最多的相处时间就是一起看电视。如果“一起看电视”是两个人唯一的共同经历，而不是一起创造，一起经历新的体验，也难怪彼此之间的感情慢慢变质。情侣可以多试试新鲜事，餐厅或者活动。这样两个人会创造更多记忆，创造更丰富的共同生活。","d":"2023.02.05","y":2023,"mo":2,"l":45,"c":4,"g":"发布于 美国"},{"i":"4865452042358668","t":"我作为TPM的工作，往大了说是产品路径图管理，往小了说…（纸上谈兵做设计，做完又把它拆开变小）其实是给工程师派活。很多TPM往后会变成管理工程师的经理(Engineer Manager, EM)，也就是EM他现在的工作。\n\n我跟EM天天都在聊ChatGPT。他刚刚突发奇想：说不定以后会诞生一种新的IC EM（IC是指individual contributor，和管人带队的经理不同），上阵单打就能做项目。IC EM手下只带机器人，技能不是管理而是产品设计，直接和ChatGPT来交互做项目。只要产品能被想出来（并且给一个合适方案，或者让ChatGPT同时spike几个方案来比较），那么实现就不成问题。","d":"2023.02.04","y":2023,"mo":2,"l":21,"c":2,"g":"发布于 美国"},{"i":"4865383343854827","t":"周五傍晚，你从你最喜欢的餐厅点外卖，点了一溜你喜欢吃的。还有比这更开心的吗？\n\n有。餐厅点对了，但外卖送错了。你拿到了一单别人从这个餐厅点的吃的，因此你吃到了一份完全不一样的新菜！品质如一，口味也是你喜欢的，但你第一次试！太香了！","d":"2023.02.04","y":2023,"mo":2,"l":14,"c":3,"g":"发布于 美国"},{"i":"4864940169495072","t":"当然啦。我们每个roadmap review都要聊一聊ChatGPT and GPT4.\n\nVP of publishing: I don’t care who wrote the book. I don’t even care WHAT wrote the book. \n\n全场大笑。","d":"2023.02.03","y":2023,"mo":2,"l":6,"g":"发布于 美国"},{"i":"4864939083169854","t":"我们有一个十个人的会，一半的人在西雅图另一半在外地。\n\n在西雅图并且来办公室的我们开了一间四楼会议室，五分钟后两个VP从同一栋楼的六楼会议室拨进来。\n\n开视频开始讨论：\n【六楼】Guys we are just two floors above you.\n【四楼】Yeah we know. \n【六楼】👀👀\n【四楼】👀👀👀（我和两个L7正襟危坐）\n【六楼】Ok fine you are probably too cool to hang out with us let’s get started then!","d":"2023.02.03","y":2023,"mo":2,"l":7,"g":"发布于 美国"},{"i":"4864622890584013","t":"“It’s not like you don’t have feelings. You probably just don’t have intense feelings because you’re currently at peace.”\n\n“Sometimes we have the tendency to doubt our feelings, but try not to. Give some space and curiosity to allow yourself to feel your feelings.”","d":"2023.02.02","y":2023,"mo":2,"l":18,"c":2,"g":"发布于 美国"},{"i":"4863966742055601","t":"因为我跟EM想要move in together，我跟朋友仔细地描述生活中一连串变化。她问我：How do you feel about it?\n\nHow do you feel about it?\n\n我的therapist也总是这样问我。我在长大以后很少沉浸于自己的情绪。如果是糟糕的事情发生，我能发泄，有很多的悲伤可以源源不断往外掏。但如果是开心的事（比如这一件），我就会想：Do I still need to feel anything at all? 在大多数时候，我都不知道自己的感觉究竟是什么。\n\n今年我不写博客，但是想要每天写日记，见therapist的频率也增加了（很意外吧？我在经历去年的剧变的时候都没有见她那么频繁），就是想要去了解自己的感受，对自己的生活经历细嚼慢咽。写博客容易添油加醋（大家可能都很喜欢看更有剧情的内容，比如我的编辑会建议我把“离婚”放在标题并且每篇文章都重复），写日记就可以柴米油盐了。\n\n我还需要很多的练习才能表达自己的感受。🤷♀️","d":"2023.01.31","y":2023,"mo":1,"l":27,"c":5,"g":"发布于 美国"},{"i":"4862449444192656","t":"我们在happy hour开了一瓶起泡酒，庆祝春节。\n\n我：Have some Champagne!\n法国老板：Is this real Champagne or f**king Prosecco?\n我：Prosecco. You know we cannot afford Champagne.\n我：But Champagne is overrated right? It’s like the same with Prosecco and Cava.\n法国老板（撇嘴）：No, Champagne is way better. Other things are not even drinkable.","d":"2023.01.27","y":2023,"mo":1,"l":5,"g":"发布于 美国"},{"i":"4860665233675319","t":"“今天，珍重。谁知道是真是梦。”","d":"2023.01.22","y":2023,"mo":1,"l":12,"c":1,"g":"发布于 美国"},{"i":"4859551512004865","t":"我的Therapist的建议：多问一句澄清，这样可以分清4C: Control or coordination. Care or criticism.\n\n跟EM的对话：分清control还是coordination. （例子：我长周末去加拿大，买票的时候告诉他，他说：”You didn’t ask me about going to Canada.” 在那个时间点我就应该直接问：What do you mean? 然后让他澄清他说的ask 是ask for permission 还是ask to plan accordingly。）\n跟我妈的对话：如果我妈还在说打击我和贬低我的话，我也可以告诉她我听到的是你的批评这让我觉得很伤心，分清她是care 还是 criticism. （例子：我妈说你总是乱花钱老是在外面玩外面吃东西，还是可能是关心）","d":"2023.01.19","y":2023,"mo":1,"l":41,"c":2,"g":"发布于 美国"},{"i":"4859128867979607","t":"在IG上学到如何保持积极：把所有发生在自己身上的事情看作三类：宇宙给我的礼物，宇宙给我的信号/警示，宇宙给我上的了一课。😂","d":"2023.01.18","y":2023,"mo":1,"l":100,"c":7,"g":"发布于 美国"},{"i":"4857635499671896","t":"早上开会，科学家分享model evaluation的结果：说I’m happy with the result and we can go ahead and launch! But also what do I care? I might not even be here after Jan-18.\n\n这就是我麻大家现在的心理状态。战战兢兢小心翼翼等着下周的消息。","d":"2023.01.14","y":2023,"mo":1,"l":10,"c":1,"g":"发布于 美国"},{"i":"4857609389870715","t":"如果我在苹果做产品的话，我一定会改进闹钟的snooze功能。\n\nSnooze按钮默认不出现，如果用户坚持要使用，屏幕显示三个问题：\n1⃣️ 你是否和伴侣同眠？\n2⃣️ 你是否和室友同住？\n3⃣️ 你是否住在墙很薄的公寓楼？\n\n如果三个回答里有一个“是”，那snooze就不可使用。如果脑中第一次响起的时候不起床，那就迟到吧！","d":"2023.01.14","y":2023,"mo":1,"l":18,"c":1,"g":"发布于 美国"},{"i":"4848975574991407","t":"2022的显著变化：从小姐妹里为数不多的已婚人士变成为数不多的未婚人士","d":"2022.12.21","y":2022,"mo":12,"l":27,"c":2,"g":"发布于 美国"},{"i":"4844912891661755","t":"小姐妹在申请医院的 fellowship, 要我看她的申请表给feedback。表格里有个问题问你在医院的长期职业规划是什么。\n\n她的原句1⃣️ I would like to move to an TK directorship position at an TK. where I can use my experience to spearhead TK. -> 把I would like to 换成 I plan to，听起来更confident.\n\n她的原句2⃣️ I imagine this interest may steer me towards leadership roles in national organizations such as TK and TK. -> 直接删掉I imagine, 你已经用了“May”, 不需要更委婉。\n\n她的原句3⃣️ Given my background in TK and TK, I am also interested in projects that allow me to effectively TK. -> 可以直接说I can apply TK and TK to projects that allow me to effectively TK.\n\n原文听起来像一个战战兢兢的小女生，改过以后语气变了：你有资格选我，我也有资格选你。","d":"2022.12.09","y":2022,"mo":12,"l":42,"c":2,"g":"发布于 美国"},{"i":"4842372238147955","t":"昨晚做梦，是以前一个梦的延续。\n\n以前梦见去西安玩，和西安的一众朋友吃饭和去景点。\n这一次梦见一样的形成，从餐厅走去景点经过一个同样的大露台。朋友说一句“这是和2019年你看到的那个建设工地一样，过去这三年没变。”\n梦里的我突然想到“可是我变了啊“，然后开始蹲下来大哭  to be effective”的视角：打开组织结构图，想象你用手指捏住自己，把整个链条拎起来。从你拎起来的这个角度来看团队合作：要把你负责的某个项目做成，链条上上下下的人都要承担什么样的工作？大老板要给什么样的资源，老板是不是要对合作方唱个红脸，现有的人员分工是否合理，等等。\n\n这个视角一下点亮了我： 团队目标一致希望项目成功，揽活到自己身上只是打补丁而不是真的解决问题。你在be useful to others同时，也要高效用上别人。而且项目越大，高效用上别人也会越重要。","d":"2022.03.13","y":2022,"mo":3,"l":28,"c":1},{"i":"4746193797646187","t":"我分享了文章 那么多人，还在苦等着普京“下一盘大棋”","d":"2022.03.12","y":2022,"mo":3,"l":1},{"i":"4739442185341376","t":"“苏北为何颠倒？为何那么多女性因婚姻来到苏北，户口却没有随之迁移？我们不得而知。” 2010年人口普查，徐州“小花梅”查无此人","d":"2022.02.21","y":2022,"mo":2,"l":6},{"i":"4735840837698310","t":"我能表达的才是我拥有的。","d":"2022.02.12","y":2022,"mo":2,"l":27},{"i":"4734366556625713","t":"婚姻生活进度条：\n1⃣️秀恩爱\n2⃣️在网上写段子\n3⃣️跟朋友聊天，突然意识到不对劲\n4⃣️找朋友倾诉\n5⃣️找朋友哭诉\n6⃣️Couples therapy \n\n此刻在5⃣️","d":"2022.02.07","y":2022,"mo":2,"l":21,"c":4},{"i":"4732916641565090","t":"合作的同事都在西岸，我一个人在不同的时区。我想了三个方法来约束时间：\n1⃣️ 早上去健身房，十点再开始工作到下午六点，重叠西岸的八点到四点\n2⃣️ 在邮件签名里标注自己的工作时区\n3⃣️ 在日历上把自己下午五点到早上九点这个时间段设置为离线\n\n结果3⃣️效果最好，因为：\n1⃣️：我是晨型人，早上精力最好的时候去锻炼有罪恶感，下午五六点我又太累了开完会也整理不动笔记。\n2⃣️：邮件签名里标注的时间不action driven，同事看完也就忘了\n3⃣️： 直接从源头上杜绝了西岸下午的会，非常subtle","d":"2022.02.03","y":2022,"mo":2,"l":21,"c":3},{"i":"4730396622719467","t":"我的team onboarding很艰难，但我缓慢学到很多。\n\n1⃣️ 把老板的话当成线索（而不是字对字地奉为金科玉律）：根据线索，自己去追踪和查验，理出逻辑。\n2⃣️ 和同组同事第一次1:1的时候，不必是业务交接（估计这个时候交接你也听不懂）。介绍自己（如果已经知道自己的职能charter，说明来意；如果还没有，就仔细问团队需求），单纯为了开一扇门。向对方要求可以自行阅读的文档资料，理出头绪，再约下一次聊业务，这样更有效率。\n\n（会继续更）","d":"2022.01.27","y":2022,"mo":1,"l":60,"c":3},{"i":"4723123070700914","t":"“The Universe is under no obligation to make sense to you.” — Neil deGrasse Tyson","d":"2022.01.07","y":2022,"mo":1,"l":9},{"i":"4721421734903960","t":"朋友说为什么不想转销售：”I don’t want my career to be entirely dependent on my personality. I don't want to put any effort to be likable, and definitely not gonna do it all the time.“ 😂","d":"2022.01.03","y":2022,"mo":1,"l":49,"c":4},{"i":"4714128290087388","t":"男同事开会分享项目进展，没开摄像头，可能是抱着孩子？在屏幕的另外一头我能听到清晰的小孩呼噜声。太可爱了","d":"2021.12.14","y":2021,"mo":12,"l":14,"c":1},{"i":"4709817697960387","t":"PepciCo的前CEO  measurement must be built by a company grounded in technology and big data management.\n4⃣️ It's about audiences, not age and gender demos.\n5⃣️ It requires a huge focus on privacy and passive media collection.\n6⃣️ Lastly, and most importantly, a deep experience in both TV and digital measurement is required to succeed.\n\n网页链接","d":"2021.08.08","y":2021,"mo":8,"l":5},{"i":"4666622654030834","t":"别人看戏在Netflix，我看戏在单位的All Hands. 精彩纷呈。","d":"2021.08.05","y":2021,"mo":8,"l":7,"c":1},{"i":"4664188256125297","t":"分享一个解压秘诀：在Netflix 上看所有剧集的season finale —— 不需要了解谁是谁以及谁和谁，也不需要遍历过程和转折。直接看极致爆发，非常爽。","d":"2021.07.29","y":2021,"mo":7,"l":20},{"i":"4662772904232722","t":"Tequila moron challenge:\n\n1. Snort some salt\n2. Have one shot of Tequila\n3. Squeeze lime juice into your eyes \n\nCheers guys! You’re welcome!","d":"2021.07.25","y":2021,"mo":7,"l":4},{"i":"4657596164735651","t":"和朋友讲了半天我在做什么，他大手一挥：Got it! Your job is like a night club host - treating everyone like a VIP so they can have a good time.\n\n把我苦哈哈的工作说得瞬间性感了！","d":"2021.07.11","y":2021,"mo":7,"l":25,"c":1},{"i":"4654350971961421","t":"粼粼的波光够不够暖和你","d":"2021.07.02","y":2021,"mo":7,"l":7,"c":4},{"i":"4652142093403775","t":"“Do not lose hope! Things change all the time.”","d":"2021.06.26","y":2021,"mo":6,"l":25},{"i":"4646817453312262","t":"今天单位发了新的WFH通知。\n我：Wow they explicitly said we’re allowed to work from home 2 days a week!\n同事: Are those two days Saturday and Sunday?","d":"2021.06.11","y":2021,"mo":6,"l":16,"c":5},{"i":"4641300445397728","t":"Husbands will transform into race car drivers in IKEA marching with the shopping cart really fast so wives have literally no time to look around.","d":"2021.05.27","y":2021,"mo":5,"l":2},{"i":"4640626908070235","t":"海归感？","d":"2021.05.25","y":2021,"mo":5,"c":1},{"i":"4640268819890938","t":"现在全美国的人三分之一在夏威夷，三分之一在迈阿密或坎昆，三分之一在Aruba或波多黎各。\n\n夏威夷的旅游旺盛到什么程度？提前两个月都租不到车。租不到车的朋友开始租U-Haul. U-Haul最近限制只有夏威夷本地ID才能租车，因为本地租车的人都租不上了。","d":"2021.05.24","y":2021,"mo":5,"l":20,"c":6},{"i":"46
