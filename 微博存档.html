办,只有在考场上一头撞死.三角只要背公式,你背得有好熟,直接决定你做题的质量.","d":"2010.07.27","y":2010,"mo":7,"c":2},{"i":"1294523009","t":"我终于明白英语140是个什么概念了.我做题\"不怎么错\",可以保证在130以上.而要\"一点都不错\",才可能傲立140.刚做全国一,134.5","d":"2010.07.23","y":2010,"mo":7},{"i":"1289006479","t":"我不是他们,我不是任何人.但我也不是我自己.","d":"2010.07.23","y":2010,"mo":7},{"i":"1272910137","t":"莲姑娘:败在未成眷属的无奈。毁在终成眷属后的倦怠。","d":"2010.07.22","y":2010,"mo":7},{"i":"1265906432","t":"“明年，我也会走，我们剩下的六个人，会回到出走的地方，然后九个人又聚在一起。又要经历分别，不过还好，我们都知道要珍惜现在的道理，不会过早地惆怅。嗯，我有了一堆朋友，谢谢你们给我的所有理解和鼓励。我希望我们都会很好，很强大。 ”","d":"2010.07.22","y":2010,"mo":7},{"i":"1265901415","t":"“高二过得太快，三个礼拜前，刘泰言很认真地说，下学期不来了。好吧，我还能说什么呢。四个女生还剩我一个，九个人还剩六个。今天去机场送她了，其实本来不想去的。我讨厌直面分离，我讨厌流眼泪。还好，一直忍住了，身边一起去的人不自觉地哭，忍也忍不住。每个人都要经历离别，还好，你的生命会不停地出现新的人，新的事。旧人不会被忘记，但却不得不被面临被时光消磨的危机","d":"2010.07.22","y":2010,"mo":7},{"i":"1265893908","t":"“高一下，郭重杉委婉地跟我说，下学期不来了。似乎早就料到了，自己没有感到太诧异，没有太难过，只是感觉很不爽。直到一个月后，蔚蔚跟我说，她也下决心不来了。也许是因为在假期里吧，没有太多的失落，只是心想，没关系，一切照旧。哪知，失去毕竟会让人不习惯。不习惯周六没有蔚蔚一起去压马路，不习惯住同一个屋檐下的人突然改变。”","d":"2010.07.22","y":2010,"mo":7},{"i":"1265884419","t":"我在看亮亮的日志《九人》：“两年前的现在，我们不停地犹豫，不停地踌躇，最终下定决心，来了耀华。九个人，周婧，郑惠文，刘泰言，郭重杉，陆巍梁，龙腾，张航，汤颖超，程雯峥。我知道下决心是不容易的事情，毕竟没有人会拿自己的前途开玩笑。与其说是上学，更觉得是在履行无形的使命。”","d":"2010.07.22","y":2010,"mo":7,"c":1},{"i":"1255876849","t":"刘特级是最好最好的人~下午发信息给他请他发一本鄢烈山散文的电子书给我,他马上就发到我邮箱了~他的飞信原文是\"丫头,你要的书我已经发过去了,注意查收喔.\"哈,我要是不好好学语文怎么对得起亲爱的刘特级~","d":"2010.07.21","y":2010,"mo":7,"c":2},{"i":"1254393371","t":"下午照了证件照,用作高考报名.已经一年多没有扎头发了,妈咪说扎起来照相会比较清爽.说实话我不喜欢.打印复赛准考证,高考英语听力口语报名,订机票,复印政治笔记与地理地图,导出微博,准备自我介绍.一件一件的完成.假期开始,在25号前主攻英语.明晚开始上数学,很充实.回到家我反而不爱笑了.","d":"2010.07.21","y":2010,"mo":7,"c":1},{"i":"1244128712","t":"我们的暑假作业越来越制作精良,越来越优质优价,厚得童叟无欺,真让人...","d":"2010.07.21","y":2010,"mo":7,"c":2},{"i":"1223777221","t":"沿着你设计那些曲线,原地转又转堕入风眼乐园,世上万物向心公转,沉没湖底欣赏月圆.(黄耀明&彭羚<漩涡>)","d":"2010.07.20","y":2010,"mo":7},{"i":"1222920766","t":"不晓得我是不是政治学多了,可能政治常识的卷子做内伤了.昨晚竟然梦见某领导给我两袋冰糖,说一袋是权利,一袋是义务.我把它们捏在手里,不久都化了.","d":"2010.07.20","y":2010,"mo":7},{"i":"1218295095","t":"巧娘谈话一整晚,打乱顺序,很巧我是最后一个.巧娘说我这次的退步\"可以理解,不可原谅\",我深以为然.诶,多方面原因叭,反正不会有下次了.巧娘觉得我是\"帅才\",甚至有能力冲清华北大,但是我其实挺为这种评价而羞愧的,因为我做得根本不够,甚至离我的梦想,目前为止,太远.不过我会努力的~!我会王者归来的~!","d":"2010.07.19","y":2010,"mo":7,"c":1},{"i":"1211517796","t":"@看天下Vista,昨天出的第19期<看天下>P10的社论很好很强大.\"最大的悲哀,不是我们在琐屑的现实面前生活得很艰难,而是我们在碰壁之后,居然转而认可那些荒唐的逻辑和低劣的价值观.\"","d":"2010.07.19","y":2010,"mo":7,"c":2},{"i":"1204944851","t":"拉开窗帘,外面有雾.","d":"2010.07.19","y":2010,"mo":7,"c":1},{"i":"1192889355","t":"@Maj_Guderian@重静静,我应该要参加9月的听力+口语考试,所以又要飞昆明了,杯具.","d":"2010.07.18","y":2010,"mo":7,"c":3},{"i":"1192778336","t":"哈.我的手机修好了转轴,爸妈又给我送回来了.本来他们不想专门跑来送手机的,可是我的手机有5个闹钟,2个备忘,不停不停的会\"叫起来(我爸说的)\",他们受不了了所以中午又跑到双流来陪我吃饭就把手机拿过来...","d":"2010.07.18","y":2010,"mo":7,"c":1},{"i":"1188992414","t":"#求外教#成都地区。星期三和星期四。紫荆星巴克或大世界的咖啡馆。价格面议。要求纯正美音。女生。","d":"2010.07.18","y":2010,"mo":7},{"i":"1184957279","t":"我现在又舍不得放弃数学放弃其他专攻英语。难道我应该这样？为了比赛，拼了？可我又担心这是得不偿失的…诶诶诶，不管了，今晚献给英语，今天都没有作作文功课。加油加油加油，一定要拿到加分~!","d":"2010.07.17","y":2010,"mo":7,"c":1},{"i":"1181131641","t":"通过古今中外发生在我身上无数的丢东西惨剧，我证明了一个亘古不变的真理，那就是：如果迷糊可以量化，我就是大象小姐；如果失物可以重现，我就是鲸夫人…总之是无比巨大的杯具…","d":"2010.07.17","y":2010,"mo":7,"c":2},{"i":"1180895649","t":"传说破财消灾，难道我破的财还不够多麽最近？校牌彻底的消失了…呜呼哀哉…","d":"2010.07.17","y":2010,"mo":7},{"i":"1178887481","t":"周三回成都的第一件事，去紫荆看《出水芙蓉》~!","d":"2010.07.17","y":2010,"mo":7},{"i":"1176947184","t":"放学的时候爸妈就已经在校门口等我，我爸本来想开到华阳戛纳滨江那边吃板栗鸡，但是我觉得太远了就在潼聚泉吃了。我妈觉得我很造孽，一个星期没有好好吃肉，所以点了一桌鱼和鸡，我很努力的吃阿吃阿吃，是扶墙出来的…","d":"2010.07.17","y":2010,"mo":7,"c":3},{"i":"1166186984","t":"刘特级说:小朋友们,雷雨天不要打电话喔,小心跟雷公两个接通了,你就遭惨了洒~!","d":"2010.07.16","y":2010,"mo":7},{"i":"1152791290","t":"过去一直去,未来一直来,只有现在.--苏打绿<近未来>","d":"2010.07.15","y":2010,"mo":7,"c":1},{"i":"1152237119","t":"大概成长的过程即从理想主义者变成现实主义者,一点一点发现自己的不完善,才有进一步完美的可能.","d":"2010.07.15","y":2010,"mo":7,"c":3},{"i":"1152154001","t":"第一阶段补课过半,到下周三结束.新课轰隆隆的进行中,如我所愿.每天生活简单,所以时间很快就过.默默准备比赛,很充实.高三会是更甚于此的忙碌状态,其实忙碌比无所事事好的多.我现在不会再想什么要去什么学校什么专业之类的事,也不必想.分数拿在手中才是最踏实的事.","d":"2010.07.15","y":2010,"mo":7},{"i":"1119361156","t":"晚安.某年今日邂逅5200,某年今日和某人暧昧不明.哈,我记性多好.今年今日关于微博关闭流言四起.微博是我的树洞,我的存在感实体,我的真实,我的Utopia,我的心意,我的情绪载体,我的日记本,我的记忆备忘,我的甜心开心果,我的寄托.希望微博永存,amen.","d":"2010.07.13","y":2010,"mo":7},{"i":"1118129219","t":"\"有的人说不清哪里好,但就是谁都替代不了.\"现在这个\"有的人\"变成了另外的人.有时候奇怪的依赖就是莫名其妙的讨厌和不得不的关注.","d":"2010.07.13","y":2010,"mo":7,"c":1},{"i":"1116379599","t":"看了两节半课的Mean Girls,是的,就是传说中的<贱女孩>~!我想说,Fantasy it is.每个女孩,甚至男生,反正所有人,心里都有恶毒有mean,但,不要被伤人的恶意害了自己,做无聊的事.善良是可贵的诚实.","d":"2010.07.13","y":2010,"mo":7,"c":2},{"i":"1101269915","t":"关于清辅音浊化的问题,刚查了一下,才大概比较有概念.一般情况下s+p/t/tr/k浊化为b/d/dr/g.典例是strike,stand,etc.特别的water,happy,meeting,walking这些词浊化了才地道~","d":"2010.07.12","y":2010,"mo":7,"c":4},{"i":"1098761053","t":"刚刘特级群发飞信给全班一条很反动的短信,全班手机一齐震动,然后一齐Smilence了,哈.","d":"2010.07.12","y":2010,"mo":7,"c":2},{"i":"1092445535","t":"再次求翻译,我的英语谚语储备量严重不足.A fall into a pit, a gain is your wit.@MissSoft","d":"2010.07.12","y":2010,"mo":7,"c":2},{"i":"1079791857","t":"我远远比我想象中的难过,也比我想象中要没那么矛盾.得知排名的时候真的一下子就垮了.不过其实我也不那么绝望,因为我觉得新生活就在后头.所以非常矛盾中.这几天注定会非常非常难熬,我注定要付出代价.诶诶诶,希望今年就把明年的失望和难过全部消耗完,明年高考要好好好好好好的~!","d":"2010.07.11","y":2010,"mo":7},{"i":"1074557508","t":"摘自牛津高阶第6版例句,中文比英文出彩:Life is hard but we all have to struggle on.虽说世路多艰,但我们全都得勉力向前.","d":"2010.07.11","y":2010,"mo":7,"c":3},{"i":"1074279949","t":"正因为我从来没有自己想象中坚强,所以我从来都希望自己更坚强一点,可以不畏人言,不惧人色,不以物喜,不以己悲.跟自己说一万遍,不必在乎,都不能挽回刹那间灰暗了的情绪.不要管他不要管他,虽然不可能,但是必须勉强自己做到.这次就是彻底的教训,过去了就过去了,别这样.","d":"2010.07.11","y":2010,"mo":7},{"i":"1068667721","t":"晚安.头痛中,没有丝毫缓解.我妈说得对,我应该全方位调整,不然再这样下去,学习没好,身体反而更差.高三需要很多很多勇敢,很多很多毅力,要作出一切一切的准备.我还在调整中,我会使自己尽量快的过渡.加油~蔚宝,唔.","d":"2010.07.10","y":2010,"mo":7},{"i":"1062425936","t":"痛定思痛.木板理论.这是第一步,还会有更长的路.走好未来就好了.过去只是教训.教训愈痛,记忆愈深.我会雪耻的.一定会.","d":"2010.07.10","y":2010,"mo":7},{"i":"1059015594","t":"我只能说:知耻而后勇.我知道以后的路该怎么走了.","d":"2010.07.10","y":2010,"mo":7},{"i":"1052525762","t":"好,不说太多.补课期间,我会十一点就睡.现在把去昆明期间落下的数学卷子补上.我会努力的,绝对不止是一句空话.我会用我的行动来绝对实现我的目的.","d":"2010.07.09","y":2010,"mo":7},{"i":"1052418512","t":"无论如何,我高三了,现在才真正有这样的感觉,只有十一个月了.这次补课会一直不间断的补到7月21日,然后家长会.晚上拿到数学卷子,很不理想.本来很难过,因为大家都考得非常好.但后来想想,不要幻得幻失,没有努力就没有提高,对我很公平了,这是警告.","d":"2010.07.09","y":2010,"mo":7,"c":1},{"i":"1045310974","t":"不能操之过急,我必须真正的理解,真正的懂得,还有很长的路.当前还有其他重要的事,现在这件,循序渐进,也是一定要完成.所以说,\"三架马车\",齐头并进~!","d":"2010.07.09","y":2010,"mo":7,"c":1},{"i":"1037550188","t":"遇到什么困难都可以跟我说，蔚蔚，你比我更有能力。我会辅佐你达到你要的目标。 亲爱的蔚蔚，记住我说的那些话，虽然它们并不是金科玉律。 当你需要我的时候，也仅仅是几个字的事。让我作你前行路上的无面人吧. (From Lucas)","d":"2010.07.08","y":2010,"mo":7,"c":1},{"i":"1035121940","t":"To love oneself is the begginning of a life-long romance.(Oscar Wilde-my lover)","d":"2010.07.08","y":2010,"mo":7,"c":4},{"i":"1027270171","t":"分享DeProfundis的博文：Nature disaster is a lesson  网页链接","d":"2010.07.08","y":2010,"mo":7},{"i":"1014153794","t":"分享DeProfundis的博文：近照一堆。  网页链接","d":"2010.07.07","y":2010,"mo":7,"c":2},{"i":"1004755345","t":"\"七月七日晴突然下起了大雪,不敢睁开眼,害怕是我的幻觉.我站在地球边,眼睁睁看着雪,覆盖你来的那条街.\"今年的许多纪念日,我只纪念过一次,其余都任其流过.或许真是没必要记得,自己的生活就已经够了,何必仍为记忆劳烦.虽然我不曾忘,但我也要假装不记忆.","d":"2010.07.07","y":2010,"mo":7,"c":1},{"i":"933329020","t":"就是。高三是长跑。要坚持。也不要像百米冲刺，跑不长。(From居小溪)","d":"2010.07.02","y":2010,"mo":7,"c":1},{"i":"887051704","t":"外婆跟我聊天,说老外最近身体不好,前段时间做了手术,现在恢复很慢,还要时不时去复查.她希望我们都能开导开导他,老外有点想不开,情绪不好.","d":"2010.06.29","y":2010,"mo":6},{"i":"885339360","t":"自07年到成都以后,每年夏天我都会回昆明.我的房间一直没有太大变化,还是满墙Twins的海报.彼时还是<我们相爱六年>,现在已是<人人弹起>","d":"2010.06.29","y":2010,"mo":6,"c":2},{"i":"876035667","t":"怕会难过,只好装作我比你冷漠.-<我们多久没牵手>","d":"2010.06.29","y":2010,"mo":6},{"i":"874185094","t":"生活不是一副副整齐排列着的眼镜,生活是一片明亮的光晕,是从意识的萌生到终结一直包围着我们的一个半透明封套.--弗吉尼亚_伍尔芙<论现代小说>","d":"2010.06.29","y":2010,"mo":6},{"i":"874146186","t":"其实自己仍旧处在某种动力匮乏的低潮中,而且是日渐走低.我不知道我要什么,并且潜意识中不相信我可以得到.每过一天都没滋味,是浮浅泡沫.","d":"2010.06.29","y":2010,"mo":6},{"i":"851992378","t":"同偕人生路,不知要如何做得到.(张国荣<不想拥抱我的人>)","d":"2010.06.27","y":2010,"mo":6},{"i":"848511542","t":"传说昆明螺丝湾变成继义乌之后最大的小商品市场,每个店呆一分钟都需要花三十八天.","d":"2010.06.27","y":2010,"mo":6},{"i":"834006921","t":"\"大概是因为,我想做一个不靠希望也有勇气的人.\"-\"但我愿意相信有些人值得遇见奇迹\"-\"一颗渐渐通透的内心,恍惚面对世界,笔直面对自己.\"","d":"2010.06.26","y":2010,"mo":6,"c":1},{"i":"833753520","t":"放了一夜的栀子花已基本蔫坏成萎黄状,不过香味依旧.早安,一整日的与生物亲密接触~","d":"2010.06.26","y":2010,"mo":6},{"i":"831020512","t":"我不知道我想要什麽,所以我只有不断的去获取,得到以后再裁弯取直来删减.或许我的野心不是我的目的,但却是我达到目的的必然途径,我必将如此.","d":"2010.06.25","y":2010,"mo":6},{"i":"3196000099368980","t":"为了自己，我会继续消失。","d":"2010.06.25","y":2010,"mo":6},{"i":"768747746","t":"你倔强，骄傲，有主见，对爱执着，不隐藏，不纠缠。爱憎鲜明，积极进取，知道自己的目标，梦想和追求，内心渴望着家的安定给予的温暖而又从不放弃对自己人生价值体现的追求。你心里知道，没有任何事情是完美的，但是人们从来都没有停止过对完美的渴求。","d":"2010.06.21","y":2010,"mo":6,"c":2},{"i":"755885713","t":"下周不再更新微博,手机会留在成都.周五下午更新博客,唔.","d":"2010.06.20","y":2010,"mo":6,"c":6},{"i":"754289551","t":"昨晚再次梦见Certain,一直犹豫是否要记录这个梦.梦见似乎是我生日.我在电梯口,恰好也遇到他.我说:今天我生日.他说:那我陪你庆祝叭.我们一起上电梯,我说:还是不要了,不好.他说:好.然后离开了.其实还有前戏,我去一个远的度假村之类的地方,忘了.梦见他的模样不是照片,而是当时,很久很久了,都面无表情.","d":"2010.06.20","y":2010,"mo":6,"c":1},{"i":"753005253","t":"继续做作业~乖乖的不说话了~Mu~a","d":"2010.06.20","y":2010,"mo":6},{"i":"749521172","t":"晚安.不能耽溺,不能赋闲,不能贪玩.下周,要不然考虑不带手机去学校?好叭,这不现实.总之我自己要懂事一点了,我特后悔今天又买了一堆流量.明天还有一堆作业和复习呢,下个周末以后我就彻底没时间复习了,只能一门心思生物了.诶,无处不在的麻烦.睡觉叭~在家我还能睡得好一点,在双流就不行了,阿叻叻.","d":"2010.06.20","y":2010,"mo":6,"c":10},{"i":"749472810","t":"冷战45天,某人粉丝增长趋于0(我的意思是不多,不要跟我具体抠数字),看来终于有比我RP值还寒碜的人了-_,-","d":"2010.06.20","y":2010,"mo":6,"c":4},{"i":"749328615","t":"看完了<超人家族>,太棒了太棒了简直太棒了.是的我太贪玩了我竟然玩了一整天,OMG.不行不行,明天不能开机了,好好学习天天向上.我不能再这样让自己失望了斯密达.我不是弹力女超人我最爱魔衣娜,喔是的.乖乖的,一味的玩不会让我开心只会后悔的.我的事还很多不能这样下去,乖.","d":"2010.06.20","y":2010,"mo":6},{"i":"745136282","t":"刚吃饺子,好饱好饱好饱,嗝.包饺子的时候我爸也特想亢奋勇于动手,但是每次都捏得一塌糊涂.我妈怒了,说:你要再包我就不让你吃了~!我爸只好特委屈的坐在一边看电视...","d":"2010.06.19","y":2010,"mo":6,"c":3},{"i":"743247163","t":"无话可说. 《大学是间坏公司》  网页链接","d":"2010.06.19","y":2010,"mo":6,"c":2},{"i":"743171293","t":"《你们的世界竟然拥有这种东西！》  网页链接","d":"2010.06.19","y":2010,"mo":6},{"i":"740573081","t":"我要不要改名叫@小确幸_蔚崽崽 捏?话说这个名字可以一针见血的指出我爱好装嫩装怪装傻装可爱的本质...但是不如@小确幸夫人 有范儿阿~","d":"2010.06.19","y":2010,"mo":6},{"i":"738759061","t":"@脑内图@小确幸夫人","d":"2010.06.19","y":2010,"mo":6,"c":1},{"i":"738712486","t":"我,连续两周搞丢数学周练了,我是不是跟数学相克阿.看到那本理数卷子我也很,这个的周末...","d":"2010.06.19","y":2010,"mo":6,"c":4},{"i":"738302766","t":"@divaLee,做梦梦见你了.梦见我们住在同一幢别墅不同房间,客厅里有一些人在做BBQ,有烤章鱼,我吃章鱼吐了...然后早上我们一起去上学,迟到了两节课,我发现住在 声，突然觉得像是给自己的警告。还有365天。两年的时间觉得自己没有很充实，浪费了好多。可是一定会潜心努力。(From亮亮 11:51)","d":"2010.06.07","y":2010,"mo":6},{"i":"583128439","t":"明年此时,希望我不会失眠,安心睡着.希望现在正在失眠的考生们马上被瞌睡虫扑倒~希望你们都能元气百倍的进入考场~好好发挥,不留遗憾~加油加油~今年你们的战场,明年我们的舞台~奋斗阿阿阿阿~!","d":"2010.06.06","y":2010,"mo":6,"c":3},{"i":"583092347","t":"又是一个高考日.去年今天我似乎在参加Compass Edu的英语复赛,最终以2.3+3.8的成绩止步决赛.尽管初赛我是几个最高分2.5之一.世事莫测.明天一个人在家,还有一堆地理卷子,至少还得做一份英语套题.还有数学两张卷子恐怕得留待后天了.哈,与考生们一起奋斗~","d":"2010.06.06","y":2010,"mo":6,"c":2},{"i":"571256575","t":"我也可以非常寡言,并将沉默作为某种状态.晚上做完所有听力模拟题,明天正式去考试.注销了昨天用gmail邮箱注册的博客,转成微博这个ID的新博客.还是会维持,发一些自励的话或者学校习作上去.","d":"2010.06.05","y":2010,"mo":6},{"i":"563397885","t":"好消息:小说家S将把我的文章<谁是主角,陪衬时光>刊登在上海<风致>杂志.虽然这是08年一篇旧文,在泛客中国,豆瓣和新浪博客上都发表过.S说,三年过去,我的文风变化不大.我觉得这不是好事,可也不坏.","d":"2010.06.05","y":2010,"mo":6,"c":2},{"i":"530869050","t":"根据阿克洛夫的理论:拖延行为是人们总过高估计今天做事的成本,而过低估计明天再做的投入.拖延行为只要进行一次就会被永远拖延下去.组织拖延行为的方法是制定最后通牒和强制性措施.","d":"2010.06.02","y":2010,"mo":6,"c":2},{"i":"526512079","t":"小王子说 有些事 流浪过才会懂原来每颗心都有个洞找不到真爱 会一直寂寞我但愿有一个人在等我在属於我的612星球好让我 忍着痛 也愿意往下走不快乐至少要有梦一定会有一个人在等我无条件拥抱着我的所有想遇见我还要翻越多少山丘花别谢太快 请你等等我擦干眼泪 一个人 漂流在这宇宙","d":"2010.06.01","y":2010,"mo":6},{"i":"523466925","t":"天气太太太太无常,风雨阴晴莫测,妖异.传说周五晚上天空出现巨大无比特别明亮的圆月亮和蓝星星,好多人看到都拼命尖叫.Really?","d":"2010.06.01","y":2010,"mo":6},{"i":"520375556","t":"外公需要动一个\"小\"手术,似乎问题不大,但是要在身上动刀子还是很让人担心的.希望他一切都好好的,快快恢复,健健康康~~我你,外公~","d":"2010.06.01","y":2010,"mo":6},{"i":"505809083","t":"做梦,什么游泳什么的,泳池里有一段全是泥.在将醒前还做梦,梦见某某某,我在路上看见他,第一次是他在我前面,就很慢很慢的跟着,不让他发现.第二次是他在我后面,我就开始拼命逃,听见后面本来没有脚步声,但脚步声后来却越来越重越来越密,但没有人叫我.第二个梦没有结局,因为我被闹钟闹醒了.","d":"2010.05.31","y":2010,"mo":5,"c":1},{"i":"500436104","t":"的确,\"去往罗马的道路\"有很多条,但是你必须把握,因为你只有一次选择,一条路.什么是你可以走的,什么是走得通的,要准确拿捏.对于无法企及的星星,舍比取更重要.","d":"2010.05.30","y":2010,"mo":5},{"i":"492047410","t":"过去的过去写给一个旧友的文。图片需要特别推荐一下，是我最伟大最亲爱的表姐净玄猫大人的作品。瞻仰之。《七年》 网页链接","d":"2010.05.29","y":2010,"mo":5},{"i":"492017702","t":"把Q好友全部删除以后就经常有陌生人来骚扰。我一概不加好友，一概不理会，就是这样。","d":"2010.05.29","y":2010,"mo":5,"c":2},{"i":"491972604","t":"同样是13岁的文，彼时是创作高峰期。《请予我幸福，全我想念》 网页链接","d":"2010.05.29","y":2010,"mo":5},{"i":"491948508","t":"13岁时写的关于私奔的文。《黑夜清晰过白昼》 网页链接","d":"2010.05.29","y":2010,"mo":5},{"i":"491894623","t":"网页链接豆瓣神帖。","d":"2010.05.29","y":2010,"mo":5},{"i":"491782949","t":"刘若英给陈升新书的序言。 网页链接","d":"2010.05.29","y":2010,"mo":5,"c":1},{"i":"488872540","t":"终于搞掂我的COMPOSITION了~可以安心做作业了~我的人生是苦海无边,四周无岸的.","d":"2010.05.29","y":2010,"mo":5},{"i":"487454196","t":"大大的高兴~大大的幸福~刚赵明超Call我说没问题一定帮我,他看完再拿给尹江进一步修改~心花怒放中~嗷~","d":"2010.05.29","y":2010,"mo":5,"c":1},{"i":"487136063","t":"歌颂我们可爱的Cool Boy赵明超小盆友~我的救星~Mu~a~今天完稿,晚上发给赵Sir~#成都新东方#大大的好~","d":"2010.05.29","y":2010,"mo":5},{"i":"484781269","t":"折腾三个多小时.翻出所有NOS的书和笔记搜集有用信息.仍然全无头绪.今晚必须必须整理出参考资料来,不然不准睡觉.","d":"2010.05.29","y":2010,"mo":5,"c":2},{"i":"481984131","t":"李·艾科卡:我一直在致力发掘那些能充当最高管理者的人。他们是一些渴望工作、勤奋向上的人。这些人总是想干得比别人期望他的更多，也总是帮助他人把各自的工作干好。","d":"2010.05.28","y":2010,"mo":5},{"i":"481961471","t":"1949年李·艾科卡进入福特工作，他以独具的市场眼光与销售方法使福特成为全球数一数二的汽车霸主。1970年李·艾科卡成为福特总裁。1978年因为理念不合，被福特解雇。同年担任克莱斯勒总裁。李·艾科卡力挽狂澜带领濒临危机的克莱斯勒汽车公司从谷底崛起，并创造了惊人的利润，写下汽车史上传奇的一页。","d":"2010.05.28","y":2010,"mo":5},{"i":"481935627","t":"10月15日〔金星?魔鬼〕代表人物：艾科卡  热情洋溢，充满野心，有极高的领悟力；擅长社交，具有群众魅力，  天生的领导人才；喜欢奢华、美好的事物，追求物质享受。  优点是具有吸引人的独特魅力；感情丰富，容易惑染别人。 缺点是过度自信，太喜欢炫耀自已的才华；比较霸道和独断。","d":"2010.05.28","y":2010,"mo":5},{"i":"474056772","t":"晚安.在\"明天把手机带回家然后下周不带来\"和\"明天不带手机回家周末消停下\"之间徘徊很久很久,我果然很犹豫很犹豫,最终还是决定选择后者.我还没想过要对自己太狠,完全放弃手机放弃微博,但我觉得有必要时时整治一下自己的浮躁.","d":"2010.05.27","y":2010,"mo":5,"c":2},{"i":"473979507","t":"原来姹紫嫣红开遍,似这般都付与断井颓垣.良辰美景奈何天,赏心乐事谁家院?(汤显祖<牡丹亭>)","d":"2010.05.27","y":2010,"mo":5},{"i":"469182409","t":"太阳是从薄薄的云层里发出光芒,所以光晕被过滤了,只剩下刺眼的惨白的光.这是具有\"成都特色\"的.","d":"2010.05.27","y":2010,"mo":5,"c":1},{"i":"463542491","t":"我能够作出的最正确的选择,就是选择未来,对自己负责.其余都可以不管不顾,不要了.不能再让未来的自己说后悔.","d":"2010.05.26","y":2010,"mo":5},{"i":"463447612","t":"我不可能主导很多人\"看,快来崇拜我\".喜欢我的人会喜欢,不喜欢的人我也从不强求.我一向不喜欢过去的自己,因为我会强求过去的自己做得和现在一样,不犯错不犯傻.事实上这不可能.我会经常后悔\"阿,以前我怎么会那样\",然后造成一堆恶果.所以我总在逃,所以我痛恶回忆,永远不想回到过去.","d":"2010.05.26","y":2010,"mo":5},{"i":"463410125","t":"我还是只要活在自己\"瘦瘦的世界,窄窄的梦想\"中就好.世与我而相违,复驾言兮焉求.其实也不是我多么\"不合群不讲理\",而是\"他们是他们,我是我\",我从未真正融入过\"人群中\".我不要去自讨没趣的看热闹,其实自己就很精彩了.我是为未来而活的,我和他们不同,我要的和他们不同.","d":"2010.05.26","y":2010,"mo":5},{"i":"463325097","t":"我还是,只爱陌生人.晚安.","d":"2010.05.26","y":2010,"mo":5},{"i":"463281135","t":"我觉得我还是不喜欢人人.虽然找到了一些人,但是找到他们并非我本意.刚看了某某某人的日志,看到\"熟悉\"的人说\"陌生\"的话,觉得很恐怖.我从来就不在他们的世界里,也从来不把他们算进我的世界.过去是自觉不自觉的边缘化,现在是不考虑其他只呆在我\"快乐\"的小圈子.我不要回到现实中去.","d":"2010.05.26","y":2010,"mo":5,"c":5},{"i":"453582765","t":"世事难料.晚安.","d":"2010.05.26","y":2010,"mo":5},{"i":"450270857","t":"我的负面情绪要把我压垮了.","d":"2010.05.25","y":2010,"mo":5},{"i":"443171990","t":"我不光要使自己\"看上去\"很强势,而要真的无限强盛起来.是的,我争强好胜,不能使自己人善被人欺.要表里如一的坚强果决,我可以做到.","d":"2010.05.24","y":2010,"mo":5},{"i":"443151214","t":"晚安.我能够预见很多人已然不同路,各自有各自的活法,彼此不能有交集.远远看着你们,看到并非自己的路,只能道珍重,看你离开.我们都在路上,所以告别和遇见都只是寻常.曾经拥有那么不可思议的你,已然是不可回顾的奇迹了.","d":"2010.05.24","y":2010,"mo":5},{"i":"433587304","t":"晚安.要在阒静里找到自己,而非无端热闹.","d":"2010.05.24","y":2010,"mo":5},{"i":"433210842","t":"07年罗非鱼生日的时候,我送她一只肥嘟嘟毛茸茸的小龙猫\"憨憨\"作为生日礼物.转眼我都离开昆明四年了,憨憨四岁了,我们也都老了四岁.我基本不再与初中同学联络,但是大家都在,都各自精彩的生活着.过去的事虽然很远了,但是每个人都记得,都念旧.尽管现在都不是当初的那个人,但记忆中不变.","d":"2010.05.23","y":2010,"mo":5,"c":2},{"i":"411871508","t":"第八型(梦想指数90，成功指数10)     你是一个感情丰富的人，很容易受到环境的影响。优柔寡断是你的性格弱点。遇强则弱，很容易成为他人欺负的，遇弱则会显得很怠惰。你需要积极营造自信，不要人云亦云。如果父母都很强势，对你将有很大的帮助。学习不要逃避问题和多自修，成功几率才会提高。","d":"2010.05.21","y":2010,"mo":5},{"i":"403796841","t":"考完数学,是概率部分的测试.每道题我都保证认真算过一遍,又认真检查过一遍.感觉很好,因为每道题都想到了解决办法.应该成绩不错.","d":"2010.05.20","y":2010,"mo":5},{"i":"399462856","t":"在看吉米的口述,<新周刊>P170,我真喜欢她.\"一个女人每爱过一次,就会形成一个闪光的剖面,剖面多了就像钻石一样熠熠发光了\"\"在感情上投资,跟股市没有任何区别,风险莫测.去过在事业上投资,在房地产上投资,再怎么赔,自己还有一套房子.\"","d":"2010.05.20","y":2010,"mo":5,"c":1},{"i":"379271134","t":"当你觉得整个世界都不对的时候,一定是你自己错了.","d":"2010.05.18","y":2010,"mo":5},{"i":"375115672","t":"窗外.此时.电闪雷鸣.","d":"2010.05.17","y":2010,"mo":5,"c":1},{"i":"366265302","t":"晚安.变得不想说话,只是看热闹.不想说自己,仿佛是一种麻烦.这记录愈加牵强了.","d":"2010.05.16","y":2010,"mo":5},{"i":"358539437","t":"阅读<大地之灯>,对卡桑和迦南之间感情的感受,与三年前完全一致.卡桑只是遇到命定的劫,绝非爱情.这是彻底的悲剧.","d":"2010.05.16","y":2010,"mo":5,"c":1},{"i":"358531589","t":"遇到劫难爱人,是你幸运的不幸.幸运,是你此生或许再不会这般铭记,你是以血液里流动的痛苦,来烙印他存在的痕迹.而不幸则单纯,可能他并不值得你的爱,或者根本他不爱你.无论如何,你以你的焦灼,紧握虚无的手.无论此时彼时,他都不是你的茶,不够担当你的爱,也不能给你世界,只是你不愿相信.","d":"2010.05.16","y":2010,"mo":5},{"i":"358513909","t":"总有一份爱情,以劫难的姿态,引你一步一步下陷.你不知你因何而爱,你不知你因和而苦.只是他的出陷让你中毒般迷恋,你走向他给你的,抑或你自己织就的幻觉中,不得救赎.你自觉茫然无知,心里苦楚,然无法放弃亦无法继续.你知道一切都不是你想要的,但却有致命的迷恋气息,让你直堕无尽渊底.","d":"2010.05.16","y":2010,"mo":5},{"i":"357238934","t":"希望虽是不可依靠的东西,但是却能使我们通过坎坷,走到人生的终点--罗休夫柯.晚安.","d":"2010.05.16","y":2010,"mo":5},{"i":"350270784","t":"我的固执不是因为对你任何一桩现实的责难,而是对自己个我生命忠贞不二的守信.你甚美丽,你一向甚我美丽.--简帧","d":"2010.05.15","y":2010,"mo":5},{"i":"350258059","t":"认识你愈久,愈觉得你是我人生行路中,一处清喜的水泽.几次想忘于世,总是在山穷水尽处又悄然相见,算来即是一种不舍.我知道,我是无法成为你的伴侣,与你同行.在我们眼所能见耳所能听到的这个世界,上帝不会将我的手置于你的手中,这些,我都已经答应过了.--简帧","d":"2010.05.15","y":2010,"mo":5,"c":1},{"i":"348552210","t":"世界之大,总有一隅可安放我和我的梦想.我会一步一步做到自己想要的位置,无论如何.晚安.","d":"2010.05.14","y":2010,"mo":5},{"i":"339380152","t":"晚安.因为生理痛折腾了一天,必须好好休息,善待自己.","d":"2010.05.13","y":2010,"mo":5},{"i":"339003451","t":"\"只是你迟到一千年/黄昏后就不会有夜/发间在印象中被蔓延/你说你放弃了八月\"(苏打绿)是的,我放弃了八月,连绵的雨季,不可再得的心意.收到你的信息\"之前的感情来得强大虚无,我无从把握\".经过那么久你才想到给我道歉,全无意义.我不需要,我也从未觉得我们彼此愧对,只是好聚好散而已.","d":"2010.05.13","y":2010,"mo":5},{"i":"333981136","t":"现行教育体制的问题所在,是\"不能培养天才\",甚至还要\"扼杀天才\".偏科在国内是一个纯粹的贬义词,但这其实毫无根据.我们花费巨大精力,用自己的长板去弥补短板,最后变成一个规矩的水桶,和所有其他水桶一样超载装水.彼此没有差别.无论你的兴趣是椅子还是桌子,你只能作水桶.","d":"2010.05.13","y":2010,"mo":5,"c":1},{"i":"333613864","t":"痛经是世界上最让人绝望的事,actually.","d":"2010.05.13","y":2010,"mo":5},{"i":"330753362","t":"晚安.我应该给自己设立高三倒计时,充分体会\"置之死地而后生,死去活来\"的心情.学校里一棵树,上周落尽了黄叶,本周竟然密密的生出新枝花苞.这是希望的所在叭.","d":"2010.05.13","y":2010,"mo":5,"c":1},{"i":"321787325","t":"晚安.生命不易,要让自己活的丰盛.不能辜负宝贵的岁月,要以理想为坐标,向前走.一定要有自己的路,一定要坚定而坚持.愿生者自勉,愿逝者安宁.","d":"2010.05.12","y":2010,"mo":5},{"i":"321765604","t":"地震教会我什么,生命的脆弱.从那时起我的Q密码就做了特别的修改,一直纪念.只有生死一线,离自己那么近,才会真正懂得,如何珍惜,如何爱,如何活着.这些是不朽的记忆.是希望,温暖着我们.这样的经历,让回忆也满含热泪.纪念512,三年,一生.任何一个亲历者都不会忘记,刻骨铭心.","d":"2010.05.12","y":2010,"mo":5},{"i":"321730288","t":"晚上,很多人不敢回家,特别是维多利亚还是高层.物管在门口摆了椅子,矿泉水和电视,业主们抢购空了红旗连锁的方便面,然后开始摆龙门阵.一个阿姨说她家在12楼,剧烈的摇晃把她们家的水晶吊灯全部击碎,鱼缸也翻了.很多老人还心脏病发,保安从楼梯把老人背下来.表扬蜀信物管,做得很好~","d":"2010.05.12","y":2010,"mo":5},{"i":"321705311","t":"那次地震,持续一分半钟.我们从二楼教室跑下来,操场上的篮球架还在\"左右摇摆\".全校都坐在操场上,每个班一个圈.我当时跑的匆忙甚至手上的红笔都没有放下来.在操场上等了一个小时,教学楼没事,但是学校不让回去拿东西,大家就都空着手回家.手机没信号,谁都不知道是怎么回事.我就赶快跑回家.","d":"2010.05.12","y":2010,"mo":5},{"i":"321683540","t":"512又至.08年的今天我是个傻兮兮的不晓得努力的初三学生.那天中午昏沉沉去上课,看到沿路的灌木丛很多白色蝴蝶在飞.地震时化学课,我们在讲卷子.哄隆隆地震了,大家都不知道怎么了,还以为是后面的人踢凳子.反应过来是地震以后全部往下跑,老师在最后,腿很软心里很怕,跑下来很多人就哭了.","d":"2010.05.12","y":2010,"mo":5,"c":1},{"i":"313248979","t":"要有信心,也要更努力.你期待什么,就必须如你期待的那般去耕耘.没有捷径,只有苦海.没有舟,只能劈开红海.不要辜负每一天的课程,我的今天决定我明年的今天.晚安.Mu~a","d":"2010.05.11","y":2010,"mo":5},{"i":"312875276","t":"路在哪里?我几乎以为我盲了.他们告诉我\"你不需要有理想,你只要有分数,你只有有了成绩才有资格挑选你的人生\".我明白,可是我真的不知道如何或许这些加在命运身上的分数.我觉得迷惘,觉得恐惧,觉得难过,觉得未来根本是不存在的,我也不知道这个未来与我要的未来又有什么干系,我又要什么.","d":"2010.05.10","y":2010,"mo":5,"c":5},{"i":"312847219","t":"我现在根本不知道该怎么实现我\"宏伟的理想\".就这样走下去,走得通吗,走得完吗?我是不是真的那么差,真的不行?!好不容易以为自己可以看到一些希望,但是希望都是假的,不可触摸的.被告知\"你永远都不要想\".很难过,简直不知道该如何坚持.就算什么都不想,过一天算一天,也根本不可能.","d":"2010.05.10","y":2010,"mo":5,"c":3},{"i":"304927379","t":"晚安.简单是快乐的不二法门.因为数学卷子做的好所以心情好所以快乐的看杂志所以背熟了成都二诊完型所以复习完了欧洲笔记所以这是积极的连锁反应~生活是单纯美好的,和同桌们分享笔记,分享偏难怪题,分享电影和音乐.阿~幸福着.","d":"2010.05.10","y":2010,"mo":5,"c":2},{"i":"304402507","t":"马克思:在选择职业时,我们应该遵循的主要指针是人类的幸福和我们自身的完美.不应人为,这两种利益是敌对的,互相冲突的.","d":"2010.05.09","y":2010,"mo":5},{"i":"301527084","t":"不要总是用你的抱怨来试探我是不是也不喜欢她,这样没用,因为我本身就是喜欢她的,我喜欢好孩子.","d":"2010.05.09","y":2010,"mo":5},{"i":"299145963","t":"外头在下雨阿哗啦啦.天空阴霾,心里安宁.刚才犯恶心的事并不对我产生影响~因为看清一个人之后,就会觉得他完全无关紧要,并且讨厌的可疑.该说的不该说的,我都没有必要给他任何解释.就这样,总之,你别在外头坏我名声就行,你自己想怎么混蛋就怎么混蛋去叭.","d":"2010.05.09","y":2010,"mo":5},{"i":"298046021","t":"社会只爱健康的聪明的,肯拼命的人,谁耐心跟谁婆婆妈妈,生活中一切都变成公事,互相利用,至于世态炎凉,人情淡薄,统统是正常的.--亦舒","d":"2010.05.09","y":2010,"mo":5},{"i":"298039047","t":"人生短短数十载,最要紧的是满足自己,不是讨好他人.--亦舒","d":"2010.05.09","y":2010,"mo":5,"c":1},{"i":"298035106","t":"爱一个人决不潇洒,为自己留了后步的,也就不是爱.--亦舒","d":"2010.05.09","y":2010,"mo":5},{"i":"298031406","t":"人们不解释的主要原因是根本不在乎对方的想法,无关紧要的人,对无关紧要的事有点儿误会,有什么关系,你信也好,不信也好,都于当事人生活毫无影响,何劳解释.--<阿修罗>","d":"2010.05.09","y":2010,"mo":5,"c":1},{"i":"293462414","t":"折腾了一个多小时的<语文报>,检索,剪切,粘贴,为自己整理一个语文资料本,作为高三语文复习中的阅读材料.现在手纸上都是黑黑的油墨~阿~","d":"2010.05.08","y":2010,"mo":5},{"i":"292757298","t":"二八理论和长尾理论并不对立,正如哲学常识马哲唯物辩证法中两点论与重点论的统一.","d":"2010.05.08","y":2010,"mo":5},{"i":"292749804","t":"莲姑娘:不能预知下一步的模样,只能模糊感觉轮廓,因而努力去验证.在纠结中前行.","d":"2010.05.08","y":2010,"mo":5},{"i":"292284506","t":"慎独:个人再无人监督时往往会放松对自己的要求,滋生懒惰和邪念.","d":"2010.05.08","y":2010,"mo":5},{"i":"289226754","t":"没有人可以阻拦我的盛大美好.我会坐拥自己的疆域,毋庸置疑.","d":"2010.05.08","y":2010,"mo":5},{"i":"289090236","t":"总之道路朝天各走一边,等着瞧,我一定会赢.我会赢过岁月,赢过未来,我会赢得真正属于自己的幸福.我一向知道无论何事,你皆给不了我.但是因为我执的错误,我以为我可以让你变成我想要的模样.是,我愚蠢,这是我的过错.很不幸让你陪我玩了,遇到你真是我的遗憾和讨厌.","d":"2010.05.08","y":2010,"mo":5},{"i":"287201007","t":"我适合的职业:管理顾问.HR.项目经理.股票经纪人.教育顾问.培训师.职业发展顾问.律师.法官.心理学者.网络主管.项目经理.","d":"2010.05.07","y":2010,"mo":5,"c":3},{"i":"287187887","t":"我的劣势:对于不如自己敏捷的人缺乏耐心.仓促决定.可能不要求或不允许别人提供建议和帮助.斗志不足,容易松懈,不愿付出过多努力.缺乏挑战精神,对失败挫折承受力差.","d":"2010.05.07","y":2010,"mo":5},{"i":"287175050","t":"我的优势:自信且有天生的领导才能.可以大胆行动.有追求成功的干劲决心,能够时刻牢记长短期目标.对于胜任工作有强烈动机,擅长技术性工作,学习新事物时接受能力强.稳定平和心态.重视安全保障.","d":"2010.05.07","y":2010,"mo":5},{"i":"286998550","t":"郭敬明:上海,一个必须按照它的游戏规则去玩的人,如果不符合,你就滚蛋.如果我当初在北京发展,可能不会赚这么多钱,会变成一个理想主义的愤青.","d":"2010.05.07","y":2010,"mo":5},{"i":"286986199","t":"郭敬明:在上海,生活得罪舒服的永远是金融家和有钱人.普通人在这里活得压抑.如果今天,我还是一个傻傻的文学青年,要想在上海生存,早就被咬得连渣都不剩.","d":"2010.05.07","y":2010,"mo":5},{"i":"283595654","t":"透过现象看本质的现实意义是,表象或许与真相完全无关.你觉得越可能,往往相离愈远.答案总在意料之外.","d":"2010.05.07","y":2010,"mo":5},{"i":"280840528","t":"最好的不是最适合的,但的确是某种需要的.不能武断作出决定和选择,要听凭内心,对自己负责,因为这是我的唯一的一生.仔细思量,矛盾,前景,取舍.","d":"2010.05.07","y":2010,"mo":5},{"i":"280816910","t":"晚安.我对自己有困惑,对选择持怀疑态度.因为影响一生,所以必须慎之又慎,不听任之.在读周国平,如果我可以从阅读中得到启示,从书本里看到自己.","d":"2010.05.07","y":2010,"mo":5},{"i":"279686129","t":"在长期的数学奋斗中,发现我的特点是理解力很强,执行力强,记忆力好.但不够细致,做题很快,但计算粗心之类错误屡犯.会计要求缜密细致,是否完全和我的优点不搭,缺点却很明显?","d":"2010.05.06","y":2010,"mo":5},{"i":"272341847","t":"关于时间的仓促感又重新降临.似乎季节更替时体现尤其明显.都要高三的人了,不能东想西想,也不能继续这样变成大幼稚了~简约而不简单,让自己快乐但是别冒傻气,不要只停留在浅浅的表面现象上,深入内里才能知道对错是非,才能知道自己的位置.","d":"2010.05.05","y":2010,"mo":5},{"i":"271320185","t":"风疾雨大,似乎成都市内还没下雨,但双流已经被淹了(...)满地都是被狂风吹落的绿叶黄叶,我真的怀疑这怎么会是夏至已至的场面?","d":"2010.05.05","y":2010,"mo":5,"c":1},{"i":"267361368","t":"或许这件事根本意思不大,不能起根本作用的影响.不过可以做尝试,做最好的努力,并不期待结果.","d":"2010.05.05","y":2010,"mo":5},{"i":"267339506","t":"好坏莫辨的结果,很难说清.更多考虑,觉得并非好事.根源还在自己,没有达到足够的高度,没有足够的能力.所以,必须努力.七月,或许会放弃零诊,但是要更努力,达到更高的高度,才有希望实现华丽的转身.","d":"2010.05.05","y":2010,"mo":5},{"i":"267065839","t":"价值决定价格,在任何场合都有体现.","d":"2010.05.05","y":2010,"mo":5},{"i":"255197986","t":"Drink Me刚通知我稿费100大洋~10天内由校园负责人送到~","d":"2010.05.03","y":2010,"mo":5,"c":2},{"i":"254216803","t":"大义灭\"亲\"=我在巴豆哥哥的怂踊下把徐Sir给举报了,虽然不亲但是太不耿直了.我在隔着一个大组的距离外清晰的听到徐Sir把我骂了...我好jiong~><","d":"2010.05.03","y":2010,"mo":5},{"i":"253857803","t":"绕城高速堵了二十分钟,非常堵.我迟到了,不管了.","d":"2010.05.03","y":2010,"mo":5},{"i":"253221560","t":"觉得自己效率很低,在家效果越来越不好了.以前还觉得在家好不受打扰,现在觉得在家就是自己对自己的打扰.诶...高三以后就是每周连续作业,两周一次假,每周六下午到晚上休息.这是好事不是?不知道了...总之我现在这个鬼样子不是好事.","d":"2010.05.03","y":2010,"mo":5,"c":3},{"i":"253018619","t":"我对\"男生\"这种生物真的很失望,不喜欢恋母恋家还自以为温柔的傻瓜,不喜欢连自己是什么都不知道的傻瓜.还是控大叔好,我要恋爱也爱大叔去~ 《大叔拯救世界》  网页链接","d":"2010.05.03","y":2010,"mo":5,"c":1},{"i":"252953970","t":"很想很想和莲姑娘在一起.一起去上课,一起看电影,一起去逛街,一起化妆,一起做Casio路演,一起做测试.什么都一起最好了.我们俩就算安安静静不说话,一起吃冷饮也是快乐的.阿~松江大学城~上外上外上外~只有去上外才能和莲姑娘在一起~不过在上财乘地铁也可以过去~上海,上海~!","d":"2010.05.03","y":2010,"mo":5},{"i":"250937536","t":"我要还给自己清静,忍耐结束.不喜欢的类型就是无法磨合成喜欢,不对的人就是不对.我要的东西某些人是不能给的,他给的我也不想要.我不想再继续让自己觉得无聊下去.","d":"2010.05.03","y":2010,"mo":5},{"i":"249388199","t":"轰隆隆~打雷闪电下雨咯~晚安.","d":"2010.05.03","y":2010,"mo":5},{"i":"247535870","t":"\"Atlanta is known as the'Big Apple'\"?But the Common Sense is that\"New York is called'Big Apple'\".Why?@geng@Mslenecroft","d":"2010.05.02","y":2010,"mo":5,"c":2},{"i":"247392778","t":"在学<逍遥游>,但我非常讨厌庄子.庄子对超现实人生自由的追求只是为逃避现实而萌生的空想,非常无聊.他永远做不到,也没有人可以做到\"无所待\".他主张无为而治,反对一切社会制度,摒弃一切文化知识,是非常愚蠢的.这种陷入相对主义的主观唯心主义没有存在的价值.","d":"2010.05.02","y":2010,"mo":5,"c":2},{"i":"247339324","t":"拒绝关注太多负面信息,不需要让自己太清楚太明白所谓\"真相\".糊涂一点好,绝对的正义具有绝对的悲剧性.我不希望自己太消极,看到什么\"好人好事\"都嗤之以鼻,觉得\"生无可信\".其实阴影的存在也是阳光的应证.不要被\"粪青\"们的情绪垃圾给打扰了我的安宁.","d":"2010.05.02","y":2010,"mo":5,"c":1},{"i":"243479534","t":"@MajLands,关于南斯拉夫社会主义自治制度,是社会所有制,实行自治的商品经济,甚至劳动者的自治达到地方自治与社会自治的境地.这样的改革,充分调动劳动者积极性,但出现分散主义与自由主义,民族矛盾尖锐.这是教材上的原话,南斯拉夫不是考点所以老师也没有再多的说明.","d":"2010.05.02","y":2010,"mo":5},{"i":"237233947","t":"真正的才华如火焰般难以收藏,总会燎原.--亦舒","d":"2010.05.01","y":2010,"mo":5},{"i":"237232072","t":"生活中无论有什么闪失,统统是自己的错,与人无尤.从错处学习改过,精益求精,直至不犯同一错误,从不把过失推诿到他人肩膀上去,免得失去学乖的机会.--亦舒<阿修罗>","d":"2010.05.01","y":2010,"mo":5},{"i":"237221733","t":"如此情深,却难以启齿.原来你若真爱一个人,内心酸涩,反而会说不出话来,甜言蜜语,多数说给不相干得人听.--亦舒","d":"2010.05.01","y":2010,"mo":5,"c":2},{"i":"237218126","t":"无论做什么,记得为自己而做,那就毫无怨言.--亦舒","d":"2010.05.01","y":2010,"mo":5},{"i":"237083683","t":"五月花.要对自己诚恳,看清自己的存在与未来,不为理想盲从,不汲汲无获.关于理想有待商榷,我应该从更合适自己的角度出发.最好的不一定是我的,而我要做到的不一定不可以.我其实做不到对自己坚定信任与坚决执行,但又不能停息,只能前进.必须化被动为主动.","d":"2010.05.01","y":2010,"mo":5},{"i":"234699556","t":"压力过大喝酸奶而不是碳酸饮料.悲伤时吃菠菜沙拉而不是白巧克力.肥胖时高蛋白饮食.能量不足吃坚果葡萄干而不是浓咖啡饮料.提高脑力吃蓝莓而非甜食","d":"2010.04.30","y":2010,"mo":4},{"i":"234172701","t":"或许我的发质并不适合蓄长发,放弃,放弃关于长发的尝试.三天假期内恢复我的挚爱BOBO头.","d":"2010.04.30","y":2010,"mo":4},{"i":"234073441","t":"分享azure的博文：[转载]开年话题：时尚，梦想  网页链接","d":"2010.04.30","y":2010,"mo":4},{"i":"233959512","t":"你在努力让自己养成一种“正确”的态度，那是一种坚强而又整合得很好的人格，以适应这种复杂的生活。封闭的自我、沉默的面具，后面是一个讨厌束缚、喜好单独行动的人。内心中至今未能解开的憎恨、失望感使你缺少和他人共处的协调性。只要认为是正确的事实，就绝对不容他人的异议和侵犯","d":"2010.04.30","y":2010,"mo":4},{"i":"233904436","t":"分享蓝心心理网的博文：从深度心理学的角度看爱情  网页链接","d":"2010.04.30","y":2010,"mo":4},{"i":"233818745","t":"分享暖地文学社的博文：呼吸里的睡莲&nbsp;作者：郑惠文  网页链接  登载在《Drink ME》第五期P65","d":"2010.04.30","y":2010,"mo":4},{"i":"233806890","t":"分享暖地文学社的博文：深情一往（待修改版本）&nbsp;作者：郑惠文  网页链接  我一直说要修改，但一直没有动笔。","d":"2010.04.30","y":2010,"mo":4},{"i":"233627044","t":"《给莲的情书》 网页链接取消错误链接。","d":"2010.04.30","y":2010,"mo":4,"c":1},{"i":"233622866","t":"<绝对是相对的> 网页链接刚才链接有问题。","d":"2010.04.30","y":2010,"mo":4,"c":1},{"i":"233238726","t":">>莲  17:32:15 每个阶段的不同的任务，   完成一项是一项   接下来的事终究会有  而且都是千奇百怪  绝不相同的 MRs.Europe  17:32:47 唔，是的。","d":"2010.04.30","y":2010,"mo":4},{"i":"233155033","t":"“如果你一直就没对某件事情并未投入足够的时间与精力，那么仅仅声称对它感兴趣本质上就相当于为自己挖下一个大大的陷阱然后奋不顾身地跳下去”","d":"2010.04.30","y":2010,"mo":4},{"i":"233067514","t":"“骨子里的安静实在怎么都掩饰不去的，无论自己掩饰得如何，也做不到一直的样子，特别是在自己觉得安心的人的面前，在自己觉得安心的地方。独处并非悲伤，更是一种能力吧，甘于寂寞，亦可绽似烟火。”","d":"2010.04.30","y":2010,"mo":4},{"i":"233032381","t":"“只是不愿意放弃自己所希望的样子。 不想失去自己坚持的许多信念，不论是什么造就了今时今日的我，我都心存感激。无论是怎样的谁，怎样的事，怎样的环境。做一个独立有自省力的Lady，即使曾经不是最最优秀，未来也未必能做到最最优秀，但对于自己而言，只要是自己认为认定的好的生活状态，人生轨迹，就足够言明自己存在的意义。”","d":"2010.04.30","y":2010,"mo":4},{"i":"233028689","t":"莲姑娘mail我“我已经无法细数自己放弃懈怠过多多少少次，同时也意味着我又继续不停得一而再再而三得又开始了多多少少次。”这次半期考看似成绩不错，但在排名曲线图上，各科成绩都有所下降，情况不好。只有政治逆势上升，不过在全班高分的衬托下也只是一般成绩。总成绩连续三次TOP15,是危机四伏的。","d":"2010.04.30","y":2010,"mo":4},{"i":"229363393","t":"<Drink Me>登在P65的是我一篇从未在任何其他场合出现过的<呼吸里的睡莲>,储存在之前坏掉的U盘里.还有一篇小说和两篇散文都失去了.","d":"2010.04.30","y":2010,"mo":4},{"i":"228826480","t":"刚给<Drink Me>工作人员发信息讨要我宝贵的银子稿费,亲爱的段诚小编告诉我五一后就给我,价格再跟社长协商.欢喜睡觉去~Mu~a","d":"2010.04.30","y":2010,"mo":4},{"i":"228727592","t":"晚安.不能辜负自己的才气,自己的未来.我需要做些什么,或许.","d":"2010.04.30","y":2010,"mo":4},{"i":"221864300","t":"无意中看到以前一句让我和瑞都很难过的话:我拿着一个叫幸福的气球 在一个长满仙人掌的房间里站了很久.By安东尼?","d":"2010.04.29","y":2010,"mo":4,"c":1},{"i":"214154897","t":"亮亮在06:08给我的回复:蔚蔚,你的话总是让人觉得温暖,让人有继续前进的力量.虽然你比我小,但是很多方面你比我成熟.直到现在,我仍旧不习惯你不在我身边.Mu...a","d":"2010.04.28","y":2010,"mo":4},{"i":"213038470","t":"U can exercise control over ur life only to the degree that u believe that u'r responsible 4 whatever happens in ur life.","d":"2010.04.27","y":2010,"mo":4},{"i":"210793485","t":"下午得知年级排名是Top28,还是小高兴了一下,因为不仅可以留在第一考场,还可以进全校Top红榜.是不是队自己的要求太低?我一直期待自己可以冲进Top20~初中和高中的巨大不同,在于初中你可以阶段性不努力,但是排名分数变化很小.但是高中起伏巨大,没有人可以掉以轻心.","d":"2010.04.27","y":2010,"mo":4},{"i":"208652926","t":"很不幸,但也非常侥幸,这一次我的班级排名又是Top15,年级估计还在Top30左右,第三次维持这个排名.看似不坏,其实非常糟糕.全班的Top10每次都有大变动,而我却一直停滞不前.说是\"保持\",其实是没有超越的勇气.为什么别人可以大大进步,而我只能小小的原地踏步?这就是退步.","d":"2010.04.27","y":2010,"mo":4,"c":4},{"i":"205812478","t":"\"...可是我想看到你拥有你想要的一切.\"我不知该如何回复,不过我已经作出回复.你是我最最信任的人之一,我们一生都会有交集.我无法对这句话作出更多的注释,就是这样.晚安.","d":"2010.04.26","y":2010,"mo":4},{"i":"205061451","t":"@求签","d":"2010.04.26","y":2010,"mo":4},{"i":"204982320","t":"快乐些,宝贝,但是不要盲目自信.你是有实力做到的,不要被其他东西给扫兴了.你是经历过一步一步从\"很不好\"到\"比较好\"的.你的心态应该很好,怀揣梦想从来是没有错的.争取上外必须拿稳,拼搏上财.退路是南审西财,这是你对自己的定位.不是你可以做到,是你 要 应该 必须 做到.","d":"2010.04.26","y":2010,"mo":4,"c":1},{"i":"204945625","t":"这个世界美好就美好在它是公平而残酷的,没有人有资格对它不满,只能尽力去适应.这是我一向懂得的道理,可是还是会周期性暴发怨恨和绝望.可是没什么,在路上,还会遇见很多很多.我不是最好的,但是我有潜力成为最好的.只有往上走,在金字塔的更高处,你才能控制规则,成为世界的缔造者.","d":"2010.04.26","y":2010,"mo":4},{"i":"204912105","t":"今天跟妈咪哭诉一些事,正如去年十一月在极端低潮情绪中我所做的那样.妈咪给我讲了个故事,是富婆给她讲的:一个人种苹果,种了10个被偷走9个,他只剩下1个,他很难过,第二年就不种了,所以他连一个苹果都无法收获.我们不能预知努力会有多少回报,但是不努力就没有回报是确定的.","d":"2010.04.26","y":2010,"mo":4},{"i":"204885293","t":"我总是为了相同的事情而烦恼,抑郁,哭泣.为什么眼泪轻易,雷同,只是自己没有改变.我心里默认不完全的自己,却又不甘,同时又懦弱的无法改变.我觉得世界不公,觉得虚伪,受骗,其实是我对自己太失望.我觉得我盼望的一些事可能穷尽一生亦无法企及,但我又这样强烈的愿望着,造成强烈的对比高差.","d":"2010.04.26","y":2010,"mo":4,"c":3},{"i":"204805125","t":"今天高三宣传栏贴出了人大和北师大的招生宣传.这两个学校今年招生人数分别为2800,2200.不晓得谁可以成为这Luckiest 1/5000 在全国1000000考生中.","d":"2010.04.26","y":2010,"mo":4},{"i":"204778952","t":"@求签","d":"2010.04.26","y":2010,"mo":4},{"i":"204037720","t":"@MajGuderian","d":"2010.04.26","y":2010,"mo":4,"c":1},{"i":"203195097","t":"无话可说,这就是我的路.哭了以后还很头疼,很烦.其实这些道理我懂,只是不愿相信.","d":"2010.04.26","y":2010,"mo":4,"c":2},{"i":"201632724","t":"分享高校招生杂志社的博文：供大于求的专业亮“红牌”  网页链接  据计算，法学、中医学、运动训练等10个专业为红牌调控专业；临床医学、旅游管理等5个专业为黄牌警告专业；石油工程、材料物理等5个专业为绿牌发展专业。@蝉时小雨","d":"2010.04.26","y":2010,"mo":4},{"i":"198138328","t":"晚安.希望明天公布的成绩可以令我满意一些.又是一个雨兮兮的夜里,不过没有受到影响~","d":"2010.04.25","y":2010,"mo":4},{"i":"197526461","t":"关于四大基本工资水平,下午的数据有误.标准是:4850,5350,7800,9800,12800.每年递增.Top level=Low level(next yr),在全体人数中15%可以享受.30w是会计审计师们的\"高薪\"分水岭.","d":"2010.04.25","y":2010,"mo":4,"c":2},{"i":"197324036","t":"今晚好好收拾一下房间,把书本整理一下.我终于把书桌的脏乱差程度搞到自己都崩溃的程度了~","d":"2010.04.25","y":2010,"mo":4},{"i":"197152106","t":"今晚我问老王,为什么七十年代苏联经济衰退的原因不是勃列日涅夫的个人专断而是高度 ll take the chance.","d":"2010.04.24","y":2010,"mo":4},{"i":"191380265","t":"If I see u next to never,how can we say forever?I took 4 granted all times, that I thought would last somehow.","d":"2010.04.24","y":2010,"mo":4,"c":2},{"i":"190428601","t":"感觉沙当当一点成都女孩的味道都没有,不喜欢.李可写的上海女孩有固定的特点,肤色白,皮肤薄,血管青.说话嗲,头脑清楚,柔中带刚.","d":"2010.04.24","y":2010,"mo":4},{"i":"189611098","t":"（《NANA》）的意思是,有陷阱的巢穴.壹旦闯了进去,就无法靠自己的力量逃出来.我觉得这是控制欲很强的男人想出来的名字. 我们要打倒[TRAPNEST]","d":"2010.04.24","y":2010,"mo":4},{"i":"189436118","t":"分享邱宇强的博文：2010年语文高考二轮复习：名句默写指导与自测  网页链接","d":"2010.04.24","y":2010,"mo":4},{"i":"189212083","t":"1. 于老师十几岁演出的时候观众不看，起哄喝倒彩，往台上扔砖...于老师说一段相声，能盖三间北房...（谦儿哥：那时候比现在挣得多啊~~）   2. 买一张彩票，我一看号“315315”，很吉利啊，这是个节日啊...排油节...","d":"2010.04.24","y":2010,"mo":4},{"i":"189190856","t":"不要逼我请你们家长，我请你家长，你家长不痛快，你也不痛快，但是我不请我不痛快。记住了我是权威。","d":"2010.04.24","y":2010,"mo":4},{"i":"189189827","t":"第五 加大纪律管理 像刘睿这样跟乙炔似地老动一点都不老实，我们要严加管教，比如说把你塞进车库，把鞋塞进你的嘴里，把你钉在十字架上，让尹老师用地铁带到他们家去，把你们都扔电解池里，把你们掖地沟眼里去，你们以为我只会教化学吗？","d":"2010.04.24","y":2010,"mo":4},{"i":"189183743","t":"第四 大力开展社团 鉴于好多大学生毕业后没有工作，所以我们现在就要培养  动手动脑能力，本校长决定开办炸果子社团，炸果头社团，炸果饼儿社团。炸  果子也需要学化学掌握比例，所以取消课间操改成炸果子。不过果子一周只能  吃一回","d":"2010.04.24","y":2010,"mo":4},{"i":"189182546","t":"第三 提高学习效率 如果有同学听不懂我讲的东西给你们两条路选择，一条是  自己再好好地相相面，第二你就去上王老师那课去,王老师一讲你就会了,回来  把钱交了去。要不然统统窗户外面站着去","d":"2010.04.24","y":2010,"mo":4},{"i":"189181255","t":"第二 加强学校影响 响应阳光体育的号召，开展陈校长希哥杯臭脚联赛，鉴于本校长是后卫出身所有前锋自动领取红牌下场所有中场领两张黄牌底下打牌去吧。场上除了后卫都不允许上场。另外我决定由七班马晨宇同学担任足协委员长二班刘洪涛担任纪律委员长一班刘振宇担任领队至于二班陈岳松吗？当个吉祥物吧","d":"2010.04.24","y":2010,"mo":4},{"i":"188260074","t":"芙蓉不等于莲花?","d":"2010.04.24","y":2010,"mo":4},{"i":"188161982","t":"不过千万富婆当然不是凡人咯,她来成都的主要目的是要去芙蓉古镇买一套别墅,还让我妈帮着去挑.我妈很无语,因为她深深的自卑了.富婆为了补偿她的女儿,决定送她去英国读书,那女孩想学时装设计她也完全同意完全赞助.诶...连我心里都哀怨了.","d":"2010.04.24","y":2010,"mo":4,"c":2},{"i":"187325996","t":"快来看看@阿娇gillian 的微博,永远最爱Twins~ 我的首页 微博-随时随地发现新鲜事","d":"2010.04.24","y":2010,"mo":4,"c":2},{"i":"186578069","t":"《实力定乾坤 志愿填报四“前规则”揭秘》  网页链接","d":"2010.04.24","y":2010,"mo":4},{"i":"186425003","t":"一边听歌一边看生物书.Lady Gaga的Italy Accent我都听懂了,生物书上的中文我却看不懂.这些都是人话麽?","d":"2010.04.24","y":2010,"mo":4,"c":2},{"i":"186399897","t":"关于会考的麻烦不止这个.这学期我们硬是连生物书都不发了.云南人都疯了叭,折腾会考这种东西有意思麽.反正,我能做到的最大限度就是看一遍生物第一册,并且也就是这两天没事了.其他不管了,挂就挂,我也懒得去补考.疯了我个文科生整这个,还不如去做数学题.","d":"2010.04.24","y":2010,"mo":4},{"i":"186373787","t":"我真的完全看不懂生物.翻开2008版会考说明P33(47)为什么肥胖者的题细胞内,含量最多的有机物是蛋白质阿?应该是脂肪阿?蛋白质不是肌肉麽?这和我的常识完全不对嘛.","d":"2010.04.24","y":2010,"mo":4,"c":4},{"i":"186286530","t":"我妈说,王伟和玫瑰不能在一起有必然性.两个都太优秀了,需要被宠被体谅,都放不下自己.现实中一个优秀一个平凡才是最好搭配,然后就是两个凡人不用说.优秀的需要平凡的去照顾它去体贴它.有一种品质叫\"善解人意\",基本在所有嫁得好的女人身上都能体现.\"金童玉女只是传说\",灰姑娘可能性更大.","d":"2010.04.24","y":2010,"mo":4},{"i":"185773757","t":"电影里的玫瑰太好了,是玫瑰+岱西的综合体,而且去除了所有的缺点,比如自私,阴险,狠毒,只留下十足的干练和聪明,比拉拉可爱~","d":"2010.04.24","y":2010,"mo":4},{"i":"185768473","t":"拉拉走上HR的职业道路也有偶然叭.如果她没有越级找何好德申诉的话,就算被李斯特升级,也只是玫瑰一般的\"行政经理\",而非\"人事行政经理\".","d":"2010.04.24","y":2010,"mo":4},{"i":"184909090","t":"哈雷安安北北莲.我们会永远在一起,永远幸福.","d":"2010.04.24","y":2010,"mo":4,"c":8},{"i":"184904765","t":"因为没有别的路,所以一条路就要走到黑的.只要坚定走下去就会有光明,毋庸置疑.我不要想太多,一天过好一天就好了,未来会有注定.","d":"2010.04.24","y":2010,"mo":4},{"i":"184894062","t":"我需要走的路还很久远.正如今天写在二三事里的<In Adventure>,生命就是冒险的.旅途无尽,岁月无常.不能辜负自己了,你看看你一天到晚都在做些什么,如何对得起你对自己的期望值?诶.不能总是给自己亲手制造失望了.","d":"2010.04.24","y":2010,"mo":4},{"i":"182043253","t":"iLOOK的超大开本感觉很好,我现在趴床上把整张脸埋进杂志~FASHION IS A STATE OF LIFE.","d":"2010.04.23","y":2010,"mo":4},{"i":"182000805","t":"只有时尚杂志可以告诉你,这个世界可以有多么美好,像仙境,多么令人期待.","d":"2010.04.23","y":2010,"mo":4,"c":1},{"i":"181175642","t":"终于知道传说中的<Drink Me>的来由了,是<Alice in Wonderland>里头Alice喝的让她变小的药水~","d":"2010.04.23","y":2010,"mo":4},{"i":"174646490","t":"地理考试结束~文综每科一个半小时,理综每科两小时~可怜的理科孩子继续奋斗~","d":"2010.04.22","y":2010,"mo":4},{"i":"173019884","t":"我跟我妈说数学考试的事,我妈特别轻松的跟我说:诶,就那样叭.大考大玩,小考小玩.我:我觉得我已经被玩死了~T^T","d":"2010.04.22","y":2010,"mo":4},{"i":"172432586","t":"为什么南亚是热季风气候,却是热草自然带?","d":"2010.04.22","y":2010,"mo":4,"c":2},{"i":"172368605","t":"最艰难的三科语数政考完了,考完就彻底的放下,迎接你心爱的地理英语历史~下午是地理~好好复习~加油~希望仍是有的~","d":"2010.04.22","y":2010,"mo":4},{"i":"172222932","t":"考完数学了...","d":"2010.04.22","y":2010,"mo":4},{"i":"167072606","t":"午睡时噩梦连连,梦见考场里好多事,起床晕乎乎.好在没有出现什么意外.我的政治主观题估计又很悬,我总之找不到话说,看别人答得满满的我觉得好罪过.今晚乖乖复习数学和地理,每科两小时,数学重错题,地理重笔记.乖~好好干~","d":"2010.04.21","y":2010,"mo":4},{"i":"161994080","t":"@MajGuderian 看完政治就睡,会在23:30之前.对于考试心里没底,所以烦躁低落.近来对你态度不好,是我自己的问题.Mu~a 我会加油好好考的~","d":"2010.04.20","y":2010,"mo":4,"c":1},{"i":"160878003","t":"明天期中考.我的考号120111226,考场32,位置:三教楼一楼三室.在文科第一考场最后一个,郁闷.郁闷郁闷,我的郁闷情绪要压垮我了.","d":"2010.04.20","y":2010,"mo":4,"c":1},{"i":"159820118","t":"\"一个人最大的悲哀就是不愿意做自己.\"(方文山)--那我岂不是非常悲哀的姑娘?","d":"2010.04.20","y":2010,"mo":4,"c":1},{"i":"158730816","t":"Avirl永远是我的兴奋剂.下午昏沉沉,塞上耳机,Avirl的6首歌就治愈我.The Best Damn Thing唤醒,Innocence高潮.状态:BRILLIANT.","d":"2010.04.20","y":2010,"mo":4},{"i":"155228559","t":"不要让自己显得轻贱,没必要低头迎合和辩解什么.我也完全不会再表露什么.是这样,因为我没有答案,答案需要时间来确认,确认我的耐心,确认我的毅力,确认我是否真的对自己诚实了.或许有,或许没有,可能放弃,可能继续.关于那个计划,就生长在心里.我可能提前忘记,也可能立即执行.","d":"2010.04.19","y":2010,"mo":4,"c":1},{"i":"155212975","t":"这些都不重要,都不重要,都不是你想要,莲姑娘给我的答案.或许?或许.不要为无关的事情搅扰了,没必要为了无所谓的人心神不宁.我从来不做赔本交易,我也从来不舍本逐末.","d":"2010.04.19","y":2010,"mo":4},{"i":"155027653","t":"晚安,最迟看完<后赤壁赋>就睡.忘记带政治地理笔记本回来,混乱要命.不能乱了阵脚,宝贝.不然你只会离他越来越远.","d":"2010.04.19","y":2010,"mo":4},{"i":"154760745","t":"是的是的,这只是事故.阿阿阿.游戏结束.","d":"2010.04.19","y":2010,"mo":4},{"i":"154725083","t":"What I said still be within the TERM OF VALIDITY.I shall NEVER quit WITHOUT CONCERN.I bear the RESPONSIBILITY to BE WITH U.","d":"2010.04.19","y":2010,"mo":4},{"i":"154670778","t":"I have the RIGHT TO SILENCE.So that please please please DO NEVER MAKE me.I mean nothing with it at all.DO NEVER MISTRUST ME.","d":"2010.04.19","y":2010,"mo":4},{"i":"154458382","t":"恶魔驱散恶魔驱散,一切消失消失.阿阿阿,秘密死亡.我不期待不怀疑不确定不要命.我不是那个意思.阿阿阿.无法解释,无法说明.过去叭一切过去叭,我只是心血来潮,我只是突然疯了,我突然中毒.只是忽然之间.阿阿阿,结束结束.阿阿阿,我很好,就这样.","d":"2010.04.19","y":2010,"mo":4,"c":1},{"i":"151445898","t":"唔唔唔~现在就好好学习天天向上~等到以后就彻底蜕变~总之为了大学里自己能彻底换一个人~加油~蔚宝~冲冲冲~","d":"2010.04.19","y":2010,"mo":4},{"i":"149136403","t":"我们班的老师总是充分jiong到.刘特给我们看过85年语病题,92年语言得体题.老王给我们看过95年材料题.他们老了,还是我们太嫩?高考三十年面貌不改.","d":"2010.04.19","y":2010,"mo":4,"c":1},{"i":"148565681","t":"我要分清自己的骄傲和虚荣,必须和放弃.不能在迷惑和混乱中度日.骄傲可以让我虚荣,而追逐虚荣的路不一定能收获骄傲.总之,一路走,一路观望.只是莫把风景错当终点,为了野草错失花园.","d":"2010.04.19","y":2010,"mo":4},{"i":"148535975","t":"听妈妈说她的同事的女儿,云南师附2005级,655分,去北师大学网络教育,现在回昆明却只能去县城的中学工作.这是命还是运.高考是唯一的路,但路途本身是不决定什么的.可能是前途光明却无路可走抑或柳暗花明又一村.Who knows.总之,还在路上的人,暂无答案.","d":"2010.04.19","y":2010,"mo":4},{"i":"148469189","t":"我出生的1993年也是舅舅考上上海交大的年份.他当时是铁三中第三盘龙区第五,本来想去武大学土木,但外公坚持让他去上海,在交大学材料工程.后来留校,继而下海,却是一直没有从事任何关于土木和材料的工作.不知道他有没有遗憾.现在又在中欧商学院读EMBA,却不是以求学为目的,而是贴金.","d":"2010.04.19","y":2010,"mo":4,"c":1},{"i":"145798482","t":"在成雅高速上看到赈灾物资车队,是四川民营企业自发组成.很感动.两年前汶川地震,全国人民也是这样帮助四川.玉树,加油~!","d":"2010.04.18","y":2010,"mo":4},{"i":"142971972","t":"#冰岛火山灰#位于亚欧板块和美洲板块张裂边界,岩浆涌出,冷却形成带状高地.--冰岛,就是海岭中的火山口.板块边界地壳薄弱,地质运动频繁,多火山地震.(如果是地理考试,这样回答应该就把得分点采完了.)","d":"2010.04.18","y":2010,"mo":4},{"i":"141032432","t":"以后的路,能够同行的人会越来越少.寡淡人情是必须承认的真理.所以,要一直把握生命里重要的人.我遇到你,爱上你,同你说这些话,都是非常不易.所以我珍惜你,想念你.","d":"2010.04.17","y":2010,"mo":4},{"i":"141017693","t":"莲姑娘给我的告诫:倘若喜欢就不要分别,不必费心再找他人.","d":"2010.04.17","y":2010,"mo":4},{"i":"136595213","t":"我爸和我妈对我的\"虐待\"还不止这样,他们俩还侵犯我的姓名权~我妈:狗屎蛋儿~你要吃汤圆不?我(左顾右盼半天发现四周无人,只好硬着头皮):...不吃.我爸更无敌,他居然开始叫我\"蔚宝咪\",作为\"蔚宝\"的高科技升级版.我突然觉得我在家里混不下去了...(><)|||","d":"2010.04.17","y":2010,"mo":4,"c":1},{"i":"136577136","t":"我妈对我现在完全背离淑女路线的行为举止忧心忡忡,一边捏我的脸一边说,我怎么觉得你的脸又圆了呢?我爸很淡定:乱说,小娃娃不就是这样的.然后他开始揪我的马尾:你一年多没扎过头发了喔?发型好傻.我:我的周末就被你们俩给摧残了,你们就打击我叭.~~T^T~~我的日子是多么水深火热~!","d":"2010.04.17","y":2010,"mo":4},{"i":"136542835","t":"我属于越长大越古怪型.早上起来套了件大毛衣,把头发束起来,顶了张面膜做作业,把起来上厕所的我妈吓坏了.妈:我怎么觉得我白养了你这么十几年呢,你说你现在十六岁和六岁有什么区别?你还是不叠被子,还是最喜欢用勺,还是要抢电视看动画片,刷牙时间还是不到三分钟,还是遇到什么事就大哭大闹的.","d":"2010.04.17","y":2010,"mo":4},{"i":"136439041","t":"我妈觉得我\"已经是大姑娘了,大得一塌糊涂\".我爸觉得我\"还是小娃娃,一岁时吃樱桃还吃吐了\".我:...","d":"2010.04.17","y":2010,"mo":4,"c":3},{"i":"134514439","t":"人的命是由某种运在作祟.我可以把握人生里的重要跳板,实现转折.这是一次机遇,也必然是考验.毕竟两年前我失败过,而且事情应该是如我想象般复杂.暂不考虑这般许多,把自己调整到去年七月的状态.写很多便签,鼓励自己到达.上次还有些\"惊喜\",而这次是我力所能及的.所以更是只许成功不许失败.","d":"2010.04.16","y":2010,"mo":4},{"i":"128195925","t":"不是我不明白/这样并不算太坏/.../你的世界/我在对岸/.../我想过能和你一起老的/不是我不明白/说被爱并不应该/我们的关怀/像爱但又说不上爱/.../但现在/说来感慨/不是那个未来/我们说好的/不会更改的/你会在.--断章取义可以完全篡改梁静茹<不是我不明白>的含义.","d":"2010.04.15","y":2010,"mo":4},{"i":"127006645","t":"我的房子要在城市的高处,楼顶最好.卧室里有圆形大床,粉色调,粉色会陪我老.大面积的衣帽间,有庞大浴缸的浴室,布满镜子.楼顶开辟成花园,不过我不爱折腾花草,最好物管可以帮忙打理,我要一个玫瑰园,然后置一架秋千.独立的Yoga房,满满的书房.其余都可有可无.","d":"2010.04.15","y":2010,"mo":4,"c":7},{"i":"125621703","t":"我不愿意被房子束缚一辈子,有钱有闲就去环游世界.在成都只要爸爸妈妈给我留一个温暖的房间.而在我自己的家里,我和我的darling要各自有独立的卧室书房更衣间与洗手间.在彼此独立的基础上结合.我不希望在我自己的2*2大床上多出来一个人,太惊悚了.","d":"2010.04.15","y":2010,"mo":4,"c":3},{"i":"125585152","t":"刚和我妈仔细分析了房子的问题,妈咪想的很多,而且结合家里的实际要作出很多困难复杂的抉择.我也没办法给妈咪提供有用有益的建议,只恨自己现在力量实在有限不能起什么作用.中国人一辈子就\"房房房\",麻烦.其实家的概念很简单,就是我和爸爸妈妈在一起.但房子涉及的就不只家的问题.诶.","d":"2010.04.15","y":2010,"mo":4},{"i":"125369520","t":"我妈是个狠角色,我一直都知道.我:妈咪阿,新家拿钥匙以后,你和老爸住10楼嘛,反正你们不想住太高,把22楼留给我.妈:可以阿,我贷款给你你再来买,现在银行利率优惠取消了,所以咱们就照银行规定来,估计你一本科生得贷二十年期的.我:- -|||","d":"2010.04.15","y":2010,"mo":4},{"i":"123026275","t":"其实昨天晚上我梦见了郎朗,很诡异,在梦里清楚看到他本人,我也不晓得为什么,以前也从未特别关注过他.梦见他住在我们家,然后我还好羞涩的样子.然后又把他送走,看他弹琴,然后开车离开.具体情节都忘了,就只记得,郎朗.莫非是我手痒了想弹琴了?拜托,都五年没碰过琴了,真可惜.","d":"2010.04.15","y":2010,"mo":4,"c":1},{"i":"122791464","t":"终于开始出太阳.这次大降温终于结束?冬天终于放过了成都?但愿不是空欢喜.","d":"2010.04.15","y":2010,"mo":4},{"i":"121294494","t":"MC突然来袭让我绝望了一节英语课,脑袋里全是完了完了.整个人寡白下来,手脚冰凉.诶,痛经要死人的.","d":"2010.04.15","y":2010,"mo":4,"c":1},{"i":"119927980","t":"呵,突然想起来碎碎念这些话,很可笑叭.迟早会忘的,写下来只是留作纪念.因为成长是从不完善到臻于完善的过程,年岁增长我终于能坦然面对过去的自己,不会惶恐,不会恶心,不会逃避.","d":"2010.04.14","y":2010,"mo":4},{"i":"119891357","t":"不过初中成绩却好起来了.初一去注册的时候我和我妈把我所有的奖状都带去,包括一张市三好.班主任一看就让我当班长(任期一年)了,后来我还兼职语文科代表(任期两年).成绩在班上一直Top5年级Top20左右.不算好.初中非常辛苦.不过基础还算牢固,所以我初三到成都耍完了.","d":"2010.04.14","y":2010,"mo":4,"c":1},{"i":"119812945","t":"因为六岁差一个月上小学,没有读幼儿园大班,所以我在班上一到三年级都很\"后进\".后来班主任张璞老师发现我的写作厉害,特别重视我,我一激动就小宇宙爆发,写了很多文章,大到全国小到盘龙区拿了无数奖,那时候很得意.还写小说,写韩流爱情古装剧,编作文选.幸好家里电脑重装把这些丢人东西销毁了","d":"2010.04.14","y":2010,"mo":4},{"i":"117556692","t":"不过也要这样安慰自己.现实的不完备是给未来的发展提供可能.将实干精神进行到底的话至少不会让自己遗憾.没尽力,不专心,不劳无获是必然的.你为什么不像他们那样全心投入?你没有资格贪耍抱怨.大部分的成功是具有必然性与因果性的,你不在例外.","d":"2010.04.14","y":2010,"mo":4,"c":1},{"i":"117514400","t":"我会担心自己不够好,但似乎从来没有非常好过.只是站起来的次数比跌倒多一次,所以坚持到现在.从来不够优秀如何能期盼足够美满的未来,觉得自己连期待的资格都不曾有.","d":"2010.04.14","y":2010,"mo":4},{"i":"112406819","t":"看起来二项式定理是数列的借尸还魂.所以,我可以泪流满面魂飞魄散了.T^T","d":"2010.04.13","y":2010,"mo":4,"c":1},{"i":"110743326","t":"若不是因为爱着你/怎会有不安的情绪/每个莫名的日子里/我想你/爱是折磨人的东西/却又舍不得这样放弃/不停揣测你的心里可有我姓名/爱是我唯一的秘密/让人心碎却又着迷/若不是因为爱着你/怎会不经意就叹息/有种不完整的心情爱你(莫文蔚<爱情>)","d":"2010.04.13","y":2010,"mo":4},{"i":"108879270","t":"我爸跟我妈俩人的教育方式几乎对立.我妈经常教导我,要把大量时间投入弱势学科,争取把短板补长,不被某一两门学科拖累总分.我爸却总是说,一定要培养一门足够所向披靡的优势学科,完全平庸的\"好\"就是\"不好\".要找到自己可以充分发挥的方面,然后全力以赴,创造奇迹.--我还是听我妈的比较实际","d":"2010.04.13","y":2010,"mo":4},{"i":"107906681","t":"@SirWilliam.朱丽叶:唉,冤家!你一起喝干了,不留一滴给我吗?我要吻着你的嘴唇,也许这上面还留着一些毒液,可以让我当作兴奋剂服下而死去.你的嘴唇还是温暖的!(From<罗密欧与朱丽叶>节选)","d":"2010.04.13","y":2010,"mo":4,"c":1},{"i":"107180914","t":"这个冬天太漫长,气温依旧很低,冷空气猖獗.教室里犯困的人很多,但统一的说辞普遍是\"上网到一点\".其实没必要撒这个谎,半期考给每个人的压力都一样.每一科都奔着零诊加量加难度却缺少复习时间.诶...","d":"2010.04.13","y":2010,"mo":4},{"i":"106285672","t":"一堆政治考试报没有解决,在半期考之前争取每晚一张客观题.还有五三,自排列组合以来还没有用过.这学期彻底的浪费了王后雄.还要做英语点拨里的题,Daily 1+1+1 很久没有做了.读本的文言文要精读,不能丢分.地理,历史笔记整理工作要尽快开展.Oh Dear,我手忙脚乱到无所事事了","d":"2010.04.12","y":2010,"mo":4},{"i":"104479214","t":"继续repeat<少了一个人>.你听不到过去的任何声音.听不到.","d":"2010.04.12","y":2010,"mo":4},{"i":"104474801","t":"所以,祝福是有必要的.他问你近况你也只能淡淡回答还好.问他,他却很尴尬,似乎觉得对不起你.其实不必要,知道他放下了我也不再牵挂.这是很好的两全状况.他会幸福的,他有一种单纯的执著和热情,对人好,即使显得有些一厢情愿.但你的确因为他的喜欢而美好过,这是幸福的,作Beloved.","d":"2010.04.12","y":2010,"mo":4},{"i":"104459228","t":"这是遗憾,你不能为他动心,但你知道他很好,所以他去收获真正属于他的\"幸福\".断然,你是给不了他什么的.你去爱的,接近一种崇拜.你喜欢比你强大很多的存在,可以教导你,指引你.甚至可以控制你,操纵你也甘愿.你愿意自己是葵花,迎着光明的存在,你以为这就是你要的幸福.","d":"2010.04.12","y":2010,"mo":4},{"i":"104441051","t":"<日光倾城>早已在你的播放列表里消失,手机单调无铃声.某人,你从未真正同他在一起过,你也从未给过他了解你的途径.可是他会凭借一首歌来记得你,体会你,不管理解对不对.你很感激他,自始至终.人情冷暖,捉襟见肘.寻找一个善待自己的人多么困难.尽管他不符你的好恶,你也仍视他为恩赐.","d":"2010.04.12","y":2010,"mo":4},{"i":"104305601","t":"气候无常太可怕.四月天里学校中很多树却黄叶累累.","d":"2010.04.12","y":2010,"mo":4},{"i":"103280886","t":"vivi:你觉得我是怎样的。全：就像《日光倾城》中那样 也许我语文太差了 想不到很适合的词 今天中午我拿手机查卡奇社的歌想找到这首 歌然后看着那些字我就想到了你","d":"2010.04.12","y":2010,"mo":4,"c":2},{"i":"103266936","t":"2. 了解工作机会：在这里，我们必须知道，专业方向并不等同于今后的工作内容。Richard Riley说过，2010年最迫切需要的十种工作在2004年根本就不存在。这表明，学生必须不断更新自己对业界的认识，不断研究产业发展趋势、工作前景、国际竞争等等。我建议同学们多花些时间，深入了解一些优秀的企业。","d":"2010.04.12","y":2010,"mo":4},{"i":"103262249","t":"1. 认识自我：即，寻找自己的理想、兴趣、天赋并积极调整自己。在大学四年里，我们应逐步找到自己的理想是什么，兴趣是什么，自己在哪方面可以做得更好。如果暂时还不知道兴趣在哪里，就要保持一种好奇的心态，多尝试，多挑战自己，让自己每天都在进步。","d":"2010.04.12","y":2010,"mo":4},{"i":"103255852","t":"全 14:59:22：我感觉我现在才一点一点明白你 当时却好像是很盲目或者什么。Vivi14:59:34：呵，是么。全14:59:35：突然不知道怎么说","d":"2010.04.12","y":2010,"mo":4},{"i":"103184483","t":"居然在Q上遭遇某全。他给我留言，问我过去手机铃声是什么。我说是卡奇社《日光倾城》。顺便说起了WAN，问他怎么会和她在一起。他说不知道，很奇怪。我说，上个月他生日，没有给他祝福，因为觉得我的身份不合适。他说：谢谢你还记得。然后再没话说。","d":"2010.04.12","y":2010,"mo":4},{"i":"102468139","t":"老爸说成都市区已经开始下雨,估计双流也快了.成都的气候诡异了,因为没有哪个气候类型是\"春雨型\"的.看来成都的\"海洋性\"越发显著了.话说四川盆地在远古时代就是一个海迹湖,看来历史有重演的可能性了...","d":"2010.04.12","y":2010,"mo":4,"c":1},{"i":"102444685","t":"诡异的气候.明天成都又要大降温,从18度降到13度.Gosh,这春天整个就被冬天埋没了,而且现在暮春将下,气温还这么低.话说全球变暖可能将北大荒变北大仓,但也不能把成都平原变成松嫩平原了叭.难道我们被省略了一个春天后,还要浪费一个夏天?Thank God almighty not","d":"2010.04.12","y":2010,"mo":4,"c":1},{"i":"99631728","t":"With this faith,we will be able to hew out of the mountain of despair a stone of hope.记得以前看到老余说新东方的\"在绝望中寻找希望,人生终将辉煌\"的出处就在这里.","d":"2010.04.11","y":2010,"mo":4},{"i":"99574197","t":"...and the glory of the Lord shall be revealed & all flesh shall see it together.","d":"2010.04.11","y":2010,"mo":4},{"i":"99362246","t":"...And so even though we face the difficulties of today & tomorrow.It is a dream deeply rooted in the AMERICAN DREAM.-Martin Luther King. Jr","d":"2010.04.11","y":2010,"mo":4},{"i":"99262528","t":"暂时性的,你失去了微笑的资格.接下来的挑战太多,而你并没有你想象中的能耐可以面无惧色.所以,低调做事.道理你已经很清楚了,你要的东西也非常明确.现在唯一的就是去获取,不能被任何人抢先,不能被任何事打扰.你宁愿无情无义,必须先解决自己该解决的问题,再言其他.","d":"2010.04.11","y":2010,"mo":4},{"i":"99240552","t":"你知道很多人视你为假想敌,秘计着要取你而代之,要永远的消灭你.你知道你若是成全了他们就是毁了自己.世界远比你想象的残酷可怕,每个人的生存都非常艰难.你凭什么比人家拿到更高的分数,更高的薪水.这绝对不是想要就有的.因果关系对每个人都公平,谁耕耘谁收获,谁犯傻谁出局.","d":"2010.04.11","y":2010,"mo":4},{"i":"99179856","t":"压力是必然存在的,这个世界里永恒存在着比较和竞争.压力也是一定会在一定时期激化的,每个人都渴望自己长袖善舞技压群雄,但绝对不可能每个人都成功.你必须忍受,必须将压力作为动力来努力,否则就会被现实狠狠的耳光打败.必须做好调整,你不允许自己落后,不允许任何失败的可能性.","d":"2010.04.11","y":2010,"mo":4},{"i":"98781401","t":"少了一个人宠爱我/朋友的爱成分就是不同/最难过的是笑着面对被羡慕自由/练很久的成熟也快遮掩不住寂寞/少了一个人拥抱我/那种拥抱能够忘了所有/少了一个人懂得我/能够体会我倔强又脆弱/不记愁温柔原谅我情绪太波动/用泪光舍不得融化我累积的寂寞/很固执无条件爱我从来没变过/抱着我沉默不动","d":"2010.04.11","y":2010,"mo":4,"c":7},{"i":"97997848","t":"爸妈送我来双流,顺便和外婆他们去逛Outlets,他们晚上十点飞机回昆明.诶,他们只来了两周,时间好快.不过好在我六月马上就回昆明会考.虽然会考本身是讨厌的事,但可以见到外公外婆是很好的.外婆永远是最好的,外公也很好.我最爱他们了~Mu~a~外婆的身体要越来越好起来喔~这个最重要","d":"2010.04.11","y":2010,"mo":4},{"i":"95892361","t":"有些坚持,与你喜不喜欢热不热爱完全无关.而是因为你没有退路,没有回转余地,因不得已而为之.这是大多数执着的本来面目.","d":"2010.04.11","y":2010,"mo":4},{"i":"95314183","t":"觉得大学里的努力比中学时代更有意义.现在的我无非就是为半期考会考而焦头烂额,感觉其实对未来的作用非常微小.我一直是迫不及待的想要长大,想要直面人生.觉得自己很着急,现在的生活让自己消极.我知道这样是不对的,必须一步一个脚印.我还没有马上面对高考的能力,一切都在任重道远的路途中.","d":"2010.04.11","y":2010,"mo":4},{"i":"95254558","t":"老外(=外公)外婆充满喜感,早上出去散步,维多利亚里有一些景观小溪.老外:呀呀呀,我要跳过去.外婆:有本事你就跳,烂老虎了不起说.老外(蹦~跳过去了.他今年72~):我跳了嘛~你看我好厉害~外婆:你跳回来嘛.老外:跳就跳.(蹦~又跳回来)我妈:你们不要跳了嘛,几十岁了还那么幼稚.","d":"2010.04.11","y":2010,"mo":4,"c":2},{"i":"94147257","t":"翻找一本旧杂志.书柜被外婆整理的太好,很多找不到的书都冒了出来.还有一本相集,08年夏天某人给我的,他的童年,他说是把一生完整的送给我,从0~100岁.记忆一股脑涌上来,我很紧张.我刻意忘了的事又被提醒,证明我的忘记和放弃多么虚伪.我不能把它们丢弃,不能退还,只能期待它们死去.","d":"2010.04.10","y":2010,"mo":4,"c":3},{"i":"91317646","t":"莲姑娘在我去年生日时,将陪伴她高三整年的LoveNotes送给我,勉励我前进.10/04/10她在本本里写了最后一页:我会保存这一切在我的生命里.一切的彷徨,自我怀疑,猜度,都会被信念所摧毁.这是自己赋予自己的美好.无论在过去的记忆里,或是未来的人生道路上,你最珍贵,我爱自己.","d":"2010.04.10","y":2010,"mo":4},{"i":"91289210","t":"Morality is the custom of one's country.Cannibalism is moral in a cannibal country.道德是国家的约定俗成.在食人国家,食用人肉就是道德.","d":"2010.04.10","y":2010,"mo":4},{"i":"91269050","t":"Progress is the activity of today and the assurance of tomorrow.","d":"2010.04.10","y":2010,"mo":4},{"i":"91264394","t":"Complacency is the enemy of study.","d":"2010.04.10","y":2010,"mo":4},{"i":"91231980","t":"浓夭不及淡久,早秀不如晚成也.(<菜根谭>)","d":"2010.04.10","y":2010,"mo":4},{"i":"91125370","t":"来往不逢人,长歌楚天碧.(柳宗元)","d":"2010.04.10","y":2010,"mo":4,"c":1},{"i":"91058838","t":"试上超然台上望,半壕春水一城花,烟雨暗千家.(苏轼)","d":"2010.04.10","y":2010,"mo":4,"c":1},{"i":"89709404","t":"这个世界从来就没有要合谁心意的义务,只有把自己变成取悦世界的模样才可以.","d":"2010.04.10","y":2010,"mo":4,"c":1},{"i":"89665225","t":"心中烦躁异常.揉乱头发,把所有的书推到地上拼命踩.我要死了.我着魔了.","d":"2010.04.10","y":2010,"mo":4,"c":1},{"i":"87543713","t":"哥大是一直以来的梦想,但我没有清晰的计划和学业目标,我不知道出国可以让我如何如何.这样的盲目留学只能造成无价值海待.所以,不如在国内争取高端的本科教育资源,研究生再去深造,对职业发展之类更加有利.这是我妈给我做的学业计划,我认可,照此执行.","d":"2010.04.09","y":2010,"mo":4},{"i":"87527707","t":"当然这些话我并没有对她说,我没有资格居高临下去断定:你,不行.罗非鱼也是金牛座,是善良的小姑娘.我以前就依赖着她,她也很能给人安全感.当然,也是我自己的问题,我把初中所有的朋友全部搞砸了,基本都冷淡甚至反目.但现在想,朝夕相对的朋友真不容易,大家共同奋斗支持,十分难得.要珍惜.","d":"2010.04.09","y":2010,"mo":4},{"i":"87399904","t":"我目前的\"财务性格\"有欠缺.四大不喜欢粗心大意,眼高手低,急躁冒进,不讲礼貌的学生.要按照四大要求来培养自己,还有高三一年+大学四年.如果不出国futher study,还有五年我就将成为四大一员.这是骄傲的,这是我要奋斗的职业理想.蔚宝~你一定可以~","d":"2010.04.09","y":2010,"mo":4},{"i":"87381849","t":"四大年假都是10天左右,CPA有考试假.EY上班时间:09:00-18:00,PWC是08:30-17:30.Freshman有加班费(1.5倍~3倍),但到第三年以后只有奖金.---我一定要进四大,首先要高考好,进上外上财,进四大可能性就非常高了.加油~我爱四大~","d":"2010.04.09","y":2010,"mo":4},{"i":"87312983","t":"四大可以专业不对口,工作以后公司提供机会报考CPA.当然,如果我可以在本科四年拿下CPA&ACCA最好,但可能性不大,尤其是CPA.四大的硬件要求是CET-6,BEC-3,GPA,社会实践,奖学金等.软件要求是有\"财务性格\":严谨,仔细,喜欢研究制度,对数字敏感,吃苦耐劳,沟通强","d":"2010.04.09","y":2010,"mo":4,"c":7},{"i":"87233388","t":"在保证周末作业完成的前提下精读杨萃先<这些道理没有人告诉过你>.","d":"2010.04.09","y":2010,"mo":4},{"i":"86068193","t":"CollectionNotes检查过关被提前放学回家~但巧娘说我英语课积极程度不比过去,要更活跃一点.她说即使我不在成都考,但也要很努力,要拿最高分进最好大学.呵,借她吉言咯.英语我最爱~莲姑娘也发信息给我说面试NOS校园职务成功~我们俩今天都很不错~Mu~a","d":"2010.04.09","y":2010,"mo":4},{"i":"82420786","t":"其实我在无话可说的状态里更安全.我不言语,说明万事太平,无事可生非.若我有意无意说了什么,才不好才有麻烦.所以沉默是可亲可爱的,你不必多心.我没有想要折腾什么的意思.","d":"2010.04.08","y":2010,"mo":4},{"i":"81619689","t":"It's obvious u tenderness is what I need to make me a better woman to myself.--Christina Maria Aquilera --Save me from Myself","d":"2010.04.08","y":2010,"mo":4},{"i":"80941618","t":"<邮差>:你是千堆雪,我是长街,怕日出一到,彼此瓦解.","d":"2010.04.08","y":2010,"mo":4},{"i":"80920385","t":"艾未未说80,90后:他们现在幼稚或错误都不是问题,只要他们有热情,有判断能力,他们会逐渐辨别是非.","d":"2010.04.08","y":2010,"mo":4},{"i":"80907207","t":"<我爱摇滚乐>刘辉+Ecke.Well,what dose it matter I exist on the best terms I can.The past is nowpart of my future.The present is well out of hand.","d":"2010.04.08","y":2010,"mo":4},{"i":"80662270","t":"高考满分作文就是一种现代八股,福建山东重庆所有所有考生都是一家人用同一张嘴吃饭说话,看着真反胃.不过也正常,怎么拿高分怎么写才是王道,高考玩你玩死你玩的就是分分分.","d":"2010.04.08","y":2010,"mo":4},{"i":"80537365","t":"语文课鉴赏满分作文,我后面两个方脑壳.甲:曾国藩是哪个?乙:你娃是瓜叻.曾国藩是曾哥他哥.甲:喔,那宋祖是不是宋!祖英他老汉?乙:才晓得说.---我无限唏嘘了...@段子,爱段子","d":"2010.04.08","y":2010,"mo":4},{"i":"79717452","t":"太阳出来唷喂~久违了,温暖日光.","d":"2010.04.08","y":2010,"mo":4},{"i":"79101678","t":"心思不定,心神不宁,是我现在的主要毛病,很讨厌.必须专注,必须投入自己.那些无关紧要的事务都可以滚了,不能成为我的拦路虎.","d":"2010.04.08","y":2010,"mo":4},{"i":"79087866","t":"我对刘特的怨言其实是对自己的失望.我不愿做练习,觉得在课堂上什么都得不到.但刘特刘特,他之所以是特级教师一定是因为他水平够高的,问题应该出现在我自己身上.是,我现在没有一门喜欢的科目,也没有哪门学科足够出类拔萃,反而有不进反退的趋势.现在我完全不能回忆起上午第三节政治的内容,糟糕","d":"2010.04.08","y":2010,"mo":4},{"i":"79067637","t":"语文老师一直对我非常重要.小学第二个班主任张老师,发掘了我的作文天赋,从那以后我就骄傲起来了.初中语文老师姓田,我是她的科代表,她重视双基,教得很好.在成都初三借读时的于老师,非常性情,那时语文课就是享受.高一语文李老师是班主任,也不错,是我两次研究性学习的导师.每个都深刻影响我","d":"2010.04.08","y":2010,"mo":4,"c":1},{"i":"79039403","t":"这世界上很多东西是责任义务,去做好不喜欢的东西也是必须履行和承担的.我讨厌语文,厌恶刘特,病根还是在自己身上.我在语文上花费时间那么少,上课又那么无所谓,怎么可能去奢望什么好成绩.但是这种状况怎么改变?整个浑浑噩噩的状态怎么改变?我如何重拾对语文的兴趣,然后拿到我要的分数?","d":"2010.04.08","y":2010,"mo":4},{"i":"78479862","t":"当然,人各有命,人各有路.不要被少数偶然现象迷惑了.我就做好自己的事就好了,我也绝对不比任何人差.这只是机遇问题,要总结教训.当然也不能因小失大,锦上添花不比雪中送炭.高考最重要,其他都是无聊,我还有很长的一生去追求.选择自己的路.\"跪着也要走完\".","d":"2010.04.08","y":2010,"mo":4},{"i":"78301928","t":"我只能坐在教室里发呆,基本的学业都自顾不暇,变成平庸的一员一无所长.做梦都是庸俗荒诞的.我讨厌我自己,非常讨厌.","d":"2010.04.08","y":2010,"mo":4,"c":1},{"i":"78291334","t":"我好嫉妒好嫉妒好嫉妒好嫉妒高一那个去参加UN年会的女生,非常嫉妒非常非常嫉妒.心理好不平衡,郁闷郁闷郁闷.","d":"2010.04.08","y":2010,"mo":4},{"i":"78087168","t":"我的新欢是uni-ball figno UM-151,书写感受很好.不再钟爱monami,它不合适长时间连续书写.当然,我最喜欢的还是UB-150.我从来只用黑色笔,明快简洁.","d":"2010.04.08","y":2010,"mo":4},{"i":"77946126","t":"或许我不得不推翻先前讲稿重写,在普遍\"心系天下\"的氛围里我这样说显得太个人了.But it's just me myself.续写一些,延长一点叭~","d":"2010.04.08","y":2010,"mo":4},{"i":"77368426","t":"清晰感觉昼渐长夜渐短的变化,只是气温却诡异的没有升高,去年此时我似乎已经开始穿T-shirt,而且还是在北方,现在却还是冬天的打扮.奇怪的气候,昨天看报纸说是美国在打气象战,操纵全球气候异常.真的麽?","d":"2010.04.08","y":2010,"mo":4},{"i":"76917655","t":"你必须仔细衡量一整天一整天你究竟做了什么,是不是值得,有没有荒费.你这样不对,课堂40min过去就过去了,你并没有把教学内容储存在头脑里.半期考将近,你心里一点底没有,居然也没有紧迫感.高二下期坏状态,半学期就够了,不能这么颓下去的,否则是自杀的傻瓜.","d":"2010.04.08","y":2010,"mo":4},{"i":"76905028","t":"晚安.周三结束,周四降临,你失去了时光仓促感,摆脱土星控制.但心里还是不踏实,24h轻易过去你觉得你收获的太少.你对语文太多抱怨太少兴趣,尽管这曾一度是你的最爱,尽管去年正是一份语文一等奖让你重拾学业信心.但你仍旧找不到任何对待语文的热情.你不愿写作,不愿阅读,你敌对语文莫名其妙","d":"2010.04.08","y":2010,"mo":4},{"i":"76146836","t":"认识具有有限性,所以每个阶段你看到的人事都是局限的.所以你可以理解为,我之所以爱你,是因为还没有遇到更值得爱的人.所以即便你觉得他太不好,你也不舍得弃他离去.能够陪伴一起的人总是珍贵,很难在对的时间就遇到Mr.Right.一生里分配给爱情的时间太短,寻找等待错过却太多太多.","d":"2010.04.07","y":2010,"mo":4},{"i":"76047458","t":"@Mschanel,我知道灰姑娘的故事只存在于童话,可以嫁给王子的只有公主.王子们即便娶了粉领女仆空姐,也是小概率偶然事件.我们要努力让自己变成公主,顺理成章和王子在一起.你的金牛王子,我的双子公爵.他们会是我们的Perfect-matched.至于牛津男,那么等我晋级哥大女,也是一定要到手的~呵.","d":"2010.04.07","y":2010,"mo":4},{"i":"75975005","t":"连续两天单曲重复Close to U. Just like me,they long to be close to u.有些人在一起却因为种种原因不合适,有些人又因为种种原因不能一起,能够顺利相爱的人从来不多,或许从来就没有我们.","d":"2010.04.07","y":2010,"mo":4},{"i":"72204839","t":"我敏感词敏感词敏感词了..>< 《散文一篇》  网页链接","d":"2010.04.07","y":2010,"mo":4},{"i":"65740976","t":"为了自己,为了爱自己的人与自己爱的人,要尽力做好自己的事.没有任何人有资格断定未来的走向,但每个人都可以为了自己尽力.我肯定不是最聪明的,但我作出的事不愧对自己,就足够.","d":"2010.04.05","y":2010,"mo":4},{"i":"65565176","t":"[1/3]@MajPolarBear,去年六月,我决定离开天津的时候我们正在进行一次漫长的吵架,所以你对于我的离开决定几乎毫不知情.当时我被会考负担压迫得厉害,我妈本来给我只报了物理化学,但官一中又自作主张的给我报了地理历史,而且我在高考之后几天才知道,才开始准备.当时我非常绝望,我的数学已经差到完全放弃的地步,","d":"2010.04.05","y":2010,"mo":4},{"i":"65075916","t":"Almighty黄小珂告诉我,乖,不着急,会考so easy. However她不晓得去年我几乎为会考忙死,而且这就是逼我离开天津的最后一根稻草.悲剧即将重演... May Immanuel.","d":"2010.04.05","y":2010,"mo":4,"c":1},{"i":"63870567","t":"@Msparis,咱姐俩无敌了.全成都都是周日下午从郊区返回城区,而我们却是住城里而奔郊区去上课.","d":"2010.04.05","y":2010,"mo":4},{"i":"62812928","t":"在富顺吃了绿色有机的鸡蛋蔬菜,风尘仆仆折腾回成都.在大蓉和吃饭.我妈最喜欢这里~","d":"2010.04.05","y":2010,"mo":4,"c":3},{"i":"62112030","t":"现在在成渝高速的内江段,晕车中.莲姑娘刚给我发了一份四大的word,周五再去打印出来.","d":"2010.04.05","y":2010,"mo":4,"c":2},{"i":"60569853","t":"我家莲姑娘说:这辈子,要不就是我有跑车,要不就是我男人有跑车,反正就是要有.我笑半天,说:我的梦想是一辆甲壳虫+一辆沃尔沃.老爸插嘴:你别想啃老,啃也啃不着,你老爸只打算给你\"慷慨\"的提供一辆BYD F0.我...- -|||","d":"2010.04.04","y":2010,"mo":4,"c":14},{"i":"59985528","t":"上帝保佑全世界最可爱的蔚蔚小朋友可以活着进上外并且在上外风光的活下去~amen","d":"2010.04.04","y":2010,"mo":4},{"i":"59786854","t":"[1/2]@MajStauffenburg,你可能会觉得我又在将自己的意志强加于你,But正如我刚清楚的说,这只是我的私人愿望,不期待你去实行.只是一个建议,可能我们最终还是不得不走完全背离的路,我们终究还是太过不同的人.我知道有些人的遇见和再见都是瞬间,但我不知道我们是不是其中之一.不论如何,不谈未来的话,只言当下也","d":"2010.04.04","y":2010,"mo":4,"c":1},{"i":"58650847","t":"刚百度知道了一下,韩寒女友曾是他们班宣传委员.这消息真给我们这些天天吃粉笔灰的芝麻官以鼓励.宣传委员,好好干~","d":"2010.04.04","y":2010,"mo":4},{"i":"58580283","t":"马诺,有意思.\"我愿意在宝马里哭,不愿在自行车上笑.\"It's the same with me.","d":"2010.04.04","y":2010,"mo":4},{"i":"58259061","t":"决定安心同你在一起,觉得这是安全可靠的,遂心无他念.","d":"2010.04.04","y":2010,"mo":4},{"i":"58201167","t":"爱情就是高手过招,谁先说爱,谁先出局.@霍艳","d":"2010.04.04","y":2010,"mo":4,"c":1},{"i":"58096282","t":"早上一家16人,上山上坟.坐车很久,又走山路.空气清新,一路真正的田园风光.四川人非常勤劳,每一寸土地都精耕细作.从老到小都给老祖祖和祖爷爷叩头,请求他们保佑.","d":"2010.04.04","y":2010,"mo":4},{"i":"56931912","t":"同心同德把经济搞上去,群策群力把人口降下来.(东湖镇计生办)","d":"2010.04.04","y":2010,"mo":4,"c":1},{"i":"56724390","t":"我的表叔,富顺二中高1999级,从初中到高中每年都是自贡市三好,最后去了重庆医科大.他当时考得很好,但是还是不敢报华西医科大,华西医科大永远比清华分高.他非常聪明,非常能干,现在留在重庆,马上考副主任医师,非常受院长器重.这是我的榜样.","d":"2010.04.04","y":2010,"mo":4},{"i":"56713154","t":"早餐吃豆花,富顺豆花非常好吃,水好豆好,最重要蘸水好,味道好.豆花不是豆腐脑,豆腐脑是稀的豆花是打了胆水的.","d":"2010.04.04","y":2010,"mo":4},{"i":"56631951","t":"痛苦源于无知. 《宗萨蒋扬钦哲仁波切:无知始于当下(痛苦篇）》  网页链接","d":"2010.04.04","y":2010,"mo":4},{"i":"56187303","t":"我痛恨任何对自己的荒费.包括爱错人.甚至等电梯等公车和被堵车.虽然我知道世界不可能围绕我转,但我仍旧不愿.我万万不会做一个后悔的姑娘,我要将自己强大的行动力付诸实用.我要我最好,我要我对所有人说要去上财上外的承诺兑现.半期考尽力而为,我毕竟反省太晚.要好好学习,这是我改变自己的唯一的路.","d":"2010.04.04","y":2010,"mo":4},{"i":"56149731","t":"我必须想清楚这些事.看看我的莲姑娘,如此一帆风顺的活着.我们都必须懂得怎样处理自己的生活.明天去上坟,看老祖祖.如果可以不去,我就留下来做作业好了.这些事情以后都有机会,然而高二只有一个,高考只有一回,而我也只有一辈子一种选择.晚安,我累了,很累.更重要的是心烦和心慌,觉得自己是背叛未来的罪人.","d":"2010.04.04","y":2010,"mo":4,"c":1},{"i":"56135135","t":"[1/2]不能做愚蠢的空想家,不能浪费自己在无意义的事情上.这些都不是我想要的,我只要彻底寂静下来,我只要乖乖学习,Top20,不能只是\"目标\",而必须实现.否则我拿什么跟昆明的孩子比?爸爸妈妈为我付出那么多,我四处折腾又麻烦那么多,我怎么好意思拿着一个差成绩回昆明考试?我怎么可以对自己的未来那么不付责任,那","d":"2010.04.04","y":2010,"mo":4},{"i":"56109761","t":"[1/2]雨一直下.我很害怕,不知道跟谁抱怨我的惶恐.觉得自己状态太不好,学习情况非常差,期中考或许会遭到惨败,不祥的预感.我觉得我近来的疯玩傻笑会遭到残酷报应,一分耕耘才有一分收获的.而我完全在荒费着.这三天假期等于完全浪费时间,作业根本不能抽空做.而平时,我又不停胡闹分心完全没有乖乖学生样.就这种混","d":"2010.04.04","y":2010,"mo":4},{"i":"55677563","t":"我知道你等的不是我，但是，没关系，我是来接你的。 (郑容和)","d":"2010.04.03","y":2010,"mo":4,"c":3},{"i":"54767871","t":"舅舅说,人生三大哲理:上帝给你两只眼,就是叫你睁一只眼,闭一只眼.上帝给你两只耳,就是叫你一耳进,一耳出.不管遇到什么事,莫慌,天黑了,天总会亮.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"54580499","t":"现在在滇北药膳馆吃饭,临沱江.富顺过去十分富裕,因为自贡井盐都要靠沱江往外运.当然,后来被公路铁路运输取代了.同理可得,扬州衰败也是因为京杭大运河的地位改变.地理是非常有意思的.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"54431613","t":"外公其实特别不想来,他在昆明挺好的,虽然退休了但经常还去评标,去受雇当顾问.他觉得自己特别有价值,自己买了很多书,查阅资料给他们解答.\"专家\"嘛,特别有面子~外公这次来错过了几次评标会,他很郁闷,吃不好玩不好的.","d":"2010.04.03","y":2010,"mo":4,"c":2},{"i":"54378108","t":"上周车览传说中的华阳国际成南,现在走在富顺脏乱差的县城街道,感触颇多.","d":"2010.04.03","y":2010,"mo":4,"c":2},{"i":"53786550","t":"自贡盐帮菜很有名,但在富顺这种小地方应该吃不到.富顺有豆花饭,听说还不错,不过得早上才吃得到.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"53604281","t":"外公喜欢打桥牌,我小学的时候他还上网在联众打桥牌.外公很厉害,而且很英俊,一直都是.富顺边就是沱江,宜宾就有沱牌曲酒.外婆完全不记得路了,我们就一路走一路问.路不好走,还很远.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"53584809","t":"外公外婆退休后在昆明每天就去打保龄球.外公还学车,一个手动档的雪铁龙开了许多年.不过后来住到上海舅舅家,驾照没有年检就作废了.外婆外公总是吵架.外婆嫌外公懒,资本家作风.外婆自己脾气也不好,喜欢埋怨抱怨.不过日子也还是挺好的,子女都很好,他们也不用多担心.","d":"2010.04.03","y":2010,"mo":4},{"i":"53568646","t":"以前苦日子太苦,外婆现在也都很节省.因为家里太穷,外婆没有接受太多教育,小学三年级就辍学了.但外婆非常聪明,之后自学很多.当打字员,铁路局工程处的总秘书.外婆十几岁就离开富顺,\"不然早就被饿死了\".外婆近年身体一直不好,但她仍然非常勤劳,整天忙这忙那,还天天跟外公去打保龄球.","d":"2010.04.03","y":2010,"mo":4},{"i":"53487872","t":"自贡有井盐有天然气,一直是四川比较富庶的地方.以前四川一直都吃井盐.不过现在看来发展比较有限,至少我们一路走来都觉得破破烂烂.","d":"2010.04.03","y":2010,"mo":4},{"i":"53443481","t":"到达自贡,号称东方威尼斯.这个城市的代言人就是郭敬明郭四娘?不过他肯定以生在自贡为耻.这是个靠井盐发家的城市.我们还要继续走省道去富顺.我打算去传说中的富顺二中看看.虽然只是个省重,但因为郭四娘全省闻名,不过这学校之前也听说还不错.自贡比成都暖和些,似乎.","d":"2010.04.03","y":2010,"mo":4},{"i":"52951915","t":"外公说,旧地主也没有多阔,还比不了现在一个公务员.当时外公的父亲还在工作,母亲经常去收租.收来的谷子能让家里吃饱,但是也不能常常吃肉,只是偶尔打牙祭.家里有几只猪,一个长工里外伺候打理着.","d":"2010.04.03","y":2010,"mo":4},{"i":"52622234","t":"外公这一辈人经历很丰富.高中学俄语,俄语老师是一位来自白俄的叶利卿娜夫人.工作以后进入铁路局,还参与了成昆线隧道的修建.老爸说,郑家的发家是因为和白崇禧的亲戚关系.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"52592553","t":"醴陵殷家,祖辈是做茶叶生意的.从湖南贩卖到湖北.有一位祖辈,有一次在渡口,所有人都下船走了,他突然发现一个包裹,就一直守在那.后来一个人来找包裹,居然是个大官,包里都是机要文件.大官很感激,就照顾他的生意,殷家就发家了,开始大量买地,变成醴陵最大地主.","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"52289121","t":"成渝高速=停车场...","d":"2010.04.03","y":2010,"mo":4,"c":1},{"i":"50844801","t":"我:郁闷了,作业好多,数学不会.外婆:乖宝宝,慢慢做,不着急.妈咪:高中数学有什么难度,自己再想想.老爸:哎呀,拿来我给你讲,我数学相当好.外公:想当年我数学高考都满分,做题就是玩~(五分钟后...)老爸:几十年了,早忘完了.外公:这个...好像我们当年没学过...我:...","d":"2010.04.02","y":2010,"mo":4,"c":3},{"i":"50593153","t":"手机无法登陆Gmail?","d":"2010.04.02","y":2010,"mo":4,"c":1},{"i":"49585092","t":"网页链接我在豆瓣上关注的音乐人太多，但登陆次数太少，豆邮塞得满满的。我爱上微博就冷落豆瓣，罪过，罪过。","d":"2010.04.02","y":2010,"mo":4},{"i":"49535576","t":"我爱Sammi~我们有几乎相同的名字~  @郑秀文Sammi  的微博 错误提示 微博-随时随地发现新鲜事","d":"2010.04.02","y":2010,"mo":4,"c":1},{"i":"49374480","t":"Sa：（低头不语，沉默一会，摇头）虽然我们分开了，仍然是一对好朋友，任何伤害到对方的事件，我们都会为对方不开心。希望大家给一些时间我去淡忘这件事。","d":"2010.04.02","y":2010,"mo":4},{"i":"49372561","t":"Sa（咬牙切齿）那天我跟郑中基在记者会上都好清楚这么交代，我们之间没有第三者。没有什么上海富家子弟，根本就没有这个人存在，我可以用时间来证明。我都不知道讲什么好，要求证的话，可以打给郑中基。（双眼通红）每天都有充满敌意的新闻，一时又说有富家子，一时又说有第三者，迟早传我们有私生子！","d":"2010.04.02","y":2010,"mo":4},{"i":"48232167","t":"这个世界是由彼此独立的各个枝干组成.你窥见的一方天地和你所处的方寸之地都微忙得不值一提.你需要走的路还很多,还会看到更多的不公和荒唐.没有人规定世界是美好的.但你可以让自己美好起来.不要被压抑与压力击败,蔚宝.你是最最好的.","d":"2010.04.02","y":2010,"mo":4},{"i":"46768479","t":"[1/2]十二点半的时候,我在失眠中,维维打来电话,我直接挂掉.又警告的发一条信息:不要再打来.这是本周第二次.他说:我只想知道,你还在.我说:没有必要,我们不是一路人.我不是你的消遣,不准再打扰我的生活,你最好滚.不要再和任何人说起我们有什么,否则只会增加我对你的恶感.他说:我不想究竟你怎样想我,我只想知道","d":"2010.04.02","y":2010,"mo":4,"c":2},{"i":"46176806","t":"[3/3]让自己清新明澈起来,重新.","d":"2010.04.01","y":2010,"mo":4},{"i":"46176726","t":"[2/3]才有努力的方向.我不能仅仅一副功利的模样,不能让自己继续麻木苍白下去.这不是我.不能明确的未来是必然,即便明确了是否达到也是未知.但是眼下的路实在让我无所适从.我觉得我一无所有,连时间都一而再再而三的抛弃我.未来太远又太近了.想起一句话\"以希望维生的人,会绝望而死.\"希望我不是想太多,希望我能","d":"2010.04.01","y":2010,"mo":4},{"i":"45796350","t":"终于成功下载微博Kjava客户端,我的KF350头一次没和我闹别扭.不过想来应该会非常耗流量,并且速度很慢,不宜多用.","d":"2010.04.01","y":2010,"mo":4,"c":4},{"i":"45650118","t":"也许每个人都该是每个人成长的助手,受一点苦痛帮助她成熟.听我说爱是对的错的,是我还没学会爱,就急着爱人,而爱错人.可是爱就对了遇到下一个爱上就爱珂,痛苦或快乐都是我的.别探听他的线索别等待他会回头,爱不喜欢看人软弱.别继续把心封锁别躲在伤心里头,爱万一来了别错过.<爱就对了>","d":"2010.04.01","y":2010,"mo":4,"c":3},{"i":"45614947","t":"对于每个人来说,青春期是很难熬的一段日子,你必须努力搞清楚你自己是谁.(Avirl Lavigne)","d":"2010.04.01","y":2010,"mo":4,"c":1},{"i":"43144831","t":"[1/2]我的Gmail Inbox总是让我有幸福的惊喜.之前没有查阅邮箱,两封03/30的邮件.一封是ilook的editor来确认我的姓名地址,感谢@洪晃.另一个是我的莲姑娘,一些鼓励的话,一些描述近况.我们的短信邮件blog从来不断.我要和她在一起,这是今明两年唯一的念头.为了她,为了我自己,去往上海.并且希望,如果有机会,实现自","d":"2010.04.01","y":2010,"mo":4},{"i":"42991127","t":"明天又要回家,清明假期全家出动回自贡扫墓.作业又没戏做完了.我妈说得好,会做的没必要做,不会的你又做不了,有什么可做的?我:...","d":"2010.04.01","y":2010,"mo":4},{"i":"42616739","t":"#愚人节 表白#我想嫁给你~我想我们有同一个家~真的.@MajGuderian","d":"2010.04.01","y":2010,"mo":4,"c":2},{"i":"41439082","t":"话说三月份,我在心里许愿,直到03/31/10 23:59:59,我的粉丝数目就会是我高考分数的预期.631,在正常年份稳上上财上外,谢谢各位.我会努力实现的~","d":"2010.04.01","y":2010,"mo":4,"c":7},{"i":"38799319","t":"明天进入四月,意味着又要重画板报.宣传委员这破差使我还是每丢掉.四月的Theme是\"校庆七十年\",这个\"短命\"的学校...","d":"2010.03.31","y":2010,"mo":3},{"i":"38456604","t":"一天时间的流逝就在无意识与下意识之间.下课铃和闹钟开始结束你的一天又一天.你的浮躁情绪日笃,不是好事.但也不必对自己有太多逼迫,你并没有做错,你并没有误事.在能力所及的范围内做有意思的人,和有意思的人在一起,是有意思的.","d":"2010.03.30","y":2010,"mo":3,"c":1},{"i":"38286230","t":"四川移动10086很糟糕,打了5次都说人工服务忙.它上厕所也不要那么长时间叭?无语.10086接通率好低.","d":"2010.03.30","y":2010,"mo":3,"c":1},{"i":"73834200","t":"决定将现在所有的蛰伏积蓄为改变的能量.比如粉红色的长卷发.比如小烟熏达人.比如花朵范儿.比如一切的改变.为了大学里完全不同的自己和新的人生.忍耐现在,承认目前的不完善与精力缺乏.就是这样的\"邋遢\",将成为我博弈未来的筹码.","d":"2010.03.30","y":2010,"mo":3,"c":1},{"i":"38162560","t":"什么意思?复读生不准报考? 《今年高招5类人不能报考 4情况优先录取》  网页链接","d":"2010.03.30","y":2010,"mo":3,"c":4},{"i":"38156668","t":"\"顺利只是平庸的人生.\"虽然看起来这只是吃不到葡萄说葡萄酸的话,但的确是有道理.人生的正弦函数高潮低谷交替共生,不可能事事合心成功.失败是必须学会品味的茶.正因为有失败,成功才有可贵的喜悦.退却,心灰,逃避,厌倦是去往成功路途中的荆棘丛.","d":"2010.03.30","y":2010,"mo":3,"c":1},{"i":"37872936","t":"我爸说求是食堂是人大的,他的研究生导师就是人大的,经常提起.好诡异~我的梦无敌了~","d":"2010.03.30","y":2010,"mo":3},{"i":"37468191","t":"今天是杜宝宝的生日,可爱的白羊座孩子.或早或晚,我们都将要或已经迈入十七岁,并且把美好都献给高二高三高考.祝福梦想就是祝福我们的青春,要加油","d":"2010.03.29","y":2010,"mo":3,"c":5},{"i":"37375266","t":"处在健康的人际关系里是幸福的,不必钩心斗角和算计.这样很幸福,不必受到无谓的伤害,反而可以收获温暖和欢笑.幸福就是,有平稳简单的关系网,为看得见的梦想付出,被爱和学着去爱.","d":"2010.03.29","y":2010,"mo":3},{"i":"37099534","t":"网页链接 充分支持晃，支持ILOOK.","d":"2010.03.29","y":2010,"mo":3},{"i":"37077462","t":"#宜万铁路#宜(昌)万(州)铁路将在今年8月完成全线铺轨任务，预计11月开通运营。宜万铁路是沪汉蓉高速铁路的重要组成部分，沪汉蓉高速铁路全线建成后，从成都坐火车到上海的将缩短到10个小时左右，比现在成都至上海快车节省20多个小时。","d":"2010.03.29","y":2010,"mo":3},{"i":"36877235","t":"觉得\"华语榜中榜\"的宣传做得一点都不好,成都人很少知道.昨天转播,观众席都比较空.为什么它不多广告一下?","d":"2010.03.29","y":2010,"mo":3},{"i":"36690331","t":"@MajGuderian,少校先生,今晚跟你说起的记忆,是我长期以来人前人后一直隐瞒的.你是它的唯一听众,当然也是最后一个.或许你觉得并没有什么,但它对于我就像一道骨裂.失败是为我所忌讳的,我非常后悔有那样的2007~2008.我不希望对既定事实作出任何假设,我只能接受现在的自己.现在,我有你,这样很好,我很心安.","d":"2010.03.29","y":2010,"mo":3},{"i":"36622185","t":"@MajGuderian@babeivy@babeChong@babe蝉时雨,我的亲们.在这里向你们道歉.因为我遇人不淑,辨人不清,将一只GISGUST引荐给你们.给你们造成了不同程度的麻烦和困扰.我向你们郑重道歉,都是我不好,我以后再也不会这么轻信此类DISGUST.请不要因为这种玩意伤害了彼此的感情.我爱你们.蔚宝亲笔","d":"2010.03.28","y":2010,"mo":3,"c":4},{"i":"36257828","t":"我觉得我应该树立\"远大的\"目标,以后去考公务员.刚从华阳那边的市政府小鸟巢溜达回来,太奢华了.就算不当公务员以后住国际城南也要工作在国际城南","d":"2010.03.28","y":2010,"mo":3},{"i":"35907351","t":"@MajGuderian,亲爱的古德瑞安上校,我是你的布尔乔亚小姐.我们来自不同的宇宙,不懂彼此语言,从不相互理解,总是相互折腾.不晓得是哪种折磨人的引力刻意作祟.你放心,你可以期待宇宙爆炸,毁灭世界.然后沧海桑田物是人非一切破碎各奔东西百年好合殊途同归.","d":"2010.03.28","y":2010,"mo":3,"c":1},{"i":"35848346","t":"[2/2]包小包.本来想让外婆在华西做手术,但华西太黑了,不好.舅舅说接到上海去,规范一些,更好.外婆外公来成都呆三个星期,清明节回自贡富顺(也是郭四娘老家)扫墓.他们十几年没回来过了.","d":"2010.03.27","y":2010,"mo":3},{"i":"35678130","t":"每个成都人都晓得的路--去双流机场并且不交过路费.从紫瑞大道上机场辅道,到棠外路口转弯,走没有明显标志的机场后门路口.回成都时就可以走高速了","d":"2010.03.27","y":2010,"mo":3},{"i":"35595157","t":"<人与社会>讲浙江武义一对卖早餐的夫妻,还经常跳探戈.虽然两个人很穷又很累,但他们自己过得幸福快乐.即便是在困境里一样可以开心,生活自己创造","d":"2010.03.27","y":2010,"mo":3,"c":6},{"i":"35548855","t":"对于#钟莉颖#这种女人,让人不觉可怜,只觉可悲.为了出名就毁掉自己的名誉来炒作,同为90后,深 ","d":"2010.03.26","y":2010,"mo":3},{"i":"34764734","t":"传说恭城郑家，解放前势力颇大。刚解放，就有个解放军小分队来管理县城，被郑家人（我爷爷的父亲那一辈）全部杀掉。这就是“广西土匪暴动”的事。然后又两个小解放军逃走，逃到湖南搬来救兵，把造反的郑家大少爷枪毙，把头割下来，不准郑家人收尸。郑家很快就被抄家了，一百多人的大家族衰败。","d":"2010.03.26","y":2010,"mo":3,"c":2},{"i":"34681065","t":"温州小镇的时尚是什么鬼时尚,你拽什么拽.穿着新中兴档次的衣服叫嚣看不起乐森仁和春天美美,开什么国际玩笑.自己没有能力在成都过优渥生活,就闭嘴","d":"2010.03.26","y":2010,"mo":3},{"i":"73834196","t":"<春分日>得到苍白空洞的评价,对我来说是意料之中.记忆反刍多次,我已经失去任何感觉.","d":"2010.03.26","y":2010,"mo":3},{"i":"34305613","t":"<玩偶之家>海尔茂:娜拉,难道我永远只是生人?娜拉:托伐,那就要等奇迹中的奇迹发生了.那就是说,咱们俩得都改变到--喔,托伐,我并不相信世界上游奇迹了.海尔茂:可是我信.咱们俩都得改变到什么样子?娜拉:改变到咱们在一起真正过得像夫妻.再见.","d":"2010.03.26","y":2010,"mo":3},{"i":"34172855","t":"操作失误删除了所有不想删除的短信,所以直接清除收件匣还清静些.","d":"2010.03.26","y":2010,"mo":3},{"i":"34157321","t":"结束茫+盲\"倒春寒忧郁症\",不管气温是否回升,我都要率先明媚.不重要的人就让他不重要,屏除杂人干扰.和亮亮说起的无能为力感不会持续,我们都是有能力左右自己未来的女孩.要快了的\"忙\"起来,拟定的周末学习计划一定要顺利完成.外公外婆周六晚上降落双流机场,期待.晚安,我又元气满满的前进了~SHUFE&SHISU","d":"2010.03.25","y":2010,"mo":3},{"i":"34051103","t":"不开心,所以牺牲某个人当炮灰.突然的恶感并非没有来由,是蓄谋已久的爆发.So,U make me SICK,Get out PLEASE.","d":"2010.03.25","y":2010,"mo":3,"c":1},{"i":"34029514","t":"不晓得是第几遍看<雷雨>,总之再一次被雷到了.其实我喜欢周繁漪,正如我喜欢苏文纨.","d":"2010.03.25","y":2010,"mo":3},{"i":"33882220","t":"@babeJane,我亲爱的亮亮~@babeChong babeJane_115，奋斗中的孩子。babeJane_115的微博主页、个人资料、相册。新浪微博，随时随地分享身边的新鲜事儿。","d":"2010.03.25","y":2010,"mo":3},{"i":"33845635","t":"同莲姑娘一起,陷入某种困局,只是情况不同.她是人事危急,而我却是对自己茫然不知了.是不是因为季节变迁气流紊乱所以心绪难宁?时间在飞,深刻体会,我是不是又被落在后面了?","d":"2010.03.25","y":2010,"mo":3,"c":3},{"i":"33701709","t":"书架上已有9本书,新买3本,如何放?有10*11*12=1320种方法.如果首尾不能都放新书呢?如果新书不能相邻呢?答案?我恶心了不想买书了","d":"2010.03.25","y":2010,"mo":3,"c":2},{"i":"33584039","t":"身处热闹的小宇宙,并不意味着你就可以不寂寞.有些人的存在让你恶心,但总有人让你觉得温暖.就像隔着无限距离的两颗恒星,以微弱的光芒相互致意.这就是幸福了,你应该热爱自己的生活.我很好,我会好起来.","d":"2010.03.25","y":2010,"mo":3},{"i":"33563575","t":"我觉得累了,是因为什么而厌倦?在低谷里顺流而下了.觉得什么都不可期待,觉得疲倦没精神.坏状态.","d":"2010.03.25","y":2010,"mo":3},{"i":"33558244","t":"如何让自己变得优秀?---用别人的智慧充实自己,不用别人的智慧贬低自己.用别人的成功激励自己,不用别人的成功折磨自己.用别人的错误提醒自己,不用别人的错误娱乐自己.","d":"2010.03.25","y":2010,"mo":3},{"i":"33223326","t":"翻了一遍手机里269张图片.本来以为照片已经全部删除,但其实只删了存储卡里的部分.觉得自己并不认识照片里的风景,旅途被埋没在微茫的生活里.","d":"2010.03.25","y":2010,"mo":3,"c":3},{"i":"33206184","t":"微博里说话多少与现实中唠叨程度成反比?最近的\"微博词穷症\"大概就是因为自己乱七八糟该说不该说的都对人说了.似乎不好.要改正~晚安.","d":"2010.03.24","y":2010,"mo":3},{"i":"32927142","t":"[2/2]是巴豆哥哥,不是木瓜,你是犀利哥呐~!","d":"2010.03.24","y":2010,"mo":3,"c":1},{"i":"32873242","t":"@门下左拾遗:为什么雅尔塔会议是丘吉尔举行的,但却是美苏操纵?感觉都没英国什么事.","d":"2010.03.24","y":2010,"mo":3,"c":4},{"i":"32693872","t":"蔚宝,你要静心做好现在的事.高三将至,高考接踵.你绝对不希望初三的悲剧重演,你不要给自己后悔的口实.该来的一步步都会来,你会等到,你努力迎接","d":"2010.03.24","y":2010,"mo":3},{"i":"32630445","t":"其实我特别羡慕莲姑娘.虽然她也忙碌着高口公关BEC,但毕竟是自己钟意的,是为了自己的付出.成长就是从做不喜欢的事到可以做喜欢的事.初中以理科为主到高中选择文科就是过滤了自己讨厌的东西.从某种程度上讲,我自己也是幸福的.文科是夙愿,而且是为了高考这未来服务的.时间太长太短,都是必然的路途.","d":"2010.03.24","y":2010,"mo":3,"c":1},{"i":"32427578","t":"(2/2)恐如痴如醉,卡丁不知劳累,武林打到天黑,上网几天不睡,半夜点灯开会,双流中学万岁!","d":"2010.03.24","y":2010,"mo":3},{"i":"32427576","t":"(1/2)青山青水青少年,双流中学混三年,浪费时间浪费钱,不如回家种大田。人在教室心在外,时时想着谈恋爱,学业不成恋爱成,一家三口出校门。学费全国最贵,上课一排全睡,考试全都不会,成绩基本个位。抽烟打牌全会,打饭从不排队,逃课成帮结队。短信发到欠费,上街花钱干脆,白酒两瓶不醉,反","d":"2010.03.24","y":2010,"mo":3},{"i":"32106913","t":"幸福的生活有三个不可缺的因素:有希望,有事做,能爱人.------我算是幸福的姑娘,或许.","d":"2010.03.23","y":2010,"mo":3},{"i":"32103576","t":"自我告诫   网页链接","d":"2010.03.23","y":2010,"mo":3},{"i":"32078825","t":"Cold rainy night+Mixed feelings.是否应该重新定位自己和周围他人的状况?一向不愿自己显得吵闹,这是麻烦事.安静简单是夙愿.该不该做,能不能够,要不要.需细思量.","d":"2010.03.23","y":2010,"mo":3},{"i":"32073416","t":"@babebaal,没有下雨,你也回去叭~","d":"2010.03.23","y":2010,"mo":3},{"i":"32029941","t":"大家都有\"月底嗜聊症\"?收件箱里塞了一堆莫名其妙的信息,回也不是,不回也不是.","d":"2010.03.23","y":2010,"mo":3,"c":1},{"i":"32027626","t":"觉得有几分内疚,自己不应该瞎折腾一些事.搞得自己很麻烦,可能又会莫名其妙的创造一个尴尬的出境.总之@门下左拾遗,@babebaal,你们顺其自然,我不干涉,不参与,不问候~But要是有成果,请我吃喜糖是必须喔~","d":"2010.03.23","y":2010,"mo":3,"c":1},{"i":"31697419","t":"每个人都有自己的路,每个人也都只能走自己的路.别人的东西,再好,你也羡慕不来,妒忌不来.他也永远不可能成为你.你不比他差,也并不比他好.你和他拥有完全迥异的人生.","d":"2010.03.23","y":2010,"mo":3},{"i":"31485802","t":"突然觉得很想离开这里,不满现状.觉得自己现在很糟糕,但矛盾的觉得又还不错.知道这是必然的路,但心生厌弃感.萌生去新加坡的念头,不为什么.会坚持现在,若有可能就申请NUS.这是未来的一些事.","d":"2010.03.23","y":2010,"mo":3},{"i":"31435049","t":"你会忘记一些貌似重要的事情.比如你忘了去年获奖时对着镜头说了什么.但你清楚记得一些琐碎:你穿了什么,和谁去,有多紧张,遇见了谁,听到了什么.","d":"2010.03.23","y":2010,"mo":3},{"i":"31417567","t":"应该明天就要结束立体几何.12/11/09~03/24/10.我们班的进度一向慢于全年级,更应该在全市之后.立体几何在高考中应该是20分左右,我都能拿到吗?以前和C在一起,他们似乎四五月了还在学正方体.这是云南的进度?","d":"2010.03.23","y":2010,"mo":3},{"i":"31393725","t":"Esturary English? I enjoy it much.","d":"2010.03.23","y":2010,"mo":3},{"i":"31382819","t":"@水北,柴静竟然是长沙铁道学院(我外公的母校,我外公是五十年代的大学生,学土木工程,桥隧.)的会计专业,但是她不喜欢.她说:\"我应该是历史上最糟糕的会计之一\".但她成为了非常优秀的记者.","d":"2010.03.23","y":2010,"mo":3,"c":1},{"i":"31301050","t":"我是迷恋自言自语,不喜互动的孩子.amen.晚安.","d":"2010.03.22","y":2010,"mo":3,"c":1},{"i":"31225967","t":"明天成都只剩下9~15度了,并且由南风转为北风.今天阴森森的风声一直\"呼啸\",寒冷到来.注意添衣~","d":"2010.03.22","y":2010,"mo":3},{"i":"31196770","t":"目的颤抖:成功和胜利应该是我们所追求的目标,但如果过于专注于未来的成功和胜利,我们的追求就会变成我们前进的阻碍和羁绊.目的性越强,越不易成功","d":"2010.03.22","y":2010,"mo":3,"c":3},{"i":"31053618","t":"@babebaal,铭记你的话:希望和困境并蒂而生执意相抗.","d":"2010.03.22","y":2010,"mo":3},{"i":"30987358","t":"电话有这样的好处,出现争端时直接挂断就好了.面对面的两人除了拂袖而去就只能争得面红耳赤六亲不认.我不开心,不想听你电话,你滚,不准打扰我.","d":"2010.03.22","y":2010,"mo":3,"c":1},{"i":"30975802","t":"@babeChong,已经报名会考.是6月25日?我提前两天回去差不多叭?什么时候开始准备生物呐?","d":"2010.03.22","y":2010,"mo":3,"c":4},{"i":"30691759","t":"所以从这个角度出发,我希望我的各位Ex-都找到世界小姐做继任,并且都生活不幸.我是不会自讨苦吃去向谁谄媚的.Ex-应该被分类回收给别人再利用,我就围观咯~","d":"2010.03.22","y":2010,"mo":3,"c":1},{"i":"30685996","t":"前女友与现女友的矛盾绝对不是人民内部矛盾,因为后者往往是小三的进阶.现女友优秀,前女友可以体面的受伤和嫉妒.反之,前女友会脸上无光心生悔恨,原来你就是配这种人的,我居然还和你在一起过,丢人.","d":"2010.03.22","y":2010,"mo":3,"c":2},{"i":"30358063","t":"晚安.似乎明天以后又有降温,北方一冷下来很快就会传染南方.倒春寒或许要持续到四月份,但温暖一定不远了.","d":"2010.03.21","y":2010,"mo":3},{"i":"30247475","t":"@babeChong已正式就任暖地写手团团长.也希望其他热爱写作的孩子加入我们\"暖地文学社\".坚持自己的文学梦想,建立暖地高品质文学交流平台.","d":"2010.03.21","y":2010,"mo":3,"c":2},{"i":"30239774","t":"About我对暖地的态度,作出说明.第一,暖地是我亲手建立,我对它负有全部责任,我不接受任何人对它的诋毁和侮辱.第二,我不会以任何借口放弃暖地.我希望建立一个文字交流平台,给我和我的朋友们.第三,暖地是属于我个人的梦想,我也希望感召更多热爱文字的孩子加入.但即便暖地只剩我一人,我也要维持.That's ALL","d":"2010.03.21","y":2010,"mo":3,"c":8}, 3},{"i":"29379881","t":"你能成为CEO吗？  网页链接 我的测试结果是: 过于谨慎型 你生活的态度是坦率而真诚，也很有创意，可是凡事喜欢留一手，有时候会有点不负责任，所以你想成为CEO的话，请多加强自己的责任感。","d":"2010.03.20","y":2010,"mo":3},{"i":"29378389","t":"败犬系数90% 在你的观念里恋人不是你的名片，也不是你向朋友炫耀的资本，所以你一定要挑选一个满意的爱人，要过上那种王子和公主的完美生活。所以你自己很努力，你希望自己更加完美，但是突然有一天你发现，完美的你却找不到了完美的爱人，你宁缺毋滥的理念十分难得，但是人无完人何不当个平凡的人？","d":"2010.03.20","y":2010,"mo":3},{"i":"29371191","t":"网页链接 好心情发生器~很好玩~","d":"2010.03.20","y":2010,"mo":3},{"i":"29293785","t":"刚和我妈一起看江苏台<非诚勿扰>复播,觉得特好玩~我说以后我也去这样相亲叭,我妈说:不行,太丢人了.","d":"2010.03.20","y":2010,"mo":3},{"i":"29254067","t":"我:耍我者,死.Barbecue:死了变成鬼也要解释清楚...","d":"2010.03.20","y":2010,"mo":3,"c":3},{"i":"29223934","t":"听Gaga的歌无疑是脸红心跳心惊肉跳的过程.她的MV尺度到没有尺度就不提了~我听了一下午Telephone,\"...Out in the club, and I'm sipping that bub...\"我是不是想太多了?脸红...~","d":"2010.03.20","y":2010,"mo":3,"c":1},{"i":"29170754","t":"@babeChong,别忘了这周到暖地报道~","d":"2010.03.20","y":2010,"mo":3},{"i":"28938489","t":"是英格瑞尔?貌似.感觉效果一般,没感觉有多大效果.昂贵的套餐玩的都是概念.像神仙树大院那儿的琉璃时光,还号称藏传密宗呢,不喜欢.我和我妈以后如果开美容院,就打宇宙牌.月光美白彗星嫩肤,哈,绝对比英格瑞尔曲高和寡的生意好~","d":"2010.03.20","y":2010,"mo":3},{"i":"28935484","t":"这个世界是荒谬的.我妈淘宝一件呢大衣,400多,配一条哥弟皮带,500多,但是特别好看.她一去办公室,她们同事看到,就说,我知道,你这衣服是王府井的,3000多.我妈特别开心~说:你给我2000叭,我帮你买~她跟人家说这衣服才400多都没人信.所以穿得贵,不如配得好.很多人都只能把淑女屋穿成欧洲挤奶工的范儿.","d":"2010.03.20","y":2010,"mo":3,"c":2},{"i":"28748969","t":"晚安,这是沉默怪圈?--大家都无话可说强颜欢笑各自忙碌?我困觉了,乖乖做梦去.><今天可以做梦,昨天前天不可以因为我不允许.因为我希望自己去想念,所以我要梦见你.~","d":"2010.03.19","y":2010,"mo":3},{"i":"28708882","t":"@西蜀蛮族,高三新课的内容只学一遍,之后再不复习?","d":"2010.03.19","y":2010,"mo":3,"c":2},{"i":"28685639","t":"唔,生活里没有旁观者.我们只能投入,热爱,厌弃,坚持,死亡. 《我为什么不敢“留点余地”》  网页链接","d":"2010.03.19","y":2010,"mo":3},{"i":"28681945","t":"我:乖,姐不欺负你,只要你让姐开心了,什么都好说~Barbecue:走走走走走...一边儿玩去-------我们俩从来没有和谐过的对话.","d":"2010.03.19","y":2010,"mo":3},{"i":"28631317","t":"手机再次猝不及防的死机,格式化.我所有的短信存储又全部消失了.我再也不信任这Ice Cream了,它会让我不停不停的丢弃丢弃丢掉我想要记得的内容.","d":"2010.03.19","y":2010,"mo":3,"c":2},{"i":"28589832","t":"@babebaal,突然想念你的黑白豹纹本本.觉得高三用非常合适非常舒服呢~以后我也买一本~就怕我丑丑的字把它给毁了,哈~","d":"2010.03.19","y":2010,"mo":3,"c":1},{"i":"2
