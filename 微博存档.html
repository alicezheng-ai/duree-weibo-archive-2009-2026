’s not my wife.","d":"2021.03.08","y":2021,"mo":3,"l":166,"c":15},{"i":"4610863249490042","t":"Good intentions don’t work, mechanisms do.\n\n这是最近在工作中感触最深的准则。","d":"2021.03.04","y":2021,"mo":3,"l":56},{"i":"4607589764302061","t":"新的转机和闪闪的星斗，正在缀满没有遮拦的天空。","d":"2021.02.23","y":2021,"mo":2,"l":12,"c":1},{"i":"4597212984644407","t":"A man is flying in a hot air balloon and realizes he is lost. He reduces height and spots a man down below. He lowers the balloon further and shouts:\n\"Excuse me, can you help me? I promised my friend. I would meet him half an hour ago, but I don't know where I am.\"\nThe man below says, \"Yes, you are in a hot air balloon, hovering approximately 30 feet above this field. You are between 40 and 42 degrees North latitude, and between 58 and 60 degrees West longitude.\"\n\"You must be a programmer,\" says the balloonist.\n\"I am,\" replies the man. \"How did you know?\"\n\"Well,\" says the balloonist, \"everything you have told me is technically correct, but I have no idea what to make of your information, and the fact is I am still lost.\"\nThe man below says, \"You must be a project manager\"\n\"I am,\" replies the balloonist, \"but how did you know?\"\n\"Well,\" says the man, \"you don't know where you are or where you are going. You have made a promise which you have no idea how to keep, and you expect me to solve your problem. The fact is you are in the exact same position you were in before we met, but now it is somehow my fault.\"","d":"2021.01.25","y":2021,"mo":1,"l":30,"c":6},{"i":"4593867263312131","t":"今天跟老板1:1，我告诉她一个近期沟通事件：某产品忽视我一个月，我在最近一封跟进里，被对方呛：如果你要我花时间解决你的问题，就不要让我花时间解释这个问题。\n\n我自认为回复得很好：没有低头道歉（我本来也没错，但刚看到他回复的时候还是马上想回I’m sorry），而是说I appreciate if you can share a way that I can work with you that’s not perceived as intrusive.\n\n今天告诉老板的时候，她说我其实应该在追了一次无果之后就直接升级，让老板代我继续追。因为老板扮演bad cop没有后果，但是我因为需要和他们长期密切地合作，得保护自己，保护我们彼此的同事关系。\n\n新年第一课。","d":"2021.01.16","y":2021,"mo":1,"l":63,"c":15},{"i":"4591999719836588","t":"在用数据说话时，不只是要告诉对方what，还要进一步给so what. 如何组织这个so what，要哪些上下文、故事，就是你的创意空间了。","d":"2021.01.11","y":2021,"mo":1,"l":25},{"i":"4573798814716503","t":"周六六点就醒了，因为做梦都在跟客户解释heavy contention from Q4, Boolean Logic for audience targeting expression, et cetera.","d":"2020.11.21","y":2020,"mo":11,"c":2},{"i":"4557560705452754","t":"I just thought of a great pun:\n\nNobel prize was awarded for crispr, but unfortunately, Feng Zhang didn’t make the cut.","d":"2020.10.08","y":2020,"mo":10,"l":9,"c":1},{"i":"4556824936712319","t":"在草稿里我写了一句including additional users with correspondingly lower model scores. PR审核标红加粗：Is there another way to say this so it doesn’t sound so negative?\n\n。。。","d":"2020.10.06","y":2020,"mo":10,"l":2},{"i":"4552474356093622","t":"“The opposite of play is not work — it is depression.” 昨天在Brene Brown的书里听到这句话，脑内循环了一天。","d":"2020.09.24","y":2020,"mo":9,"l":28},{"i":"4545991392887439","t":"Southwest的空乘真是太好笑了：If you’re traveling with children, we’re sorry. Well I’m just joking but not really. Please put on your own mask and then help them. If you’re traveling with someone who acts like a child, please also put on your own mask and then help your husband. 😂 美国·洛杉矶国际机场","d":"2020.09.06","y":2020,"mo":9,"l":24,"c":4},{"i":"4543383664866488","t":"“成功通过数据科学面试的SQL部分所需的所有知识。当然，练习是关键。试着给自己设置一些问题，然后使用上面描述的工具来解决它们。更好的办法是，找一块白板，在上面练习，这样在面试的时候你会感觉更舒服。\n\n我还想就面试本身给大家提几条建议。\n\n1⃣️ 把每个问题分解成尽可能小的部分。这是清晰思考SQL问题的最佳方式，将帮助你一步一步地思考要实现每个步骤所需要的SQL命令。\n\n2⃣️ 大声说出你的解题过程。就像在学校里一样，你会因为展示你的作品而得到赞扬。如果你只是独自埋头在白板上写东西，没有与面试官交流让他知道你在做什么，他们将很难评估你的技能，尤其是当你没有得到最终答案的时候。\n\n3⃣️ 寻求帮助。无论你是否相信，但大多数面试官都希望面试者能通过面试，也乐于提供一些帮助，只要你能清楚地表达出自己的问题所在。换句话说，可以问一些诸如将整数转换为浮点数的正确语法是什么之类的问题，但是要避免问一些含糊不清的问题，这些问题可能表明您不知道如何处理您试图解决的问题。” Twitch数据科学家手把手教你拿下面试必考的SQL","d":"2020.08.29","y":2020,"mo":8,"l":22},{"i":"4542290732778408","t":"给人挑了错加了活对方还这么客气 😹\n\n“Thanks for prodding me, this helped us trace the issue!”","d":"2020.08.26","y":2020,"mo":8,"l":4},{"i":"4541562099350234","t":"Jeff Wilke上周宣布退休，他写了自己穿法兰绒衬衣的典故。1999年假日季购物高峰，他和同事需要从西雅图总部出差到各个地址偏僻的物流中心帮忙打包，穿法兰绒又保暖又方便。后来物流运营变强，订单扩大无数倍也能应对，不再需要这种hustle。Jeff就在第四季度的每一天穿法兰绒衬衣上班，提醒总部同事在物流中心前线奋战的同僚。\n\n网页链接 Day One Blog不只发了Jeff Wilke的原文，也发了Jeff Bezos转给全公司的回信，很动人。","d":"2020.08.24","y":2020,"mo":8,"l":4},{"i":"4540975555282754","t":"在听迪士尼前CEO Bob Iger 的自传 The Ride of a Lifetime。第五章他说起自己被Michael Eisner 忌惮，他从员工和老板的两个角度来谈。员工这段原话：”Do the job you have well. Be patient. Look for opportunities to pitch in and expand and grow. Make yourself one of those people through attitude, energy, and focus that your boss feel that they have to turn to when an opportunity arises.” 机会会有，但等来机会之前，你需要把手头工作上做到精益求精，为抓住机会做准备。","d":"2020.08.23","y":2020,"mo":8,"l":12,"c":1},{"i":"4539838641997488","t":"第一次感觉到在大公司工作的好：Slack里有好几个狗频道，每天更新成百上千张毛茸茸照片，根本刷不过来。每当觉得累到秃头，一看狗频道又有五条新消息，就能立马开心！","d":"2020.08.20","y":2020,"mo":8,"l":28,"c":2},{"i":"4539221203232219","t":"不要回去，不要期待回到你在了解这一切之前的「正常生活」里面去。你必须和我们一起 move forward，不要忘记这一刻，不要抛下这一刻。\n\n这是我最首先要说的，这是我能够面对这一切并勉强保持 sanity 的前提。\n\n接着很重要的一个因素是，你不能逃避。\n\n你希望这个世界是有希望的，你希望有道理可讲，你希望世界的运行归根结底还是符合你的基本想象：善恶有报、正义虽迟但到，等等。\n\n但你眼下看不到这些，你只能看到荒谬，看到那些事情在大太阳下面明晃晃地发生。\n\n请你不要躲开，不要移开你的目光，即便荒谬本身是刺目的，是令人疼痛的，你也不可以躲开。\n\n被荒谬刺痛，是你，一个生活在 2020 年的普通人，最基本的道德义务。\n\n网页链接","d":"2020.08.18","y":2020,"mo":8,"l":310,"c":12},{"i":"4537936353176879","t":"“It’s refreshing to see Amazon fail at something.” ಠ_ಠ 听到播客嘉宾这么说我笑死了。","d":"2020.08.14","y":2020,"mo":8,"l":5,"c":8},{"i":"4532914865837073","t":"Paul Kotas, SVP of Amazon AMI org (Advertising, Music and IMDb，之前叫Amazon Media Group), 直接向Jeff Bezos汇报的12个人之一，在今天的all-hands里给新老同事提了以下的职场建议：\n\n1. “I got my first career advice from my mom: You’ll always find interesting things in your work. “\n2. Invest in yourself. Invest time in self study. Read about your craft. Go deep. \n3. Advocate for yourself. Discuss your interests and goals with your manager, and seek guidance from them. Don’t conflate career guidance and promotion. Focus on your work and promotions will come.\n4. Be patient with your career. It’s a 40-year journey.\n5. Avoid the temptation to engineer your career. Don’t think your resume as a portfolio of skills. （这条非常神奇，Paul也说这条可能会引起争议。但他认为往某个方向深钻比遍历多领域更有益。）\n6. Attach yourself to an organization that’s growing.","d":"2020.08.01","y":2020,"mo":8,"l":37,"c":4},{"i":"4525349335026995","t":"工作的快乐有两种：\n1⃣️ 被 Launch Annoucement 感谢\n2⃣️ 写Launch Announcement 并发给所有人\n\n这背后所有的苦都值得。","d":"2020.07.11","y":2020,"mo":7,"l":31,"c":1},{"i":"4520285191495350","t":"是年纪的笔 不知不觉改写自己","d":"2020.06.27","y":2020,"mo":6,"l":9},{"i":"4512735998488581","t":"“黑人工人遭受着一些经济学家所说的“最先被解雇，最后被雇佣”现象：他们早早失去工作，但即使白人工人的劳动力市场开始好转，他们的失业率仍在继续上升。这可能会产生持久的影响，因为处于劳动力市场边缘的工人会发现自己的技能已经过时，这将使他们更难回到体面的受薪工作中。\n\n在所有这些因素之上，弗洛伊德之死是另一个毁灭性的打击。“先是健康方面面临威胁，然后是经济差异……在那之上又有着一种面对政府时的无力感，”马萨诸塞州大学(University of Massachusetts)经济学助理教授达尼亚·弗朗西斯(Dania Francis)对《金融时报》表示，“结构性的不平等导致了我们今天看到的许多差距，任何不解决这些问题的方案都不会成功。”\n\n深度 | 美国非裔落后是因为不思进取吗？","d":"2020.06.06","y":2020,"mo":6,"l":18,"c":2},{"i":"4496974562453492","t":"#世界读书日# \n\n欢迎加入书群 2020 Book Club!\n书群书单持续更新，目前的分享包括：\n\n1. @邓大双眼：The Man Who Solved The Market\n2. @染fightonthatlight Educated （@萝博特, @ccexcc 也在读）\n3. @三亩沙拉：Hillbilly Elegy\n4. @三亩沙拉：西方文学十五讲\n5. @unanaranjaaa: 植物智能的认识史\n6. @用户7383239972: 当下的启蒙\n7. @擦掉起跑线：Doormen\n8. @Muse时光流逝：The Unconsoled\n9. @missaero: Bad Blood\n10. @_渡渡鸟：钱：7步创造终身收入\n11. @辉辉烟：Flipped 怦然心动\n12. @ccexcc：The Subtle Art of Not Giving a Fuck\n13. @ccexcc: 送你一颗子弹\n14. @把闹钟给我关了：人类简史\n15. @镀边麻油鸡：冬泳（@橙子不要圆滚滚 也在读）\n16. @duree: Blitzscaling\n17. @啵啵啵bo儿：论自由\n18. @TravelingHeavy: 最好的告别：关于衰老和死亡，你必须知道的常识\n19. @小清新失败背后的金主：深度工作\n20. @小清新失败背后的金主：黑箱\n21. @小清新失败背后的金主：末世之城\n22. @缓缓地熊：当代西方国际关系理论\n23. @duree: When Breath Becomes Air\n24. @染fightonthatlight: Never Split the Difference\n25. @_渡渡鸟：The Clean Coder\n26. @TravelingHeavy: 最好的告别\n27. @TravelingHeavy: 白天的房子，夜晚的房子\n28. @JUST-DO-FORE-U: Atomic Habits\n29. @胡荣婷ERIN: 全球科技通史\n30. @duree: The Startup of You\n31. @缓缓地熊：往事与随想\n32. @alahohahi: 向加泰罗尼亚致敬\n33. @JUST-DO-FORE-U: Rage of Angels\n34. @一哥斯达黎加量天尺：追寻记忆的痕迹\n35. @你的爱亲：阁楼上的疯女人\n36. @蜗牛掉坑里了：改变中国：洛克菲勒基金会在华百年\n37. @et_chako: 追寻记忆的痕迹\n38. @et_chako: 模糊性的道德\n39. @duree: Gmorning, Gnight!\n40. @_Ikari_Shinjin_2020: 当下的启蒙\n41. @低碳少女糖果妹：人生的智慧\n42. @一哥斯达黎加量天尺：红豆生南国\n43. @邓大双眼：过度饮食心理学\n44. @ccexcc: 我的孤独是一座花园\n45. @ccexcc: 摇摇晃晃的人间\n46. @Muse时光流逝：Digital Minimalism: Choosing a Focused Life in a Noisy World 群聊","d":"2020.04.23","y":2020,"mo":4,"l":15,"c":1},{"i":"4494979907036232","t":"我这个星期通过@LinkedIn领英 的职场人时间捐赠计划跟两个学生聊了两小时。大家别气馁，目前形势艰难，但我们能挺过去，要往长远看。\n\n给他们都发了follow-up信息：\n1⃣️ 不必浪费时间在排版不同的简历，上creddle.io这样简单的排版工具自动化这个流程\n2⃣️ 在G-Doc上细节地写自己所有的经历，给经历都打上标签，再根据投递职位，选择最相关的内容誊写到简历上\n3⃣️ 这个直播讲了简历如何SEO：网页链接\n4⃣️ 如果2020年暑假实习难找，花时间重做一遍学校里的项目，加深难度（比如自己爬取和清理数据，不满足于ggplot而是做更多visualization的尝试），把学过的知识内化，再把项目整理成portfolio website（比如朋友的这个例子：网页链接）。尤其对数据分析的基础岗位来说，这样的努力也很能体现能力。","d":"2020.04.18","y":2020,"mo":4,"l":102,"c":14},{"i":"4493200494904150","t":"“Advertisements themselves are now instantaneously placed in browsers based on customer data.  So the application of the 4Ps today requires more constant experimentation and dynamic decisions (not to mention algorithms, data scientists, econometricians, and big data experts), instead of the well-thought-out and stable policies that are recommended by extensive market research. As a result, IT must play an increasingly important role in marketing, and the importance of the person who looks at marketing from the technology lens must have increased over time. On the flip side, a marketing person who doesn’t understand technology must find it difficult to keep his or her job. One could even argue that marketing is getting merged into the IT function or outsourced to companies such as Google Marketing Platform.”\n\n网页链接","d":"2020.04.13","y":2020,"mo":4,"l":2},{"i":"4488713059067154","t":"周二下午，WFH的第四周。Hopefully I continue to be busy 😂","d":"2020.04.01","y":2020,"mo":4,"c":3},{"i":"4483053969813515","t":"There are two things we’re allowed to do when following the CDC’s advice to stay at home: reading the news about COVID-19 and feeling overwhelmed by the increasing case numbers. \n\n今天是我们离开纽约后住在宾州的第11天。\n\n离开的时候我们两个人只带了我一个红色的20寸箱子。我们周末会出去爬山，就直接穿了登山鞋，箱子里放了各自的抓绒睡衣和换洗内衣裤。乡下家里网不好，开视频会议我打不开摄像头，所以非常放心地没有带更多“成年人”需要穿的衣服。\n\n也就是今天，我才有一种要打持久战的觉悟。四月会不会好转？可能要到五月？辗转难眠。每天都好像比之前更糟糕一点。:(","d":"2020.03.16","y":2020,"mo":3,"l":11,"c":4},{"i":"4483009829386198","t":"用数据来更好的了解纽约市旅游的现状和发展方向，并且对未来的旅游规划提供有建设性的意见，是Jonathan的重要工作内容。他分享了关于华人旅行的一点小发现。近几年来，来纽约市旅行的中国人和前几年有了很大的变化：传统参团旅行越来越少，取而代之的是20、30岁的年轻人，他们更喜欢体验纽约文化，像本地人一样生活的旅行方式。\n\n@她数据纽约沙龙 二月线下沙龙：为什么数据科学家和你想得并不一样？","d":"2020.03.16","y":2020,"mo":3,"l":5,"c":1},{"i":"4481245494714300","t":"早知道有今天，我管他批评不批评我，老子到处说！","d":"2020.03.11","y":2020,"mo":3,"l":9},{"i":"4481183914579055","t":"『《人物》被删文：发哨子的人 - Matters』网页链接","d":"2020.03.11","y":2020,"mo":3,"l":9,"c":2},{"i":"4481183813616457","t":"『李文亮所在医院为何医护人员伤亡惨重？』李文亮所在医院为何医护人员伤亡惨重？","d":"2020.03.11","y":2020,"mo":3,"l":2},{"i":"4480882147042599","t":"实例教学：如何一步一步建立AI机器人","d":"2020.03.10","y":2020,"mo":3,"l":2},{"i":"4480474347067166","t":"美国外卖平台混战：DoorDash是最终赢家吗？","d":"2020.03.09","y":2020,"mo":3,"l":3},{"i":"4478589380791407","t":"办公室禁止握手，只能fist bump。刚忘记了，两个人握完手同时去拿桌上的Purell. 太科幻了。","d":"2020.03.04","y":2020,"mo":3,"l":9,"c":1},{"i":"4476339703228477","t":"取消第三方cookie, 谷歌将彻底改变数字营销","d":"2020.02.26","y":2020,"mo":2,"l":8},{"i":"4467153288102365","t":"武汉医生李文亮率先披露不明肺炎有关情况，受到单位约谈、警方训诫。他说，让大家知道真相比自己平反更重要。一个健康的社会不应该只有一种声音。今天，他确诊了。\n\n新冠肺炎“吹哨人”李文亮：真相比平反更重要","d":"2020.02.01","y":2020,"mo":2,"l":64,"c":1},{"i":"4467137743808607","t":"我分享了文章 为什么不该用双黄连预防新型冠状病毒？","d":"2020.02.01","y":2020,"mo":2,"l":3},{"i":"4466580811459634","t":"新工作两周感慨太多了。\n\n1⃣️ “Feel free to own it!” 以前是在夹缝中求生，求take initiative and take control而不得。现在是fly solo的autonomy.\n2⃣️ “You’re driving your own growth here.” 在这里的晋升和成长不是爬一个visible梯子，而是要更了解自己，更了解业务，然后去开发路径。","d":"2020.01.30","y":2020,"mo":1,"l":27,"c":3},{"i":"4463481463841112","t":"“自我认知的深度和广度远远超越测试所能给出的结果。天赋优势也许决定了你的出厂设置，但是你的知识技能、兴趣爱好是可以通过学习和阅历不断拓展的，而价值观和使命感更是被境遇和个人选择所塑造。所以，自我认知是一个动态的发现和创造的过程，在这个过程中，理想职业的模样也在随之演变。”\n\n测了那么多，为啥还是找不到理想职业？","d":"2020.01.22","y":2020,"mo":1,"l":14},{"i":"4461841160011867","t":"某厂面试最著名的有两点：1⃣️所有问题都围绕公司价值观，2⃣️所有问题都是大的情境题。他们不通过“你是否做过x”来考察你的经验，而是一系列tell me about a time的宽泛问题，了解你面对问题找解法的能力和思路。\n\n这六个小时的面试车轮战还有一个秘而不宣的twist。当你以为自己已经用显微镜检视过职业生涯，并给出所有必要的细节之后，他们马上会追问一句：Knowing what you know now, what would you do differently?\n\n于是你重新被扔回故事里的挣扎节点，再去思考分岔路口有哪些可能性。太难了，但这个过程真的能帮你找到工作的新角度。😂","d":"2020.01.17","y":2020,"mo":1,"l":15,"c":6},{"i":"4461822545103528","t":"分享我的故事","d":"2020.01.17","y":2020,"mo":1,"l":6},{"i":"4461714210981078","t":"这是我毕业后时间最长的一份工作，干了二十二个月。晚上送别酒喝了很多，在车上想到这些。\n\n如果你全情投入，会发现本职工作在任务以外所要解决的更大的问题，以及这个问题对于公司来说又意味着什么。有了这样的意识，你能逐渐掌握主动性，调整思路——原本是用某种技能来做某件工作，变成扩展为学习技能、调动资源来解决一个甚至一类问题。这样你也会觉得更能伸展拳脚，有更多事可做，生意太有趣了。","d":"2020.01.17","y":2020,"mo":1,"l":44},{"i":"4460579760357100","t":"CES科技大展总结：2020什么值得期待？","d":"2020.01.14","y":2020,"mo":1,"l":2},{"i":"4457700961946640","t":"2020年刚开始我就已经在Everlane, Anthropologie, Madewell买了总共二十六样东西。这个周末收拾衣柜，家里井喷式爆满，很多衣服想不起来也找不着。\n\n立两个新年愿望：1⃣️剩下的361天不再买任何衣服鞋子和饰品；2⃣️每天都穿不一样的衣服，如果不再合适不再喜欢就处理掉，不继续占用空间。\n\n等12/31再来看这一条。","d":"2020.01.06","y":2020,"mo":1,"l":29,"c":19},{"i":"4447704673217029","t":"🎬 Marriage Story: Grow into marriage and develop a life together. You’re building up each other, and bend yourself to integrate with the other person. The first 20 or 30 years of experience without the other person that made you love them would fade away, and your new family life will cover them like a growth ring. You might wake up one day and find yourself voiceless, and the process of picking up your individuality means to deconstruct the relationship that you used to carefully maintain. You’ll fight ugly fights with beautiful people. Love is not going to save you from each other. The process will be a painful rebirth.","d":"2019.12.09","y":2019,"mo":12,"l":13,"c":2},{"i":"4445378763613296","t":"The Good Place超好看！","d":"2019.12.03","y":2019,"mo":12,"l":6,"c":5},{"i":"4441728402881097","t":"土师在这儿@linsantu_","d":"2019.11.23","y":2019,"mo":11,"c":2},{"i":"4438493860666076","t":"@她数据纽约沙龙 十月在哥大：找到属于你的那条独一无二的Career Path","d":"2019.11.14","y":2019,"mo":11,"l":5},{"i":"4438415674448948","t":"无线耳机刻字建议：No strings attached","d":"2019.11.14","y":2019,"mo":11,"l":26,"c":4},{"i":"4435815402654978","t":"一点出门吃饭没带围巾，缩着脖子往北走。太阳正晒在背上，特别暖。","d":"2019.11.07","y":2019,"mo":11,"l":2,"c":1},{"i":"4434821914524387","t":"真正的人生成就，属于极致的沉醉者。在更广阔的世界中，在更长久的人生里，最终是对一件事极致的敏感和热情，才能让一个人摸索出攀登的道路。郝景芳：我真正遇到过的人生困难","d":"2019.11.04","y":2019,"mo":11,"l":15,"c":1},{"i":"4434814893797703","t":"Let everything happen to you: beauty and terror.\nJust keep going. No feeling is final.","d":"2019.11.04","y":2019,"mo":11,"l":21,"c":1},{"i":"4429579034707319","t":"哈哈原来你没有写毕业典礼上和拜登的过节！@清门庶子 『第115章 费城的风（中） - 清门庶子 | 豆瓣阅读』网页链接","d":"2019.10.20","y":2019,"mo":10,"c":3},{"i":"4428326368146856","t":"@她数据纽约沙龙 九月活动回顾：\n\n“如何向非技术人员解释技术相关的分析项目？”\n\n“Chaoyun和Michelle都认为最重要的是沟通清楚业务人员的目标，再一步步倒推。同时要了解业务人员的背景，用他们懂得的业务语言交流，可以达到更好的效果。\n\n而Ariel通常会通过讲故事的方法来帮助业务人员增加对项目的理解。\n\n毕业以后，我们一开始从事的工作可能跟专业对口，也可能有所出入。通过这次活动也能感受到，好多人干着干着就会对职业有新的发现和思考。在今天，更多职场人开始看重自身发展与个性需求。我们需要在职业道路上不断尝试，和他人接触、交流，从而慢慢发现更适合自己的道路。”\n\n网页链接","d":"2019.10.17","y":2019,"mo":10,"l":3},{"i":"4427056638904421","t":"川普用仇恨来煽动和分化人群，我们不能让他得逞。","d":"2019.10.13","y":2019,"mo":10,"l":19,"c":1},{"i":"4426656326308504","t":"梦见我小时候跟的手风琴老师要退休，把一代一代的学生都叫回去。大家一人提一台琴，一起拉《多瑙河之波》和《蓝色多瑙河》，和七岁的时候一样。\n\n还梦见去看戏，很小的舞台和一个不寻常的修道院场馆。看了一遍，隔几天做梦又看了一遍。\n\n也就是在梦里能重历回忆。","d":"2019.10.12","y":2019,"mo":10,"l":5,"c":1},{"i":"4425371691103575","t":"“Just take the credit 👧!”","d":"2019.10.09","y":2019,"mo":10,"l":4},{"i":"4425060016573168","t":"今天我在办公室哭了，第一次哭。而且哭的场合是最糟糕的，是和CMO开会的时候。\n\n我的分析文档有许多地方还要大改，对方语气平和，提出的每条建议合情合理，也认可我付出的努力。但我一边写笔记，一边眼泪就大滴大滴地掉下来。\n\n眼泪让我自己非常吃惊、尴尬，但停不下来。我老板，CMO和VP三个人也开始有点难堪。我们继续开完了会，VP给我拿了一张纸巾，CMO让我在他办公室里坐一下，感觉好一点再出去。我去厕所里哭了十五分钟。上午后来的两个视频会议我都关了摄像头，因为眼睛完全红着。\n\n这一份文档我花了很多个周末加班来做，CMO也改得非常细。七页白纸黑字交上去，几个小时内他细细密密的红色批注就返回来。我很感激这样的intense iteration，是成长机会，我不仅理智上认真对待，情感上也care deeply. 这是我一直想要解决的问题，做梦都想。\n\n哭让我感觉非常内疚，这是大忌。大家更把我当小孩子了。情绪化，不专业。我回来给mentor打电话。\n\n她给了很多特别好的建议：\n1、不必为哭泣道歉，但要给当事人一个解释，不能假装什么都没有发生。她建议能当面说的当面说，不能当面说的（比如我觉得我要再跟CMO当面解释我为什么会哭可能又要哭）写封短邮件。\n2、坦诚地告诉他们你也觉得眼泪很意外，同时说明他们你是真的对工作全心投入，and your passion came out unexpectedly. \n3. 落实这段解释到工作的实处，告诉他会议里的记录依然会落实，该改的部分会改。\n4. 既然哭泣这件事已经发生，考虑接下来怎么应对更重要。在家里可以把办公室抹眼泪还没哭完的部分哭完，ugly cry，宣泄出来。然后成熟地acknowledge 这件事，向当事人解释，之后move on继续靠谱地做事。","d":"2019.10.08","y":2019,"mo":10,"l":8,"c":5},{"i":"4423758989174766","t":"Carolyn，美国Facebook总部全球产品营销总监（Head of Global Product Marketing）。负责Facebook核心的广告测量产品的产品营销，这些Facebook的广告产品包括：品牌提升（Brand Lift）、转化提升（Conversion Lift）、归因（Attribution）、A/B测试（Split Testing）等。Carolyn带领产品经理们制定产品线路图、定义产品上市战略、优化商业影响与用户满意度，曾成功在全球上线推出Facebook Attribution（Facebook的广告归因产品）。\n\n全球第一门来自Facebook硅谷华人高管的产品营销课程!","d":"2019.10.04","y":2019,"mo":10,"l":4},{"i":"4423100906830721","t":"会议纪实：我便涨红了脸，额上的青筋条条绽出，争辩道，“Directionally speaking, Variation A is outperforming the control”接连便是难懂的话，什么“confidence interval”，什么“approaching significance”之类，引得众人都哄笑起来：会议室内外充满了快活的空气。","d":"2019.10.03","y":2019,"mo":10,"l":44,"c":4},{"i":"4421420958151230","t":"@她数据纽约沙龙 \n\nYixin认为持续学习需要与大量的练习相辅相成，不能只输入而没有输出。数据科学的工作不只是关于算法，而是如何把算法应用在解决商业问题上，参加Kaggle之类的比赛是一个很好的实战方式。\n\nShisi表示，作为一位数据分析师，如果想在职业道路上有进一步发展，那就不能只专注于自己份内的数据工作，还需要像项目负责人一样主动组织，并且像销售人员一样和意见不同者推销自己的想法。而对于初入职场的人来说，Shisi认为尽管他们不一定完整地知道推进一项工作的全貌，但是至少需要拥有解决问题的直觉想法，有时候你会惊讶于自己有多接近真实答案。\n\n纽约最适合聊金融","d":"2019.09.28","y":2019,"mo":9,"l":10,"c":1},{"i":"4418512678427805","t":"我在IG云养了20多只法斗，今天去IG纽约办公室蹭饭，一进门就被精准投放了一只法斗。开心了！","d":"2019.09.20","y":2019,"mo":9,"l":10},{"i":"4418181831427581","t":"@她数据纽约沙龙 九月活动：网页链接\n\n三位嘉宾：IBM的Chief Analytics Office高级战略咨询师；大数据分析平台1010Data的增长、战略和执行部门负责人；共享健身房领域独角兽企业Gympass的营销分析总监","d":"2019.09.19","y":2019,"mo":9,"l":1},{"i":"4408024342665972","t":"“产品分析，在沃尔玛和亚马逊的激烈争夺中发挥了不可或缺的作用，并且帮助沃尔玛电商在短时间内实现了40%的强劲增长。沃尔玛和亚马逊的争夺战一度被写进哈佛商业评论和案例。这一位在沃尔玛电商担任产品经理的课程老师将带给你最一手的实战经验以及电商领域的产品思维！”沃尔玛产品分析课上线了，你也来上吗？","d":"2019.08.22","y":2019,"mo":8,"l":6,"c":2},{"i":"4407666560809960","t":"CFA放榜，正好来参加@她数据纽约沙龙 八月的FinTech沙龙吧：网页链接","d":"2019.08.21","y":2019,"mo":8},{"i":"4407077742941644","t":"@她数据纽约沙龙 的波士顿分舵本周二有活动：「她数据」8/20波士顿线下职场沙龙：勇于领导","d":"2019.08.19","y":2019,"mo":8},{"i":"4406781058939463","t":"一个常见的怀疑：FB/谷歌/亚马逊是不是在偷听我和我朋友说话？不然为什么我们刚刚才说到XX它马上就推XX广告给我？其实这是recommendation system（推荐系统）的一个常见优化手段：collaborative filtering。\n\n你朋友近期可能上网大量看过搜过XX，而且因为他们这么做了，所以可能他们也会跟你说起XX。话音刚落广告就来，真是神奇的巧合。\n\n网页链接","d":"2019.08.18","y":2019,"mo":8,"l":14,"c":3},{"i":"4406621750789651","t":"Repost @麻婆豆腐锅 ：言論自由不等於濫用hate speech：网页链接","d":"2019.08.18","y":2019,"mo":8,"l":6,"c":4},{"i":"4406212134901361","t":"「人與人的關係，尤其男人和女人的關係，怎麼說，都是更整體上的問題。更曖昧、更任性、更悲切的事情。」村上春樹","d":"2019.08.17","y":2019,"mo":8,"l":4},{"i":"4406211716170798","t":"「世界上的酒徒可以大致分為兩類。一種是為了替自己添加什麼而不得不喝酒的人，另一種是為了替自己去除什麼而非喝酒不可的人。」村上春樹","d":"2019.08.17","y":2019,"mo":8,"l":8},{"i":"4406211224894804","t":"「不過無論是彼此應該多麽了解的對象，多麼相愛的對象，要完全窺見別人的內心，終究是不可能的事。去追求這種事，唯有自己難過而已。不過那如果是自己的內心的話，只要努力，應該就能確實窺見努力多少的份。因此，結果我們不能不做的，大概是和自己的心巧妙地誠實相處吧。如果希望真正看清別人，只能深深地筆直凝視自己的內心。」村上春樹","d":"2019.08.17","y":2019,"mo":8,"l":135,"c":4},{"i":"4406046351419244","t":"广告科技专项课（美国增长营销核心技能）系列不仅囊括了最重要的广告投放技术（Facebook社交广告、Google搜索竞价广告、Amazon广告），还抽丝剥茧地介绍了程序化广告购买、动态创意优化解决方案、联网电视（Connected TV）等前沿技术。此外，二期还新增了移动增长营销，教你玩转Google UAC、优化APP商城、制定高效的多平台移动APP营销战役，提高留存与活跃！\n\n快来点亮你的2019「广告科技」技能树！","d":"2019.08.16","y":2019,"mo":8,"l":3},{"i":"4402241144182244","t":"@她数据纽约沙龙 \n\nLiron在Bloomberg Tradebook工作的17年间，换了4次CEO，每一个CEO都认为Marketing部门没有存在的必要（部分原因是Bloomberg是非常销售导向的公司）。他作为CMO，4次站在整个部门的生死边缘，向CEO说服Marketing的重要性。现在他作为founder，把这种坚持和毅力也带入到了他的团队。“这周失败了下周就继续坚持，keep persistent”，这样才能把事做成。\n\nFei提到了成功的公司有很多种存在的形式，不要把投资人的一面之词当作圣经。现在越来越多年轻一代的创业者都越来越遵循自己内心的价值和意义感，创业的驱动力变得越来越多元，并非只有对金钱的极度渴望者才能成功，也远远不止一种成功。一个人怎么做自己的公司代表了她/他想和世界发生关系的方式。可能很多老一代创业者和投资人无法理解，但年轻人创业确实越来越从心了。\n\nLenore坦言自己的公司的商业模式与传统的代理商不同，因此并非是客户最习惯的模式。虽然这为她的公司带来了挑战，但是这是她希望做的方式，是她之所以创立自己公司的初心，所以她不会改变。\n\n网页链接","d":"2019.08.06","y":2019,"mo":8,"l":10},{"i":"4401896477716917","t":"【更正|编辑重发】\n\n哈佛大学肯尼迪政治学院下属Joan Shorenstein媒体、政治和公共政策中心对媒体在操作有关滥杀凶手和极右/白人至上恐怖主义的报道提供了十条建议：\n\n1. Be aware that journalists play a role in helping white supremacists and right-wing extremists spread their message. 从业者要充分意识到媒体的影响力和渠道会扩散极端分子的错误言论。\n\n2. Investigate the funding sources of white supremacy and right-wing extremist groups. 新闻应该追踪和调查这些极端分子的资金来源。\n\n3. Don’t portray race-based extremism — or racism in U.S. politics — as new developments. They’ve been around for many decades. 基于种族主义的恐怖主义不是新事，它已经存在了很久。去真正分析这种举动/行为的历史和文化脉络，而不是每次都惊叫“这是从未有过的劣行…”。\n\n4. Avoid letting white supremacists use their own terms to describe themselves. Call them what they are: white supremacists. 避免使用极端分子自定义的标签（不要被他们的话术迷惑，或者继续让他们的话术去迷惑更多人），直呼他们白人至上主义者。\n\n5. Consider taking a stance of “strategic silence.” 不要采访和引用极端主义者，不要去试图了解和解释他们的行为和动机。\n\n6. Record your interactions with these sources. 极端主义者希望利用和抹黑新闻机构。如果记者需要跟他们打交道（采访、调查等），记录（录音录像）每一次打交道作为上下文，并用这些信息来作为驳斥和回应。\n\n7. If you must cover the statements of far-right extremists, always paraphrase. 如果你不得不报道这些极端分子的声明，一定要用自己的话来复述，而非使用他们的原句。因为他们的原句和原话中可能充满暗语和陷阱，你的报道可能会被利用。\n\n8. Investigate the role technology plays in amplifying racist messages. Don’t link directly to white supremacist websites and content in your news articles. 当你在研究极端分子所使用的科技/互联网工具时，不要直接链到他们网站。从社会影响的角度，你的文章可能帮潜在极端分子“找到组织”；从技术的角度，你的链接提高了这个网站的搜索引擎排名（有影响力的媒体网站链接到其他站点会提高该站点的权威度，因而搜索引擎算法会优化其搜索结果显示）。\n\n9. Familiarize yourself with the efforts of organizations that advocate on behalf of racial and religious minorities. 充分关注代表少数族裔和少数宗教信仰的组织，了解和报道他们是如何应对种族主义威胁。相关机构比如Color of Change, MediaJustice, Muslim Advocates.\n\n10. Understand that white supremacists who perpetrate violence want notoriety. Don’t give it to them. 不要给极端分子所渴望的名声，不要给自白书链接，不要给他们力量让他们策反更多人。\n\n全文链接中有更多细节：网页链接","d":"2019.08.05","y":2019,"mo":8,"l":153,"c":5},{"i":"4401889132905776","t":"哈佛大学肯尼迪政治学院下属Joan Shorenstein媒体、政治和公共政策中心对媒体在操作有关滥杀凶手和极右/白人至上恐怖主义的报道提供了十条建议：\n\n1. Be aware that journalists play a role in helping white supremacists and right-wing extremists spread their message. 从业者要充分意 7,"l":44,"c":1},{"i":"4394814067796839","t":"“我们渐渐被亚马逊生态全方位包裹，直到有一天我们发现我们再也离不开它。Apple做过同样的事，让我们持续购买——iPhone、Mac Book、Apple Watch、Air Pods。有很多想要转去使用谷歌手机Pixel phone的人都发现，自己已经很难离开苹果家族去使用其他品牌的产品了。”亚马逊Prime Day背后的增长逻辑","d":"2019.07.16","y":2019,"mo":7,"l":14},{"i":"4393552056620421","t":"和三番的朋友回忆起我2016年一个人独自生活在南湾的苦闷经历。我们俩都是南湾郊区生活受害者，苦闷到长胖。离开南湾（她回三番，我回纽约），才又疏朗地做回自己。\n\n她说南湾的朋友还会跟她抱怨“三番有什么好的？都是流浪汉。”\n她有一次终于怼回去：南湾才都是homeless，是mental homless。","d":"2019.07.13","y":2019,"mo":7,"l":15,"c":3},{"i":"4393443394070572","t":"@反吃瓜联盟 好文章：今天你被1044了吗？\n\n“分明没有增加一张绿卡额度，却能够激起众多国家移民群众内斗。玩零和游戏的明明是提案者，中国和印度移民却炒作一团互相指责。如果真是为了移民好，为什么不直接增加发放的绿卡数量（BELIEVE Act），却搞这种拆东墙补西墙的数字游戏呢？现有印度公民绿卡申请的积压，就意味着任何移民法案只有把池子做大才有可能惠及中国池鱼，倘若只抱着死道友不死贫道的心态，希望别的族群牺牲自己的利益给你做分母，这种心态和愿景永远也只能停留在朋友圈的键盘侠。”\n\n“如果想要反对这个法案，最合适的方法是直接联系你选区的议员，给他们发传真、写信、打电话；在美国社交网络上发表你的意见，而非跑去什么政府网站请愿。”\n\n“至于在中文社区里yy呼叫要和‘美国红脖统一战线’、从而总结出要’支持总统川普‘的奇葩言论，恭喜你，今天又被1044了。”","d":"2019.07.13","y":2019,"mo":7,"l":9,"c":2},{"i":"4392984663255776","t":"理想与现实：新人数据分析师的重要一课 先站稳","d":"2019.07.11","y":2019,"mo":7,"l":3},{"i":"4387408390632521","t":"文章开头的例子就是我的真人真事：如何用数据来争取广告预算话语权？","d":"2019.06.26","y":2019,"mo":6,"l":4},{"i":"4386655890401834","t":"Brave浏览器，超喜欢。","d":"2019.06.24","y":2019,"mo":6,"c":1},{"i":"4385059463717664","t":"“我们还可以在不同的地域做同样的测试，即先做广告，再撤掉，同时监测用户注册率的变化。因为我们不可能在测试中达成完全的变量控制（变量控制指的是，除了“是否投放户外广告”这个变量在两组间不同外，不能有其他因素在两组间不同。实际中当然是不可能的，不同的地域在很多维度上都不同），所以在多个地域重复做相同的测试可以一定程度地起到排除混淆因素的作用（因为当实验的地域足够多，混淆因素本身就被随机化了）。通过这样的方法，或是以此为基础的更为复杂的方法，我们可以有效提高准实验方法的准确率。”\n\n当A/B测试不可行时，网飞居然用了这种方法！","d":"2019.06.20","y":2019,"mo":6,"l":6},{"i":"4384454703301972","t":"有哪些领导力原则？\n\nElin觉得在leadership中有三个原则，其中有一些是她以前很欣赏的老板给她的启发。首先，一个领导者需要有self-awareness，明确的自我认知是最大的驱动力。第二，people first，人永远是第一位的。第三，Being humble，being hungry。学习是始终不能缺席的，要从身边的人身上学习，并且要不断学习行业最新的变化。\n\nMarissa提出了两个原则。第一，humanity，关注人性本身。非常具有人文关怀的一条原则，因为她认为没有人是完美的。第二，是impact on others，领导者自带的影响力。想要让团队的人一起往一个方向走，就需要领导者真正可以用自己的行为影响到他人，给员工展示出来how we can get there。\n\n为什么职场新人也需要培养职场影响力？","d":"2019.06.18","y":2019,"mo":6,"l":16,"c":1},{"i":"4384265745210863","t":"“不管你有多想拓宽知识面，你还是需要不断改进你本职工作的水平。那些你反反复复需要做的事情，你有没有把它做得效率越来越高、结果做得越来越好？如果你一直在原地踏步，第一次做和第十次做都做得差不多，那很可能你是需要改变工作理念的。”\n\n职场里的四种人","d":"2019.06.17","y":2019,"mo":6,"l":13,"c":3},{"i":"4381925185369292","t":"黑镜第五季第二集实在是太好看了。","d":"2019.06.11","y":2019,"mo":6,"l":3,"c":3},{"i":"4380485377625994","t":"推荐一波我讲的课：Programmatic 201 (Beyond Campaign Management) 亚马逊收购Sizmek：广告生意越做越大，但越做越好了吗？","d":"2019.06.07","y":2019,"mo":6,"l":4},{"i":"4380273669673498","t":"我们公司把创意和媒介搬到in-house的故事上Digiday了。我去年年初入职就是加入这场运动，在25年历史的常青品牌建立数字营销这个小“创业团队”，将最好的视觉内容推广到全世界。\n\n网页链接","d":"2019.06.06","y":2019,"mo":6,"l":2,"c":2},{"i":"4380123317341444","t":"“营销分析职业远远超越了点击量和转化率。这是混合着数据可视化、算法、编程、内部咨询等等的综合性工作。这种多样性就是我在工作中最享受的部分。对我来说，很少有一模一样的两周。”\n\n网页链接","d":"2019.06.06","y":2019,"mo":6,"l":4},{"i":"4378922127066900","t":"“I embrace the label of bad feminist because I am human. I am messy. I’m not trying to be an example. I am not trying to be perfect. I am not trying to say I have all the answers. I am not trying to say I’m right. I am just trying—trying to support what I believe in, trying to do some good in this world, trying to make some noise with my writing while also being myself.” -Roxane Gay","d":"2019.06.03","y":2019,"mo":6,"l":419,"c":7},{"i":"4378532115246053","t":"我只想吹爆这门课！多少次聊到incrementality test，多少次聊到ghost ads，如果我能早点听到这门课，整个实验设计都会大不一样。太好太好太好了。如何用增量模型选取目标用户？","d":"2019.06.02","y":2019,"mo":6,"l":12},{"i":"4377736044752053","t":"如何用增量模型选取目标用户？","d":"2019.05.30","y":2019,"mo":5,"l":2},{"i":"4369607144491893","t":"时隔一年，再次和36氪录了播客，聊Facebook：S3E10 麻烦不断的Facebook，为什么财报表现还不错？","d":"2019.05.08","y":2019,"mo":5,"l":22,"c":4},{"i":"4368464824946388","t":"鲁迅：愿中国青年都摆脱冷气，只是向上走，不必听自暴自弃者流的话。能做事的做事，能发声的发声。有一分热，发一分光，就令萤火一般，也可以在黑暗里发一点光，不必等候炬火。此后如竟没有炬火：我便是唯一的光。","d":"2019.05.05","y":2019,"mo":5,"l":48},{"i":"4366707487049015","t":"逐梦与探寻：康泰纳仕与Daily Harvest分析总裁做客“她数据”","d":"2019.04.30","y":2019,"mo":4},{"i":"4364894872588377","t":"“增长说到底是全公司的努力，但那份努力的质量来自于创始人的心理和认知。通过每天1000个小的举动，创始人可以最终把这份心理带给他们的整个团队。”初创公司必须学会的5条增长心理学","d":"2019.04.25","y":2019,"mo":4,"l":3},{"i":"4364696683924501","t":"网页链接","d":"2019.04.24","y":2019,"mo":4},{"i":"4362746859954504","t":"哥大没有一门课能教我怎么做Google Ads","d":"2019.04.19","y":2019,"mo":4,"l":5},{"i":"4362215156811271","t":"从代理商到品牌主 | 我的职场日记","d":"2019.04.17","y":2019,"mo":4,"l":8},{"i":"4361118854013993","t":"莫须有之罪：给视觉中国这破鼓敲敲鸣冤鼓 - 来自知乎专栏「急救室」，作者:可可苏玛， 网页链接","d":"2019.04.14","y":2019,"mo":4,"l":2},{"i":"4360569408424359","t":"VCG的生意是根据客户的需求定制/授予自己代理的版权内容使用的许可。不要被自媒体阴谋论带着走，说什么它们是境外公司的hitman，这他妈真的是神经病。他们真的是想借此机会扣VCG一个屎盆子以后继续盗图不付任何代价。而你，作为读者、内容消费者，你是要为了现在吃瓜乱转发而付出代价的。","d":"2019.04.13","y":2019,"mo":4,"l":1,"c":1},{"i":"4360209046040435","t":"我一开始觉得自媒体反应激烈因为大家用免费的图用惯了，一旦被维权反而还像是受了委屈。事实上新闻图片版权有界定（国界、发表的方式等），广告的素材图也是有界定。认真讨论版权的话，自媒体是很难这么逍遥的，内容生产成本会变高。\n媒体或者广告等商用图片在创作时需要使用合法合规可被授权的内容，并且在这个取得授权的过程应该是容易并且高效的——在大部分时候，大家都没办法直接联系创作者。因此，找与创作者合作的版权代理机构拿一份授权，或者在视觉中国这样的机构搜索能被授权和合理使用的内容是绝对必要的。\n如果没有这个一开始的授权（rights clearing），那么接下来不被发现是侥幸，被发现就是教训。\n谴责视觉中国可能会让世道变得更糟。","d":"2019.04.12","y":2019,"mo":4,"l":6,"c":7},{"i":"4360019085888812","t":"因为视觉中国将黑洞图片打上“版权所有”的事，挺多人来问我图片版权的事情（和新闻本身毫无关系）。其实我的工作内容不涉及这一块，我的版权知识也是入职培训时学到的。但我觉得分享这一点点知识版权101笔记，能帮助自媒体/媒体朋友厘清基本认知。\n\n1. 不是所有的网上的图片/视频都是公共版权（你在谷歌百度或者任何地方搜到的看到的），你在大部分情况下都需要许可才能使用。\n2. 即便图片/视频本身没有版权标志，也不代表你不需要许可就能使用。\n3. 即便你不以盈利为目的使用这张图片/视频，你也需要许可才能使用。\n4.即便你调整/修改了图片的某些部分，你也需要许可才能使用。\n5.即便你没有使用完整的图片/视频，你也需要许可才能使用。\n6. 并不是说侵权之后删除就可以避免支付版权费。","d":"2019.04.11","y":2019,"mo":4,"l":21,"c":6},{"i":"4356569078793284","t":"@她数据纽约沙龙 「她数据」刚结束模拟面试，四月又要现场招聘了！？","d":"2019.04.02","y":2019,"mo":4,"l":3,"c":1},{"i":"4353708437074824","t":"非常荣幸接到Redefine组织方邀请，我将参与“突破舒适圈(Reach Out Of Your Comfort Zone)”嘉宾主题研讨会。一年一度的Redefine峰会是四月纽约最值得关注的活动。4月27日在福特海姆大学，欢迎你也加入！ 迎来改变，从“突破舒适圈”开始 | Redefine四月纽约年度峰会","d":"2019.03.25","y":2019,"mo":3,"l":6,"c":2},{"i":"4349725337888341","t":"Just published the top article:《从“最早的几份工作别去创业公司”这条微博说起》 从“最早的几份工作别去创业公司”这条微博说起","d":"2019.03.14","y":2019,"mo":3,"l":17,"c":6},{"i":"4349550829005461","t":"我刚刚跟一个从创业公司离职，重新投入 corporate America 但找工作很不顺利的小伙伴打电话。听他讲自己的经历，基础岗位他看起来overqualified（因为创业公司确实人少责任大），而 experienced hire 所需要的 know-how 他又没有。这简直是一个典型的创业公司迷思。很多事情你看起来都做过，你以为创业公司的经历让你成为多面手，但是当你真正写进自己简历的时候就发现是空洞。\n\n首先你的失败很难归因。创业公司资源总是不够的，所以你很可能会觉得 I did my part it’s other people’s fault. 而缺乏反思。\n第二你负责的事情很可能在那个小团队里没人比你懂，所以你就是你自己和整个团队的天花板。你做对做错，很可能没有人能站得比你高一点来带你。\n第三是没有常性，老是像救火队员一样 rush to something else. 能跑通一个思路，专注并 optimize 在创业团队是很奢侈的。\n\n当你总是在 set to fail 的状态，自己工作的状态从鸡血到越来越糟糕，而公司肯定也不会更好。这是为什么我觉得最早的几份工作别去创业公司的原因。","d":"2019.03.14","y":2019,"mo":3,"l":212,"c":22},{"i":"4348182739141387","t":"Just published the top article:《#America Needs You 美国需要你# 导师志愿者招募》 #America Needs You 美国需要你# 导师志愿者招募","d":"2019.03.10","y":2019,"mo":3,"l":8,"c":1},{"i":"4347904728036794","t":"在朋友的生日派对被要求合照因为我是 Subtle Asian Traits celebrity. 😳","d":"2019.03.09","y":2019,"mo":3,"l":4,"c":2},{"i":"4347129289637833","t":"数据营销训练营第四期开始报名！","d":"2019.03.07","y":2019,"mo":3},{"i":"4346804193776626","t":"🧲 Do interesting things and interesting things will happen to you. 🧲","d":"2019.03.06","y":2019,"mo":3,"l":9},{"i":"4344987485971373","t":"你在执行工作的同时也在建立你自己的个人声誉。品性靠谱还是办事不牢，其实都特别容易打听。“把手上的任务超预期完成，也是在为你自己接下来的发展铺路。你很难坐在家里等机会降临，但你做过的事情有时候会帮你带路。”他们说职业生涯管理，可比跳槽重要得多","d":"2019.03.01","y":2019,"mo":3,"l":5},{"i":"4342458542618954","t":"二月：让我们好好聊聊“跳槽”这件事 #她数据纽约沙龙#第二次活动就是下周三啦！三位嘉宾各有千秋，四年升职五次的，从电影营销分析转做电商营销分析的，酒店管理转产品经理的。有空就来聊聊吧！","d":"2019.02.22","y":2019,"mo":2,"l":2,"c":1},{"i":"4339712271130575","t":"带爸妈看完《新喜剧之王》（🙃🙃🙃）回家看《喜剧之王》（🤣🤣🤣）","d":"2019.02.14","y":2019,"mo":2},{"i":"4339329612864892","t":"说到低俗广告，在昆明的高速上看见“阿庐古洞，千娇百媚的洞”这张广告牌。画面是简笔画的女性轮廓配红唇。非常生气。","d":"2019.02.13","y":2019,"mo":2,"l":8},{"i":"4338551632087891","t":"云腿月饼、桃片、荞饼/糕、鲜花饼、枣糕、蛋清饼。","d":"2019.02.11","y":2019,"mo":2,"l":7},{"i":"4338536331432102","t":"昨晚已经过了凌晨，回外婆家住书房旁边的小侧卧。电热毯已经开好了，还有一盏小台灯。台灯上面一张塑料的立体挂历，是 2007 年的，是一头咧嘴笑的小猪。\n\n原来 2007 年是猪年。\n自然 2007 年也是猪年。\n\n2007 年我们一家三口搬离昆明，去了成都。之后在昆明断断续续的短住，我一直住这个小房间。这个旧挂历就像家具一样留下来。每次走进这里，就像走进另一片时空。","d": 养成记 \n\n我们把Ivy的职场经验整理成了9条建议：\n\n1. 多了解Marketing的不同方面。我在读MBA的时候做了三份实习，让自己了解了营销的三个不同方面。\n2. 在美国，Growth Marketing这个行业非常需要很强的数据分析能力做基础，还需要很强的marketing sense和产品开发经验。在职业早期，你应该积累数据分析硬实力，掌握求职敲门砖。\n3.我看待我的工作的心态是，我不是在为公司打工，而是为自己的履历打工。我通过这份工作来让自己能力获得提高，为职业发展铺路。你要去思考“我从现在的职位上可以带走什么到下一个职位”，这样就会从现在的工作找到意义和看问题的不同的角度。即使在做一件重复的工作，也会学习到新的知识。\n4. 入对行很重要。未来10年，增长营销的人才需求都会很高。\n5.学会像美国人一样营销自己。\n6.了解动态，有好想法时会和老板分享。\n7.所有的business都是人和人的关系，资源也是随着人的流动而move around。\n8.有内容才是硬道理。\n9.多回馈社会，扩大影响力。","d":"2018.12.05","y":2018,"mo":12,"l":22,"c":1},{"i":"4313124242785601","t":"成年人说走就走的代价太高了，像我们单位这种DTO的，欠下的都是人情啊。","d":"2018.12.03","y":2018,"mo":12,"l":2,"c":5},{"i":"4311284751050859","t":"“今天适合启动一个大型Flag，因为距离2020年正好是400天。”","d":"2018.11.28","y":2018,"mo":11,"l":5,"c":3},{"i":"4311279549873037","t":"《哈利波特与Python文本分析》","d":"2018.11.28","y":2018,"mo":11,"l":4},{"i":"4310095686609438","t":"@杨毛肚儿 说币圈的信仰主要有两种，你赚多少和你亏多少。信仰最深的是人是赚得越多和亏得越多这两极的人。 美国·Long Beach City Hall","d":"2018.11.25","y":2018,"mo":11,"l":2},{"i":"4306959392067321","t":"【本周六的免费活动】11/17下午，由哥大应用分析专业学生会主办的职场讲座和模拟面试活动，我和6位姑娘（一个完美的性别比，7:0）做圆桌讨论数据分析在营销和其他领域的应用。欢迎大家来！网页链接","d":"2018.11.16","y":2018,"mo":11},{"i":"4306952425176681","t":"电影业是怎么做数据分析的：10年遍历20部漫威电影","d":"2018.11.16","y":2018,"mo":11,"l":3},{"i":"4306068412832165","t":"网页链接 本周六（11/17）在哥大，career panel + mock interview. 我是六个panelists最不data的一个，但我做的事情有意思呀哈哈！欢迎大家来~","d":"2018.11.14","y":2018,"mo":11,"l":7,"c":1},{"i":"4305827340427542","t":"Microsoft与Oracle高级经理谈「美国数字化营销」20年","d":"2018.11.13","y":2018,"mo":11},{"i":"4301859612724273","t":"文科生如何让数据分析成为你的铠甲而非软肋？","d":"2018.11.02","y":2018,"mo":11,"l":2},{"i":"4301092001671196","t":"你在Tinder刷到的不是男朋友，而是广告","d":"2018.10.31","y":2018,"mo":10},{"i":"4301016902115090","t":"却听得杨过朗声说道：“今番良晤，豪兴不浅，他日江湖相逢，再当杯酒言欢。咱们就此别过。”说着袍袖一拂，携着小龙女之手，与神雕并肩下山。","d":"2018.10.31","y":2018,"mo":10,"l":4},{"i":"4299569866809825","t":"直播 | 如何成为Business Intelligence商务智能分析师？ 这是我从微博下载的下来的好老师哈哈！","d":"2018.10.27","y":2018,"mo":10},{"i":"4299304719674287","t":"想转Analytics、做数据驱动营销的 ⃣️重新开始活跃在Instagram, 不仅是记录更是curate我的生活。\n🔟回纽约connect了新老朋友们，大家很inspiring而且我也过得非常充实。\n\n目前就想到这些！如果还有更多，那十三小时后在纽约降落可以再补充跨年笔记：） 北京·首都机场T3航站楼","d":"2017.12.31","y":2017,"mo":12,"l":23,"c":1},{"i":"4175408008022836","t":"Just published the top article:《关于外公走失》 关于外公走失","d":"2017.11.18","y":2017,"mo":11,"l":19,"c":4},{"i":"4174674662939572","t":"今天晚上去了Wonder Wheel的special screening。我很意外的今天这场人很少，在42街AMC的大放映厅只有寥寥二十多人。这是Woody Allen新作，又有Kate Winslet和Justin Timberlake。但…联想近期推特上的号召抵制Woody Allen的campaign（传他性侵女儿/养女，不是新闻，只是一直没有追究和结果），朋友说大概the tide is turning.\n\n说回电影！\n\n这片子在Coney Island摄制，又是一部关于夏天的，戴玫瑰色眼镜的悲剧。Kate Winslet演一个餐厅女服务员，曾经是戏剧演员，后来因为出轨和婚姻失败因此不在演出，带孩改嫁给胖丑的游乐园旋转木马售票员。售票员丧偶，和前妻生的女儿已经二十六岁，在学校时辍学嫁给了黑帮老大，因此断交。这女的突然现身，请求爸爸的原谅和保护，住进了这个位于游乐园内的小家——indeed a “homeless shelter” for the three adults and one kid.\n\nJustin Timberlake演一个救生员。他是NYU的研究生，写剧本，暑假在Coney Island打零工。之前是NYU文学系本科生，然后珍珠港事件后应征入伍成了水手。听起来像是deja vu？我感觉这个角色是受J. D. Salinger启发。Salinger的青年时代和电影设定是同一时期，先上写作班，被迫入伍，返回后写了Catcher In The Rye. 海滩上的救生员难道不就是catcher of the sea？他坐在高高的椅子上，试图发现和救助溺水的人。\n\n他抓住的溺水之人，就是Kate Winslet，然后就是黑帮老大的年轻妻子。但她们下沉的生活远不是他所能承担的。\n\n这部电影里的每个人都是set up to fail, and they did fail. 所以越看越叹息。尤其他们开心的每一秒，都是悲剧的一个逗号。悲剧，或者说是他们的命运，在一个夏天的篇幅里，开头空了两个，中间几次放过（轻轻的逗号），但还是要在结尾有个最终判定的句号。这个判定是，每个人都deserve彼此，而没有人deserve希望。\n\nKate Winslet在戏中的小儿子非常有意思。A red head，逃课、偷钱、爱看电影，爱纵火恶作剧。他是母亲情绪化和疯狂的具象表现，他纵火正是母亲的自毁。\n\n看得流畅（光影、摄制、表演都很棒），看完非常不是滋味。这片子被影评人打爆低分，但如果你和我一样每年都等他一部电影，也是应该看的。The characters deserve each other, and we deserve this movie. 🤷🏻♀️","d":"2017.11.16","y":2017,"mo":11,"l":4,"c":1},{"i":"4171266551755931","t":"吕频：「在这个性别不平等的大局里，大胆挺身做发言人的冯钢，所表现出来的与韦恩斯坦相通的自大乃至带有极端倾向（冯说“我十辈子也不会道歉”）的品格，不是什么天生个性，而是根植于他们所拥有的权势，以及权力对他们的长年放纵。当然冯钢的势力范围要小得多。但他从来都不会孤单，他不用担心没有援军。当冯声称遭到围攻，却又以“名士性情”获得对自己“带生殖器字眼的言论”的赦免，并且如明星般被《新京报》等媒体追访半生心路的时候，一个男权同盟昭然上线，实际上这是这个事件中腐坏程度更甚过冯自己的一部分：以公器之名行联手霸凌之实。」\n\n从韦恩斯坦到浙大冯钢，保持争议很有必要","d":"2017.11.07","y":2017,"mo":11,"l":6},{"i":"4170177384284077","t":"问答一则：如何评价新京报报道《冯钢：女权的「敌人」》？","d":"2017.11.04","y":2017,"mo":11,"l":2},{"i": 次🚖去SFO回纽约，司机大叔是个🇷🇺移民，五十多岁，离异但非单身，以前做技术现在卖保险。我们俩突然就聊起了象棋，他说他很想在三番tournament上打败跟他积分相当的Peter Thiel。\n\n他女朋友是个跟我差不多大的94年的🇷🇺女留学生。她出生在苏联解体后，对苏联的记忆很淡薄。我们俩堵在101上，突然就哼起了《三套车》和《莫斯科郊外的夜晚》。万万没想到他女朋友都没听过的歌，居然是我一个🇨🇳女生听着长大的。我外公小时候跟着白俄的女老师学过俄语，每次如果跟家人去KTV，我们会给他点这两首歌。\n\n突然想起来这个故事，不写下来怕忘了：）","d":"2017.08.15","y":2017,"mo":8,"l":13,"c":1},{"i":"4140581438942953","t":"我不爱跟ABC玩的两个原因：\n1⃣️问他们会不会说中文，他们说一点点🤦🏻♀️🤦🏻♀️🤦🏻♀️\n2⃣️问他们会不会吃辣，他们说一点点🤦🏻♀️🤦🏻♀️🤦🏻♀️\n\n🤷🏻♀️🤷🏻♀️🤷🏻♀️…既不能一起形而上又不能一起形而下…","d":"2017.08.14","y":2017,"mo":8,"l":7},{"i":"4139172744169146","t":"Kira 从纽约毕业了。\n\n她明天要走，今晚还在收拾东西。四年的时间，随身行李是一盒沉沉的唇膏，一手提箱的化妆品，顺手把学位帽上带2017标志的的穗儿也塞进箱子里。\n\n我们四个还剩在纽约的朋友们聚在她的屋子里。没说好有晚餐，没说好有酒，我们就只想和她多呆一会儿，因为纽约以外，就是天涯海角了。\n\nKira和她们是同学，她们一起熬过夜，一起编程，花一年多的时间做一支毕业作品动画，因为压力忽胖忽瘦。我跟Kira却是野生朋友。\n\n我四年前在老赵家的沙发上捡到她，堪比今天数千人邮件列表的规模，当时沙龙以老赵家的客厅为主场。我俩都刚来纽约，看她非常可爱，我问她，你能不能当我在纽约的第一个好朋友（literally like that, no joke!)。\n\nKira说，好。\n\n当时我们俩都在23街东面，她宿舍楼离我学校一个路口。我下课去找她，去看展，去韩国城吃饭，一起过了几个生日。后来她要找新房子，我帮她去看了这套在23街西面的房子，她在这儿住了两年。\n\n今晚这个房间必须被清空。\n\n我拿走了Kira画的两幅油画，一包因为怕室友生气一直不敢煮的螺蛳粉，她为了赖在床上吃早餐买的早餐床桌，一大堆她带不走的衣服。\n\n我们把Kira打算留下来的衣服一件一件拿出来相互试穿。高矮胖瘦各不相同的我们四个，穿上她一个人的衣服，居然都能挑到很喜欢的。已经不合适她的黑色短皮裤，在另一个姑娘腰上挂着正好；她大四压力肥胖起来以后穿不上的姜黄色小衫，我正好扎进牛仔裙里。\n\n她这忽胖忽瘦的四年，攒下来各种尺寸的衣服。有优衣库的大码，也有Saturday的加小号。好多连吊牌都拆不下来，塞在衣柜角落陪了我们几年。好多永远不会有合适场合的花衣服。要不是临走，都想不起来还有这样一身一套，全都挥霍了。\n\nKira以前特别不习惯每三五分钟就呼啸而过的消防车，后来我们习惯了自己的生活里横冲直撞的消防事件。我们和刚见面的时候好像没什么区别，四年不是整块的，而是聚沙成塔的。我们在MOMA听过未来主义，在2013年的最后一天吃了鹿鸣春的小笼包，在东河里两人划一条船，一起拍她申请宿管的一支白菜第一人称小视频。我换了几任男朋友，吵架都跑去她那里避难。上个月她做了我的伴娘，染了特别好看的粉色头发。\n\n在纽约的时间，买错衫爱错人都不是辜负，弯路也都是好风景。我们都没想过共度的时光会是这样的走向，以及说再见是无法避免的。\n\n山高水长，重逢可期。我爱你Kira，祝你一路顺风！","d":"2017.08.10","y":2017,"mo":8,"l":42,"c":1},{"i":"4138418634119218","t":"我同事今天跟我说他之前一家公司做过的一个糟糕的广告：一个男的在看棒球比赛然后有人吐痰吐到他头发上了，他就拿手去抓头发，被痰粘住的头发居然有发胶的效果，然后旁边一个女的开始跟他抛媚眼…\n\n寓意：发生在你身上的烂事，有的时候，可能也没那么烂\n\n我在会议室里响亮的笑了出来…","d":"2017.08.08","y":2017,"mo":8,"l":7,"c":2},{"i":"4138339068658141","t":"从今天我开始管理5⃣️2⃣️campaigns，media budget超过💲4⃣️,1⃣️3⃣️0⃣️,0⃣️0⃣️0⃣️。","d":"2017.08.08","y":2017,"mo":8,"l":3,"c":1},{"i":"41364527 am press for misunderstanding the president’s priorities and his supporters’ motivations. “Do you think you have enough people who understand and sympathize with Trump’s worldview in your news organizations?” he asked the panel. “Or do you think you’re predominantly staffed by people who view Trump’s point of view as not only wrong, but also evil?”\n\nElisabeth Bumiller, the New York Times Washington bureau chief, replied almost instantly: “Do you have enough people in your organization who disagree with Trump’s point of view?”\n\n网页链接 网页链接 .","d":"2017.03.04","y":2017,"mo":3,"l":5},{"i":"4081205761206274","t":"酷爱做饭的我最新发现五个小技巧：\n\n1/ 用热水和糯米粉最好，水只要一点点就能揉成漂亮的面团\n\n2/ 在切洋葱时拧开水龙头就不会被熏哭\n\n3/ 往炒鸡蛋里加一点点玉米淀粉，成品会非常蓬软湿润\n\n4/ 做汤圆的时候馅儿最好提前在冰格里冻成小块儿\n\n5/ 用单山蘸水代替盐放进炒菜里相当有滋味","d":"2017.03.03","y":2017,"mo":3,"l":10,"c":11},{"i":"4080867452743388","t":"硅谷 La La Land - 来自知乎专栏「当我用duree这个笔名时我在写什么」，作者:郑惠文， 硅谷 La La Land","d":"2017.03.02","y":2017,"mo":3,"l":5},{"i":"4080819024736940","t":"硅谷 La La Land（还没有结尾）\n\n男生在三番的速成班里上交互设计课。他之前从东岸的名校拼了三年拿到建筑硕士学位，但作为外国人，找建筑师工作太难，他想先在美国养活自己，再谈建筑理想。\n\n女生在东湾一所公立学校读文学。她周围同学都辅修了计算机，打算暑假申请软件公司实习。只有她想着要写书，在圣何塞的本地小报做无薪实习。\n\n两人认识是在三番唐人街的川菜馆。周五下午，全部坐满。男生本来下课后想带走个外卖，但想想周五是白人室友的 date night。未免被醉醺醺的叫床声吵到失眠，他决定坐下来慢慢吃。女生和朋友约在这里，但朋友最后一刻被男生约走。两个人被拼到一桌。\n\n女生一边吃一边刷推，男生把笔记本放到桌上。看见这个奇怪的 logo，女生想起这是一个没约到采访的明星创业公司，马上问他是不是在那里工作。男生答，这是培训班每周一度招聘会上拿的小礼品。两个人聊着湾区非码农糟糕的就业形式，还有难以置信的高生活成本。\n\n后两人从唐人街一路走到地铁站，男生给她讲加州实验建筑。两个人一个去东湾，一个南下半岛。两个人在火车上用手机看完了对方的作品集网站，短信定情。\n\n男生从速成班毕业后真去了那家明星创业公司工作。七万九千块年薪，为市场部设计高点击的 Facebook 展示位广告。女生犹豫要不要毕业后申请 Iowa 的创意写作班，但她在 Fremont 开饭店的广东籍爸妈显然不想让女生折腾到玉米地里去。\n\n男生说：你想出书也不必再读学位啊，找个工作吧，白天八个小时挣房租，夜里慢慢写。他没有说的话是，你可以留在我身边。\n\n女生看见自己 Facebook 时间线上突然蹦出的精准定位广告，正是他的“创意作品”。在市场经历的压力下，他把一个促销按钮改大几个像素，又再改大几个像素。她酸酸地说：那么建筑呢，可我不想变成螺丝钉就忘了自己是谁啊。\n\n他开车载她去奶茶店，女生叫了 Uber 自己回家了。\n\n两年后，女生拿到文学 MFA，搬回加州的父母家。她在伯克利找到一个教大一学生语法的兼职讲师工作，业余写创业公司的公关稿。她结识许多创业圈子里高能量的技术人和企业家，帮他们讲叫好又叫卖的故事。\n\n她从科技新闻上读到许多关于那家明星创业公司的报道，他们正在筹备上市。她想男生现在一定过得很好，股票能帮他在半岛上买个公寓房。\n\n她和创业者朋友们连夜开车去洛杉矶市中心一个投资人的派对，第二天中午才醒过来，仔细看白天的城市建筑。洛杉矶市中心和北加看起来完全不同，北加都是矮矮的科技园区，停车场和办公楼占的面积一样大。而这里所有的建筑都拔得很高，是有滋有味的都市感。她在 Frank Gehry 的迪士尼音乐厅楼梯上坐着，心里想男生告诉她现代建筑美则美矣，大多漏水。\n\n她正想着还好洛杉矶不下雨，然后就看见他迎面走过来。\n\n男生之前没抽到 H1B，又不是 STEM 专业，一年过后就回了国。设计广告只是一晃神，他在北京找了建筑事务所的工作。建筑师出头很慢，但在处处起高楼的中国，他渐渐开始负责项目。他译写普利兹克奖得主的书，在中国出版，和他正在全世界为书籍做讲座叫卖。\n\n她戴上墨镜，他想起自己停车位到了时间。两个人远远打了照面，彼此都没有上前确认。","d":"2017.03.02","y":2017,"mo":3,"l":12,"c":2},{"i":"4080813627364698","t":"男生在南湾的速成班里上交互设计课。他之前从东岸的名校拼了三年拿到建筑硕士学位，但作为外国人，找建筑师工作太难，他想先在美国养活自己，再谈建筑理想。\n\n女生在东湾一所公立学校读文学。她周围同学都辅修了计算机，打算暑假申请软件公司实习。只有她想着要写书，在圣何塞的本地小报做无薪实习。\n\n两人认识是在三番唐人街的川菜馆。周五下午，全部坐满。男生本来下课后想带走个外卖，但想想周五是白人室友的 date night。未免被醉醺醺的叫床声吵到失眠，他决定坐下来慢慢吃。女生和朋友约在这里，但朋友最后一刻被男生约走。两个人被拼到一桌。\n\n女生一边吃一边刷推，男生把笔记本放到桌上。看见这个奇怪的 logo，女生想起这是一个没约到采访的明星创业公司，马上问他是不是在那里工作。男生答，这是培训班每周一度招聘会上拿的小礼品。两个人聊着湾区非码农糟糕的就业形式，还有难以置信的高生活成本。\n\n后两人从唐人街一路走到地铁站，男生给她讲加州实验建筑。两个人一个去东湾，一个南下半岛。两个人在火车上用手机看完了对方的作品集网站，短信定情。\n\n男生从速成班毕业后真去了那家明星创业公司工作。七万九千块年薪，为市场部设计高点击的 Facebook 展示位广告。女生犹豫要不要毕业后申请 Iowa 的创意写作班，但她在 Fremont 开饭店的广东籍爸妈显然不想让女生折腾到玉米地里去。\n\n男生说：你想出书也不必再读学位啊，找个工作吧，白天八个小时挣房租，夜里慢慢写。他没有说的话是，你可以留在我身边。\n\n女生看着他近期极其机械的“创意作品”，把一个促销按钮改大几个像素，又再改大几个像素。她酸酸地说：那么建筑呢，可我不想变成螺丝钉就忘了自己是谁啊。\n\n他开车载她去奶茶店，女生叫了 Uber 自己回家了。\n\n两年后，女生拿到文学 MFA，搬回加州的父母家。她在伯克利找到一个教大一学生语法的兼职讲师工作，业余写创业公司的公关稿。她结识许多创业圈子里高能量的技术人和企业家，帮他们讲叫好又叫卖的故事。\n\n她从科技新闻上读到许多关于那家明星创业公司的报道，他们正在筹备上市。她想男生现在一定过得很好，股票能帮他在半岛上买个公寓房。\n\n她和创业者朋友们连夜开车去洛杉矶市中心一个投资人的派对，第二天中午才醒过来，仔细看白天的城市建筑。她在 Frank Gehry 的迪士尼音乐厅楼梯上坐着，心里想男生告诉她现代建筑美则美矣，大多漏水。\n\n她正想着还好洛杉矶不下雨，然后就看见他迎面走过来。\n\n男生之前没抽到 H1B，又不是 STEM 专业，一年过后就回了国。设计广告只是一晃神，他在北京找了建筑事务所的工作。建筑师出头很慢，但在处处起高楼的中国，他渐渐开始负责项目。他译写普利兹克奖得主的书，在中国出版，和他正在全世界为书籍做讲座叫卖。\n\n她戴上墨镜，他想起自己停车位到了时间。两个人远远打了照面，彼此都没有上前确认。","d":"2017.03.02","y":2017,"mo":3,"l":54,"c":1},{"i":"4080691371258990","t":"First Date Curse （接上一条）\n\n如果你觉得我之前只发迎合之声是怠慢，那简直太错了。事实上，这是在我闺蜜团分析我整场约会表现时，觉得我唯一做对了的地方。我偏头向他那一边，留个尖下巴，点头还能隐约体香。面对金融男，要顺毛摸，用手指处理他提供的信息就行，“女孩子不需要用大脑”。\n\n我很快说了自己正学的专业，实习的翻译活，还额外附赠了我最近在读什么书，才看完一部讲图灵的电影。他听进去了我说的每一句话，点头，却又好像没听懂，所以开始连珠炮问问题。\n\n戴维一开始没有皱眉，还沉浸在自己很牛逼的流利说辞中。当然，这是我的感觉，不一定对。\n\n他的第一个问题是：“你的五年规划是什么？”我愣了一下，几乎没反应过来，然后说：可能没有特别明确的计划，只是应该先不申请研究生，想工作试试，写写东西，或者去流浪也行啊。\n\n显然不满意，戴维觉得一点不好笑。他发现我的回答和他完整的大棋盘并不对仗，甚至欠考虑到为我觉得抱歉。\n\n他提出第二个问题：“你对未来伴侣的期待是怎么样的”，为了让自己不产生歧义，他补充说：“我指年薪”。\n\n我心虚地看着他，说从未想过，别太少吧。然后试探性地把问题扔回给他，说你呢？他接过话茬，先说赚钱养家男人天职，妻子应该做好妈妈；然后说人当有长远规划，写作也应该争取更高等学位和稳定工作。最重要的是最后一点，他坚定沉着地报出了自己的年薪，说自己准备置业，然后一脸期待的看着我的反应。\n\n我的反应？可怜我还沉侵在懊恼中，觉得应该说个面试型的逻辑回答，来取悦他。所以听到那个我本应欢呼的数字，却错失了做出反应的机会。\n\n虽然临近毕业，我对真正要自己负担的物质生活还依然没有把握。我琢磨，这是戴维想要惊艳我的点吧，用他的坦诚和能干，让我至少应该让渺小的自己躺平放他面前。可偏偏，我是自由散漫惯了的姑娘。\n\n他再问第三个问题，是我要留在纽约，还是回国。他问我成都，你的家乡是成都对吗，你提过川菜。我来了兴趣，说对，去留我还没谱，但川菜我有心得。稍微演绎了两句，他却只敷衍地笑笑。\n\n依然长着中国的眉眼，戴维曾告诉我他在长岛的家里会和开中餐自助餐厅的爸妈说福州话。但中国对他来说已经没什么连结。别说中国，曼哈顿以外他都不去了。除了每月火车回长岛一次，他也不度假，靠标普五百和彭博头条推送的新闻形成全部的世界观。\n\n成都是哪里，他只看见面前这姑娘心不定。\n\n预期中的崇拜和靠谱都落了空，戴维面前的咖啡好像一搅就凉了。我还绷着，却看出他泄了气。领子其实并没有很挺，头发上有白丝，我偷偷看他几眼，他盯着我手指。\n\n当天有塞尚夫人的展，我们没看。本来想好好逛逛雅诗兰黛先生新捐的81幅立体主义名画，他也只是耸耸肩。即便我终于开悟，告诉他这是价值上亿的绝妙收藏。我一向喜欢博物馆，但戴维说这是他第二次来。\n\n“第一次是费城一帮同学要到此一游，我没兴趣。”他抬抬眼皮，也好像是跟我说为时已晚。\n\n出门，他把大衣和花都从寄存处取出来，花递给我，撑开伞，让我扶着他走下楼梯，问我去哪。\n\n我说没关系，一点点雨，我走走吧。“谢谢你的花，”我迈进雨里。\n\n他终于是什么也没说。\n\n再见了这样一个戴维之后，我跟闺蜜团哭求，给我一个不那么靠谱的男生吧。我想要个男朋友而已，不想要一次性要那么多，我的想象力还没有这么完整，对人生一览无余。","d":"2017.03.02","y":2017,"mo":3,"l":18,"c":7},{"i":"4080691295549950","t":"First Date Curse \n\n最近（这篇文章是三年前写的）一直没有性生活，所有的关系都止步于第一次约会。我的脑门上冒了一排痘，每天早上出门的时候夹卷刘海，都要小心把红点点藏住，也把这种说不出口的囧事要藏一藏。\n\n对，我可能是一个第一次约会杀手。已经和二十多个男生在曼哈顿二十多家餐厅和咖啡馆聊过了人生，发短信却从来没有跟进。聊人生，我们可以从碟片的A面聊到B面，唱针溜完一轨又一轨。但约会，我和他们却从来没有下文。从、来、没、有。什么鬼。\n\n我的文盲闺蜜耷拉说，天，你是不是中了什么蛊，first date curse什么的。我翻白眼，天，你到底知不知道什么是first date curse。\n\n早十年的美剧，女主角谆谆教诲电视机前的良家妇女，“first date curse”是万万不能犯的忌讳。她的上下文是女生要矜持，别第一次约会就上床，把自己置于必输的败局，男生永远永远不会打电话来约第二次。\n\n苦口婆心，熬给干柴烈火。这跟我自然是没关系的。我知道这典故很久，也知道这典故不将于我身上应验。事实上我知道所有的典故和禁忌，这是个经验和熟手的世界，我每天在地铁通勤的四十分钟里，都很诚恳地在Kindle上画线做笔记。\n\n我最常看那种浪里来浪里去的戏文，《欲望都市》翻了好几遍。间隙偶尔抬头看看地铁里发臭的流浪汉，半眯眼抱公文包的老大叔，和我一样年轻和面有菜色的穷人，想想失望也就只有靠失望来安慰罢。爱情这种英雄梦想，要多少余力来完成呢。\n\n诶，说回第一次约会，我为什么没犯上床这禁忌，依然也第一次约会就必死呢。\n\n我不知道，真的。\n\n第一次决定要出台（对，结束单身那种出台），按照American dating culture出去约会，还是寒假里的事。\n\n耷拉也不知哪儿给我搞来一张名片，一脸高深玄妙地跟我说：ABC，典型金融男，25岁，老成得像35，你的菜。我张张嘴像抗议，却不知道从哪一条驳起。同龄人我从没交往过，一直都在年龄差杠杆的另一端。\n\n叫他戴维吧，方便起见。\n\n典型金融男，戴维是典型金融男。什么是典型？本科毕业后，去投行折腾两年，然后换工作跳对冲基金或私募基金，每周工作一百小时。工作就是生活，生活剩下留给自己的，就是永远没时间锻炼，出门就蹦上出租车，和金丝眼镜后面极端精明的脑袋。\n\n光这么说，你或许还不能领教金融男的厉害。他们永远让姑娘等，等他加班，等一周跟他短暂见一面，等他好不容易从四五个显示器屏幕里抽身看一眼满电的手机，你的一条“嗨，吃饭吗”信息已经已经挂在锁屏界面三个小时。\n\n对，他们就是忙，以上都是我朋友们的血泪史，我其实觉得忙挺好，我也忙，上课之外，还有一份要求多多的无薪实习。基本工作日就是三天像拧毛巾一样费精力，两天像晒海苔一样费脑汁。所以隐隐有些期待。\n\n戴维约我第一次见面，周六在大都会博物馆吃早午餐。这是浪漫？我在下雨的周六准时到了五大道八十二街，在博物馆商店里逛。他第一条短信来，说回公司拿了文件。第二条说去买了花。第三条用WTF开头，骂了不识路的印度出租车司机，因为他被载到了中央公园对面的自然历史博物馆，他一抬头看到了一副恐龙骨。第四条说我来了，花被博物馆说先放外面，所以，抱歉。\n\n我也不尴尬，本来下雨天就意外多，出去跟他握了手，说好吧，去吃东西。戴维见我跟他说英文，瞬间五官都舒开了。我想他难道一路都在担心如何与我，一个中国留学生交流？\n\n老成，我看见戴维才反应过来耷拉给的第二个关键形容词。他的身材显然疏于管理，微胖。很体面地穿了一身大衣，却把朝气黑压压地盖住了。至少我看不到，我还挺惶恐自己是不是穿的幼齿了。\n\n在点菜之前，他就已经说完了优异的成长经历，以及在6%录取率的情况下申请到沃顿。在汤喝完前，他就讲到自己从未有过恋爱经历。从未有过？我心一沉，伸手叫一杯Mimosa。\n\n如果说我恋爱有什么绝对的no-no条款，没有过成功或失败的任何感情经历，一定是唯一一条（不是身高，也不是脸）。没什么具体原因，也不是栽在这上面过。就是因为我自知不会心疼人，怕把人家好好一颗冰封王座的玻璃心给磨花了，赔不起。\n\n他口若悬河地讲述自己如何如何忙于学业和工作，如何如何取得了先人一步的成就，没有女朋友，只是因为不想，而现在他终于骑在了自己生活的马背上，所以现在他想。他看着我，我赶快又喝一口酒，不太敢清醒跟他对视。\n\n大概一直到分享完最后一个水果塔，他行云流水的自我介绍才算真的做完。潇洒、佩服，如果我是记者，应该此时就能关录音笔回家憋稿子了。一句“你最近怎么样”就能换了这么细节完善的回答，运气不要太好。\n\n他又为我点杯咖啡，十指对插，投来第一抹好奇的目光：所以你呢，你怎么样。这是我埋头苦吃两个小时以来第一次要有意义的说话，因为在他讲话期间，我就支着一个额角，一边笑一边小心不要吃掉了唇膏，说：“对”、“没错”、“是吗”、“当然”、“好厉害”。\n\n（转下一条）","d":"2017.03.02","y":2017,"mo":3,"l":20,"c":5},{"i":"4077374620428100","t":"\"Our lives are defined by opportunities, even the ones we miss.\"","d":"2017.02.20","y":2017,"mo":2,"l":18,"c":1},{"i":"4070891740307494","t":"\"The stages of bereavement are like the stages of love - they are both unpredictable.\" Lucy Kalanithi, MD 美国·Memorial Sloan -Kettering Cancer Center","d":"2017.02.03","y":2017,"mo":2,"l":1},{"i":"4069089771524401","t":"请问 Uber 的用户隐私条款里包含 NDA 吗？My colleagues couldn't stop talking about business. 🙄🙄🙄 英国·格林威治海岸地区","d":"2017.01.29","y":2017,"mo":1,"l":1},{"i":"4068702226442762","t":"You may entertain angels unawares. 英国·ExCeL London","d":"2017.01.28","y":2017,"mo":1,"l":1},{"i":"4067588055407056","t":"“你没法再以讽刺的态度面对这一切，你以往讽刺的态度纵 08218563010","t":"网上的资料真是有效度的没有信度有信度的没有效度！居然搜托福证件还是大量的网页宣称【护照是可以的！护照是优先的！】，差点被坑死！我打印准考证的时候才发现说是ID card ONLY，心里一惊打电话到010的那个号去问，他们告诉我从今年开始就统一不再使用护照作为有效身份证件了！拿护照的会被拒考！","d":"2012.10.26","y":2012,"mo":10},{"i":"3505478455736332","t":"售楼小姐们真是美貌如花。如果是按脸的好看程度来决定卖什么房子的话（即最好看的去卖别墅然后以此类推），我估计可以去卖经济适用房，就是坐在窗口里跟人对吼的那种。但是如果是很不幸按小腿围来算的话，我…应该就只能去强拆了…","d":"2012.10.26","y":2012,"mo":10,"c":2},{"i":"3504603054421815","t":"完了完了，考试只剩三天了，我连文章都读不懂。The most important languages in the world，and the ones that we should be focusing our attention on，are languagrs that are dying. 又读了一遍才明白！ #考托福者，脑必残#","d":"2012.10.24","y":2012,"mo":10},{"i":"3504215416437015","t":"我还记得那天 @思想聚会 那位孵化园大叔说的两点：1.手机确实减少了直接的人际交往，但是这很可能就是未来人际交往的方式。就好像Molière名作Tartuffe里对电视毁灭朋友交往的反驳。2.操作系统的走向决定于终端设备的使用，什么是入口？手机才是入口！","d":"2012.10.23","y":2012,"mo":10},{"i":"3503719784572011","t":"拥有某种功能其实没用，因为功能只是为目的服务，就像精美绝伦穿金带银设计师品牌的空盘子不能让你吃饱。","d":"2012.10.22","y":2012,"mo":10,"c":1},{"i":"3503572782042894","t":"莫言为什么会有这种看法？为什么对着国王的仪仗行礼反而需要勇气？也许因为在艰难时代长大的他，深知驯服中藏着牺牲与妥协的意味，而这同样需要勇气——战胜自己的骄傲从来不是一件容易的事。莫言像一颗种子从岩石缝里长出来，渐渐长成树，他不会让自己轻易跌下悬崖。via@宋石男","d":"2012.10.21","y":2012,"mo":10},{"i":"3503110985091744","t":"每回删除游戏app都会被问：您要保存在Game Center的记录吗？我就想，就我那点儿小分数，还是别给人服务器添堵了，赶快否掉。","d":"2012.10.20","y":2012,"mo":10},{"i":"3502885322752308","t":"有时候我真的很想紧紧握住某奇葩的手，真情告白：大兄弟，你错的实在是太有道理了！从没见过有人能跟你一样错得那么如栩如生，如梦似幻，还符合（你们人类最喜欢挂在嘴边的）逻辑！","d":"2012.10.19","y":2012,"mo":10},{"i":"3502806063233106","t":"Nothing can beat the view ‖ When as far as the eye can see ‖ there's no one but Mrs ‖ No one but Mr ‖ Smith and Me.","d":"2012.10.19","y":2012,"mo":10},{"i":"3502624920150767","t":"就像乔治克鲁尼在《在云端》里的背包理论一样，我也有我的爱情生命周期假说（也是为了实现终身消费效用之和最大化）：每个人在不同的阶段有不同的需要，他的伴侣并不总是能和他一起成长，所以时间长了必然分开。世界上是没有永恒这回事的，只有每个阶段的合适伴侣。不可能真爱永远，但是永远有真爱。","d":"2012.10.18","y":2012,"mo":10,"c":5},{"i":"3502592728740204","t":"写paper的时候想起来上周六做presentation，一组人很惊悚地在结尾的时候大喊：You deserve it! 把正在和同桌聊天的我吓半死。后来结合上下文想了一下，妈呀他们莫不是要表达“你值得拥有”吧，然后顺手一查，是：Because you’re worth it 好嘛！","d":"2012.10.18","y":2012,"mo":10},{"i":"3502444711094545","t":"阿莲今天陪我上宏观，上完以后冒出一个金句评价：我觉得经济学其实是一种新宗教，只不过是用经济学解释世界，这些原理就好像是以前的宗教教义。我补充我的观点：但是这绝对不是唯钱论或者一切向钱看，觉得经济学是搞钱的连门都没入。现在的经济回归经世济民的本义了。","d":"2012.10.18","y":2012,"mo":10,"c":3},{"i":"3502227517844219","t":"之前听不懂宏观是天资不足，结果听大家吐槽才知道我错怪自己了。一个经典的梗是我们的宏观老师讲索洛模型，开讲前要深呼吸，开讲十分钟就开始沉默思考，思考五分钟然后开始问“哪位同学会啊？”——年年如此！","d":"2012.10.17","y":2012,"mo":10,"c":1},{"i":"3501544667988608","t":"写在生日的最后几分钟，从明天开始的每一天就都是不新鲜的19岁了。不要再追求表面的祝福，而是感激真实陪在身边的人。拜拜善意和恶意的陌生人，告别18岁，走新的路。","d":"2012.10.15","y":2012,"mo":10,"c":3},{"i":"3501367610173881","t":"吐槽：名字越夸张越傻逼，故弄玄虚一事无成。","d":"2012.10.15","y":2012,"mo":10},{"i":"3501182741523754","t":"生日确实也就是平凡生活里的重复一天，不是什麽不经过就长不大的槛儿。不过人确实得经过一些槛儿，跨过才长得大。祝我生日快乐，19岁来了呢！","d":"2012.10.15","y":2012,"mo":10,"c":14},{"i":"3500928017420923","t":"既然选择了纽约，便只顾起早贪黑没有周末连轴转上课的生活。","d":"2012.10.14","y":2012,"mo":10},{"i":"3500442887945353","t":"当你只有一个半圆的时候，你觉得你面前时平的，并不觉得自己缺了另一半；当你有的更多一些，有了一个四分之三圆时，你前面就变成一个刺眼的缺了的直角扇形。所以这就是为什么有的多的人还想要更多更多更多。","d":"2012.10.12","y":2012,"mo":10},{"i":"3500305851835364","t":"调查问卷还是挺有意思的。首先，它提的问题一般都是记者采访不问的，因为刻板和教条，所以能知道哪些问题不要碰。其次，每份问卷都可以看出一个人的生活相貌。","d":"2012.10.12","y":2012,"mo":10},{"i":"3500019212209766","t":"觉得New Yorker真的是世界上最有存在感的一群人。无数的影视书籍献给它，无数的事件在且只在那里发生。在外人看起来很不可侵犯的神物也都不过是『我家隔壁的二狗子』『我家后院的小猫咪』，世界真的就是绕着纽约转的。","d":"2012.10.11","y":2012,"mo":10,"c":1},{"i":"3500016011979525","t":"据说理工出身的来自重大的新校长在开学典礼上跟12级新生说少去活动多学习，果然12级就都是这么理科范儿的孩子！从长相来说就带有学长学姐的沧桑；从学习来说，比我（们）靠谱几百倍啊！","d":"2012.10.11","y":2012,"mo":10},{"i":"3499948769629156","t":"人家主流杂志都是在问问题、做背景资料上下足了功夫，所以访谈文章直接就问答式。而我们在问题上永远都是【你是怎么从X变成了X】【你能给大学生一些什么意见】这种大而无当傻了吧唧不是问题的问题，所以记者蔡需要狠狠地在文章的加工处理上下功夫，只能把文章主观地写，或者变成客观事实的罗列。","d":"2012.10.11","y":2012,"mo":10},{"i":"3499358135878827","t":"今天突然说我们去纽约的这一撮人要搞个汇报演出，什么什么什么嘛。然后大家商量事这样的，用Jaz-Z的Empire State Of Mind在中央公园玩快闪！听起来很酷的样子耶！","d":"2012.10.09","y":2012,"mo":10},{"i":"3499293031853610","t":"求教各位大神，口语速度不够快，在托福1-2题每次只能说一个点，不过确实能给出足够的细节。这样可以吗？还是必须要多说两个点，或者成倍的加快速度呢？口语地址：网页链接 @珏子要和学术君一直好下去 @Leon的老友记","d":"2012.10.09","y":2012, o":9},{"i":"3491549738267514","t":"#知乎问答# 我在知乎提了一个问题：Win8应用商店有可能做到苹果应用商店的繁荣吗？为什么？ 网页链接 (分享自@知乎)","d":"2012.09.18","y":2012,"mo":9},{"i":"3491537919150301","t":"知乎收藏夹低效用途小，不如把知乎周刊做成开放式，大家自主添加内容，把复杂的收藏夹变成简单的周刊浏览。用户编辑后还可以分享，票选一二三做出品牌来。为什么只能有蛮子文摘呢，知乎不是要发现更大的世界吗，这样就是开拓呀。","d":"2012.09.18","y":2012,"mo":9,"c":4},{"i":"3491535758834303","t":"突然觉得知乎可以变成新的自媒体平台，围绕问题的回答可以看成命题作文。针对热点和重点问题（而不是“柠檬的苦味怎么去”这种百度知道的问题）展开讨论，不是投票选出最终答案，而是投票选出最好的各个版本的答案。iPad知乎周刊不更新了真遗憾，这应该是数字杂志的未来呢。","d":"2012.09.18","y":2012,"mo":9,"c":14},{"i":"3491279080465225","t":"曼昆的经济学原理我不知道在美国大学里是什么地位，但我敢肯定在中国是被低估了的。老师们都迷信高鸿业，认为曼昆低幼。但是我觉得曼昆的教材是在教你如何思考（像经济学家一样！），领你进经济学的门。而高鸿业呢，就像其他中国教材一样，只是告诉你那里有一扇窗子——一片光明，没有出路。","d":"2012.09.17","y":2012,"mo":9,"c":6},{"i":"3491277343937626","t":"学校门口旧书店的老板娘太牛了，随便问点什么都对答如流。比如我问她某某专业的统计学教材用的什么，她把这些年的教材变化一一历数，告诉我原始版本性价比最高也最好用，其他都是无伤大雅的小玩意儿。更牛的是随便跟她说个术语她就能找来一堆参考书，比如佐罗模型什么的…","d":"2012.09.17","y":2012,"mo":9,"c":1},{"i":"3490662819268556","t":"#知乎问答# 我在知乎提了一个问题：柯南剧场版为什么越来越烂？ 网页链接 (分享自@知乎)","d":"2012.09.15","y":2012,"mo":9,"c":2},{"i":"3490320090570826","t":"好忧郁，写了四十分钟的两三千字的影评在一瞬间被delete了。我一定要改掉用手机写长文的坏习惯。诶，或许也是老天爷在告诉我不露天机不乱说话吧。悲伤的去睡觉，如果我睡得着的话。","d":"2012.09.15","y":2012,"mo":9,"c":2},{"i":"3489519804414085","t":"最主流最关注互联网的几本财经杂志，环球企业家做分析最好看；第一财经周刊做专题最好看；创业家做专栏最好看。","d":"2012.09.12","y":2012,"mo":9,"c":2},{"i":"3489458957812488","t":"上午上完马克思以后三观尽碎，十点半回到宿舍就一直睡，睡到被自然地饿醒，趴床上看完了《驯龙记》，现在继续一瘸一拐的去预习线代晚上上课。睡了四个小时却依然不清醒是闹哪样！那什么主义的遗毒吗！","d":"2012.09.12","y":2012,"mo":9,"c":1},{"i":"3489353902351506","t":"老师开场白说了，你看我们这门课，名字叫《马克思主义基本原理概论》，一个字的废话都没有，严谨，严密，逻辑，好厉害。我好想吐槽…封面里面没有一句不是废话好嘛！讨厌！","d":"2012.09.12","y":2012,"mo":9},{"i":"3489352354967867","t":"大清早八点半起床见马克思的感觉真糟糕。不过我想，那老师得日复一日年复一年每天起床见马克思，肯定比我更困更累更死去活来。","d":"2012.09.12","y":2012,"mo":9,"c":5},{"i":"3489212358052325","t":"作女没有好下场。穿着10厘米高跟鞋崴了一大脚，脚背肿了。疼得没法儿。靠背上楼，倒床就睡，可怜。","d":"2012.09.11","y":2012,"mo":9,"c":2},{"i":"3489132900306036","t":"所谓忙，就是把大块时间浪费了然后用小块时间紧急赶工的恶果。","d":"2012.09.11","y":2012,"mo":9},{"i":"3489079658182047","t":"之前还觉得这学期挺美好课挺少，每周只有19节，加上10小时的英语课也都不算什么。可是…我们能转去纽约的学分很少很可怜，所以又得跨专业选跨年级选大物信管统计，还得把我的倒霉微积分和微经成绩刷上去。上学期+3门下学期也+3门才能搞得定。杀了我吧！我是作了什么孽！","d":"2012.09.11","y":2012,"mo":9,"c":2},{"i":"3488725910441302","t":"H座完全木有3G信号，而我这学期90％的课都在这儿上，这是逼我好好学习，逼我好好学习，还是逼我好好学习呢？（I HATE WAITING LIST!）","d":"2012.09.10","y":2012,"mo":9,"c":3},{"i":"3488619702827089","t":"财大有些男生真是够了，你们就只剩上男厕所这唯一一个男性特质了吧。比长舌妇还长舌妇，一张屁股嘴只会瞎嘚嘚，唯恐天下不乱。快他们歇了去，别秀下线了，恶心。","d":"2012.09.10","y":2012,"mo":9,"c":1},{"i":"3488377061775420","t":"我妈最好玩了，说话一点不像受过多年高等教育的知识女性，专门负责搞笑。今天中午我跟她一起睡，一只蚊子就盯了我脸颊上一块儿红，我就开始顾影自怜了。我妈评论：咬了就咬了呗，难不成你还想飞到天上在蚊子脸上也咬一口？","d":"2012.09.09","y":2012,"mo":9,"c":13},{"i":"3488105971695517","t":"【信息图】我们都是智能手机的“脑残粉”——智能手机用户调查 | 36氪  网页链接","d":"2012.09.08","y":2012,"mo":9,"c":4},{"i":"3487318319091712","t":"米果人真是叶公好龙啊。老师非常鼓励我们在essay里用中国传统故事传说，但是翻译过去其实平淡无奇，比如精卫填海就是一只小傻鸟破坏海洋生态平衡的故事，而我为了写孟母三迁把吃奶的劲儿都使上了，才让孟母表现出母爱而不是歇斯底里。所以还是就用普通个人经历作例子好了，不然真是用电锯杀鸡，白瞎。","d":"2012.09.06","y":2012,"mo":9},{"i":"3487310706533096","t":"To be a sophomore, we really suffer more.","d":"2012.09.06","y":2012,"mo":9},{"i":"3487030371736990","t":"学姐什么时候能当上学姐呢？当她们有了靠谱的学姐夫时。","d":"2012.09.05","y":2012,"mo":9,"c":1},{"i":"3486985107230930","t":"刚和靠谱学弟吃饭，各种开心。白天一直在纠结英语，越说越觉得自己蹩脚，晚上和学弟（他是北京人，一口噶嘣脆的京腔）一起终于说上了字正腔圆的普通话，好开心。他们说我们俩特别像说相声，一个逗哏一个捧哏。啊，汉语真是博大精深，发人深省，让人愉快。祖国真美好…","d":"2012.09.05","y":2012,"mo":9,"c":1},{"i":"3486928828104003","t":"从国内英语考试中积累的『我英语超级好』的错觉被真正的英语写作，尤其是academic reading打消得一干二净。从小被亲切的chiglish培养起来的英语能力，根本就不是英语啊…因为chiglish是中国老师自己的好恶，不是人家老外说的英语啊。","d":"2012.09.05","y":2012,"mo":9},{"i":"3486876323132247","t":"#知乎问答# 在知乎实习是一种什么样的体验？有何收获？ 网页链接 (分享自@知乎)这真是一个温暖的问题呀。","d":"2012.09.05","y":2012,"mo":9},{"i":"3486869461627471","t":"笑了。接到靠谱学弟的电话，人家要请学姐吃大餐，畅想一下美好的大学生活，共商国是，还要学姐给出纲领性指导意见…好嘛，吃饭总是好的~`o`~","d":"2012.09.05","y":2012,"mo":9,"c":3},{"i":"3486808027593028","t":"为什么做梦呢。为什么梦见不可能呢。为什么痛苦。为什么不甘心呢。真是奇怪啊。","d":"2012.09.05","y":2012,"mo":9,"c":2},{"i":"3486639273811844","t":"奶牛奶脂肪含量3％，水牛奶脂肪含量9％，而我这种脂肪层超厚的肥妞，应该可以直接挤出奶油来－O－『肥肉已经让我心态扭曲了』","d":"2012.09.04","y":2012,"mo":9},{"i":"3486638145977782","t":"世界上最悲剧的事情就是，学妹长了一张学姐一般的老脸，而学姐穿衣打扮像学妹一样土渣渣。","d":"2012.09.04","y":2012,"mo":9},{"i":"3486615718860146","t":"美国老师就是有这种隔山打牛的神力，虽然说的每个字都在夸奖你，说得比春花秋月更灿烂，但却会让你觉得我这不行那不行一定要努力啊必须提高。正能量神马的，这不就是，他让你不好意思不好好学习。","d":"2012.09.04","y":2012,"mo":9,"c":1},{"i":"3486522705409518","t":"有一撮人，精神洁癖得厉害，生怕自己[被代表]了，只要看到对群体公共特征的描述就跳出来拍拍屁股撇干净。但这一点也不聪明，也并不能证明你[傻了吧唧没头没脑的优越感]。这真的很蠢好吗，作者没有针对任何人，却偏偏要董存瑞似的堵枪眼。我去。","d":"2012.09.04","y":2012,"mo":9},{"i":"3486460269002211","t":"昨晚本来想抱怨时间紧任务重，我的托福复习搁浅了。但其实是我根本没把散碎的时间利用起来，它们本来可以派上大用场的。试了一下今天早上，果然！","d":"2012.09.04","y":2012,"mo":9,"c":4},{"i":"3486257034724859","t":"在写essay，谈到American individualism，突然想到汉语语言习惯不但不喜欢说[我],还特喜欢把人家也代表了说[我们]。好像说话也要人多力量大，[我]不够正确，[我们]才比较有份量。","d":"2012.09.03","y":2012,"mo":9},{"i":"3486191258944168","t":"越来越觉得我们这一小撮去纽约的同学卧虎藏龙。上周坐了我同桌男生爸爸的凯迪拉克回家，这星期发现我后面的后面的男生开卡宴来上学。我还知道有个看起来很那啥的男生是我妈单位的实权局长。还有男朋友全家投资移民在美国等她的幸福女。还有体育总局高层千金……我……好自卑阿！！！！！！","d":"2012.09.03","y":2012,"mo":9,"c":14},{"i":"3485478310948375","t":"吐个槽，我还是觉得学姐最好看，大四学姐都修炼成精了。但是大一学妹嘛……有的长得像学弟，有的长得像家长—。— 我在#温江区西南财经大学柳林校区# 成都·西南财经大学柳林校区","d":"2012.09.01","y":2012,"mo":9,"c":3},{"i":"3485368311555634","t":"九月居然有这么凉丝丝的开始。看到了不怎么可爱的学弟学妹们。诶，高三折磨的每个人都是一张三十岁的脸。去年我也这样，爸妈带着来学校报道，满脸困惑，还自以为是。历史果然是重演重演和重演的。","d":"2012.09.01","y":2012,"mo":9,"c":5},{"i":"3485165932143337","t":"因为去纽约的这个项目，我们放弃了暑假放弃了周末还要放弃寒假，不停的上课（阅读听写作文）……为了变成一个合格的资本主义接班人，真是不容易阿。","d":"2012.08.31","y":2012,"mo":8},{"i":"3485054161914537","t":"我还觉得，应试教育本质是某种愚民教育，奴化教育。","d":"2012.08.31","y":2012,"mo":8,"c":1},{"i":"3485053948254359","t":"我觉得青年人很难真正做出改变。原因是20多岁时自顾不暇，等到40多岁有余力可兼济天下时，其实已经在体制内，那个你20多岁时想要改变的体制里享受了。","d":"2012.08.31","y":2012,"mo":8},{"i":"3485053076042058","t":"这几天的自由课堂讨论，我们把中国几乎所有的敏感词都念叨了一遍。我们中的有些人很活跃，看到问题并积极头脑风暴。但是有些做题为生的【好学生】，就觉得很不安，觉得我们不该说政治，因为无能为力，而且家丑不可外扬，干嘛让老外知道这些，我们自己suffer就行了。……这真是—。—","d":"2012.08.31","y":2012,"mo":8,"c":3},{"i":"3484688154588802","t":"理科生在和人争辩时，最喜欢叫嚣【这不科学】！好像科学是某种万用标尺，能不量出他智商的短板。","d":"2012.08.30","y":2012,"mo":8},{"i":"3484687370401934","t":"高中文理分科，让理科生变成了一群自以为逻辑，并用不逻辑的方法企图证明逻辑的强辩者，没内容；让文科生变成了一群一知半解，含混不清，用纯主观的偏见去解决客观问题的偏执狂。","d":"2012.08.30","y":2012,"mo":8,"l":1,"c":2},{"i":"3484080752501751","t":"我发现颜色差不多的饮料味道也差不多。百事和可乐，健力宝和美年达，七喜和雪碧，各种奶茶，各种乳饮料……其实AD钙奶和爽歪歪还有蒙牛伊利新出的乳酸菌饮料味道也差不多……","d":"2012.08.28","y":2012,"mo":8,"c":1},{"i":"3483363584973683","t":"作为一个愚蠢的消费者，今天我终于领悟到了一个真理：我们永远也买不到自己想买的东西，只能在它们（商家）想卖给我们的东西里，找到稍微能产生点儿效用的带回家。","d":"2012.08.26","y":2012,"mo":8},{"i":"3482905634475192","t":"很多时候关注一个人，并不因为他说了什么，而是因为他是谁。所以许多许多的有志青年都关注了某些话多得要死营养少得可怜的虚胖名人。他们真恶心不是吗，占据着时间线的大半江山，说的屁话都没有[转发微博]四个字有意义。","d":"2012.08.25","y":2012,"mo":8,"c":1},{"i":"3482562611440244","t":"想起上午上课时的小段子，我们的外教Joan是奥巴马的拥趸，说自己会毫无疑问的投票给他，他聪明又迷人，被他代表是很荣幸的，而且他们是哥伦比亚的校友。然后说到小布什，她就翻白眼吐舌头，说He is so stupid! Horrible!我们就笑得一塌糊涂～不过其实我蛮喜欢这个吃小饼干都会把自己噎晕，好萌！！！","d":"2012.08.24","y":2012,"mo":8},{"i":"3482491605955271","t":"巴鲁的第一节英语培训，passage dictation，我真是要多瓜就有多瓜，写了一堆comma, period, colon, semicolon, 然后完全不知道这篇文章要干嘛……结果这都是标点符号阿魂淡！！！！！！我的听写结果翻译成中文就是“我肚子好饿逗号好像吃饭冒号猪头肉顿号大白菜句号……” 我在:海科路东段","d":"2012.08.24","y":2012,"mo":8},{"i":"3482297019491482","t":"看完了听风者，第一次也看完了字幕。剧组里好多奇葩的职业耶，有梁朝伟专用的化妆师，有个【茶水】叫惠宝宝，还有厨房主管什么的……","d":"2012.08.23","y":2012,"mo":8,"c":1},{"i":"3481976885058811","t":"节日存在的意义是什么呢？从物理上说，是创造新的消费点拉动内需;从心理上说，是给我们的回忆立一个里程碑。人们都健忘呢，没什么比忘记更容易了。要不是有这样一个人为的【特别的日子】，谁还能记得谁呢？","d":"2012.08.23","y":2012,"mo":8},{"i":"3481782445528758","t":"“我不知道文艺青年什么时候成了贬义词，对我来说，它既不好，也不坏，它不过是一个过程，一种处于困惑中的生命状态，一个人有太多自我和世界的关系需要协调，那种困惑和执拗的表情必然会占据他的脸，不过那也不无魅力，总好过一张麻木不仁的脸。 ”——廖一梅","d":"2012.08.22","y":2012,"mo":8},{"i":"3481781858715472","t":"在亚马逊上买廖一梅的书，在《像我这样笨拙的生活》试读里看到一句话：“年轻时并不知道自己要过什么样的生活，但一直清楚地知道我不要过什么样的生活。那些能预知的，经过权衡和算计的世俗生活对我毫无吸引力，我要的不是成功，而是看到生命的奇迹。”我还没有那么勇敢，不过我在努力变得那么那么勇敢","d":"2012.08.22","y":2012,"mo":8,"c":2},{"i":"3481496524101342","t":"人家都是笨鸟先飞，我这只笨鸟却非得挨了枪子儿才扑楞扑楞翅膀。人家猫有九条命（虽然在另外一些我很厉害的场景里我扮演的是吃鱼要吐骨头的白猫小姐），不晓得笨鸟有几条……","d":"2012.08.21","y":2012,"mo":8},{"i":"3481201215860706","t":"而且在国人（所谓的）价值观里，觉得花自己的钱没什么了不起，能够花别人的（公家的）钱才厉害，权生钱所以一切向权看。Sucks!","d":"2012.08.20 子阿～得意～","d":"2012.04.10","y":2012,"mo":4,"c":3},{"i":"3433200455874388","t":"我在西南财经大学学生活动中心：世界上最幸福的事就是在办公室值班，躺在沙发上喝茶看书看杂志做脑体操了。 网页链接","d":"2012.04.10","y":2012,"mo":4,"c":3},{"i":"3433199428618874","t":"同样是为观点服务，新闻写作是尽可能地展现，而史书是尽可能的掩藏。时间是连续的，而历史是破碎的。新闻是强时效性的，也是脆弱易腐的。新闻搁旧了也不会变成历史，而史书印得再新也不会变成新闻。一些新闻确实记录了历史，但只是一些。历史不是事实，而是对事实的选择。","d":"2012.04.10","y":2012,"mo":4,"c":5},{"i":"3433197289666347","t":"在读《光荣与梦想》，我一直想新闻和历史都是作为对客观事实的反映，到底有什么不同。他们都有政治目的，都为意识形态服务，都不纯粹。或许新闻是冷眼观世相，是以旁观者的心态，新闻事实万变不离其宗。而历史却是当局者写给后世人，有主人公意识，也有更强的传承感，历史有无数种写法。这是我的理解。","d":"2012.04.10","y":2012,"mo":4,"c":2},{"i":"3433066381000458","t":"今天在我的会计书上发现了不晓得哪一节写的【世界很大，只要勇敢】，可能又是睡着了梦话多。确实，发现有太多不期而遇的美好，我在等奇迹，奇迹也在等着我。倒春寒会过去的，冬天里所有糟糕的回忆都死翘翘，夏天会有最热烈的拥抱。所以就让我拿好我的行李跟你出发吧，一秒都不要延迟，我们一路走下去。","d":"2012.04.10","y":2012,"mo":4,"c":2},{"i":"3432933027382130","t":"你是人间四月天，快到月中，忙死我算了=。=突然发现周末要deadline好多事情，还有2篇采访稿没结，这周周报没写而且又要去科大助教，还要做LOL的事写好教案给成都办还有组织meeting和预演，还有一个活动的申请一个字都没写，学习的事情更是一泻三千里，kill me。","d":"2012.04.09","y":2012,"mo":4,"c":3},{"i":"3432896893574472","t":"有些菜要文火慢炖，有些菜开水一冲就很速食。有些人不必等，有些人不愿等，有些人等不起。——>继续看经济学看出满腔怨气的某蔚刚从午睡中醒来╭(╯ε╰)╮","d":"2012.04.09","y":2012,"mo":4,"c":2},{"i":"3432883622773219","t":"有的人像火，有的人却是冰。火燃烧了自己来取悦冰，冰化成冰凉的水，把火扑灭。火死掉了，冰冷冷笑着变成热闹的雾气，湿了眼眶。——>在h座五楼晒着太阳看西经好幸福，懒懒的春困，让人发梦。","d":"2012.04.09","y":2012,"mo":4},{"i":"3432877943771299","t":"有些小菜，你不能贪多贪吃，因为即便你愿意以之果腹岁岁年年，人家也不一定愿意，比如香酱。有些主食，你不能放任放弃，因为即使你一时意气不吃，也无法改变你对它的需要需求，比如大米。恩，不要做别人的花生酱，吃自己的大米饭。","d":"2012.04.09","y":2012,"mo":4},{"i":"3432523881298084","t":"把毕马威的笔试做得像屎一样,Verbal的36个题我刚刚好做出18个,做数字推理题的时候没有计算器就全部瞎写了.还好离毕业还有三年多还不着急实习工作只是考着玩,我真是太凌乱了.上午考完英语啃了一块士力架就转战毕马威,现在在去成都的校车上.喵=w=是不是很乖?","d":"2012.04.08","y":2012,"mo":4,"c":2},{"i":"3432337113273775","t":"4月7日那啥第20天(昨天写错了),其实没有什么放不下,但是真的不要假装.就像x君分析的,我是在天坑上面建摩天大楼,再亮的玻璃外墙都要塌.沉淀自省的路很长,我却连第一步都没迈出.因为青春太短,我不舍得打散这泡沫去遍尝苦涩.让我彻底的醉和忘叭,在follow之前找到自己的heart.","d":"2012.04.08","y":2012,"mo":4,"c":2},{"i":"3432108397797211","t":"我的文章目前就是一坨一坨的肥肉，没有一根脊梁骨一以贯之。如果强加思想，就变成了烤羊肉串，也不能变成一个活生生的人。所以，只能一步一步来，或许我不该强求我现在就能“造人”，可以先 "t":"发表了博文 《偶然间心似缱，梅树边》 - 在上课高峰期逆着人群逃课出校门，回头一看被正西方的夕阳晃花了眼睛，然后就变成了边吃边哭情绪崩溃。 我总是用“突然发现”这个动词，因为我的生活里总是充满了那么多 网页链接","d":"2012.03.31","y":2012,"mo":3},{"i":"3429607103702002","t":"虽然我知道经济学考试我肯定不会考得怎样怎样，但是还是蛮喜欢觉得很好玩。经济学是一票聪明人用理性的方法去研究感性的人们的消费。恩，对，我觉得理性人的行为其实是感性的。我不是跟经济学家对着干，只是觉得经济学规律不应该那么数学。数学神马的，可以表征思想，可是不能说清不过脑子的行为呐！","d":"2012.03.31","y":2012,"mo":3},{"i":"3429437482121738","t":"我的微博走了极端正经和极端不正经的两个极端（本来下午发“肚皮不争气”的时候我真正想说的是“留不住他的人还留不下他的种麽”！），每次都想写到140字充分利用有限的空间吐无限的槽。我很纠结把新闻评论写成杂文这件事，第18期的长评迟迟没有下笔。求灵感！17期写了近一万字的5篇稿子，付梓好开心！","d":"2012.03.31","y":2012,"mo":3},{"i":"3429376819698908","t":"我一直着迷于意外,觉得凡事不破不立,于是事事都破.所以应该回归一个好习惯连成的生活,不然实在是太乱了套.","d":"2012.03.30","y":2012,"mo":3},{"i":"3429333710740876","t":"活得忙碌绝对不是丰盛,这种忙也只能泯然众人.","d":"2012.03.30","y":2012,"mo":3},{"i":"3429270959750540","t":"明明三个星期前才来了姨妈，这个月又来……诶，果然是肚皮不争气。","d":"2012.03.30","y":2012,"mo":3,"c":2},{"i":"3429188742893627","t":"可能确实每一项工作纠其根本都是琐碎的日常组成的，但是在我们不必为生计奔忙的学生时代至少可以自在的做一些让自己快乐的事吧，现在你何必勉强自己。所以，如果每天两小时守在篮球场数帅哥的腿毛，没头没脑的头脑风暴让你感觉不快乐的话，退了吧。@POTATOWORLD","d":"2012.03.30","y":2012,"mo":3},{"i":"3429074955688853","t":"我其实已经很不容易感伤了，因为有那么多事要想，我的一天那么的不充实。梦只是梦而已，谁都帮不了我。","d":"2012.03.30","y":2012,"mo":3},{"i":"3429051823855419","t":"刚刚吹完头发“顺便”（其实是被念了一个星期了）拖了个地，我们寝室其他三个姑娘纷纷表示“我了个擦的，你也有今天，一定要用照片记录下这激动人心的时刻，太千载难逢了！”我趁机表示了一下其实我也很居家，而且一直梦想着要做家庭主妇（恩，那天职规课我真是这么发言的），然后就木有然后了……","d":"2012.03.29","y":2012,"mo":3,"c":2},{"i":"3428713574545695","t":"好像自己玩自己还真没什么不妥的，除了把颈椎玩坏了其他都还好。生活宽广了就不至于把目光紧紧锁在自己的小破事儿里。眼泪什么的，也有适可而止的度。我其实是放下了一个沉重的托盘，那个托盘里曾经是被当做【牺牲】的我自己。唯一的后遗症是，经过海风海浪的小船不愿回细瘦的江河中了。她想走得更远。","d":"2012.03.29","y":2012,"mo":3},{"i":"3428711519195705","t":"3月28日那啥第10天。我经常会问自己“你快乐吗？”得到的答案永远是迅速脑内一个难堪的片段，回答说“不”。不过说出来的瞬间就很relief了，觉得快乐许多。我真是个很没谱的人呐，度日如秒，荒废如流。感觉还是一潭浑水还没冒出滚滚的清流，自己被淹得半死呼吸不畅。只见树木不见森林真糟糕。","d":"2012.03.29","y":2012,"mo":3,"c":1},{"i":"3428651968263707","t":"最近一直和正常的孩子在一起，不过我完全木有被同化的感觉，反而越来越觉得自己不正常。这真是太令人发指了。","d":"2012.03.28","y":2012,"mo":3},{"i":"3428635311454471","t":"我跟我妈描述颈椎痛时说\"前脑后勺一起很酸,就像头盖骨松动要脱落一样\",我妈说:\"啊?那么科幻呀?\"","d":"2012.03.28","y":2012,"mo":3},{"i":"3428352465988051","t":"3月27号那啥第9天（似乎我已经开始不记数了？这还没超过两位数呢！），纠结的颈椎！感觉脑袋都要咕噜咕噜滚下来了！整天都在折腾什么整块儿的事儿都没做！我要好好学习了，有了求知的强烈渴望，而不是整天都被胡搅蛮缠的工作撕成两半。我还是不知道自己想要什么，或者该不该现实。不过我在努力地想。","d":"2012.03.28","y":2012,"mo":3,"c":2},{"i":"3428311824861727","t":"一扭脖子就听见我可怜的颈椎像波浪鼓一样啪啪作响><","d":"2012.03.27","y":2012,"mo":3,"c":1},{"i":"3428274539638494","t":"吐个小小的槽，K记人的STYLE都好一致，女生都是素净黑色长直发+框架眼镜，男生严谨但搭配潮品。比如台上现在这个senior manager，很vivid但很克制，没有王小贱那么骚，但是真的有点小娘炮的说……等下要上台present的intern就是上周五才跟我合作过的研究生学长，哈，他还好还木有那么K记属性→_→","d":"2012.03.27","y":2012,"mo":3},{"i":"3427988890890681","t":"3月26日那啥第8天。颈椎微痛。真心佩服那些专心失恋的姑娘，你们到底是有多大的冤情阿每天都卯足了劲儿使劲哭。我倒是还好了啦，在人前不好意思哭成五官蹉跎的二逼脸。而且每天要想着怎么吃怎么学哪能怨妇得下去阿。而且想啊想啊想啊想啊想啊想啊，很多事情明白了不就不纠结了，对吧，有什么嘛。","d":"2012.03.27","y":2012,"mo":3},{"i":"3427873496609371","t":"发表了博文 《修身、齐家、治业、行天下 ——访捷普人才发展国际学院院长张子库（Adam Zhang）》 - 记者/郑惠文 杨洋 背景介绍：捷普集团 (Jabil Group)——著名美资企业，成立于1 网页链接","d":"2012.03.26","y":2012,"mo":3},{"i":"3427625752410835","t":"大家都觉得我是无比之顽强，也没有谁觉得有必要正儿八经地安慰我。确实我的伤不是外敷膏药就能治好的，我不需要一个寝室都陪我哭陪我一起浪费面巾纸。我的伤是自己的盲，在成长的这一关我冲闯失败了。比从伤口上撕下疤更痛的是把心血耗干。我不知道，我不知道了。烧了重写重新谋篇布局吧。","d":"2012.03.26","y":2012,"mo":3,"c":2},{"i":"3427621662716727","t":"这个春天真是糟透了，明明是越变越温暖，我却一个人沉尸于越来越深的寒意中。","d":"2012.03.26","y":2012,"mo":3},{"i":"3427617279884316","t":"3月25日那啥第七天。以周纪念的日子过得很快，从“诶，你眼睛怎么是肿的？”到“喂，你眼睛怎么还是肿的？”只是很短的时间。新的一周好好学习好好写稿，停止作贱自己了。说好的英语大赛说好的挑战毕马威说好的六级说好的托福呢，多久没碰英语和数学了魂淡！本本分分做好自己的事，停止其他！","d":"2012.03.25","y":2012,"mo":3,"c":2},{"i":"3427607477673970","t":"从会议室走出来的时候空气有点填，果然是下过雨。明天如果还下雨又变冷的话，我会考虑继续穿开衫继续装外婆的。贱贱已经离开了，他真的要开始走自己的路了。我却还在原地，还在很远很远的原地。要好好想想到底是要什么，我也不能一直姑息自己糊里糊涂的吧。大一下，我挣扎在新的迷茫中。","d":"2012.03.25","y":2012,"mo":3,"c":4},{"i":"3427583314575012","t":"吃辣又吃肥，长痘痘又长智慧，被骂又被夸。瞧我这恋失的，一边憔悴损，一边看着多欢乐。","d":"2012.03.25","y":2012,"mo":3,"c":5},{"i":"3427475582900601","t":"发表了博文 《你以为爱情是什么?》 - 阳光那么好,好到我见光不见光都会落泪.收到一封意料之外情理之中的邮件,就被辣到了眼睛,我又肿成了一个悲伤的蘑菇. 其实,我以为爱情什么呢?我曾经很迷信肾上腺素和 网页链接","d":"2012.03.25","y":2012,"mo":3,"c":9},{"i":"3427276157285448","t":"虽然悲伤在胸腔结成了比心脏还大的一坨，噗通一跳我的眼泪就开了闸。不过总不能局限于悲伤画地为牢地难过吧，我还得战斗在自己的路上。我学不到那么聪明奥妙的世界观，只能用自己的方法论去慢慢体验体悟体谅。18岁，我兜了那么大一个圈子，终于还是魂魄归体，自己回到自己身边。重建废墟为广厦吧！","d":"2012.03.25","y":2012,"mo":3,"c":2},{"i":"3427274173390343","t":"3月24日那啥第六天。上周的这个点儿我哭得快断气了，不过这一周我过得还算争气，无关人等不会让他们看见我的伤心，所以有人觉得我真是变态把爱情扯出来扔地上当炮踩。只是下午在校车里回学校时突然煞不住车地哭了，大颗的眼泪顺着脖子流到锁骨然后被皮肤吸收。然后就睡着了，就像早上哭醒时一样一样。","d":"2012.03.25","y":2012,"mo":3,"c":5},{"i":"3427014768244412","t":"完整清楚地做了一个梦，梦见你来找我，我们和好，十指相扣地轧马路，走几步我就亲你一下。其实背景很不成都，很是北京。我甚至知道这个梦是个梦，梦里我就开始哭说千万千万不要醒来，然后你就消失了，我就真的哭醒了。","d":"2012.03.24","y":2012,"mo":3,"c":1},{"i":"3426684370131793","t":"做presentation的各位，不是想通过毫无逻辑的大声吼住听众，就是想通过毫无沟通的念稿来“睡”服听众。有的风格很aggressive以为这样就能控场，有的自己都不知道在讲什么满PPT都是字。大家都在抢着想去present，但是都各种现眼。亲，上讲台之前用用你的二两大脑好吗，脑容量小不是犯傻逼的借口。","d":"2012.03.23","y":2012,"mo":3,"c":2},{"i":"3426673041132121","t":"四娘曾经在《梦里花落知多少》里曾经曰过：在这个明媚而忧伤的三月，我在我单薄的青春里打马而过。在阴风阵阵，下雨后的，降温的，上会计课的，讲材料采购的早晨，突然想到这句话，顿时一个驴打滚听不进课了……","d":"2012.03.23","y":2012,"mo":3},{"i":"3426540757013193","t":"3月22日那啥第四天,再过几天我肯定就数不清了,不记数的人到底怎么学会计阿喵=w=喜欢自己忙起来,能够感觉到自己的成长.虽然在有的地方我还是弱爆了,比如数学比如单反比如会计学,不过慢慢来,把头绪理出来我就能完美清Q了.恩,我会独立的,我会拿起这武器.","d":"2012.03.23","y":2012,"mo":3,"c":1},{"i":"3426472985880512","t":"#未来中国进西部#西南财经大学站。许戈辉开始做主题为【改变】的分享，提到自己在电视台的尝试中开始喜欢这份工作，然后她把“改变”的问题回抛给同学们。有的同学针砭时事，说城管执法为民却未能真正为民；有的同学分享了希望能更包容更“浪漫”，许戈辉正在进行精彩点评。@未来中国官方微博","d":"2012.03.22","y":2012,"mo":3,"c":2},{"i":"3426437694565693","t":"今天中午我妈跟我洗脑让我遁入空门一心考CPA，我却跟她说连会计我都懒得读了。她说：你不先好好学习好好考证好好工作完成资本的原始积累你怎么干自己喜欢的事？快乐是要买的，快乐都是真金白银（对，我妈就是说理姐，理科逻辑帝）。代沟。我却也无法反驳，事实上我也不知道自己喜欢什么什么让我快乐。","d":"2012.03.22","y":2012,"mo":3,"c":5},{"i":"3426432686672338","t":"马克思说“人是社会关系的总和”，恩，说的对，这句话真他妈应该去见马克思。","d":"2012.03.22","y":2012,"mo":3},{"i":"3426311391488200","t":"I love you once. I love you twice. I love you more than beans and rice.  一见倾心，再见倾情，我爱你，此生不渝。——from DESPERATE HOUSEWIVES S8","d":"2012.03.22","y":2012,"mo":3,"c":3},{"i":"3426105858136795","t":"中国典型好学生第三弹：务实不务虚，浮躁，认劳不认怨，毛衣起球，爱用360浏览器和百度，用QQ空间写日志，毛裤党，直筒长羽绒服，说话有地方特色，每次考完试都喜欢说“诶呀，又考砸了，XXX题我明明是会的”，每次拿到卷子都喜欢说“诶呀，XXX题老师给我批错了or老师把我分家错了，我要 子”，今天帆爷在演讲中演绎为“成长为自己想要的样子”，我深以为然。","d":"2012.02.27","y":2012,"mo":2,"c":2},{"i":"3417361325970173","t":"八百年没在KTV里唱过周杰伦，突然唱了一串想起小时候。小学毕业那天和当时的闺蜜去看《不能说的秘密》，两个人就送了《一路向北》的EP。还有一次大人在屋里麻将，我和屁股妹妹就在车里把《七里香》的专辑不停的听不停的唱，动静大得都车震了……我初一为《夜曲》写过小说，在厚笔记本上写了20页。","d":"2012.02.26","y":2012,"mo":2},{"i":"3417357337077002","t":"从十二点唱到五点半阿……哑得我都需要代言人了-_-///从小学六年级的SUPER STAR到初二的《杀破狼》，怎么我们的童年都这么声嘶力竭撕心裂肺呢Q_Q三点总结（我现在每件事都写工作日志……）：①注意点歌排列组合的优化，嗓子打不开效果出不来。②永远别随便唱男生的歌，你永远找不着调。③热水是解药。","d":"2012.02.26","y":2012,"mo":2,"c":2},{"i":"3417252244279473","t":"发微博立志！今年三部曲！不是六级，托福，准备出国！而是90斤，豆瓣卖闲置，开淘宝店！","d":"2012.02.26","y":2012,"mo":2},{"i":"3417008789798911","t":"我在@知乎 回答了问题【你认为幸福与快乐的区别？】: 瘦腰题！ 真是太巧了！这星期的外教课布置作业就是找牛津高阶里HAPPY这个词的全部替换词。为了完成任务，我们这个team就从【快乐】和【幸福】这两个方向来找，大概凑了几十个。 我觉得，【快乐】的典型是EXCITED，而【幸福… 网页链接","d":"2012.02.25","y":2012,"mo":2,"c":1},{"i":"3416999617529098","t":"幸福就是满足感+进取心。","d":"2012.02.25","y":2012,"mo":2},{"i":"3416961000632689","t":"#思想聚会#@思想聚会 @涛哥在成都 万事耕本，我完全同意三农问题不止在农村，也不是只能在农村靠政府解决。农村要改变生产方式，城市也要改变生活方式。农村不止要富，要多发展，更多的和谐与可持续。","d":"2012.02.25","y":2012,"mo":2,"c":2},{"i":"3416868696579329","t":"少吃一顿不会瘦，多吃一顿不会胖，这个世界还好是这样。","d":"2012.02.25","y":2012,"mo":2},{"i":"3416748559087711","t":"你们都当我是浮夸，没人真正懂得。所以我真的什么都不想说。晚安，被眼泪泡得又肥大又无力的冰冷世界，我从何处取暖。","d":"2012.02.25","y":2012,"mo":2,"c":2},{"i":"3416660461579911","t":"学了经济学在慢慢明白买东西不是要买最好的，而是要买能使自己效用最大的。如果你的眼光很高，那你所必须偿付的代价也肯定很高，比如月光，疲惫，饥饿。不过如果一切都是你想要的，那么再怎么都是值得的，你的一切都配置到你认为合理的地方，你是快乐的。学经济学不能让我变有钱，但可以让我会花钱。","d":"2012.02.24","y":2012,"mo":2,"c":5},{"i":"3416322748269781","t":"推荐钱佳楠的作品《星球跳跃历险记》。“历险回来，我口袋里只剩下这些星球了。 V: V星球法律规定不到30岁的人都必须环球旅行，然后选择一个自己最喜欢的地方定居，一旦...” 网页链接","d":"2012.02.23","y":2012,"mo":2,"c":2},{"i":"3416268839684230","t":"以前我觉得有的人把上大学的目的归于找工作是短视的，现在我觉得把工作的目的归于赚钱是狭隘的。昨天职业规划课让画人生鱼骨图，我觉得很难提炼出具有影响力的重大事件。因为我活得不是骨头而是皮肉，没有那么尖锐的转折，但咬下去每一口都有滋味。","d":"2012.02.23","y":2012,"mo":2,"c":2},{"i":"3416159854574554","t":"#记梦器#微积分听不懂来走神说一下昨晚的梦。梦的场景是在荒郊野外的学校，四周都很荒凉，还有眼睛发光的野兽。学校大修，变成了迷宫，还挖了一个大湖一条大河，我好不容易才找到。一个崇拜我的姑娘来找我，我带她吃东西。还有高中时一度跟我很好但最终闹翻的女生。——>春 2011,"mo":12,"c":2},{"i":"3390953193585069","t":"我莫需有的完美主义表现为:若有一丁点的不好,那么我就全盘自暴自弃><!","d":"2011.12.15","y":2011,"mo":12,"c":2},{"i":"3390867117885771","t":"诶，异想天开的废柴们多到无药可救。手里一点货都没有也敢出来卖。这种innocence非常可耻。","d":"2011.12.15","y":2011,"mo":12},{"i":"3390672279383520","t":"你想啊想啊想，想累了就可以想我。我忙阿忙把忙，忙累了就可以找你。所以我们是彼此的owner和support，完全可以搞定，一切都不在话下。","d":"2011.12.15","y":2011,"mo":12},{"i":"3390670677146598","t":"每天都忙得狗血淋头，等忙完这个期末那么我就应该可以荣誉升级beta2.0的蔚蔚了，而不仅仅是2b蔚蔚(ΘωΘ)。加油加油加油，再困难的日子都能熬过去，以后就会好多了。恩，晚安，等待七个小时后的新挑战。","d":"2011.12.15","y":2011,"mo":12},{"i":"3390579820643323","t":"很多事情都和想象中不一样,不过只能被动接受叭,这或许也是最主动的态度了. 不过你现在还不用担心,好好学习就行.该你担心的事未来一件都不会少.","d":"2011.12.14","y":2011,"mo":12,"c":2},{"i":"3390519329733450","t":"在阳光下草地上坐着，这学期最后一节体育课，我们的恰恰结课鸟 ∩__∩y。虽然我是没有腰没有胯把纽约步跳得像做操还逃课两次的傻姑娘，依然非常喜欢，弥补小时候学琴没学舞的遗憾。听巩老师说了很多她跳舞的事，脑袋里一直回荡TWINS《森巴》的旋律，感慨舞者之所以舞都是发自内心的能量释放，真美。","d":"2011.12.14","y":2011,"mo":12},{"i":"3390212352774971","t":"贱贱，其实我真的超佩服你，超好的耐力和耐心，我真的理解你『受够特别了』。我保证，你这辈子都不会再有心力精力再去栽培这样一朵奇葩了。你是悲剧英雄，蛋定。","d":"2011.12.13","y":2011,"mo":12},{"i":"3390067049510041","t":"回忆不能呼吸，但只要有一个切口，就能自顾自的上房揭瓦。很多事如果不提，就一年一年的被树皮越裹越紧越长越瓷实，最终被埋深了就痕迹淡了就忘了。我现在学会用更开阔的视野来看自己，不是宥于一心，困于一己。渐渐的我要学会如何看国家，看世界。IT'S A DAMNLY LONG WAY TO GO.","d":"2011.12.13","y":2011,"mo":12},{"i":"3390063996461400","t":"#我们这十年微传记大赛#2001年，国企改制，许多人下岗买断，爸妈曾考虑学托福移民，终于因为“36岁了，老了，不折腾了”作罢。现如今他们真的老了，46岁，工作稳定但暮气沉沉，妈妈这辈子都没喜欢过地质勘探和石油。今年在搬家时整理出一堆旧书，我想：如果当年我们走了，会不会不一样？","d":"2011.12.13","y":2011,"mo":12},{"i":"3389940142794291","t":"能够为了有趣的事而忙还是幸福的，虽然challenging，但是很锻炼。大学图什么呢，我不要活在别人的传说里，不想感叹谁谁谁是fucking brilliant，我只想让自己变得好一点。讨厌的科目也不挂科，维系好最最重要的感情，做有意思的事并从中收获，主动担当与体验。这就是我要的丰盛不是吗？加油喔！！！！","d":"2011.12.13","y":2011,"mo":12},{"i":"3389918957753761","t":"恩，凡是都有第一次，感觉位高压重有木有，我被揠苗助长了有木有。masterplan喔，从agenda到masterplan，从策划组员到第二负责人，头大，加油！！！！！！我们会呈现一个amazing party！！！！！！","d":"2011.12.12","y":2011,"mo":12},{"i":"3389591207945325","t":"又是新的一周了，大学生活都是以周来计算。虽然并没有神马新鲜的，忙还是一样的忙，茫也是一样的茫。不过现在似乎觉得冰冷的被窝也不是那么难以忍受，形式上的一个人也不是那么折磨。这一周要好好学习，再做行动上的矮子自己都不能原谅自己了。所以，晚安，好好睡，明天全副精力两场演讲两篇论文！！","d":"2011.12.12","y":2011,"mo":12},{"i":"3389482797491017","t":"我在@知乎 回答了问题《何谓大学精神？》: 大学者，大人之学也。分享一下我们学校的【大学精神】叭。经世济民，孜孜以求。（西南财经大学） 我觉得大学是大部分人学校教育的终点，社会生活的起点，最重要的是从孩子过渡到大人，从幼稚过渡到相对的成熟，从依赖过渡到生活…  网页链接","d":"2011.12.11","y":2011,"mo":12,"c":1},{"i":"3389371958647240","t":"我在@知乎 回答了问题《计算机二级证书在找工作时有哪些作用？》: 我觉得证书就是一个门槛的作用，大学生太多了，泛滥成灾，每个人都差不多，只有靠五花八门的证书去【证明自己】大学四年不是玩掉了，而是做过一些正经事的。就好像给你盖个戳【检疫合格，允许屠宰】。 … 网页链接","d":"2011.12.11","y":2011,"mo":12},{"i":"3389065984383200","t":"不怕神一般的对手，就怕屎一般的队友。OH MY GOSH, WHAT A MESS！","d":"2011.12.10","y":2011,"mo":12,"c":2},{"i":"3389052638298799","t":"在成都，误一辆出租车就是误一生呐！！！姐刚刚就是犹豫了一下是不是先去买杯喝的放过了一辆空车，然后直到现在都没打到车阿！！！都快走到了！！！！！！要哭了！！！！！！我在这里：网页链接","d":"2011.12.10","y":2011,"mo":12},{"i":"3388718939009132","t":"每个星期，除了没好好学习以外我还是做了不少事的。不对，不是没好好学习，是根本没学习。T_T，我做了策划写了rundown做了presentation写了papr，结结实实的做了许多事，就是没学习。。。。。。就要期末考了情何以堪！！！！！！","d":"2011.12.09","y":2011,"mo":12},{"i":"3388485287235615","t":"网页链接这支利笔，割破了地铁里多少只真真假假的LV包包。我爱邓小宇。","d":"2011.12.09","y":2011,"mo":12},{"i":"3388371184976525","t":"其实大学不就应该贪玩和体验麼，大家怎么都这样视自由为死敌，视营营役役为靠谱充实。我们迫切的让自己揠苗助长长成大人又有什么好处。应得的成熟圆滑世故时光会帮你完成（不管愿意与否），而你失去的快乐天真却是滚滚东逝不复返。我们总在舍本逐末，最终可悲的变成我们不愿变成的大人。错！错！错！","d":"2011.12.08","y":2011,"mo":12},{"i":"3388369566645366","t":"当一个姑娘自己报名来做你的饭友的时候，take care，她可能只是需要一个尴尬的电灯泡来让她和他不尴尬。不过嘛，对于吃货蔚，I enjoy～","d":"2011.12.08","y":2011,"mo":12},{"i":"3388368408833099","t":"步路丹老师说，我们的同学很奇怪，上了大学，老师都不分数导向型，同学们却重新把自己扔进题海考这考那。盲目考证就是迷茫，就算你cpa了中级会计师了那又怎样，不过是早考了两年而已。这些考证是没有门槛的，所有人都可以，你急什么，为什么不好好享受自己的大学。我们是211的会计，我们不同。","d":"2011.12.08","y":2011,"mo":12},{"i":"3388362482416990","t":"正在会计学院导师见面会，张东老师说：我们会计同学很容易就会计论会计，看书都只看会计，知识面很狭窄。我跟你讲，就连看几本琼瑶都有好处，至少未来给孩子起名都好听点！！！","d":"2011.12.08","y":2011,"mo":12},{"i":"3388311521872173","t":"身为未来踏实的小会计，我却整天向往自由而无用的灵魂，成天看闲书说闲话。要是当初真的让我去了文史哲人类学图书馆学，我肯定又天天报班学ACCA考证了。总之，我就是拧巴，就是不好好学习=_=凸","d":"2011.12.08","y":2011,"mo":12,"c":3},{"i":"3388257246671675","t":"我在@知乎 回答了问题《你们有没有最让你心醉的一部动漫？你为什么心醉？》: NANA。 初一看的，看了前50话。很不一样的少女漫画，当时我也正从女童向少女过度，所以进化成了很不一样的少女（益rz） 好像很 "2010.11.22","y":2010,"mo":11},{"i":"3811743163","t":"复杂的人际小漩涡,一团一团,危机四伏.幸好我在事外,与各种利益集团都不冲突,各种安宁.无心插足任何麻烦,我的成绩已经乱麻一团.很灰心,不过仍旧不得不不得不继续.我没有后路可以退,只能走下去.","d":"2010.11.22","y":2010,"mo":11},{"i":"3802003691","t":"只要一如既往的,做我认为对的事情就够了.I don't CARE,有波动是必然.","d":"2010.11.22","y":2010,"mo":11},{"i":"3794464467","t":"不必患得患失,自怨自艾,成绩只是客观地让你认识自己的不足,让你找到努力的方向.其余一切皆空,提高分数才是一切.要努力,时不我待.","d":"2010.11.21","y":2010,"mo":11},{"i":"3775767689","t":"虽然以我目前的状况,谈不上能上什么特别的Key Univ.但是毕竟还有时间,还有提高,我不相信我命该如此,平凡一生,眼睁睁看着那些庸人占据本不该属它们的位置.我会尽力的,做好自己的事.不去管那些\"刺激\",我知人各有命.而我的路就是这样的,我的远方,\"除了遥远,一无所有\".","d":"2010.11.20","y":2010,"mo":11},{"i":"3773234165","t":"看完<哈7>,眼睛很累.期待明年夏天的下集咯~><!","d":"2010.11.20","y":2010,"mo":11},{"i":"3770000149","t":"紫荆电影院3号厅,9排3号,<哈7>英文版.紫荆永远是冬热夏冷的,现在的空调温度肯定超过20,热得我叉叉圈圈了...><!刚在楼下看到俏江南,感觉也很叉叉圈圈...==!","d":"2010.11.20","y":2010,"mo":11,"c":1},{"i":"3754537563","t":"我待微博的\"政策\"尚不明确,或许时走时留,全凭瞬间心意.现在在这里,也只因为一点点的寂寞情绪.我不想说话,大部分时间都不想.只想隔岸观火,度年如日.","d":"2010.11.19","y":2010,"mo":11},{"i":"3754456657","t":"只要自己快活就好,转发我想看到的东西,不在乎什么粉丝什么的.有人看热闹固然好,剩只我一人也无妨.我只为自己活着,懒得去取悦那些路人甲乙丙,也懒得参加任何互粉活动.这是专属于我的领域,与你无关.","d":"2010.11.19","y":2010,"mo":11,"c":1},{"i":"3718052103","t":"(2/2)要俏、要笑。六不要:不要饿了才吃、渴了才喝、困了才睡、累了才休息、病了才看、老了才锻炼。记得发给你最爱的姐妹哦!via@小象小姐","d":"2010.11.18","y":2010,"mo":11},{"i":"3715915139","t":"一个\"好消息\"喔,11级各位.在明天的第三次月考结束后,我们就迎来了每两周\"月考\"一次的美好生活喔~真美好,还有四次大考和最少四十次小考,人生好销魂,好泪奔,好不羁...(我回四医院去了,这日子没法过了T^T)","d":"2010.11.18","y":2010,"mo":11,"c":1},{"i":"3704157523","t":"每周=每个情绪周期,每到一定时候我都会变成\"咆哮的西瓜\",情绪小崩溃一下==!今天纯粹是因为穿太多,闷得崩溃了...><","d":"2010.11.17","y":2010,"mo":11,"c":1},{"i":"3693292115","t":"我百度到老王的新浪博客,他只在07年写了几篇文章.不得不说,文笔很好.虽然他教历史,虽然因为某些原因他非常\"不得人心\".老王经历了文革上山下乡,又教书30年,风雨辉煌一路.我们是他的关门弟子,但他...他的博客地址:blog.sina.com.cn/wdw501210","d":"2010.11.17","y":2010,"mo":11,"c":4},{"i":"3690219993","t":"屋子里脏乱差程度令人发指,so勤劳(阿呸,真有脸说==!)勇敢善良的俺决定要在周末月考完小小的\"扫除\"一下(本质是能拖则拖,能赖就赖...)~!否则下次我皇额娘移驾过来,肯定打断我的狗腿...><!","d":"2010.11.16","y":2010,"mo":11},{"i":"3676191259","t":"明年夏天,会面临\"B or S\"为主体, N C T G H 多种选择 y":2010,"mo":9},{"i":"2767420325","t":"英语晚自习 看<危情谍战>~!全班\"阿\"了一声,然后又用NCE2经典课文<Better Than Nothing(聊胜于无)>自慰了一下.Now~!Welcome To An Amazing Movie Night~!","d":"2010.09.20","y":2010,"mo":9},{"i":"2765481901","t":"我一直不愿说学校不好,因为觉得这是对自己的降格.因为我毕竟也在这里,这是无法改变的.学校相对于学生是强势的,我们不能改变这里的肮脏丑陋.只能期待迅速逃离,让自己优秀的骄傲的摆脱这个鬼地方.","d":"2010.09.20","y":2010,"mo":9,"c":3},{"i":"2765433895","t":"这个学校为了敛财和整人真是无所不用其极.老师缺乏师德,今天我见识了政教处那帮人的嘴脸,真是让人恶心.赶快摆脱这里叭,垃圾学校.(这是我第一次恶毒的骂学校,但愿会是最后一次,不过我觉得不可能.一再的失望,让人崩溃.)","d":"2010.09.20","y":2010,"mo":9,"c":5},{"i":"2765298767","t":"如果今天晚上英语晚自习要看INCEPTION,我就直接打包回家做数学.本来INCEPTION是值得\"看了又看\"的,但是看电影那天我和老爸出的事故让我不愿再看它,哪怕一眼.@鱼在空中跳舞 你们班看的啥子喔?","d":"2010.09.20","y":2010,"mo":9,"c":1},{"i":"2764769811","t":"25天后生日.我给自己的礼物是<穿Kenzon的女人>+<名牌至上>.17岁,我要有积极用世的姿态和无限的进取心.世间无比美好,我要尽最大可能去获取.Queen V,世界是你的.","d":"2010.09.20","y":2010,"mo":9},{"i":"2764430507","t":"\"The Promise Land,恩许之地(or 应许之地?),<圣经>中上帝应许给西伯来人始祖亚伯拉罕及其儿子以撒,孙子雅各的土地,即迦南.比喻'期望的乐土','希望之乡'.\"(Senior English for China Student's Book 3)","d":"2010.09.20","y":2010,"mo":9},{"i":"2763507495","t":"在中秋佳节来临之际，“东方万里行”愿您月圆人圆事事团圆，人顺心顺事事都顺。祝身体健康，全家幸福，中秋节快乐！[东方航空]","d":"2010.09.20","y":2010,"mo":9,"c":1},{"i":"2762071841","t":"一直很恶心的事拖阿拖阿的会越拖越恶心,但是你终于不得不要去解决.","d":"2010.09.20","y":2010,"mo":9},{"i":"2759538193","t":"学校终于发慈悲把高三的放假安排下发各班了,内牛满面...T^T...周三中午放中秋假,周四晚返校上晚自习.9月30日上完课放国庆假,10月4号晚返校上晚自习.那就正好了~我们家的返程机票定的是10月4号上午~","d":"2010.09.20","y":2010,"mo":9},{"i":"2759340775","t":"我已经困得气不打一处来了,困得要shi,我要倒下鸟=^=...BTW,秋老虎成因是神马阿?老天爷是不是太迫切的要迎接秋分驱赶炎热,所以今天早上才下一阵一阵的暴雨阿??","d":"2010.09.20","y":2010,"mo":9,"c":1},{"i":"2758854589","t":"我再一次梦见有关高考的梦.梦见一股脑发了很多卷子,只有半个小时,而且做完还对答案..Orz...现在外面突然下大雨,不晓得可不可以做完我迟到的借口...","d":"2010.09.20","y":2010,"mo":9},{"i":"2745439385","t":"好叭,如果我的咳嗽只是告诉我我无聊了...Orz...下午冲锋陷阵换装吹空调一直折腾但一声都没咳,晚上却又咳上鸟,诶唷喂.明天七点半起床八点上课,高三也就剩这么一点点特权了.=^=我要睡觉觉鸟~Mu~a~Nite.","d":"2010.09.18","y":2010,"mo":9,"c":1},{"i":"2742582995","t":"在韩记炖品吃完.白果炖鸡 椒麻鸡 米饭 满分.西兰花 服务 速度 零分.刚刮奖刮到5元,我的第一次.","d":"2010.09.18","y":2010,"mo":9,"c":2},{"i":"2741556553","t":" 还没有从梦境中醒来.Now come back to the reality,堵车的成都雨夜,我在回双流的路上.","d":"2010.09.04","y":2010,"mo":9,"c":4},{"i":"2310854223","t":"看着老了13岁的莱昂纳多,说出:I will never jump with u,觉得是被很多人误解了.他的不跳,不是因为他不爱,而是因为深爱.幸福不在记忆里,不在梦境里,而是两个人,在真实的时空里,老去.You jump,I jump是童话般的灾难传奇里.而爱情真实的虚假.","d":"2010.09.04","y":2010,"mo":9,"c":2},{"i":"2310687338","t":"电影结束.Awesome.不管是停留在梦境,还是现实,已经不再重要了.","d":"2010.09.04","y":2010,"mo":9},{"i":"2306417107","t":"紫荆里人满为患,我们七点半这场的观众现在才开始进场,人太多了.90的票价完全不是门槛,成都人民完全不差钱,并且对Inception有极大的热情.成都就是五星电影院太少了.我们在中国银联厅,11排21,23号.这一场英文版,老外非常多.","d":"2010.09.04","y":2010,"mo":9,"c":1},{"i":"2298758611","t":"要不然我在家死皮赖脸赖一辈子就行了.反正家里永远有我14平米的小房间,永远有我的衣柜书柜电脑,永远有科学营养的三餐,永远有爱我的爸爸妈妈.诶唷喂,我自己都把自己煽情到了~^^","d":"2010.09.04","y":2010,"mo":9,"c":10},{"i":"2291255950","t":"感情是一笔债,我偿不起.我不知道自己还会浪掷几次真心,还能再获得几分真意.所以我,还是静下来,等待.或许时间是唯一的答案,我无话可说.","d":"2010.09.04","y":2010,"mo":9,"c":1},{"i":"2290875065","t":"姨妈,你今天再敢疼,我就怀孕给你看,你等着~><!!","d":"2010.09.04","y":2010,"mo":9,"c":8},{"i":"2276594598","t":"作为一只重口味+怪口味控,我是看菜名吃饭的.这两天在巧抄手持抄手,我昨天点了怪味抄手(甜+咸+酸+辣=怪),今天是糖醋抄手(强调一下,糖醋的抄手.)在地下铁点果汁也是,昨天是黑加仑汁,今天是金橘西蕃莲汁...=_______,=全部都很好吃喔~三人行,咬着吸管,肚子饱饱的回学校鸟","d":"2010.09.03","y":2010,"mo":9,"c":1},{"i":"2268500369","t":"Just for this once,let me be sincere in my self.I can no longer love u owing to ur love for me.For this once,I'm sure of NO REGRET.","d":"2010.09.03","y":2010,"mo":9,"c":7},{"i":"2267829068","t":"一直都是你说我听,你带我走.我一直没有找到角色,即便现在也无法进入状态.我贪恋你对我的好,宽容 情话 道理 温度,我也真的列举不出更多,这些东西现在对我也失去意义.除了\"你还在爱我\"这个理由,我再没有别的借口与你交往.我们之间从来不是小孩子的游戏,但是可能我对你也一直不是爱情.","d":"2010.09.03","y":2010,"mo":9,"c":4},{"i":"2267470503","t":"与你在一起的记忆对于我是最糟糕的,因为被动,因为盲目.但是因为它也算是\"最\"字头,所以我放不下.现如今我也没有什么不能说清楚的了,不存在碍于面子与否.你与爱与记忆的存在,对于我是灾难.之所以对你仍旧挂念,不是因为你,不是因为爱,只是因为我自己的缘故.我爱我自己的感觉,绝非是你.","d":"2010.09.03","y":2010,"mo":9},{"i":"2248187250","t":"好悲催,我爸刚收到政教处短信,说本周日要正常上课~!也就是说这个星期只放假7h...学校真有人性阿.","d":"2010.09.02","y":2010,"mo":9,"c":7},{"i":"2239441889","t":"要不星期六我和老爸去紫荆看<盗墓空间>叭,我请客他买单咯~(事实上是我想吃俏江南了...)因为下个星期不我在成都,下下个星期再陪我妈去看<山楂树之恋>(是0912上映?),我妈超级爱,从书到广播剧她都追了 是.我确定自己不想与他回到过去,也确定自己不能失去他.尽管现在我并不知道我想从他身上得到什么.","d":"2010.08.25","y":2010,"mo":8},{"i":"1995048533","t":"#微博改变生活#我是去年九月在豆瓣拿到邀请码注册的.微博吸收了我生活的点滴,是真正的流水帐纪念本.上周末还在整理我的微博记录,我就这么跌跌撞撞的,从高二走进高三,还会一直走下去.微博是对于我Best companion.而且是我的Lifestyle.","d":"2010.08.24","y":2010,"mo":8},{"i":"1990038579","t":"补课期间竟然要上体育课阿,没天理没天理.","d":"2010.08.24","y":2010,"mo":8},{"i":"1986986961","t":"我们应届生和复读生比是不是很吃亏阿.","d":"2010.08.24","y":2010,"mo":8,"c":4},{"i":"1980095052","t":"在雾中散步真是奇妙/一木一石都很孤独/没有一个人了解别人/人人都很孤独.(德_黑塞)","d":"2010.08.24","y":2010,"mo":8},{"i":"1975498838","t":"哼。你就是只猫，懒，但是感兴趣的鱼儿一出现就活泼的要死。(From William-原来他是懂我的.)","d":"2010.08.23","y":2010,"mo":8},{"i":"1973631892","t":"在古代,我们不短信,不网聊,不漂洋过海,不被堵在路上.如果我想你,就翻过两座山,走五里路,去牵你的手.(via@胡淑芬)","d":"2010.08.23","y":2010,"mo":8,"c":1},{"i":"1948709092","t":"今天站在即将交房的新家,想象未来我新房间的模样,粉嘟嘟是我从小到大的啦.不过等明年六月拿钥匙,我都已经高考完要上大学了,除了寒暑假就不能回家.高一离开爸妈去天津是假离开,而马上就要真离开了.,我们家的成都三周年纪念日.","d":"2010.08.22","y":2010,"mo":8,"c":1},{"i":"1944780986","t":"今天还是21:30就放学了,因为教务处没有提前通知.刚刚在路上看到有人烧纸,明天23号是我们家搬到成都三周年的纪念日,我爸妈可能要过来和我一起吃饭.后天是鬼节七月半,竟然还那么晚放学,好吓人喔. T^T","d":"2010.08.22","y":2010,"mo":8,"c":4},{"i":"1923719792","t":"#丹东~鸭绿江~洪水#刚看<中国财经报道>还看到丹东的新发展呢.","d":"2010.08.21","y":2010,"mo":8},{"i":"1909528088","t":"到家了到家了,阿,我快饿死了.刚在车上听FM.101.7,听到四川宣传歌,啥啥啥\"四川欢喜你,四川欢迎你\",把我和我爸都吓到了,好雷人.","d":"2010.08.21","y":2010,"mo":8,"c":1},{"i":"1907766906","t":"@toplyc,覃朗好过分~!他说:你们班130~140的都走了,我根本就不想再教你们班了.我们好生气~!","d":"2010.08.21","y":2010,"mo":8,"c":4},{"i":"1907331911","t":"覃朗等假期里代表学校去清华大学参加全国课改教师培训,他给我们传达一个信息,高考数学从来不求\"难偏怪\",明年高考数学绝对比今年简单.但求\"通形通法\"的熟练运用.尤其是注重知识的文数,要认真对待基础,并且\"举一反三\".","d":"2010.08.21","y":2010,"mo":8,"c":1},{"i":"1903892008","t":"成都又在大雨,雨声嘹亮,雨滴饱满.Anyway,今天下午就可以放假回成都啦,应该是三点左右.唔唔唔~~早安.","d":"2010.08.21","y":2010,"mo":8},{"i":"1872362085","t":"今天班里插进的复读生的自我介绍非常触动.某某就说:我知道在座各位都心高志远,没有人愿意再接受心理煎熬再读痛苦的高四,所以大家一定要抓紧每一分每一秒,后悔是不可能让你进大学的.其实能进我们班的复读生都是一本上下的分数,他们也很优秀.他们的成熟会给九班的热血增温~!","d":"2010.08.19","y":2010,"mo":8},{"i":"1870454079","t":"请高人帮解答:P={(x,y)|y=k(x-1)+1,x y是实数},Q={(x,y)|圆心为
