的睡眠~","d":"2010.03.15","y":2010,"mo":3},{"i":"71633024","t":"全班在看<福尔摩斯>,很遗憾我看过了,所以就用手机照着写英语.明天英语考试,又是一桩麻烦事.刚杜宝宝给我发信息来,说想我了,还夸我一大通~我脸红了~呵~我亲爱的小姐妹~Mu~a","d":"2010.03.15","y":2010,"mo":3},{"i":"71506964","t":"我不是最好的,我没有很厉害,甚至没有特别所向披靡的优点.但是我在努力着,我在实现对于自己的改变.我在亲手建立我的未来,未来的我不会后悔现在,我做到这样就很满足.加油~尽快现在前路未明,但是心里有希望,就可以照亮~我可以的~","d":"2010.03.15","y":2010,"mo":3,"c":1},{"i":"71499631","t":"作为高中生应该充分理解所谓\"总分\"概念,所谓高分就是高能的概念.作为每个个体,要充分意识到我是谁,我的能力是多少,我可以有多少潜力.认真对待学习~认真对待自己.我讨厌语文数学政治,但我有责任去学去学好.同时对于英语历史地理也没有理由去轻视.加油~高考就是硬道理~","d":"2010.03.15","y":2010,"mo":3},{"i":"71235316","t":"我害怕自己被质疑,但又无法确定和肯定.我的行动力似乎没有我现象中的强,并且意志力没有被调动,只是依赖某种惯性继续生活.我没有找到改变的契机,这很麻烦.我担心这是难堪的状况.","d":"2010.03.15","y":2010,"mo":3},{"i":"71230850","t":"莲:要拥有信念,相信着自己想要的一切.我看着这信息,心情却是低落的.觉得自己陷入某种被动,无法掌控的局势.我对自己存有怀疑,对周遭来势汹汹的人有恐惧.我知道我要,但同时又在对自己说不.我看不懂自己,觉得累且盲目.","d":"2010.03.15","y":2010,"mo":3,"c":3},{"i":"71010518","t":"覃朗在28班说:我给你们下死命令,哪个十一点以后才睡,我咒他不健康~!   我们全班沉默了...","d":"2010.03.15","y":2010,"mo":3},{"i":"70878971","t":"我习惯蜷缩侧睡,但这似乎意味着某种不安全感.有种说法是熬夜可以让头发快长,不晓得理由是什么.不过太晚睡伤身体倒是,我每晚睡觉时间都错过肝排毒,这是健康隐患麽?","d":"2010.03.15","y":2010,"mo":3},{"i":"70864860","t":"晚安.我不会纠缠不需要答案的问题,但是我会给自己一个答案.我不能被自己戴上的面具迷惑了,孰真孰假要有分辨.坚持脚下去往远方的路,这是我的担当.","d":"2010.03.14","y":2010,"mo":3},{"i":"70862657","t":"觉得我并不晓得自己寻找和盲目的原因,觉得自己是苍白的,所以患上失语症.觉得欲望在某种程度上是幸福感的缺失,我不确定我的理想可以让我快乐,我不晓得它是不是我的兴趣.但我只能费心费力去靠近它,以求获得真实了解.我不希望自己会失望.不论如何,坚持SHISU&SHUFE的念头是我当前存在的全部理由.加油~","d":"2010.03.14","y":2010,"mo":3,"c":1},{"i":"70780322","t":"这大概又是新一轮降温的开始.寒冷坚持,温暖就无法停留.要折腾多次,才能彻底改换成春天的面孔.不过气温总是会回升的,事物的发展道路是前进性与曲折性的统一.","d":"2010.03.14","y":2010,"mo":3,"c":1},{"i":"70548930","t":"老王在上班会,给我们打PPT看他2001年8月的<班主任>上的<宽容>(现名为<我的学生是我仇人的女儿>).","d":"2010.03.14","y":2010,"mo":3},{"i":"70422716","t":"正在收东西。要把卡换回Ice Cream去了。我还是没有找到耳机。这星期不要再忘记什么了。一会儿去洗澡。六点之前出发。","d":"2010.03.14","y":2010,"mo":3},{"i":"70406670","t":"每周末在双流和家之间带来带去的书们总有几本根本来不及看。事情总是那么多，周末总是那么少。估计最早半期最晚下学期开始就要把周末假变成月假。不晓得怎么熬过去。","d":"2010.03.14","y":2010,"mo":3},{"i":"70287175","t":"计划三点半之前起床，把政治题做完，语文也尽量看看。我总之怠慢语文，所以没有好果子吃。现在，午安。","d":"2010.03.14","y":2010,"mo":3,"c":1},{"i":"70232629","t":"窗外天青欲雨模样，今日温度陡降。","d":"2010.03.14","y":2010,"mo":3},{"i":"70073546","t":"@川鼠鼠，我突然想起个事。外国语学校男生少，所以男生报考相对容易得多。就像同样面试四大，女生要求比男生高。男生只要成绩过得去长得不太丑就可以被录用。你报上外成功率应该蛮高。","d":"2010.03.14","y":2010,"mo":3,"c":4},{"i":"70049675","t":"莲宝贝在纠结高口去昂立还是NOS，我似乎听说昂立要好一些，以后我要去昂立把高口拿下~在上外进四大似乎比较多，就算考去英语系也没关系。要是在东北片就去上财辅修会计，要是在松江就拿双学位。上外是志在必得的~奋斗叭，蔚宝~明年你要收获你的上外和你的长头发~","d":"2010.03.14","y":2010,"mo":3},{"i":"69993261","t":"去年的今天，下午与某人会面完毕，就在山西路门口的花店买了一支白蔷薇。拍下来发给莲姑娘。后来将它放在平安夜“偷”来的香囊里，连同之前某某人给我折的纸玫瑰，挂起来。不晓得现在它还在不在，应该是被孙雪萌丢了。","d":"2010.03.14","y":2010,"mo":3,"c":3},{"i":"69916906","t":"事实是这样的，我现在清醒的抵达了白色情人节。去年的今天，某人送我两盒明治和一瓶叫春田的花。我和他站在风里聊了很久，只是完全依赖性质的朋友。我的信任与托付都是消费品，我清醒的感觉自己一层层戴上冷漠的面具。今天不能遇到表白，没有人陪伴祝福，但是我爱我自己，这就足够。晚安。","d":"2010.03.14","y":2010,"mo":3},{"i":"69688858","t":"为了保证作业质量，我决定休息，休息一下~到此为止了~明天继续奋斗~","d":"2010.03.13","y":2010,"mo":3,"c":2},{"i":"69615656","t":"莲姑娘说，她一向需要一些危机感来警醒自己努力。我们本来的人生轨道完全不同，但只是因为她是莲，我是安安，我们都热爱未来，热爱自己，所以紧密的结合在一起。她会去往VISION或奥美，而我一定要在四大中建立自己的事业。上海会是我们共同的起点，我们相爱。","d":"2010.03.13","y":2010,"mo":3},{"i":"69501315","t":"青红白   网页链接","d":"2010.03.13","y":2010,"mo":3},{"i":"69457383","t":"回到车上,FM.102.6在放王若琳.高三也是这时候放学,放一个下午一个晚上,明天继续上课.很多车来接,和我们一样回成都.","d":"2010.03.13","y":2010,"mo":3},{"i":"69395374","t":"要做Shero,我的大女人主义.课间休息,BaboonLo把Shero蓝牙给我.\"为自己赴汤蹈火~\"","d":"2010.03.13","y":2010,"mo":3},{"i":"69318659","t":"太阳不大,不用打伞.出单元门就闻到一股专属成都的热起来了的味道.感觉很舒服,我觉得我可以清楚辨别这个城市的情绪态度,所以我爱它.Mu~a","d":"2010.03.13","y":2010,"mo":3},{"i":"69287230","t":"一点半之前出发，又回双流上课。","d":"2010.03.13","y":2010,"mo":3},{"i":"69109577","t":"@川鼠鼠，我建议你选择西财。首先，西财签约可以保证你去它的最好专业。其次，西财真的很好，全国大部分银行中高管都是西财校友。再次，本科学历不重要，西财机会那么多，你将大有可能出国深造，研究生学历最重要。最后，西财也是我的底线选择，能留在成都对我来说也很好。你觉得呢？","d":"2010.03.13","y":2010,"mo":3,"c":10},{"i":"69098281","t":"最初我同莲姑娘在Sina Blog遇见的时候，我还没有那么折腾。当初和她共用过一个她制作的关于娜娜的模板。现在我们落户在Blogbus,且合二为一了，也由她来做模板（我对代码那些拎不清…），想要将主页上干净的留着文章和音乐，其他什么都不要。","d":"2010.03.13","y":2010,"mo":3},{"i":"69090775","t":"上海是魔都,是斗兽场.所有人都渴望获得名利与快乐.所以制造无穷尽的战争,所以建立我们自己的时代. 《郭敬明的《小时代》：给“小时代”一个形象》  网页链接","d":"2010.03.13","y":2010,"mo":3},{"i":"69089795","t":"我充分的被起床了~><奋斗作业是我逃离被窝不得不的理由~下午还得回双流上课和拿充电器.BTW讲个笑话,双流的建设目标\"国际田园空港大城市\"~好笑不?~","d":"2010.03.13","y":2010,"mo":3,"c":2},{"i":"68798704","t":"2008年上海财经大学在云南录取本一批文科生15名，会计学录取平均分623.加油~蔚宝。这就是你的希望所在~","d":"2010.03.12","y":2010,"mo":3},{"i":"68792831","t":"2010级。香港中文大学招生咨询会：3月29日(星期一)，云南师大附中。香港大学招生咨询会：03月12日 12:30-14:00 树德中学。","d":"2010.03.12","y":2010,"mo":3},{"i":"68751899","t":"书写没有收件人的信心，也是过去我的习惯。太深情的话没有目的地，太无情的话也碍于面子。连同一闪而过的小念头，一起塞进草稿箱。等着它们生长，搁置，然后变质，删除。","d":"2010.03.12","y":2010,"mo":3,"c":2},{"i":"68741352","t":"i said its too late to apologize, its too late id take another chance, take a fall take a shot for you and i need you like a heart needs a beat but its nothing new","d":"2010.03.12","y":2010,"mo":3,"c":2},{"i":"68739140","t":"看到明里在车站送别贵树，想起娜娜在车站分别莲。她在车上给了莲长长地吻，又在车门关上前一秒跳出车厢，跪在雪地里哭泣。我给人的道别，第一次在电话里，听到对方嘈杂的背景音。第二次一个人走在路上，他不来送我。第三次我欺骗了那个孩子，再也没有回去，并且弄丢了他给我写的爱心。","d":"2010.03.12","y":2010,"mo":3},{"i":"68735883","t":"贵树：我知道在以后的日子里，我们不能一直在一起。在我们面前，横卧着漫漫的人生长路，和无尽的时间长河。但是，占据心中的不安却渐渐消融。最后，只剩下明里柔软的嘴唇。","d":"2010.03.12","y":2010,"mo":3},{"i":"68728547","t":"贵树：时间带着明显的恶意，从我身上缓缓流过。","d":"2010.03.12","y":2010,"mo":3},{"i":"68714713","t":"用红色的笔在地图上做标记。虽然我们的距离已经远到有时间相差，但是能够在全世界找到你的所在，也是我的梦想。我爱你。","d":"2010.03.12","y":2010,"mo":3},{"i":"68708761","t":"圆满完成同伴互助题，乖乖看我的《秒速五厘米》。PS：5cm/s是樱花坠落的速度。","d":"2010.03.12","y":2010,"mo":3,"c":2},{"i":"68696661","t":"热烈推荐。同伴互助题可以出得更简便~ 网页链接  网页链接","d":"2010.03.12","y":2010,"mo":3},{"i":"68679611","t":"网页链接 新海诚《秒速五厘米》。我和莲都喜欢的新海诚，大师中的大师。","d":"2010.03.12","y":2010,"mo":3,"c":2},{"i":"68663395","t":"爸妈去逛宜家，我被丢在家里。等下出同伴互助题，高人们从哪里下载高考模拟考真题？然后看电影。我又把充电器忘在了双流，但我明明记得我已经把它丢进包里了的。真是诡异的事，我肯定巴豆哥哥上身了~","d":"2010.03.12","y":2010,"mo":3},{"i":"68650015","t":"网页链接《云影天光》，献给我的莲姑娘。我爱她。","d":"2010.03.12","y":2010,"mo":3},{"i":"68363165","t":"今天不能丢三落四的了~一定要调好闹钟,带齐东西~对我来说回家=度假,虽然爸妈都觉得周末他们的劳动强度比上班大多了,哈~我爱爸爸妈妈~我爱我家~","d":"2010.03.12","y":2010,"mo":3},{"i":"68057342","t":"@MajGuderian,有些话我写在这里就是为了不和你吵,我希望我们和谐一点.就像不要每次都为了hk那点小破事快掐起来一样,没意义.我知道我们是完全不同的人,不对立几乎不可能,但我上微博就是为了寻开心,你不开心了我没办法.我要说的说完了,你爱怎样就怎样.","d":"2010.03.12","y":2010,"mo":3,"c":3},{"i":"67957306","t":"把学习当成生活里的全部,去接受,去认可,然后lead the life.我有责任要制造培养更好的自己.加油喔~蔚宝~","d":"2010.03.11","y":2010,"mo":3},{"i":"67943158","t":"早睡早起好宝宝.明天周五,但因为不能回家所以并没有特别感觉.做英语就是要多做手才顺才有手气,同理对于数学.今晚还是做了不少题目,值得表扬~明天下午爸妈过来,去吃芭夯兔?小天鹅?总之不去老妈兔头,腻死了.","d":"2010.03.11","y":2010,"mo":3,"c":1},{"i":"67808103","t":"莲呐,我爱你.这夜里灯下的跋涉,都是为了去往你的所在.我们相爱3年,在你之后我对人的心意一杯淡过一杯.在我见证你的蜕变之后,你也在等待我的答案.我不会令你失望,不会令哈雷和北北失望.我爱你们.","d":"2010.03.11","y":2010,"mo":3,"c":2},{"i":"67707267","t":"我不稀罕当则天大圣皇帝了~事实证明我是向量巫婆~我Master空间向量~百战不殆~我爱向量~","d":"2010.03.11","y":2010,"mo":3,"c":1},{"i":"67646799","t":"晚上发信息问问刘特课程安排.上全部的课没必要,但也不坏.反正都是我们自己班的老师上课,英才九班肥水不流外人田.我妈说的对,只有分数是唯一主动权.不必考虑哪些学校不招哪些学校不好,只有你有分数在手,你才可以理直气壮的作出选择.","d":"2010.03.11","y":2010,"mo":3},{"i":"67643088","t":"刚妈咪仔细跟我分析了培尖班,我还是应该去上,但可以不用全上.政治是我文综弱项,它拖累我20分,而我的历史地理已经没有什么上升空间了,毕竟不可能满分.数学最重要,我现在不好不坏的状态很难维持.这两门必须要去上课.","d":"2010.03.11","y":2010,"mo":3,"c":4},{"i":"67622530","t":"对世界的企图与你愿意为此付出多少的冲突,构成眼高手低的杯具.","d":"2010.03.11","y":2010,"mo":3},{"i":"67618536","t":"我在担心培尖班会成为鸡肋.不然我们班那么多尖子生不会无顾缺席.我觉得我一个人做题效率也很高,我不需要人专门督促我现在做什么然后做什么.但是自己学多少又有盲目性,我的数学最近似乎有提升但只是因为向量掌握得好.但英语却无缘无故下降了,很着急.","d":"2010.03.11","y":2010,"mo":3},{"i":"67321626","t":"我妈全力支持并极力怂踊我参加培尖班课程.上学期因为分数漏加失去参加机会的时候她还跟老王据理力争过.她要我每个星期都参加,等于说每周都周六晚上才回成都,并且基本放弃上网时间.我无语.","d":"2010.03.11","y":2010,"mo":3,"c":10},{"i":"67252715","t":"如果做不到Ectomorph,那么就让我做Lily Allen这个骄傲,让人又爱又恨的小胖妞叭~@wasabii","d":"2010.03.11","y":2010,"mo":3},{"i":"67136189","t":"我在纠结着Top20培尖班的事.刚巧娘骂人了,说是我们班骄傲自满居然集体缺席培尖班课程.我在想我也应该去上这课,最近太松散了.只是觉得培尖班课程要牺牲周五晚上和周六全天,有点不愿意.不过,这种牺牲是值得的叭?","d":"2010.03.11","y":2010,"mo":3,"c":3},{"i":"67045473","t":"昨晚梦见,我可爱的伟大的母亲大人也开始玩微博,还有她的同学党(@蝉时小雨,包括你爸),然后我就开始躲.还梦见去一家很不错的小店,似乎是和BaboonLo,点的东西太多了,所以吃不了兜着走了.服务员神色一直古怪.","d":"2010.03.11","y":2010,"mo":3,"c":1},{"i":"66950236","t":"听着Innocence入睡,这首歌绝对可以划入治愈系~今天起倒春寒退去,夜间4~17度,希望这是本学期我开电热毯睡觉的最后一次~今天遇到了不太好的事,但并不是过不去的坎,完全可以解决,只要调整好自己.我的每一天活着都是为了第二天的继续,为了梦想的跋涉.","d":"2010.03.10","y":2010,"mo":3,"c":5},{"i":"66823691","t":"一个棱柱成为正四棱柱的充分条件?是\"底面正方形,相邻两个侧面是矩形的四棱柱\",还是\"每个侧面都是全等的矩形的四棱柱\"?@MajGuderian@川鼠鼠","d":"2010.03.10","y":2010,"mo":3,"c":3},{"i":"66632970","t":"说会计学的时候居然没说上财?为什么?西财会计好吗? 《24个最容易被误解的高考专业解析》  网页链接","d":"2010.03.10","y":2010,"mo":3},{"i":"66608509","t":"觉得必须调整自己的心态,我是做不了做不到也不能做坏孩子的.叛逆对抗只是一时之快,而我必须有足够长远的考虑.我需要自己做与世无争甚至像巴豆哥哥那样道貌岸然伪君子样.我必须为了得到我要是的东西而有所取舍.","d":"2010.03.10","y":2010,"mo":3},{"i":"66602268","t":"我是极容易把小事化大的人,遭遇小颗沙砾就仿佛被高山阻挡,觉得天不容我.但事实是我并不是为了这事觉得不是滋味,就是觉得什么被阻挡了,循环不畅.","d":"2010.03.10","y":2010,"mo":3},{"i":"66386799","t":"我希望过去的就不留痕迹,So I make it.所以\"怀旧\"就是简陋的笑话.生活的轨道永远是单行向前,当你对那些人念念不忘,人家可能只把你当笑谈甚至不会想起.所以我宁愿修炼的越来越冷漠,不去想起谁,也就不担心会不被谁想起.","d":"2010.03.10","y":2010,"mo":3},{"i":"66383738","t":"阳光太好,在成都晒太阳是奢侈的事.我还是经常把天津的事误认为\"只是上学期发生的\".再有三四个月就是\"离开天津一周年\",值得纪念,因为我再也不会回去了.","d":"2010.03.10","y":2010,"mo":3,"c":2},{"i":"66327558","t":"春光如此明媚~但我还是必须进行周三中午的例行纠结:下午第一节体育课,逃不逃?每次都下定决心不去,最后又灰溜溜跑到运动场,矛盾的杯具...","d":"2010.03.10","y":2010,"mo":3,"c":5},{"i":"66241508","t":"When I am be ur side,it is like a button inside the body been turn off.If u know what I mean...From Antonio","d":"2010.03.10","y":2010,"mo":3},{"i":"66223282","t":"三月刊的<最小说>,发现自己没有哪一篇能够读下去,为什么?我怎么了?","d":"2010.03.10","y":2010,"mo":3,"c":3},{"i":"66171761","t":"覃朗就是要造成这样一种局面,他不鼓励我们用向量法,而是要死扣传统方法~他让我们产生一种错觉,用向量法都是思维不行的.这是不对的~拿到分才是王道~","d":"2010.03.10","y":2010,"mo":3},{"i":"66085947","t":"Teamwork前后两排互相背诵.在被欣然兄的日式发音轰炸以后,我露出蒙娜丽莎的微笑,觉得我的听力又到了一种新的境界~","d":"2010.03.10","y":2010,"mo":3,"c":1},{"i":"66044274","t":"今天4~14度北风转南风.我梦见一个男的在给我做心理测试,他问完了我所有的题目,正在算分,然后我醒了.","d":"2010.03.10","y":2010,"mo":3,"c":4},{"i":"65970302","t":"我知道矛盾具有普遍性.在渴望得到关注的同时就必须付出被别人误读和看透的风险.想要专注就必须放弃一些不必要的热闹.我正处在这样一个必须以行动说明一切的阶段,不能天真愚蠢懒散,在努力的时候一定要心无旁骛.我是枕着梦想入睡的,我明白自己.","d":"2010.03.09","y":2010,"mo":3},{"i":"65712351","t":"两人成虎是什么?我们同桌三人一起做数学.巴豆哥哥:第三题选什么?我:A.巴豆哥哥:杂我选B叻?BaboonLo:我也选A.巴豆哥哥:...好嘛,真理总是掌握在多数人手中,那就选A嘛...","d":"2010.03.09","y":2010,"mo":3},{"i":"65619677","t":"是我的手机出问题了吗?但明明可以登陆Gmail吖,怎么一点微博就Forbidden呢?难道微博遭遇霍艳写的\"饭团\"厄运?","d":"2010.03.09","y":2010,"mo":3,"c":1},{"i":"65592279","t":"刚不自觉又在优化方案的答案上签名Men9,感觉怪怪的.然后又签了Maxine,才感觉是现在的自己.monami后遗症~","d":"2010.03.09","y":2010,"mo":3},{"i":"65510889","t":"@Vista看天下,还是这期杂志,P116<脱俗相亲>,四大的素颜丫鬟那得是魔都女性中的极品段位呐~我的目标~我的未来~But我不喜欢吃软饭的小海归,我喜欢马文才~","d":"2010.03.09","y":2010,"mo":3},{"i":"65464943","t":"<看天下>2010年第5期P90标题<去越南捞个极品媳妇>,上面有一则广告:越南新娘介绍,三个月包娶到家,20万,保证处女,一年内跑掉赔一位.我觉得好悲哀.","d":"2010.03.09","y":2010,"mo":3,"c":8},{"i":"65413881","t":"我要为我自己的混乱找借口,不能让自我批评把情绪逼落低谷.首先,我的饮食结构混乱了,我需要整饬健康规律的食谱来维生,不然我会在这早春就把自己折磨死.其次关于衣服,还是要细致的打扮起来,不修边幅是有罪的可耻的.我要重新精致元气起来~","d":"2010.03.09","y":2010,"mo":3,"c":3},{"i":"65334313","t":"对于自己和生活都有隐约的失望(是这个原因?),所以沉默了,表现为轻度自暴自弃.不想劳心费神在吃穿用度上,埋怨时间太短又太长,体内厌倦荒费的懒又生长.我不知道自己可以期待和等待什么,学业上的目标觉得苍白了.这是太近又太远的路途的中间,我迷路了.","d":"2010.03.09","y":2010,"mo":3,"c":1},{"i":"65235467","t":"关于Jules Verne,某人应该会了解很多.虽然小学一年级胡诌过要当科学家,但我对科研完全没兴趣,不过我完全接受非常支持应用最新科技~","d":"2010.03.09","y":2010,"mo":3},{"i":"65186665","t":"跑操结束,我和BaboonLo都感觉喝了一肚子冷风.文科班跑内圈理科班外圈.理尖班那些精力充沛的疯子,还有力气喊口号...我们班跑到一半就完全没有方阵这种概念了~","d":"2010.03.09","y":2010,"mo":3,"c":1},{"i":"65130667","t":"我:你这星期又留校?又冷又闷又无聊,你不想家?巴豆哥哥::男生和女生完全不同啦~女生可以恋家,因为你们以后毕竟是要别人养的,男生就不行了.","d":"2010.03.09","y":2010,"mo":3,"c":4},{"i":"64933033","t":"刚百度了阿Sa<知己>的歌词.是你让我相信未来的路,偶尔孤孤单单却不孤独,是你让我有种久违了的暖暖幸福.Sa&Gill-Twins呐,你们永远都要幸福的在一起~一起唱歌一起跳舞一起微笑~我爱你们~永远支持~Mu~a","d":"2010.03.08","y":2010,"mo":3},{"i":"64826009","t":"巴豆哥哥的简称是PS(Public Servent),因为他是班长语文课代表英语课代表历史课代表计算机课代表多媒体管理员...在九班,有困难,找子希~","d":"2010.03.08","y":2010,"mo":3,"c":5},{"i":"64647006","t":"老爸说今晚气温会降到0度.Gosh,双流这边衣柜里只有两件高领毛衣的储备,但我现在穿的是棉衬衣和V领毛衣,加不进去呐...只有让爸妈把毛外套大衣这些送过来了,不晓得他们有没有时间...?","d":"2010.03.08","y":2010,"mo":3,"c":2},{"i":"64636304","t":"快讯说今天夜间成都11~4度,这倒春寒越演越烈?","d":"2010.03.08","y":2010,"mo":3,"c":3},{"i":"64544300","t":"刚刚才晓得我和我喜欢的内只孩子用的是同一款mp4,也觉得莫名其妙的幸福感.将播放列表设成<月>里头的四支曲子循环.他在听什么?","d":"2010.03.08","y":2010,"mo":3,"c":1},{"i":"64488433","t":"@女生有时候有一种愚蠢的甘愿,传说中的爱情作祟,让你觉得你可以将自己的全部都给他,你是归属于他的.你可以和他做爱,付出你的Virgin,但你不能作出危险行为,不能意外怀孕,要做好保护措施.你还不是他的妻子,他可能在任何时候抛弃你,你不能因为一次爱情牺牲一辈子.","d":"2010.03.08","y":2010,"mo":3,"c":1},{"i":"64334903","t":"高考结束以后的旅行,想要乘火车.云南好像有米轨?昆明-河内-呵叻-曼古-清迈.不过我妈总觉得东南亚太色情,西藏太危险,很难被批准.","d":"2010.03.08","y":2010,"mo":3,"c":1},{"i":"64266774","t":"我满眼桃花的说:基德大人好帅~巴豆哥哥就眨着他纯净的大眼睛,基德是谁吖?和基督什么关系?我:...","d":"2010.03.08","y":2010,"mo":3,"c":2},{"i":"64225624","t":"最令我羡慕的情侣不是外型出众很拉风的,而是成绩优异感情美满将来考同一所学校的.比如我们班的\"人大情侣\",我羡慕得都要流哈啦子了><","d":"2010.03.08","y":2010,"mo":3},{"i":"64175049","t":"现在心理课做活动~一张华西都市报上可以站几个人?天才的杨小羊小朋友把报纸撕碎了每人发一张~还有一个host让本班十个男生左拥右抱一个~","d":"2010.03.08","y":2010,"mo":3,"c":2},{"i":"64067948","t":"事实是昨晚我做了很欠扁的梦.我梦见小哀死在柯南怀里,但柯南之后变回大人却没有和小兰在一起,他爱上了步美...的确混乱.我的梦杂乱,刚不愿起床,心里想着,让我把这个梦结尾叭~","d":"2010.03.08","y":2010,"mo":3,"c":4},{"i":"63965509","t":"噜啦啦噜啦啦噜啦噜啦叻~顺利的快狠准攻克一道全国二的压轴题~心情美美~安心睡觉~","d":"2010.03.07","y":2010,"mo":3,"c":5},{"i":"63923641","t":"monami的深红色,近似红褐血色,曾是我和瑞的最爱.我们曾经给对方写信,甚至写在镜子,桌子,白瓷砖,烟盒上.密密麻麻,惺惺相吸.我们签自己的名字,Men9,Jun9,作为给彼此的亲吻.那是2008年秋天,没有人回得去.","d":"2010.03.07","y":2010,"mo":3},{"i":"63905637","t":"呵,微博现在成了淘宝卖家的广告阵营了哈.各位掌柜真是用心良苦.不晓得成果如何?","d":"2010.03.07","y":2010,"mo":3},{"i":"63786211","t":"巴豆哥哥:你不要逼我,你逼我我就自恋给你看~从今以后你是小葵我是小新,我要天天欺负你~我:你在说梦话吗?巴豆哥哥TAT","d":"2010.03.07","y":2010,"mo":3},{"i":"63689846","t":"决定这个星期彻底的低调,不笑不闹了.我要乖乖的.老爸今天跟我说,感觉这学期你要轻松一些了,这个周末还看了电视.我也不知道怎么回事,周末带来带去的书都少,还会忘记很多东西.怪怪的,诶.","d":"2010.03.07","y":2010,"mo":3},{"i":"63632450","t":"今天居然出发那么早,郁闷.又换回Ice cream来用了,所以标点符号又残疾了.诶...心情低落.我的恐双流症...><","d":"2010.03.07","y":2010,"mo":3},{"i":"63612918","t":"用5200最后发一条微博，不知道下次又要什么时候才再使用了。六点前离开成都去双流，周末总是太短了，又是倒长不短的一周。诶…","d":"2010.03.07","y":2010,"mo":3,"c":11},{"i":"63482215","t":"当我在写数学…妈：走，我们一起去做脸。我：算了，我数学还有一张卷子。妈：学得好不如嫁得好，你看你皮肤蹉跎的…我：…","d":"2010.03.07","y":2010,"mo":3,"c":3},{"i":"63466024","t":"时间有奇妙的形状。去年的两天前给莲姑娘打电话，思忖了整晚要如何安慰她。现在的二十天以后，外公外婆要到成都来，短暂停留以后清明前回自贡扫墓。BLOGBUS可以清晰的整理自己的日历，觉得时间是属于自己的。","d":"2010.03.07","y":2010,"mo":3},{"i":"63410974","t":"[2/2]说我们的文学梦想是不灭的，我们的收获与成长是无限的。杜宝宝最后给我发：谢谢你，我的姐妹。我觉得很温暖。暖地文学社或许并没有被运作成功，但一步步跟着暖地发展的核心建设者都获得了我们需要的经验与成绩。我爱我的暖地，爱着我的姐妹们。暖地永远是我们的梦想之家。","d":"2010.03.07","y":2010,"mo":3},{"i":"63344183","t":"5200的开机问候语是张悬的“My life will find its way,”正好对应了彼时我兵荒马乱四面楚歌的情绪。下午回双流，就不带着它了。这个小宝贝将带着满格的电躺回盒子里。或许以后每个周末我都不要带Ice Cream充电器回家？好让5200复活一下？","d":"2010.03.07","y":2010,"mo":3},{"i":"63294669","t":"万千人都在试图挤进你的生命里，头破血流，唯独我在极力退却，我想大概你会因此多记认我一些。这就够了。From<澜本嫁衣>","d":"2010.03.07","y":2010,"mo":3},{"i":"63258197","t":"索取和得到都是相互的，你不能抱怨自己默默的被边缘化了。你必须懂得人情就是一借一还，你不是Super Star,不能自成引力吸引一批无脑信众。你也不可能尽心维持每一段关系，你知道有些人交会的目的就是为了远离，你不想也不必挽留，每个人都有权力选择适合他的选择。","d":"2010.03.07","y":2010,"mo":3,"c":2},{"i":"63251597","t":"美食频道我大爱~以后要学着作料理达人~","d":"2010.03.07","y":2010,"mo":3,"c":4},{"i":"63216916","t":"“我们早就学会了就算对着电脑也要戴上厚厚的面具，作为防备。仿佛这个世界再也找不到可以信赖的人。”@霍艳","d":"2010.03.07","y":2010,"mo":3,"c":9},{"i":"63124738","t":"莲，我是你永远的安安。我们不离不弃，彼此深爱，就像爱着自己，爱着未来。","d":"2010.03.07","y":2010,"mo":3},{"i":"63113272","t":"只有在家里心才宁静。学校里看似欢快，但我对热闹一向不安心，我觉得我在默默失去什么。不论如何，不要把自己的问题转嫁成别人的借口。我要将自己武装，不只变得坚强，还要坚定。我会将我和莲的生命接连，不再有别的杂念，我去定了上海。","d":"2010.03.07","y":2010,"mo":3,"c":2},{"i":"63103118","t":"有些人或许冥冥中注定，无法了解彼此。恋人之间，有时候，有着世界上最难懂的语言。虽然我们寂寞地生活着，但在茫茫宇宙中，一定有个人能听懂自己的语言。一个，也就够了。From＜时间海洋＞","d":"2010.03.07","y":2010,"mo":3},{"i":"63074700","t":"莲给我传来信息，说她已不再当年，会沉静收敛，朝着可遇见的未来前行。我会同她一起努力。最近太浮躁，心理状态或许难以改变，学习状态一定要更新，否则失败便会踩在我脸上。明天乖乖做数学。今晚已看了几个柯南OVA和一些节目，已经是放松。我必须踏实做事，上海是唯一的目的地。","d":"2010.03.06","y":2010,"mo":3},{"i":"62880112","t":"5200的存储卡被拔掉不见了，手机里只有一首＜可惜不是你＞，还有一堆Tuzki和瑜珈的图片。用起来并没有什么不顺手，除了嫌弃它屏幕分辨率低了一些。它毕竟承载了我那么多记忆。我不敢在Ice Cream里存什么信息，觉得迟早它会死机会消失，不信任感。","d":"2010.03.06","y":2010,"mo":3,"c":2},{"i":"62774410","t":"古天乐＜意外＞","d":"2010.03.06","y":2010,"mo":3,"c":1},{"i":"62710090","t":"你是有一些酸酸的想念，因为生活变化轨道太快，你似乎被遗落在中间。觉得难以分辨今是何夕又在何地。想念一些人，他们曾是你生活里的全部。而你默默的放弃了那一整个世界，没有道别，无更多言语。想念是卑微的，他们已经忘了你。一个人的离开对另一个人可能就是另觅新欢的必要。人情没有不落窠臼的。","d":"2010.03.06","y":2010,"mo":3},{"i":"62595630","t":"正在看＜天天向上＞的重播，魏伟根据手相看健康。我的智慧线很长，但居然没有事业线。手指上多有青筋，不太好。可怕…","d":"2010.03.06","y":2010,"mo":3,"c":1},{"i":"62555221","t":"力尹力尹张淡然～回国内发展叭～支持你～","d":"2010.03.06","y":2010,"mo":3},{"i":"62479368","t":"本来是想趁着学完了东南亚，重温一遍＜誓鸟＞，但实在是看不下去。这是我不喜欢的悲剧，觉得非常恶心。或许我根本无法理解那种甘愿，我也忘了记忆之美。","d":"2010.03.06","y":2010,"mo":3},{"i":"62375396","t":"K:其实她还不错。你还别说，你和人MS.S还真挺像的。我：那是，她都很像我了，人能不好麽。But,哪里像呢？K:就是感觉叭，说不清。我：算了叭，人家那可是级花，哪是我这种民女可以附庸的。K:乖，咱不比那有的没的，而且就算要比你也不是比不过。我：呵，亲爱的你好好复习，争取给我拿个语文一等奖回来。","d":"2010.03.06","y":2010,"mo":3},{"i":"62340203","t":"The double life about Veronica.I am not who I am, meanwhile I am who I  am to be.","d":"2010.03.06","y":2010,"mo":3},{"i":"62269649","t":"将5200上存储的信息,自己写的抑或收到的,都整理编辑到文档里.看到那些字句,想起当时的自己,心里酸酸的.许多陪伴过我的人已经消失在我的生活里,剩下的大概只有莲.我犹记得彼时我们依靠屏幕上的字句熬过一个一个艰难的长夜.我爱她,像爱自己一般.","d":"2010.03.06","y":2010,"mo":3},{"i":"62216504","t":"我一直没喜欢过5200,甚至在购买它的时候.它的第一条信息似乎是发给莲还是维维?最后一条是给莲.其实它蛮好,Nokia功能比LG强大很多.我对Ice Cream多有抱怨,不过还是喜欢.5200很乖,承担了我的手机依赖症,承担了我的几个爱人,承担了我的天津.现在它退出我的生活,躺在盒子里默默不语,小可怜又小可爱的模样.","d":"2010.03.05","y":2010,"mo":3,"c":1},{"i":"62136828","t":"终于找到较合心意又没有被注册的名字.Weigela,锦带花,忍冬科锦带花属落叶小灌木.我不是Verphine,而是植物一样清淡.回到家中便可以完全不设防.温暖甜蜜的晚睡一点,或许等会儿写点东西.","d":"2010.03.05","y":2010,"mo":3,"c":4},{"i":"62041758","t":"小引<简单的情诗>:成都黑不黑/恩,成都的夜/黑不黑/你的眼睛黑/还是/青城的寺院黑/恩,我问你呐/你的长发黑/还是我的思念黑.","d":"2010.03.05","y":2010,"mo":3,"c":6},{"i":"61973838","t":"<不结伴的旅行者>.上周末稍饰修改的旧文。写给我心爱的暖地。我不会放弃。 网页链接","d":"2010.03.05","y":2010,"mo":3},{"i":"61940359","t":"你的寿命约为83岁，请珍惜时间，您还有约23740天05小时15分34秒61的时间可以享受生活。 网页链接","d":"2010.03.05","y":2010,"mo":3},{"i":"61871187","t":"我无话可说，手机充电器忘记带回家来，现在手机还有弱弱的两格电，看来周末发不了什么微博了。那么就乖乖的做作业和看书吧。微博改变了我的生活方式，但不能让我失去自我。","d":"2010.03.05","y":2010,"mo":3},{"i":"61683907","t":"我彻底睡蒙了,醒来的时候已经14:07,诡异的是闹钟完全没响...我脑子一片空白,打电话给巴豆哥哥,他说:莫得事,是政治课,你搞快来~然后我就听信他了,飞奔来教室...太杯具了><|||","d":"2010.03.05","y":2010,"mo":3},{"i":"61587389","t":"稍微简单的收了一下书本,下午老爸过来直接帮我来拎一下包就行,我就不再上楼来了.下午一点四十五的闹钟,设了每周五的循环,还有三节课就可以回家.还算开心~现在睡觉觉,昨晚因为一些破事折腾了半宿,我总是对不起睡眠对不起我的皮肤,这样不对.午安~","d":"2010.03.05","y":2010,"mo":3},{"i":"61460157","t":"我和莲姑娘都作出了自我藏匿的决定,不让任何人在我的生活里对号入坐,不许任何人将我对号入座.","d":"2010.03.05","y":2010,"mo":3},{"i":"61352566","t":"大神Doris今天一语惊醒梦中人.作英语题最重要的就是RP,RP不好成绩就不好.要说好话,不做恶.我领悟了,最近我就是太sharp了,所以做题水平高回到史前,我要行善积得了...><","d":"2010.03.05","y":2010,"mo":3},{"i":"61321778","t":"《高考和我》  网页链接","d":"2010.03.05","y":2010,"mo":3},{"i":"61307618","t":"总之今天下午就回家了,白天有姐妹党陪我我一样可以没心没肺没天没地的笑,我会把事故伤害程度减到最少,而且必须如此,而且我可以做到.","d":"2010.03.05","y":2010,"mo":3},{"i":"61307173","t":"我觉得今天很冷.快讯说今天7~13度,但我现在穿着保暖内衣衬衣毛衣,毛外套,厚仔裤却还是发抖.我是不是病了?诶...我的心绝对是我全身最寒冷的地方,我的全身却不能像我的心一样抵御寒冷.","d":"2010.03.05","y":2010,"mo":3},{"i":"61304735","t":"看到就看到了.我相信我可以毫不在乎.失去就失去了,被失去就被失去了.就当我唯一一次对你诚实.是这样的,我知道你说得对,若我们在一起也是因为你寂寞了我无聊.我一直觉得这不可能是任何一段任何形式的感情基础.分开最好,消失最好,不然明年我还不知道如何面对你.不用面对最好.","d":"2010.03.05","y":2010,"mo":3},{"i":"61229880","t":"幸好微博实名制仅限于那些加V的名人,否则全民实名一定是部惊悚片.无人再能将微博当树洞倒出心里全部,又回到现实里压抑的维度.就让我做 @文勤勤,谁也不认识我,我谁也不认识.","d":"2010.03.04","y":2010,"mo":3,"c":2},{"i":"60952327","t":"点点细雨.抱着一大杯热水缩在教室里.但愿一场春雨一场暖.","d":"2010.03.04","y":2010,"mo":3,"c":3},{"i":"60942453","t":"不一定每个人都可以在自己最好的时光里遇到最对的人.也不一定每个人能在别人爱上你的时候恰好也爱上他.不是所有的悲剧都可以有结局,不是所有的喜剧都能存在.不是所有的想念都可以被知晓,不是所有的感觉都能被体察.你不是我的了,这是必须与不得不的事.","d":"2010.03.04","y":2010,"mo":3},{"i":"60879691","t":"这果然变成难以摆脱的包袱.老王是我见过最糟糕的班主任.因为要退休了并且性格胆小怕事所以班上事情不管不问,你干好了他不管,干差了就一定要骂人.真难办.","d":"2010.03.04","y":2010,"mo":3},{"i":"60850124","t":"利用化学课完成板报,并正式书写辞职信要求辞去宣传委员职务.我不愿意再浪费精力在这吃力不讨好的工作上,就是这样.","d":"2010.03.04","y":2010,"mo":3},{"i":"60658561","t":"我是中南半岛消逝的雨季,你在旱季里错过.彼此隔绝的距离消失在河谷间隔里,我想念你,随季风漫过湄公河.你被赤道划破了想念,我是你不得不的遗忘.终有一天,我会在夏日最长的白昼里,去遇见你,去重新相信爱情.(原创.一则熟记中南半岛自然地理,二则情书一封投递给c.)","d":"2010.03.04","y":2010,"mo":3,"c":7},{"i":"60345773","t":"这种生活绝对不能继续下去了.又没规律又混乱又一事无成.我拒绝任何人以任何手段任何目的介入我的生活.拒绝任何对我简单生活的改变.去年我已经被烂桃花毁了,今年绝不能毁于假桃花.我要镇定,平和,简单,我不允许任何意外.","d":"2010.03.03","y":2010,"mo":3},{"i":"60335333","t":"刚和某人指桑骂槐的明确表达了:\"我绝对不玩任何形式的情感游戏,我没时间没精力\".结果他完全没有领悟,跟我说\"你不开心让我也很难过\".搞得我很想骂街.决定谁都不理,坚决不接电话不回短信,所有的.我不要被干扰,我要天天向上.","d":"2010.03.03","y":2010,"mo":3},{"i":"60077714","t":"何况我现在也不需要刻意打扮来取悦谁,我只要清静素白面孔就好.把头发尽量留长.这不是自暴自弃叭,我只是在等待蜕变.等高考结束,我就会彻底的改变.","d":"2010.03.03","y":2010,"mo":3},{"i":"60068942","t":"是这样的.喜欢一个人,就是听着她喜欢的歌,就会觉得幸福的感觉.尽管你们全无交集,但你心里有落在他身上的目光.@IDO全球婚戒典范","d":"2010.03.03","y":2010,"mo":3},{"i":"60066541","t":"根据穿着打扮就可以嗅出一个人的许多信息.相比年级上其他班级,我们班女生打扮应该是最\"幼稚\"的.上学期做操,隔壁八班和我们班出去都像吸血鬼,脸色苍白,黑眼圈大眼带.几乎没人化妆,每天事多得要死谁折腾那些有的没的.我庆幸把自己的高二高三放在这样单纯的环境里.班训:\"目标放在2011,行动落实每一天\".","d":"2010.03.03","y":2010,"mo":3},{"i":"59732132","t":"和莲姑娘发信息,永远是亲切的.她在准备着BEC和高口.我们都瞎忙,对爱情高度洁癖.哈雷和北北,只有他们才可以担当我们的爱情~.我们是真正类似的人~事业永远第一位~独立才是根本~最爱她~Mu~a,我会为了莲去往上海~这是确定一定以及肯定要实现的约定.","d":"2010.03.03","y":2010,"mo":3},{"i":"59615176","t":"当我终于把武装到牙齿落到实处,发现自己的心也失去软度.这是坚强?好强?我以为这样别人就无法伤害我,但我却是在伤害自己.","d":"2010.03.03","y":2010,"mo":3,"c":1},{"i":"58398683","t":"什么叫犯贱?我和Doris现场直播~纯属娱乐-我(撩头发):我最大的缺点就是优点太多.Doris(眨眼睛):你喜欢我哪点嘛,我改还不行嗦.","d":"2010.03.01","y":2010,"mo":3,"c":1},{"i":"58346441","t":"正如我昨天说：我们从来都没有对彼此坦白过什么，或许的确也没什么可坦白。或许我们都太好强，太好面子，太不能接受失败。我们小心翼翼的保持某种安全距离。我们都不知道如果关系进一步退一步会怎样，所以只好冷淡着。你知道，我几乎从不主动，我总是等着别人主动，宁愿失败失去都不要。所以，笨笨。","d":"2010.03.01","y":2010,"mo":3,"c":5},{"i":"58338316","t":"微博允许非注册用户查看了？我左边右边的同学都在看微博，不过都没有注册。好神奇。","d":"2010.03.01","y":2010,"mo":3,"c":3},{"i":"58048692","t":"还梦见了坍塌的木梯和印巴风格长裙子~","d":"2010.03.01","y":2010,"mo":3},{"i":"58046764","t":"梦见一个叫字白的男人.一场车祸成全两对情侣,我的梦越来越文艺了~","d":"2010.03.01","y":2010,"mo":3,"c":3},{"i":"57995145","t":"延迟了一个小时。 我才不听你这话，气话吧。别说不是气话啊，傻瓜都知道明明就是。 相信什么不好，你非得信这个。 我不喜欢她，那会儿告诉你那个是胡说八道的。 当然你不会相信我的解释，真话没有谎言好听进。 From William 00:27 03/01/10","d":"2010.03.01","y":2010,"mo":3,"c":2},{"i":"57935306","t":"[2/2]过什么,或许的确也没什么可说的.宋宋也好其他也罢,我没误会,也轮不到我误会什么.你爱谁谁.W:有必要吗这样?我:有.我就这德行.好了,就这样叭.我闭嘴了.","d":"2010.02.28","y":2010,"mo":2,"c":7},{"i":"57935304","t":"[1/2]W:我不在乎你怎么说我,反正误解早就成了常态,反正你从来不在乎我.我:我难过了.W:是吗?昨天飞机经停双流机场的时候,我想好像是离你近一点叭.但是随后我想,只要距离不是0,1000m与1000km没什么区别.我:你喜欢她.W:我什么时候说过喜欢她?又是误解.我能说什么,你又听不见.我:我觉得我们从来没有对彼此坦白说","d":"2010.02.28","y":2010,"mo":2},{"i":"57856483","t":"元宵快乐~一早就吃了芝麻馅的汤圆~听了整晚的烟花声,非常喜庆欢乐的气氛,只是学校里几乎没有感觉.祝福团圆~","d":"2010.02.28","y":2010,"mo":2},{"i":"57854998","t":"褐色,黑色,浅粉的monami,华丽丽的道林本本,作为对数学的投资.什么叫舍不得孩子套不着狼,我要对数学做功,而且绝对是有用功~","d":"2010.02.28","y":2010,"mo":2,"c":3},{"i":"57649606","t":"我不想太早去双流,每周都要熬到最后,几乎要迟到.不想过去,不想不想~","d":"2010.02.28","y":2010,"mo":2,"c":1},{"i":"57644622","t":"Mr.C哪里都好,就是作业布置得多.But这不是他的问题,是我一般都不写他的作业.因为跟他上课不定时定期,每次都是到我出现不懂的问题时才约课,不能及时对答案,所以觉得还不如不做.","d":"2010.02.28","y":2010,"mo":2,"c":9},{"i":"57579115","t":"我要睡一个长长的幸福的午觉,周末都休息不好简直太亏待自己了~午安~","d":"2010.02.28","y":2010,"mo":2},{"i":"57561946","t":"两件事.1.Mr.C的提包竟然是dunhill.2.决定全家出动,<爱丽丝漫游仙境>一上映就去看.因为我的第一个英文名就Alice,是我妈取的,她叫Iris.","d":"2010.02.28","y":2010,"mo":2,"c":2},{"i":"57509018","t":"和楼上英语学校的帅哥老外一起下电梯,金色的眼睫毛&烟灰色瞳孔~心脏停跳了><","d":"2010.02.28","y":2010,"mo":2,"c":7},{"i":"57506779","t":"数学课结束,Mr.C太厉害了.不过上完数学体力耗尽,觉得头晕眼花脚软中~","d":"2010.02.28","y":2010,"mo":2,"c":3},{"i":"57428837","t":"刚看到一对情侣穿着同样的黑夹克蓝铅笔裤红匡威,简直幸福逼人~以后我会为哈雷亲手绘制匡威,我们一起穿着,踩在甜蜜之上~","d":"2010.02.28","y":2010,"mo":2,"c":1},{"i":"57418631","t":"现在在锦城外国语这等车,居然它也把自己贴了石室标签...我终于搞清我要去的地方叫中西顺城街了,早知道就打车了.","d":"2010.02.28","y":2010,"mo":2,"c":4},{"i":"57399986","t":"等下去顺城中街上课,爸妈不送我,只好自己坐公车去.78路改道?28路呢?我out了,好久没坐公车也好久没去市里了,小村姑状态越演越烈...","d":"2010.02.28","y":2010,"mo":2,"c":3},{"i":"57367224","t":"梦见自己去了热闹的地方,和许多人在一起.很镇定的撒谎,被不愿遇见的人找到,如此之类.倒都是我昨天一念之间所想之事的反映.","d":"2010.02.28","y":2010,"mo":2},{"i":"57279878","t":"刚出去吹头发正好看到CCTV6<神奇一家>的结尾Watt Disney说的一段话.我觉得Disney的动画不是要取悦不想长大的成年人,而是要用童心给生命注入新的能量.我爱Pixar~我爱Disney~不知不觉又熬到很晚了,摆摆手,睡觉觉~","d":"2010.02.27","y":2010,"mo":2,"c":1},{"i":"57263264","t":"晚安.今天是一边看莉莉周一边写东西,不晓得第几次了.将自己包围在属于自己的青蓝色以太里.","d":"2010.02.27","y":2010,"mo":2,"c":3},{"i":"57258676","t":"我觉得这样不对,不能把士橘的故事写成流水帐了.我对叙述与表达小说有障碍.今天就先这样叭.以后所有的文都要在mp4里备份,一定要.","d":"2010.02.27","y":2010,"mo":2},{"i":"57218984","t":"我最擅长的就是篡改记忆,篡改自己.所以这篇文今天必须出色完成.关于那轻小说,可能得缓一缓.因为明早还约了Mr.C,我必须早睡一点保证状态.","d":"2010.02.27","y":2010,"mo":2},{"i":"57212567","t":"我就知道,我的学籍问题会衍生许多麻烦,现在就遇到了.不过尚在可以解决的范围内.","d":"2010.02.27","y":2010,"mo":2,"c":2},{"i":"57098799","t":"我是有American Dream,但也不至于过分崇洋媚外,我知道国外并非就是天堂.我只需要研究生出去,体验生活,获取更高水平的学历.然后回到中国,在成都安居乐业是很幸福的.目前是这样认为.","d":"2010.02.27","y":2010,"mo":2},{"i":"57095282","t":"为了打消我的出国念头,我妈几乎搬出了她所有同事同学的孩子不成功留学经历的例子.回来都是海待,爸妈找了重重关系最终弄去花旗当出纳.这几乎是普遍现象.而移民的,第一代移民永远无法融入国外主流社会,工作就跟农民工赛的.尤其是文科女生.","d":"2010.02.27","y":2010,"mo":2,"c":4},{"i":"56699758","t":"我又要念叨莲姑娘这次择爱不慎了.我们都是会因为寂寞妥协的孩子,妥协结果往往是一个根本不是自己想要的人.南南不就是另一个维维?我和莲都阴沟里翻船.要把爱情当爱情,才能有爱人.莲要北北,我要哈雷,我们不能在迷茫了,不能为别的什么人耗费自己的心意.我和莲不管怎样都有彼此,我想抱抱她.","d":"2010.02.27","y":2010,"mo":2,"c":8},{"i":"56696968","t":"莲在两点时发信息来告诉我,写了文在二三事上给我.不过我似乎修改了微博的关联博客,所以没有转载上来.她引了The September Issue上的图,Anna Wintour小姐是我们俩的神.莲和安安,我们俩,由Asura庇护着,我们都是吴珉珉,我们深爱,支持彼此前进.终究会开始另一个Vngue~","d":"2010.02.27","y":2010,"mo":2,"c":1},{"i":"56622887","t":"<北海道的小村姑>,\"以前他说过要带我去北海道安静地生活在小木屋里,而如今我终于可以鼓起勇气自己去了\".看到这句话的时候眼睛润了,真的.我一定会静静的把自己的心找回来,不能把冰冷的面具变成心的底色.哈雷,你知道,我在用我最多最多的美好来等待你.","d":"2010.02.27","y":2010,"mo":2},{"i":"56577390","t":"晚安,许会再做一节历史学案.乖乖的~记住我的路是\"最朴素的生活,最遥远的梦想\".","d":"2010.02.26","y":2010,"mo":2},{"i":"56575709","t":"春天将至,每次季节变化我都会产生一段抑郁情绪.必须慎重面对自己的反常期.我和莲都是这样.她将继续为了高口而努力,我则为了明年的高考.这是最重要的.我们都会顺利过渡情绪的波折与路上杂芜的枝蔓.我只有一种坚持,去往梦想.","d":"2010.02.26","y":2010,"mo":2,"c":7},{"i":"56573222","t":"关于文勤勤,我的新昵称.这是亦舒写在<石榴图>里的.用这个名字,我希望自己变得清晰明确起来.也就此进入我的准高三状态,不再空耗了.我可以对不起世界,但不可以对自己和梦想说抱歉.必须安心踏实的努力.我比任何人都清楚我要的是什么,并且懂得怎样得到,并且志在必得.不能被虚假繁荣迷惑双眼.","d":"2010.02.26","y":2010,"mo":2,"c":9},{"i":"56564306","t":"\"到南方去,到南方去,你的血液里没有情人和春天\",海子.","d":"2010.02.26","y":2010,"mo":2},{"i":"56557667","t":"把握机会,不期待结果,只要自己不后悔没努力过.打算在爸爸妈妈睡下后再把稿子誊写到电脑上.一定要悄悄的,不能被发现了~","d":"2010.02.26","y":2010,"mo":2,"c":3},{"i":"56525199","t":"Another Beginning   网页链接","d":"2010.02.26","y":2010,"mo":2},{"i":"56435246","t":"心情不好。觉得自己是那么失败的人。踌躇满志那么多事情，最后都只能蹉跎。","d":"2010.02.26","y":2010,"mo":2,"c":23},{"i":"56429909","t":"我心爱的一只U盘坏掉了。2009年夏天的文和暖地的一些资料都在里面。很麻烦。因为后来我的旧IBM重装过，很多东西独一无二的在那里。手足无措中。或许老爸会有办法。还有答应DooGigi修改的文章，也不知道什么时候才能动笔，然后放到文学社里。","d":"2010.02.26","y":2010,"mo":2,"c":11},{"i":"56292058","t":"为什么数学这么扭曲?因为覃朗就很扭曲~他的笔记本桌面竟然是Hello Kitty,可见他是多么腹黑的大叔~最后一节数学上得人真反胃,诶,我得依赖魔术师Mr.C来帮我搞搞二面角了~","d":"2010.02.26","y":2010,"mo":2,"c":16},{"i":"56217241","t":"我要使我的政治主观题发生质变~不能再听之任之它差下去了~作为文科生,我连政治都搞不定,我还怎么搞定文综~真是~雄起雄起~","d":"2010.02.26","y":2010,"mo":2,"c":7},{"i":"56076347","t":"话说今天是2010级#高考倒计时100天#,也就是我们11级倒计时465天.很快就得搬进高三楼啦~人生呐~祝福学长学姐们~@门下左拾遗,@蝉时小雨~","d":"2010.02.26","y":2010,"mo":2,"c":5},{"i":"55620169","t":"其实我是潜在的急性子,遇到一点点兴奋的事就觉得\"不得了了不得了了\",野心膨胀得比信心快.冷静下来又失意了,觉得没有可行性.所以说,自卑与自负都背在身上,却没有很好的有机结合.","d":"2010.02.25","y":2010,"mo":2,"c":8},{"i":"55613035","t":"揣有梦想,明媚起来.","d":"2010.02.25","y":2010,"mo":2},{"i":"55577105","t":"高辕:我拒绝成为一个幸福的人,有了幸福便有了恐惧.小优:你现在恐惧了?高辕:是的,我恐惧,因为你,我害怕死亡.-------<琥珀>","d":"2010.02.25","y":2010,"mo":2,"c":2},{"i":"55352187","t":"有人辛苦的奔忙于月薪2000,就有人可以把蓝色大奔开进学校.有人变成笔记抄录机但成绩却是笑话,有人却可以谈笑间第一到手.活在其间,你的羡慕与愤怒都微不足道,你看见这个世界,他们却看不见你.","d":"2010.02.25","y":2010,"mo":2,"c":6},{"i":"55060436","t":"但是认真反思一下,我也并没有不专心认真.数学王后雄没有带过来,各科参考书也都没发,所以每天过得心虚,我似乎有受虐倾向了.但是似乎没找到上学期开始时心无旁骛的状态?或许是我现在太热闹了,我真怕安静不下来的自己,觉得就像不安的浮木.","d":"2010.02.24","y":2010,"mo":2,"c":1},{"i":"55048575","t":"不能再聒噪下去.静下心来.我已经想好已经想得很清楚了,不能被任何人或事打扰了.","d":"2010.02.24","y":2010,"mo":2},{"i":"55043876","t":"盲目的\"阿Q乐观\"使人麻木浮躁.我一直没有调整好自己的状态,开学第三跳结束.数学课听课质量非常低,每天既无所事事又手忙脚乱,这样不行,必须改变.","d":"2010.02.24","y":2010,"mo":2},{"i":"54935695","t":"如果三道数学题,你从早上做到了下午做到了晚上还没做完,你的感想是什么?A.疯狂B.癫狂C.扭曲D.崩溃E.以上皆是-------我的答案是E.","d":"2010.02.24","y":2010,"mo":2,"c":4},{"i":"54819939","t":"历史不可以重来,但可以重演.","d":"2010.02.24","y":2010,"mo":2,"c":2},{"i":"54606978","t":"我和我妈有非常强悍的心理感应?我还没跟她说让她过来呢,人家居然就已经开到了收费站那儿了~","d":"2010.02.24","y":2010,"mo":2,"c":1},{"i":"54597540","t":"我和林蝎蝎养生修炼中~暖的红豆烧,牛奶,芝麻糊,橙子,苹果,红枣,杏仁,核桃~争取得道成仙~","d":"2010.02.24","y":2010,"mo":2,"c":16},{"i":"54550472","t":"韩昌黎和十二郎是不伦+背背山叭,太肉麻了~\"一在天之涯,一在地之角,生而影不与吾形相依,死而魂不与吾梦相接,吾实为之,其又何尤!\"","d":"2010.02.24","y":2010,"mo":2,"c":1},{"i":"54420853","t":"我经常梦见高大的建筑物里,我在其中迷路之类.机场,学校,商店,场景都有类似.还梦见电梯也多,然后家人.很奇怪喔~","d":"2010.02.24","y":2010,"mo":2,"c":1},{"i":"54418955","t":"昨晚做梦,梦见去一个十楼的图书馆,乘电梯上去,但所有的入口都有火.中途醒来一次,因为电热毯不发热了.看来下午得让妈咪过来一下~","d":"2010.02.24","y":2010,"mo":2,"c":10},{"i":"54338154","t":"似乎在微博里话痨的症状减轻.那么晚安叭.Mu~a","d":"2010.02.23","y":2010,"mo":2},{"i":"54110565","t":"支持<独唱团><合唱团>~ 《太紧》  网页链接","d":"2010.02.23","y":2010,"mo":2},{"i":"54107964","t":"巴豆哥哥(=巴):天上一只鸟被猎人打中以后为什么不会掉下来?我:因为它是\"superbird\".巴:错,因为它很坚强~我:...巴:天上另一只鸟被猎人打中也没掉下来,为什么?我:它装死~巴:错,因为它反应慢~我:...词穷了.","d":"2010.02.23","y":2010,"mo":2,"c":1},{"i":"54080719","t":"巴豆哥哥发给我一首<想把我唱给你听>,\"旅途遥远,我们在一起叭\".非常适合表白的话.曾有人对我唱过<做你的男人>,我就被拿下了.我给c唱过光良的<天堂>,c给我唱朴树<她在睡梦中>.还喜欢<流浪歌手的情人>\"我们的爱情在四季传唱.\"","d":"2010.02.23","y":2010,"mo":2,"c":4},{"i":"53962816","t":"搬进教室公寓以后我就开始修炼\"踩铃神功\",从房间出来到这里只要三分钟左右.真是不想从温暖的被窝里爬出来~","d":"2010.02.23","y":2010,"mo":2,"c":4},{"i":"53568079","t":"上学期期中考后,学校给Top20设立培尖班,我31名,失去机会.当时很惋惜,不过后面好像效果并不太好,还庆幸自己没耽误时间.这学期我也有机会去培尖班了,不过要牺牲周末,我不愿意一直呆在这鬼双流,还是不想去.但我妈劝我尽量参加,Mrs Z最近也经常苦口婆心的让我们不要松懈.矛盾着.","d":"2010.02.22","y":2010,"mo":2,"c":3},{"i":"53428079","t":"@郭启,在\"二三事\"这博客里,近期文章中,署名安安的就是我写的,写给安安的文,就是莲姑娘的.而以前的文章则是从我和她所有博客中一起导入的.","d":"2010.02.22","y":2010,"mo":2,"c":4},{"i":"53413906","t":"明确每个剧目中自己的角色台词,是必要的自知之明.不浪费表情,不表错情,拒绝暧昧不明的光,拒绝走错台步.你晓得你的主角还没有上场,你在幕里等待","d":"2010.02.22","y":2010,"mo":2},{"i":"53335381","t":"命盘   网页链接","d":"2010.02.22","y":2010,"mo":2,"c":15},{"i":"53213320","t":"几分相似而已,不能指鹿为马.c呐,你看我总是迫不及待的从任何人身上寻找与你相似的地方,然而越来越失望,反证了你的唯一性.这很糟糕.离你生日还有一个月差一天,但我绝对不给你祝福,就像你不与我任何瓜葛一样.因为你,春天成了我的死敌,我痛恨这貌似明媚的阳光,一丁点都无法温暖我的冰冷.","d":"2010.02.22","y":2010,"mo":2,"c":11},{"i":"53042574","t":"本学期象征性的物化生课程也取消了,我估计书也不会再发了.我的生物会考将彻底成为一个笑话,回昆明突击?买答案?短信作弊?都挺麻烦的了.","d":"2010.02.22","y":2010,"mo":2,"c":1},{"i":"52772472","t":"开心点~宝贝~上学有什么不好~你的成绩又可以噌噌噌往上涨~你的同学们也都那么可爱~新的小窝布置得那么舒服~对自己微笑一个~乖.","d":"2010.02.21","y":2010,"mo":2},{"i":"52544806","t":"巫时   网页链接","d":"2010.02.21","y":2010,"mo":2,"c":4},{"i":"52408775","t":"C呐,你看,我又遇见与你如此相像的人.你是不是一直就在我身边无孔不入?我可以向你保证,不会再为了谁而再赴汤蹈火.我只要有过唯一的你就意足.","d":"2010.02.21","y":2010,"mo":2,"c":1},{"i":"52406434","t":"全国二卷今年明年会怎么命题?使用全国二卷的地区有的已经课改,有的还没有.是分别命题?否则是让那些学新教材的觉得学了没用,或揠苗助长老教材叭?","d":"2010.02.21","y":2010,"mo":2},{"i":"52304331","t":"明天就逃不过了,必须花费整个上午的时间来收拾衣物书本作业生活用品食物等.还要带上榻榻米的床垫,最后并没有在IKEA买.新房间里只有简单的床和书桌,但是有整墙的落地窗,这是最吸引我的.住这房间估计会有很多麻烦,不过必须熬完一学期,高三再另觅佳处.","d":"2010.02.20","y":2010,"mo":2},{"i":"52297799","t":"第一次对刘谦产生些许好感,觉得他好像怪盗基德呐~","d":"2010.02.20","y":2010,"mo":2,"c":2},{"i":"52215789","t":"全国好像就只有四川有\"国家级重点中学\"这种东西叭?为什么?","d":"2010.02.20","y":2010,"mo":2,"c":3},{"i":"52188261","t":"仰卧起坐是不是会损伤腰肌腰椎?","d":"2010.02.20","y":2010,"mo":2},{"i":"52159917","t":"即兴翻开5.3函数部分,挑全国二的题来做,发现它尤其喜欢考单调性和对数.题目不难,但我的正答率不高,受到打击.TT.TT怎么办~~~","d":"2010.02.20","y":2010,"mo":2,"c":4},{"i":"52092617","t":"同学们，新年大喜讯，没得一科老师搞赢出题，大家耍的太开心，所以不用开学考试了！ 刚刚最伟大的睿姐发来的信息~我要乐癫了~Oh Yeah","d":"2010.02.20","y":2010,"mo":2,"c":2},{"i":"52023244","t":"明天下午去双流返校,搬进教师公寓.高二下就是准高三了,一直不敢面对的现在成为不得不.拟定新的学习计划是必须的.语文要抓双基,尽可能做些题.数学要继承+改变,争取进步,目标120.政治必须保证客观题不错,主观题要大大.提高地理历史英语完成高考总复习题,要突出自己的优势.","d":"2010.02.20","y":2010,"mo":2,"c":4},{"i":"51865386","t":"西藏卫视在放<寺庙揽胜>.想起<莲花>.记得厦大新闻系在滇招理科生定向去西藏,不过忘记这是否确切了.","d":"2010.02.20","y":2010,"mo":2,"c":3},{"i":"51691197","t":"觉得立体几何部分题目作得不好,症结是不能很好利用空间向量.高一时数学一塌糊涂,殃及现在,很麻烦.函数部分高三补得回来麽?Mr.C去年暑假倒是给我讲过,但当时对数学还是摸不到头脑.不光数学,高一在天津新课改几乎什么都没学到,当然也有我自己没有很好过渡的原因.总之很麻烦.","d":"2010.02.19","y":2010,"mo":2,"c":5},{"i":"51158348","t":"特别是在你看到了他们的生活后,更清楚了自己想要的是什么.从来没有无本万利的买卖,你需要比上学期更多的努力.更要明确,对手不是你周围这些人,但你也必须进步,把名次继续往上冲.你必须夯实基础,对全国二卷要游刃有余.会考的事也得纳入计划,但不得耗费太多精力,这并不重要.加油","d":"2010.02.18","y":2010,"mo":2},{"i":"51155222","t":"要清楚的认识到旅行只是短暂插曲,已经结束.回到真正的生活里,并为开学作充分的心理准备.这不是困难的事,这是必然的接受与担当.这是我自己选择的路,并且我没有给自己后退的机会.只有一年半,就可完成我梦想的蜕变.安心勤奋的学习,其他都可不管不顾.我爱我,所以要做最好的自己.","d":"2010.02.18","y":2010,"mo":2},{"i":"51147399","t":"觉得在成都手机网速都夸张地慢.","d":"2010.02.18","y":2010,"mo":2,"c":3},{"i":"51136707","t":"因为假期将尽,不得不又把时间概念在脑子里建立起来.明天就周五了,我从来没有这么希望周末永远不要到来.我妈说明天得去一趟双流,要搬些东西过去.天,我的学校恐惧症...陷入抑郁情绪中...","d":"2010.02.18","y":2010,"mo":2},{"i":"51074042","t":"一切又将回到正轨.周日就开学.这几天必须作数学和写读后感.总之我的年我的暑假已经彻底玩完了~","d":"2010.02.18","y":2010,"mo":2,"c":1},{"i":"51072468","t":"成都娇惯着人的皮肤和胃口.在成都养好的皮肤去昆明就会有黑头,去天津就粗糙,去桂林长痘痘~诶...我不能克制在MC期间洗头发,这样是不是特别不好?怎么办...","d":"2010.02.18","y":2010,"mo":2,"c":1},{"i":"50753475","t":"小怪物是倚仗自己年幼无知愚蠢来恣意骄纵横行霸道的垃圾.今后我要坚持dink,不能被这种垃圾拖累了人生.","d":"2010.02.17","y":2010,"mo":2,"c":1},{"i":"50718574","t":"@郭启,我关注的第101个小朋友~有些事不是你想的那样,或许也不是我想的这样.不过这不重要,我知道过去的就过去了,记得但不纪念.Mu~a","d":"2010.02.17","y":2010,"mo":2,"c":1},{"i":"50691979","t":"关于飞机一直有个疑问:机舱内最安全的部分是机尾?飞行员Franklin是这样讲的,但明明头等舱都在机头部分呐,机尾颠簸不适.到底是哪?","d":"2010.02.17","y":2010,"mo":2},{"i":"50687444","t":"一直因为手机冷落mp4,但以前一直依赖它.里面整齐排列的文件夹,听到的都是记忆.我有不断删除更新的习惯,仿佛自己永远是完好整饬的,没有缺憾.","d":"2010.02.17","y":2010,"mo":2,"c":2},{"i":"50608957","t":"小孩子活得很累,一天到晚要哭要笑要吃奶要睡觉要尿床要长大.它周围的大人更累,身累心累.这是一种麻烦而讨厌的小玩意,但却是一个家庭的中心领导.","d":"2010.02.17","y":2010,"mo":2},{"i":"50600230","t":"四川泡菜,广西吃酸.前者还要再加工,后者作为小吃直接吃,连西瓜苹果一类水果也可以泡.昆明光华街也有类似后者的泡菜,某人带我去过,味道不错.","d":"2010.02.17","y":2010,"mo":2},{"i":"50540799","t":"我今后不再愿意来桂林了.黑导黑车黑票,不规范的市场,也不会有什么发展.这个城市就这样了,尴尬的守着\"山水甲天下\",但不过尔尔,无创新只退步.","d":"2010.02.17","y":2010,"mo":2},{"i":"50527599","t":"在桂林打车.爸:怎么那么贵?你们不打表?司机:你有没有常识,桂林从来不打表,而且现在过年.爸:小心我投诉你!司机:找死你都找不到打表的!","d":"2010.02.17","y":2010,"mo":2,"c":1},{"i":"50509371","t":"桂林这些地名都是可以吃的.比如荔浦,葡萄,恭城是古代\"茶城\"的笔误.我和我妈超不习惯这的饮食.现在在微笑堂六楼好大妈美食广场吃米粉.","d":"2010.02.17","y":2010,"mo":2},{"i":"50473216","t":"我:阉鸡是不是没有小鸡鸡的鸡?妈(汗):鸡好像本来就没有小鸡鸡...我:为什么阉鸡比较肥?妈(大汗):它觉得自己不男不女人生没了追求就拼命吃","d":"2010.02.17","y":2010,"mo":2,"c":2},{"i":"50445448","t":"昨晚梦见一部电影<茶恋>,内容是兄妹恋,梦见看着看着就没有了.诡异,刚百度一下没查到这电影.照弗洛依德的解释这是我自己的潜意识?可我没哥哥.","d":"2010.02.17","y":2010,"mo":2,"l":1},{"i":"50442346","t":"今天是妈咪生日~虽然45岁了仍然年轻漂亮可爱迷人的小女人~我答应作她一天丫鬟~八点五十离开恭城去桂林,在桂林吃神卤然后回成都~","d":"2010.02.17","y":2010,"mo":2},{"i":"50309226","t":"这次回来总共见了猫姐两次,其实我特羡慕这样能把兴趣爱好当事业有能做得非常好的人.我:你一定要想我~猫:我在忘记你之前一定会想你~","d":"2010.02.16","y":2010,"mo":2},{"i":"50147401","t":"上山是我爸把我拎上去的,下山是姑爹拉着我下来的.我有严重的下楼梯恐惧症,总觉得会一脚踩空滚下去.一路桃花已经盛开,恭城桃花节快到了~","d":"2010.02.16","y":2010,"mo":2},{"i":"50119518","t":"现在在去红岩村,什么魅力乡镇的路上.刚一不小心把偷菜的事多嘴跟姑爹说了(PS:姑爹是大法官),他从后视镜就一直瞪我...><|||","d":"2010.02.16","y":2010,"mo":2},{"i":"50104871","t":"我的亲爷爷郑继文,是非常内向的人.他生得英俊,从照片上看还忧郁着.学问很大,但在文革时因为地主出身和文化人就被打倒.心情郁郁,淋巴癌去世.当时我爸爸两岁,二姑姑没出世.","d":"2010.02.16","y":2010,"mo":2},{"i":"50065269","t":"我们偷菜四人帮~老爸负责把狗引开,我负责跟主人聊天看住猫头鹰,我妈和二姑姑采苟杞和豌豆尖和玫瑰花~满载而归~","d":"2010.02.16","y":2010,"mo":2,"c":3},{"i":"50048996","t":"现在在山上,要去上坟,一路上采香椿和卜葱,好神奇~我从来没见过~刚因为不认识萝卜叶子被我爸打击了半个小时...","d":"2010.02.16","y":2010,"mo":2},{"i":"50031335","t":"我为我\"为什么在天津时理科不好\"找到一个充分不必要的客观条件:因为在天津早餐老是吃豆腐脑和煎饼果子,而在成都我每天吃核桃花生鸡蛋之类的有益大脑的食物~","d":"2010.02.16","y":2010,"mo":2,"c":2},{"i":"50022358","t":"旅行途中阅过的人事,都会烙印在自己的成长中.时光的塌缩让久远变成切近的未来.所以再也逃不过回忆. 《闪光。》  网页链接","d":"2010.02.16","y":2010,"mo":2},{"i":"49915472","t":"我希望自己入睡困难的症状会有所改善,假期要都还睡不好那马上开学不是得把我折腾死.诶...明天最后一天,上午去扫墓,下午去小姑姑家做酒.五年前小姑姑的感情生活混乱,全家都担心她的婚姻未来.我当时和她亲密,现在也好.她目前生活幸福,小小的610也在长大,快乐的一家.","d":"2010.02.15","y":2010,"mo":2},{"i":"49912983","t":"我应该是MC快来了,连续两天火气旺.的确快\"闲疯\"了.","d":"2010.02.15","y":2010,"mo":2},{"i":"49911074","t":"我绝不能容忍哈雷是酗酒者.最恨酒精与醉汉,龌龊下流.我可以接受因为应酬而不得不的酒局,但最恨借酒焦愁之类的肮脏事.","d":"2010.02.15","y":2010,"mo":2,"c":1},{"i":"49800184","t":"吃完夜饭,饭桌上她们(规矩是男人在外一桌,女人在内一桌)都用恭城话聊天,我基本听不懂...然后聊天话题是偷菜,食堂之类,我又完全插不进话,只能沉默的刨饭...每天三餐不停的吃嗄吃嗄吃...","d":"2010.02.15","y":2010,"mo":2},{"i":"49652402","t":"传说昆明今天8~23度,外婆他们要去罗平看油菜花.我却在这个寒冷的鬼地方当居里夫人~郁闷.","d":"2010.02.15","y":2010,"mo":2},{"i":"49488453","t":"望远镜:目标就在眼前,其实距离还很遥远.","d":"2010.02.14","y":2010,"mo":2},{"i":"49395682","t":"单身中。禁止情人节。如果哈雷你在，一定可以微笑着拥抱我，说世事静好，你会给我一切，你会给我天堂。我会努力的穿越对流层，和你在平流层舞蹈。我会找到你，我会飞，我爱你。","d":"2010.02.14","y":2010,"mo":2},{"i":"49394389","t":"心静下来。他们的热闹是他们的。我们不一样。但是会有一样的辉煌的。我不可能输给你。我一定要赢。我的写作是为了自己的心意。爱着自己所以作出最有利于自己的选择。其他都不重要。只要达成目的。","d":"2010.02.14","y":2010,"mo":2},{"i":"49386646","t":"我也绝对不要像他们一样庸常忙碌一生。这是决心，这也是我的路途。我会有精彩，我也会为自己的绽放付出全部。","d":"2010.02.14","y":2010,"mo":2},{"i":"49385942","t":"我从未放弃自己，从未否认自己手中的才气。只是高考当前我必须集中精力做好我最重要的事情。但是必要的尝试必要的锻炼我不会放弃。我不是愚蠢的应试教育考生。","d":"2010.02.14","y":2010,"mo":2},{"i":"49381450","t":"我决定不放弃文字作为药物，自我支持。决定加入风致未明文学社写手团。我不能成为无信仰的傻孩子。","d":"2010.02.14","y":2010,"mo":2},{"i":"49261906","t":"这破败的小县城,老爸当初发奋读书,大概就是为了逃离叭.逃离农村,贫穷,愚昧,吝啬.","d":"2010.02.14","y":2010,"mo":2},{"i":"49252162","t":"每个人都有自己的生存方式.人多是非多,取舍得失是说不清也难释怀的.","d":"2010.02.14","y":2010,"mo":2},{"i":"49144555","t":"我要疯了~一直是鞭炮声...我快精神衰弱了~OMG","d":"2010.02.14","y":2010,"mo":2},{"i":"49019564","t":"BTW,情人节快乐~","d":"2010.02.14","y":2010,"mo":2},{"i":"49012040","t":"有些人你知道他是好人,同时你也知道他不会是你想成为的人.有些生活你觉得也平和美满,但你也知道那不是你的活法.观看般般世态,就会心如明镜,看见自己.","d":"2010.02.14","y":2010,"mo":2},{"i":"48961110","t":"新年快乐~","d":"2010.02.14","y":2010,"mo":2},{"i":"48945942","t":"新年快乐~去放礼花了~Mu~a","d":"2010.02.13","y":2010,"mo":2},{"i":"48872876","t":"#新年愿望#希望老爸妈咪老外外婆奶奶等所有亲人身体健康,平安顺利,事业取得更多发展~","d":"2010.02.13","y":2010,"mo":2,"c":1},{"i":"48863419","t":"#新年愿望#希望我在新年成绩能够越来越好,我会努力的~努力把语文数学政治提上去,英语地理历史要最好~要顺利的从高二过渡入高三~要追求增长的好成绩.要找到目标与培养兴趣,明确自己未来的路.","d":"2010.02.13","y":2010,"mo":2},{"i":"48576049","t":"爆竹声声,空气里的硫黄味炭火味酒味菜味,就是年味.越是小县城,人情味越重,过年越热闹~","d":"2010.02.13","y":2010,"mo":2,"c":2},{"i":"48471598","t":"终于贴好了对联~千辛万苦但还是搞歪了~但我们一致认为我们贴得很好很强大,是墙歪了~经过热烈的讨论~我爸决定改叫郑有财,二姑姑叫郑有材,我叫郑有才~大姑妈可以叫郑有彩~我们郑家四门神~","d":"2010.02.13","y":2010,"mo":2},{"i":"48371729","t":"广西人习惯年三十早上洗澡.婶婶一早就过来操持年夜饭.今晚有八个人一起:我们一家三口,江表弟一家三口,奶奶,二姑姑.我:老爸,作别人媳妇真可怜,过年忙死了.干脆我不嫁人了~爸:明显受到惊吓的表情...","d":"2010.02.13","y":2010,"mo":2,"c":3},{"i":"48222420","t":"我以后还是不要嫁太远好了,不然回家都难.即便我移民,把他们都带出去,但强迫两个老人家适应国外生活是很困难的.以后出去读书,获得工作经验,最后成家立业还是回成都来和爸爸妈妈待在一起最好.我不知道一个人如果连家都没有他还能有什么.","d":"2010.02.12","y":2010,"mo":2,"c":12},{"i":"48148135","t":"奶奶家也特别传奇.奶奶的爸爸是黄埔军校毕业的,国民党的军官,但因为一些原因没去台湾,就被整死了.诶,我们家的家庭成分真是...","d":"2010.02.12","y":2010,"mo":2},{"i":"47954122","t":"我们郑家的四姑奶奶来串门,讲起以前郑家是恭城最大的地主,占有1/3的土地,后来被扫地出门,就彻底败落了.我爸的大伯是国民党的军官,后面逃去台湾.老宅被推平,所有的东西都被那些孙子抢走破坏了.","d":"2010.02.12","y":2010,"mo":2,"c":1},{"i":"47946492","t":"我妈特幼稚~她那么幼稚还非不让人家说她幼稚~她非要自己偷偷的幼稚还不要别人揭穿她~","d":"2010.02.12","y":2010,"mo":2,"c":1},{"i":"47896764","t":"我爸是嘉字辈,郑家独苗.我是乐字辈,但是是女孩.我们家家庭成分不好,就没有按祖宗规矩起名.本来我爷爷叫郑继文,我跟他一字之差不合适.","d":"2010.02.12","y":2010,"mo":2,"c":2},{"i":"47881055","t":"我宁愿去吃石记米粉店都不要再来菜市场,而且今天风特大~","d":"2010.02.12","y":2010,"mo":2},{"i":"47851495","t":"二姑姑去做脸,抽到港澳豪华游~她和我妈要一起去~我也要去~But她们要是等圣诞前大打折再去我就没戏了~","d":"2010.02.12","y":2010,"mo":2,"c":1},{"i":"47828822","t":"我们在阳朔吃的40/斤的毛骨鱼,在恭城只要7~8块,茶江边水库边甚至只要5元/斤...TAT我们上当受骗了~注意,毛骨鱼是没有鳞没有小刺通身很黑的,不要被鲶鱼骗了~","d":"2010.02.12","y":2010,"mo":2},{"i":"47691685","t":"我妈对笑话的反应永远慢半拍,我爸刚讲了个特冷的笑话,本来不好笑,但我妈完全没听懂,这就变得非常好笑了~","d":"2010.02.11","y":2010,"mo":2},{"i":"47685306","t":"刚在下面烤火,顺便看<猎鹰1949>,一部充满喜感的电视剧.正好大结局,我从头笑到尾快抽过去了~从编剧剧情到演员演技都是笑话~杯具呐~","d":"2010.02.11","y":2010,"mo":2,"c":1},{"i":"47609197","t":"如果你只晓得荔浦芋头,那么请自觉承认你out了.如果你不晓得沙田柚是哪里的?那么请自觉加入怪兽的行列~恭城芋头很好吃~沙甜柚很有名~","d":"2010.02.11","y":2010,"mo":2},{"i":"47579179","t":"#微博意见反馈#,MS微博粉丝地域性很强?我的粉丝大部分都是四川的.豆瓣就不会这样~我又没有一天到晚跟李伯清似的讲评书...","d":"2010.02.11","y":2010,"mo":2,"c":3},{"i":"47568214","t":"我真的有朝灭绝师太发展的嫌疑.我对所有的小朋友小动物都只想远观不愿亵玩.一个肉乎乎毛茸茸还有体温的小玩意是非常惊悚的.Gosh,我肯定是Dink女~","d":"2010.02.11","y":2010,"mo":2},{"i":"47561854","t":"Once,某全:你们女生是不是都喜欢打篮球的男生?我:貌似是.某全:你看得懂不?我:你觉得呢?某全:...","d":"2010.02.11","y":2010,"mo":2,"c":2},{"i":"47559522","t":"我对篮球一无所知,所以跟小江同学保持沉默.唯一的对话就是:江:表姐好~我:你是谁?","d":"2010.02.11","y":2010,"mo":2},{"i":"47557577","t":"是,我承认我是正太控~不仅萌610,还萌小江同学~","d":"2010.02.11","y":2010,"mo":2},{"i":"47513792","t":"在这个小县城里能把我困得无聊死.这几天或许就是透支了我今年全部的休息时间.好后悔没带作业来,现在闲得发慌.","d":"2010.02.11","y":2010,"mo":2,"c":1},{"i":"47498946","t":"网页链接","d":"2010.02.11","y":2010,"mo":2,"c":10},{"i":"47491283","t":"\"如果天空下起雨，没有客人，窗帘被吹起    我们就趴在窗台，托着脑袋，等彩虹来    DA DADADA  \"","d":"2010.02.11","y":2010,"mo":2,"c":3},{"i":"47489128","t":"从豆瓣一直妖孽到这~快来看看  @我们爱讲冷笑话  的微博 错误提示 微博-随时随地发现新鲜事","d":"2010.02.11","y":2010,"mo":2},{"i":"47488557","t":"解散我的豆瓣\"字抱字弃\"小组.原因是0组员.小组描述是:如果拍拖是为了根治孤独,不如一个人走路,一个人寂寞.","d":"2010.02.11","y":2010,"mo":2,"c":5},{"i":"47485161","t":"#鲤,因爱之名# 网页链接","d":"2010.02.11","y":2010,"mo":2},{"i":"47483119","t":"#鲤,逃避# 网页链接","d":"2010.02.11","y":2010,"mo":2},{"i":"47481971","t":"\"她在我的左边,在我的右边,在我的无处不在\"","d":"2010.02.11","y":2010,"mo":2},{"i":"47286429","t":"二姑姑讲,我爸从小都是好孩子.在他两岁的时候,我的亲爷爷就去世了,继爷爷人不好.我爸从小挑水打柴,成绩还特别好.他没有读初三,直接上高中.他初中在乡下没学过英语,上高中才学.他的成绩从来都是恭城县前5名,非常刻苦,那时还没有加分.","d":"2010.02.11","y":2010,"mo":2},{"i":"47282880","t":"在恭城瑶族自治县,所有的高考考生都有20分加分,不管是不是少数民族.并且恭城中学非常好,所以升学率相当高.","d":"2010.02.11","y":2010,"mo":2,"c":1},{"i":"47273179","t":"茶江特别清,特别美,似乎是漓江的上游,没有游客,倒是县城老街上的人和船上人吃住洗都在这江水里.","d":"2010.02.11","y":2010,"mo":2,"c":2},{"i":"47252535","t":"亲爱的二姑姑要带我去茶江边走走~","d":"2010.02.11","y":2010,"mo":2},{"i":"47241179","t":"刚喝了三碗油茶,还吃了好几块船上粑,我是恭城妹仔嘛~油茶就是喜欢的人会很喜欢,不喜欢的人闻都闻不得.奶奶还在油茶里打了一条泥鳅,我受到了惊吓~","d":"2010.02.11","y":2010,"mo":2,"c":6},{"i":"47226508","t":"今天开始彻底的降温了,降幅很大,昨天30度,今天可能只有13度.经历洗澡风波以后,我马上下楼喝油茶.恭城油茶很特别,也蛮出名.地道的恭城人一日三餐连宵夜都离不了它.","d":"2010.02.11","y":2010,"mo":2},{"i":"47093847","t":"在恭城这样的小县城生活成本居然很高,比桂林高一些,甚至有些比成都都高.小县城也有点乱,这地方不太好.","d":"2010.02.10","y":2010,"mo":2},{"i":"46847729","t":"房间地板都特别潮,南风天气.不过明天之后就会冷下来,天气变化光怪陆离了~","d":"2010.02.10","y":2010,"mo":2},{"i":"46773237","t":"到达恭城,我好困.","d":"2010.02.10","y":2010,"mo":2},{"i":"46748170","t":"我只要再多一个粉丝就是250了,所谓量变到一定程度引起质变...","d":"2010.02.10","y":2010,"mo":2},{"i":"46738985","t":"特别特别拥挤的超载中巴车,怎么广西人也可以那么多,而且都是去恭城?","d":"2010.02.10","y":2010,"mo":2},{"i":"46724167","t":"我们刚坐了摩的,吹惨了~现在在加油站拦车去恭城...","d":"2010.02.10","y":2010,"mo":2,"c":3},{"i":"46704917","t":"有钱有闲才有旅游,象是西街上惬意的鬼佬.","d":"2010.02.10","y":2010,"mo":2},{"i":"46703765","t":"去找地方吃饭也别去那种全是当地人的地方,特别是米粉店.当地人图便宜,反而不注重味道.阳朔没有特别好吃的东西,那些川菜店人倒是多,但我们怎么可能跑那么远来吃川菜?简直是笑话...所以,去吃MC叭~(- -|||)","d":"2010.02.10","y":2010,"mo":2},{"i":"46701906","t":"这个季节没有板栗肉粽?诡异...上次我和我妈也是这时候来的,还吃了好几个呢,特别好吃~","d":"2010.02.10","y":2010,"mo":2},{"i":"46701109","t":"建议不要吃阳朔的啤酒鱼,尤其是西街上的什么什么大姐啤酒鱼,毛骨鱼剑骨鱼都是假的,而且不好吃.要吃就去农家,不过啤酒鱼这种做法本身就是很一般.不过也许是我们的四川舌头刁钻了~","d":"2010.02.10","y":2010,"mo":2},{"i":"46675521","t":"在阳朔的金龙寨吃饭~","d":"2010.02.10","y":2010,"mo":2,"c":3},{"i":"46635412","t":"遇龙河太远了,我们半途而废了,打算回西街喝咖啡~李萍咖啡屋特多老外.","d":"2010.02.10","y":2010,"mo":2},{"i":"46360773","t":"我爱阳朔~以后一定要和一堆有意思的朋友一起来泡吧尽情high~","d":"2010.02.09","y":2010,"mo":2,"c":2},{"i":"46294487","t":"在西街老街坊吃毛骨鱼~","d":"2010.02.09","y":2010,"mo":2},{"i":"46279075","t":"推荐游漓江竹筏的黄大姐13471263729~","d":"2010.02.09","y":2010,"mo":2},{"i":"46259169","t":"郑牛哥和殷三姐,带着蔚六妹,漓江童话~美不胜收~","d":"2010.02.09","y":2010,"mo":2,"c":1},{"i":"46256482","t":"坐竹筏漂流漓江,我妈拼命杀价,三个人,一个小时35块~老广说话很有水分~漓江比画美~","d":"2010.02.09","y":2010,"mo":2},{"i":"46241511","t":"红星特快不好吃~我和我妈五年前就吃过了,居然还长盛不衰,真是不可思议~","d":"2010.02.09","y":2010,"mo":2},{"i":"46224135","t":"最后住在双月桥客栈,价钱最低,有家庭间,离西街最近.Anyway,当然无论如何都不能与懒人堂相比,不过就一晚上,就这样叭.","d":"2010.02.09","y":2010,"mo":2,"c":4},{"i":"46208818","t":"懒人堂很好,我很喜欢,但我妈不喜欢,说华而不实,郁闷.以后我自己来住~","d":"2010.02.09","y":2010,"mo":2},{"i":"46156029","t":"在温暖如春的阳光中华丽丽的降临阳朔~我要群魔乱舞了~","d":"2010.02.09","y":2010,"mo":2},{"i":"46071269","t":"@懒人堂,我是Maxine,请预留房间到下午六点,我们马上出发去阳朔~","d":"2010.02.09","y":2010,"mo":2},{"i":"46052812","t":"叠彩山里的百鸟园,八哥说:客官客官,吃嘎嘎~成都世纪城大酒店里电梯口有个八哥会说:你好,你好,老板好~","d":"2010.02.09","y":2010,"mo":2},{"i":"45991456","t":"我们到了叠彩山,据说可以俯看桂林市景.就在这里拍照片发给Kitty好了~","d":"2010.02.09","y":2010,"mo":2,"c":1},{"i":"45975044","t":"刚有个小日本在柜台问游漓江,我爸在办退房,很niubility的说不给鬼子作翻译~其实是他口语太烂...","d":"2010.02.09","y":2010,"mo":2},{"i":"45972693","t":"征婚者：“你从哪里来？”  罗玉凤：“我从地球来”  征婚者:\"好巧我也是“。 @段子","d":"2010.02.09","y":2010,"mo":2},{"i":"45923664","t":"MichellePhan教你化妆之Lady Gaga Bad Romance Look  网页链接","d":"2010.02.09","y":2010,"mo":2},{"i":"45201125","t":"阳朔西街酒店如何？吵了点？","d":"2010.02.07","y":2010,"mo":2},{"i":"45199663","t":"我挺喜欢阳朔懒人堂的。但我妈就是不同意...她逆反~","d":"2010.02.07","y":2010,"mo":2},{"i":"45172732","t":"桂林的天气不错。比成都暖和一些。我妈一直记得上次来桂林很冷，不过我觉得蛮好。","d":"2010.02.07","y":2010,"mo":2,"c":1},{"i":"45169777","t":"徒步漓江？","d":"2010.02.07","y":2010,"mo":2},{"i":"45168026","t":"来桂林旅游的似乎很少有回头客。光靠有限的风景，旅游业很难有更多发展。","d":"2010.02.07","y":2010,"mo":2},{"i":"45166416","t":"沿着中山路走，去吃了肥仔街坊书香菜馆，很不错~推荐一下。","d":"2010.02.07","y":2010,"mo":2},{"i":"45165878","t":"05年春节，小学毕业前也来过桂林。5年了，感觉也没什么变化。似乎桂林“没有”发展。","d":"2010.02.07","y":2010,"mo":2},{"i":"45165274","t":"住在城市便捷，挺不错，比天津的香槟小镇和成都的IBIS都好。","d":"2010.02.07","y":2010,"mo":2},{"i":"45044745","t":"终于到达桂林了。住在城市快捷。一会儿出去觅食~","d":"2010.02.07","y":2010,"mo":2,"c":4},{"i":"44967438","t":"已经在广西境内了,六点到桂林就去吃米粉~去石记米粉店~","d":"2010.02.07","y":2010,"mo":2},{"i":"44965401","t":"风水...好诡异~","d":"2010.02.07","y":2010,"mo":2},{"i":"44891450","t":"记得一种叫\"水晶之恋\"的果冻.","d":"2010.02.07","y":2010,"mo":2,"c":1},{"i":"44616340","t":"看着事不关己的幸福,也有甜蜜.我想我还是心甘情愿的嫁给你.只是哪里找得到你.但心里默认着,身心都归属于你.会不会应了那写在<圣经>扉页的谶语.Darling,I love u, which will never change until death.","d":"2010.02.06","y":2010,"mo":2},{"i":"44606471","t":"处女情结?","d":"2010.02.06","y":2010,"mo":2},{"i":"44435860","t":"我绝对不会让这种事情在我今后的人生中发生第二次.","d":"2010.02.06","y":2010,"mo":2},{"i":"44435591","t":"火车站是不把人当人的地方.根本不人道,也根本不以人为本.所以说,坐这次火车也好,告诉我,现在不努力,以后就挤一辈子火车,毫无尊严可言.","d":"2010.02.06","y":2010,"mo":2},{"i":"44420469","t":"第一次坐火车延误,真是无语.其实我的外公外婆都是铁路上的,外公大学学土木工程的桥隧,是铁路设计院院长.不过可惜他的三个子女都不从事铁路这行.我对火车没好感,小学是铁路子弟学校.郁闷呐~有闷人又多又无聊~","d":"2010.02.06","y":2010,"mo":2},{"i":"44362176","t":"我的神,疯了.为了带那几瓶五梁液,我们家三口加入了浩浩荡荡的春运火车大军...简直是个笑话...","d":"2010.02.06","y":2010,"mo":2,"c":2},{"i":"44264915","t":"回到桂林就可以跟净玄猫小朋友一起妖孽了~我们骨子里流着真正相同的罪恶的血液~","d":"2010.02.06","y":2010,"mo":2},{"i":"44256053","t":"在阳朔可能住在懒人堂。要是有可以一起的小盆友就联系我~","d":"2010.02.06","y":2010,"mo":2},{"i":"44241251","t":"#桂林#周一全天至周二半天，桂林市区游。周二下午去阳朔。周三在阳朔。周四去恭城。有一起的么？","d":"2010.02.06","y":2010,"mo":2},{"i":"44203787","t":"到上大学,我还有十九个月可以来把头发养长~总有一条要变成贞子把你们吓死~还有我要多吃木瓜牛奶,不管喝什么饮品都要目光的~我就不信了~摆脱BOBO头太平公主的称号~","d":"2010.02.06","y":2010,"mo":2},{"i":"44202666","t":"曾经有一次特\"心碎\",我和全哥保持安全距离既没拉又没扯很正常的一起走,迎面碰上鹏哥(我暗恋他整一个月,我们班的),然后那两人特哥们儿的拥抱了下,鹏哥还给全哥使眼色,他死活没理我~TAT~什么叫喜欢我的我不耐,我耐的不喜欢我~杯具...","d":"2010.02.06","y":2010,"mo":2},{"i":"44201495","t":"Kitty一大清早就跟我汇报,我曾经默默喜欢过的和喜欢过我的男生都投入了长发的it girls的怀抱,而我这BOBO头的太平公主默默的在角落里被遗忘了...","d":"2010.02.06","y":2010,"mo":2,"c":1},{"i":"44099101","t":"想念是不被苛责的,因为想念只是一个人的爱情.甚至你爱的不是那个人,而是自己的回忆.我知道有些事情搁浅在潜意识里,有意无意都存在着,会不时浮出看似平静的水面.但我的航向不因此改变.你只是我不灭的风景.","d":"2010.02.05","y":2010,"mo":2},{"i":"44049303","t":"桐梓林家乐福特别和谐,从来都是中国人外国人很多人.前年地震后我们疯狂抢购方便面面包和矿泉水,水没有了抢牛奶,牛奶没有了抢啤酒...当时许多老外还买了很多东西要运到灾区去,很感动.","d":"2010.02.05","y":2010,"mo":2},{"i":"44047268","t":"今天在超市强迫我爸给我和我妈买费列罗,我爸宁死不屈~(-_-|||)去年喜欢明治的巧克力,还收到了两盒德芙,虽然不是在情人节.今年我和我妈自己买脆香米,惨~","d":"2010.02.05","y":2010,"mo":2},{"i":"44043872","t":"因为我养成了一边说话一边戳我爸肚子的坏习惯,所以我爸也养成了一边回答我说的话一边摸肚子的习惯...","d":"2010.02.05","y":2010,"mo":2},{"i":"43897194","t":"妈咪一个新疆同学从库尔勒寄了好多好多的果脯干果过来~太有爱了~But不是那个我觉得很帅很帅的当年他们班班草的叔叔寄的~","d":"2010.02.05","y":2010,"mo":2,"c":1},{"i":"43881839","t":"最后决定,带上政治题,语文英语背诵清单...我的人生超脱了~像我这么有觉悟的好孩子全宇宙哪里去找第二个~TT.TT...\"文化苦旅\"呐~回到恭城一定要去孔庙拜拜~","d":"2010.02.05","y":2010,"mo":2},{"i":"43856127","t":"谢天谢地,我终于搞完了数学.","d":"2010.02.05","y":2010,"mo":2},{"i":"43578614","t":"我要卖书.柳美里<魂>,吉本巴娜娜<甘露>,<暮光之城,暮色>,棉棉<糖><你的黑夜我的白天><声名狼藉>,Acosta<极地阳光>.全部正版全新,半价出售,买主负担邮费,还有近百本类似书籍.联系我vwv.zhw@gmail.com","d":"2010.02.05","y":2010,"mo":2,"c":3},{"i":"43576180","t":"今天晚上开始收拾行李,决定带上梁文道的<读者><常识>,萨冈的<你好,忧愁>.聊以解闷.","d":"2010.02.05","y":2010,"mo":2},{"i":"43573282","t":"我只要一做关于高考的梦,就会梦见自己没写作文.半夜三更被吓得一身冷汗,第二次了.","d":"2010.02.05","y":2010,"mo":2},{"i":"43468824","t":"我希望哈雷可以成为我的药, 让我停止这种无果无聊无谓的追忆. amen. 我相信我一定可以遗忘, 彻底干净且不留痕迹. 就像一切从未发生.","d":"2010.02.04","y":2010,"mo":2,"c":2},{"i":"43424816","t":"刚刚看完<阿凡达>,比我想象得好很多,某些桥段的确发人深省.或许明天我会试着写点什么.","d":"2010.02.04","y":2010,"mo":2},{"i":"43098021","t":"由厌恶转为同情。可怜之人必有可恨之处也可以被理解成可恨之人必有可怜之处。很可惜我对人缺乏同情心。如果不自我改变他只能恶性循环。","d":"2010.02.04","y":2010,"mo":2},{"i":"43002343","t":"小七的高考,最后是栽在文综上.而我明年高三下学期就必须回昆明了,文综的复习也不能参加.地理历史还比较有自信,但政治...回到昆明以后怕是也不敢跟着那些胡教的老师乱复习.真是麻烦,我希望在成都呆到最后,但又担心还是需要回昆明适应一下全国二卷.不过,到时候再说,先把手头上的事情做好.","d":"2010.02.04","y":2010,"mo":2,"c":3},{"i":"42965459","t":"郑大象四年前去了同济,追溯起来我们都是五百年前的郑家人~我叫郑小鲸好了~","d":"2010.02.04","y":2010,"mo":2},{"i":"42949915","t":"我们在彼此的以太中感知彼此.命运从来不乐善好施.我们的努力是在虎口夺食.上财~我爱你~","d":"2010.02.04","y":2010,"mo":2},{"i":"42884876","t":"睡眠于我变成一桩难题.","d":"2010.02.04","y":2010,"mo":2,"c":3},{"i":"42761988","t":"不等式+数列+函数=牛头马面","d":"2010.02.03","y":2010,"mo":2},{"i":"42748109","t":"平庸乏味是曲线救国.觉得苍白是清静与干净.我从未默许过自己可以单调庸碌.冬天是一场疾病,我会不药而愈.","d":"2010.02.03","y":2010,"mo":2},{"i":"42681823","t":"[2/2]欺压了~","d":"2010.02.03","y":2010,"mo":2},{"i":"42634133","t":"对于这12张(O My God)数学报纸,我打算做这样的处理.用两天左右的时间 35697980","t":"猴子喜欢柯南喜欢犬夜叉.我还在喜欢着柯南,却不再写作,也一直没看过犬夜叉.尽管戈薇和桔梗俩人,我会坚定的喜欢桔梗.猴子那里还保存一枚c送我的戒指,我与她却几乎失去所有联系.","d":"2010.01.26","y":2010,"mo":1},{"i":"33093900","t":"我真怕爸妈花费那么多代价在我身上我最后还考不过那些云南孩子.不过目前学习上面临的困境都是我可以解决的.我的语文功底好,数学逻辑好,政治哲学知识丰富.这三项该是我的抓分项呢,现在这个局面不会长久.我要取得突破.首先数学必须万分重视,语文也要系统整理,政治假期把世纪金榜总复习做了.","d":"2010.01.25","y":2010,"mo":1},{"i":"32736998","t":"巴豆哥哥付出百倍收获甚微,他几乎没进步空间了.不过我还是很羡慕他这次数学有了极大的提高.而我微小的向上爬了3分毫无作用.我每一科都大概的知道问题所在,但解决办法没有.历史地理已经接近满分没有空间了.英语要保140去.花时间不是,不花时间又怕下滑.其他的仨弱科一头雾水也不知道方法哪里不对.","d":"2010.01.25","y":2010,"mo":1},{"i":"32642034","t":"我从来都非常在乎自己的成绩.特别是今后回到昆明更要为了那张蓝表的榜首尽全力.这次的排名很与上次持平不升不降.因为语文政治数学的若项还是没有改变.一定要努力冲进前十~在昆明一定要拿到第一~我志在必得,要改变弱势~!","d":"2010.01.25","y":2010,"mo":1},{"i":"31799247","t":"某人应该自以为很适合<说谎>,但他绝对不是林宥嘉.谎言不能让他显得完美,反而是更卑鄙可憎.我做不到不拆穿.","d":"2010.01.25","y":2010,"mo":1},{"i":"31390935","t":"成都可以改叫雾都了...~","d":"2010.01.25","y":2010,"mo":1},{"i":"30602580","t":"躺在床上了,预备早睡.补课期间不想累着自己了.爸妈也一直嫌我有太晚睡休息不好导致事倍功半的嫌疑.晚安.","d":"2010.01.24","y":2010,"mo":1},{"i":"30422044","t":"补课这两天日子悠闲.老师们慢节奏的评讲试卷,不用再急促赶进度.而我们孩子早就放空了,跑步进入寒假状态.我没有再密密麻麻做题的动力.象征性的做寒假作业,然后抓紧时间胡思乱想.覃朗也说,这么舒服的日子以后不会再有了,要尽情享受~","d":"2010.01.24","y":2010,"mo":1,"c":3},{"i":"30414860","t":"不过比他幸福我过得更纯粹简单些.为了明年九月,可以站在上海,站在港大委培的浙大.我们都是以希望维系性命的孩子.","d":"2010.01.24","y":2010,"mo":1},{"i":"30407819","t":"小四的<我上高二了>几乎每年都会被不同的报刊杂志转载.我初二时看过第一次,今天又在假期作业的语文学习报上看到,不知道多少遍了.每年都有孩子高二,每个孩子都会面对同样的压力,面对眉睫之上的高三.所以\"这一切似乎没有改变其实一切都已改变的生命的罅隙\".","d":"2010.01.24","y":2010,"mo":1},{"i":"30159519","t":"9月13日的周记写在一个道林的本本上.现在要丢弃.其中一句话是\"似是彻彻底底变作了另外的人.还有种种种种,冥冥中,默默地给我新的模样.是欢喜又或悲忧,我担当成长的代价.\"掐日子算,当时应该是Doris说的我\"又冷又傲,大小姐脾气\"的时候.那段日子很孤单.","d":"2010.01.24","y":2010,"mo":1},{"i":"30015080","t":"在心里暗暗膜拜600高分以后必然去人大的小也君.我迷恋优秀的孩子.","d":"2010.01.24","y":2010,"mo":1},{"i":"30010097","t":"刚成功的狐假虎威的让小也君帮我擦黑板~小小的少女情怀一下下~~","d":"2010.01.24","y":2010,"mo":1},{"i":"29839625","t":"老王刚把我们拖出去班委会,我完全忘了宣传委员也是干部,然后巴豆哥哥铁面无私的把我这个芝麻官抓出去被老王唠叨...","d":"2010.01.24","y":2010,"mo":1},{"i":"29176057","t":"2010-01-24   网页链接","d":"2010.01.24","y":2010, ":1},{"i":"24356733","t":"书架上躺着一本毛尖的<当世界向右的时候>,我初二时在昆明买不到这书,就让舅舅从上海买给我.这书写的也是上海.舅舅本来是希望我高中在天津读完考到上海去.现在我在成都读完,也是一门心思奔上海~","d":"2010.01.16","y":2010,"mo":1},{"i":"24291463","t":"其实维维应该庆幸我没有赴约.我是给彼此留有余地,不然凭我现在的心性,当场刻薄起来多让他下不来台.","d":"2010.01.15","y":2010,"mo":1},{"i":"24279530","t":"c对我的解读,曾是善良单纯.尔后几乎没有人再这么评价过我.妈咪刚过来和我坐谈,不知道是想套我什么话.居叔叔太高估我太低估我和我妈的深厚感情了.我是最爱我爸妈的,对他们我能不隐瞒的都会如实相告,并且我妈还是我的心理医生.家是我最大归属感的存在,而且我目前简单明快.他不会了解的.","d":"2010.01.15","y":2010,"mo":1,"c":2},{"i":"24277036","t":"妈咪刚同学聚会回来,是跟居叔叔一起吃饭.他受维维的影响一直对我有偏见,觉得我太精明古怪?我躲了几次他设的饭局,不想跟他们有什么接触.我也不在乎他怎么想我的,这对我来说是微不足道的事.","d":"2010.01.15","y":2010,"mo":1},{"i":"24193333","t":"亲眼看到了&lt;闪耀年华&gt;和我的&lt;暖地&gt;.但是心里犯恶心,不愿意去看十三岁的自己究竟写了什么.我接受自己的过去,但是充满厌恶.我希望人生若只如初见.我喜欢光鲜完好的新的自己.过去的下场就是死去,不准跟我叙旧,不准提醒我什么.","d":"2010.01.15","y":2010,"mo":1},{"i":"24176552","t":"2010-01-15 17:22:32   网页链接","d":"2010.01.15","y":2010,"mo":1},{"i":"24174031","t":"SHUFE,","d":"2010.01.15","y":2010,"mo":1},{"i":"24131813","t":"老王其实没有骂我,他还安慰我来着.跟别人比,他对我很好了.","d":"2010.01.15","y":2010,"mo":1},{"i":"24124930","t":"爸妈要是知道我居然这点小打击都受不了肯定会骂死我.其实我知道这几天自己气焰嚣张肯定要受到挫折,幸好不是考试让我挫败.好了.正好把我的浮躁赶走.安心复习做题叭..","d":"2010.01.15","y":2010,"mo":1},{"i":"24110996","t":"你以为我想哭.我就是面子挂不住.","d":"2010.01.15","y":2010,"mo":1},{"i":"24079296","t":"也就是在这里在现在可以让我简单的生活着,虽然还是会想很多.但是就这样重复着有序的紧凑的生活,对成绩要有最多最多的功利追逐心.符合我的要求.但愿我可以做到.","d":"2010.01.15","y":2010,"mo":1},{"i":"24077550","t":"Doris觉得她对我的判断最准确.觉得我是本来不单纯的,但现在想单纯下来.是这样麽?或许叭.我觉得很难说清.","d":"2010.01.15","y":2010,"mo":1},{"i":"24034105","t":"传说下学期只有十六周,然后我们就正式上高三,下火海...今天已经开始发下学期的书了,期末考21号结束,23号还要补一周课.我还有什么话可说...","d":"2010.01.15","y":2010,"mo":1},{"i":"23946566","t":"我和林蝎蝎相互打击了~我爱看美女,学习穿衣技巧,被她骂色女~她喜欢狗狗,天天为了老板娘的京巴拖我去买蛋糕~...我们两个火树银花的女人...","d":"2010.01.15","y":2010,"mo":1},{"i":"23895296","t":"把该说不该说的话在微博上说尽,平时还是清明恬淡的姑娘.微博就是我的心理按摩,自我调节着.","d":"2010.01.14","y":2010,"mo":1,"c":4},{"i":"23888304","t":"2010-01-14   网页链接","d":"2010.01.14","y":2010,"mo":1},{"i":"23881779","t":"敛言而行.多事多话多是非.","d":"2010.01.14","y":2010,"mo":1},{"i":"23854766"," 测验了~(- -|||)p><q我上次800m和Y姐一起跑的,居然跑了四分半...泪...誓死不上田径场~","d":"2010.01.12","y":2010,"mo":1},{"i":"23063522","t":"伪君子的毒性远远大于真小人.","d":"2010.01.12","y":2010,"mo":1},{"i":"23037122","t":"这才高二呢,就每天发十几张卷子,到高三还得了?!天呐...八分钟后又又又要考数学...To be or not to be, it's a question.","d":"2010.01.12","y":2010,"mo":1},{"i":"23027801","t":"找天气作为造成自己情绪低落的元凶是最不靠谱的.在成都很容易得SAD,不过也没有谁规定晴天就一定要有好心情.","d":"2010.01.12","y":2010,"mo":1},{"i":"22960576","t":"最令人讨厌的不是扶不起的阿斗,而是你以为可以寄予希望但他马上会让你失望的废柴,最可恨.","d":"2010.01.12","y":2010,"mo":1},{"i":"22950987","t":"你看着某人的邮箱地址,作出最坏的也是不得不的以为,你觉得他一定是死去了.就算现实里他没有,在你心里他也必须消失.","d":"2010.01.12","y":2010,"mo":1,"c":3},{"i":"22924230","t":"事不宜迟,不过也不便现在展开.方法论里统筹兼顾的条款必须要执行.我不是为了这一片刻的自己活着,而是为了今后的每一须臾.这是我必须承担的责任.","d":"2010.01.12","y":2010,"mo":1,"c":1},{"i":"22922807","t":"屏蔽所有不该出现的物质.一方面我不做败家女,一方面我不干蠢事.这学期还剩两三周,结尾要漂亮.","d":"2010.01.12","y":2010,"mo":1},{"i":"22921590","t":"强大执行力所依赖的不仅仅是手段到位,更要拼意志力.正如莲所说.把\"我想...\"的句型改成\"我要...\"的口气,就会知道接下来自己该怎样做.","d":"2010.01.12","y":2010,"mo":1},{"i":"22920104","t":"计划的拟定作用不光是让你事后反省中途做错了多少,最重要的是指明方向,界定该与不该.杜绝意外,就是谋杀所有生长意外的条件.","d":"2010.01.12","y":2010,"mo":1},{"i":"22919358","t":"所有的意外都是由无计划的盲目造成.而意外的重叠会导致某种令人抓狂的秩序.整理自己的条理,生活里不要意外,只会获得惊喜.","d":"2010.01.12","y":2010,"mo":1},{"i":"22916456","t":"讨厌一个人就是你很真诚的认为,他是一个疯子.","d":"2010.01.12","y":2010,"mo":1},{"i":"22768785","t":"妈咪问过我为什么把文学社叫做暖地.我只说暖地是温暖之地.兴办文学社当时是被模联社团刺激的,以及研究性学习我选择的课题.似乎是想到要办文学社的同时,就想到暖地.","d":"2010.01.11","y":2010,"mo":1},{"i":"22543646","t":"陈梁同志新语,愚公移山就是想改变一下气候类型...- -|||","d":"2010.01.11","y":2010,"mo":1},{"i":"22405925","t":"政治哲学部分客观题,难在诗歌名句的哲学观点,考的不是政治,是语文.地理人文部分主观题,难在它考的不是地理,考的是政治...","d":"2010.01.10","y":2010,"mo":1},{"i":"22333141","t":"老王说的对,课改,千改万改,高考绝对不改.","d":"2010.01.10","y":2010,"mo":1,"c":1},{"i":"22123333","t":"目前的交易非常公平.凭什么用两年的努力改变一生,就是凭这每一天的积累.苦与累是必然的代价,每个孩子都要付出,并且依据各自付出程度收获未来.努力并不是一种悲观情绪.况且我有高考移民优势,不必太担心.晚安,今天早些休息.","d":"2010.01.09","y":2010,"mo":1},{"i":"22006635","t":"五点的时候去看<第十放映室>,应该差不多这个时间.这周是我的Miranda小姐,The devils wears Prada一直鼓舞着我~","d":"2010.01.09","y":2010,"mo":1,"c":1},{"i":"21992730","t":"咖啡对心脏的影响减少,但似乎在影响着我的骨头.腰部,尾椎骨的地方酸痛.是坐姿太久引起?还是?看着作业我就想哭.","d":"2010.01.09","y":2010,"mo":1,"c":1},{"i":"21913248","t":"用Lily Allen与她的Chanel包做桌面.我有随时随地随心换桌面的嗜好.Lily一款熊猫水钻眼妆的演唱会图没有找到.","d":"2010.01.09","y":2010,"mo":1,"c":2},{"i":"21827554","t":"用完了一个mateist A5的本本,极简风格,写起来很舒服.四川的孩子似乎都不喜欢上海,我说想去上财时他们都觉得我发烧了...他们都要去北京.不过似乎云南孩子还对上海挺有感觉.不知原因的现象.","d":"2010.01.08","y":2010,"mo":1},{"i":"21778309","t":"要把我的笔记做得美美的全全的有用的,高三好用,高考完了好卖~","d":"2010.01.08","y":2010,"mo":1,"c":15},{"i":"21769994","t":"@微博小秘书,如何在微博上传视频?","d":"2010.01.08","y":2010,"mo":1},{"i":"21769470","t":"给自己的叮嘱:蔚宝,不去想想不清楚的事,不被无所谓的人所打扰.手中握紧的现在,就是给未来的一份答复.现在在辛勤笔耕着地理~A za a za~","d":"2010.01.08","y":2010,"mo":1},{"i":"21764349","t":"我所忍耐与担负的,是对自己的爱,信任与期待.","d":"2010.01.08","y":2010,"mo":1,"c":3},{"i":"21763048","t":"我是积极用世的孩子,但也并不像想象中那么明白自己的路.只知道光在远方,只知道手上的事必须完成.我要自己丰盛,这是一定要完成的愿望.在这个阶段我确定我的选择是为我的未来负责的.所以一定要走下去.","d":"2010.01.08","y":2010,"mo":1},{"i":"21761832","t":"在某人眼里,蔚可能是溺水的孩子,深深沉溺于现实.他或许是因为看不懂所以看得淡,也可能太清楚,我不愿意多做揣摩.\"眼角的余温低于体温,麻木的心无暇顾及单纯而幸福的细节\".呵,我们殊途却同归于某处.","d":"2010.01.08","y":2010,"mo":1},{"i":"21737746","t":"昨晚的邮件已经发送成功，我被Gmail忽悠了。呵，真是讽刺，还以为天意有什么转机。看来放弃是必然的必然。那么好吧。该说的我都说完了，够了。","d":"2010.01.08","y":2010,"mo":1,"c":1},{"i":"21678274","t":"一整个宇宙换一颗红豆.2010天秤的忠告:我的决定决定我是谁.","d":"2010.01.08","y":2010,"mo":1},{"i":"21629960","t":"总结了一下我每天跟爸妈打电话的模式:.我:妈咪~你想我没?妈:你想我没有嘛~我:当然想咯~妈:咦~你好肉麻~...爸:吃饭没?我:吃了.爸:有事没?我:没有.爸:在干嘛?我:做作业.爸:喔.我:拜拜.","d":"2010.01.08","y":2010,"mo":1},{"i":"21600543","t":"三狗刚说,我觉得你好乖喔,(喜~)像樱桃大丸子(悲~),以后我就叫你团子叭~(泪~高一就被郭同衰叫了一年团子,悲剧重演了...)","d":"2010.01.08","y":2010,"mo":1,"c":4},{"i":"21531558","t":"虽然这不是需要计较分数的大考,但...诶.算了.其实真实分数是考得还不错.不过没关系.数学我是有希望的.我可以的.","d":"2010.01.08","y":2010,"mo":1},{"i":"21530143","t":"第一节数学课就发卷子.无缘无故被批错了两个选择题,全班就我一个人.真是怪事.太打消我的积极性了...","d":"2010.01.08","y":2010,"mo":1},{"i":"21495210","t":"刚打算mail他说抱歉打搅我放弃,点击发送后gmail乐呵呵的跟我说service error发送失败.我不知道该有什么表情.天意?是否愚蠢了.明天下午,我给他最后的话.还没有谁,可以用空白的等待,消耗我的骄傲.","d":"2010.01.07","y":2010,"mo":1} ,"d":"2009.12.22","y":2009,"mo":12,"c":1},{"i":"16698874","t":"老王刚叽叽歪歪了半天头发的事,我同桌总结了一点,那是因为他自己没头发戴假发~简直深中肯綮~","d":"2009.12.22","y":2009,"mo":12},{"i":"16661386","t":"悲剧是我差一点点就要睡着的时候,闹钟响了~","d":"2009.12.22","y":2009,"mo":12},{"i":"16654078","t":"一月二十三日左右考试,市统考.初二时也是这一条.那么大概二月一号左右就可以回桂林老家了.上次回去都是05年小学六年级的寒假...","d":"2009.12.22","y":2009,"mo":12},{"i":"16570770","t":"网页链接","d":"2009.12.22","y":2009,"mo":12,"c":1},{"i":"16570695","t":"虽然不是苏菲,没有活在席勒的哲学书中,不被少校的想象力支配.但谁说命运不是公理呢,不被证明也不能推翻.你不知道下一秒又有什么情节.","d":"2009.12.22","y":2009,"mo":12,"c":1},{"i":"16396577","t":"我还是不得不以某人给我的记忆来纪元.比如,会跟随我一生的日期,20090702","d":"2009.12.21","y":2009,"mo":12},{"i":"16385787","t":"我对这个世界有越来越多的企图.因为过去太萌昧,现在就加倍的懂得.想起黄碧云的话,要努力活得丰盛,不能湮没在人群中.","d":"2009.12.21","y":2009,"mo":12,"c":1},{"i":"16328921","t":"初二时自己背<锦瑟>,只觉哀感顽艳,美到极至.现在高二真的来学,却无甚感慨,只觉酸诗一首.不过也是自己变了.以前梦想当作家,现在却非常鄙视卖文维生.越来越现实了.","d":"2009.12.21","y":2009,"mo":12},{"i":"16303561","t":"意志力是支配与鼓舞自己的驱动器.不能麻木了忙碌的意义.但同时空有志向眼高手低又很可悲.我要取恰好一个临界点.走下去.","d":"2009.12.20","y":2009,"mo":12,"c":1},{"i":"16266359","t":"与我家君君宝贝一起开了一个Blog,在blogbus,决定把以往的所有blog内容整理整理放到上面,并且坚持记录2010与2011这两年时光~","d":"2009.12.20","y":2009,"mo":12,"c":1},{"i":"16192266","t":"某种非常自私的想念是要绝对杜绝的.没有资格因为自己的如何如何就要去干扰别人平静的生活.而且或许现在的你什么也不是,时间早物是人非,你是个笑话","d":"2009.12.20","y":2009,"mo":12},{"i":"16129464","t":"99年我还是傻了叭叽的小学一年级小朋友,一晃十年了.","d":"2009.12.20","y":2009,"mo":12},{"i":"15837342","t":"终究不是属于我的.属于我的只有目前一须臾的现在.虽然我的理想不是我的愿望与兴趣,可是也必须达成.必须.我不像他们,我没有颓废的时间.过去的我过去了.我的时间只有顺时针的未来.","d":"2009.12.18","y":2009,"mo":12},{"i":"15836628","t":"我想找回他,不是因为空虚,而是想回归信仰.只是找不到可以找到他的路.641344090?什么咒语挥之不去,可惜无效了.","d":"2009.12.18","y":2009,"mo":12,"c":1},{"i":"15836133","t":"没有人可以让我脆弱的话,那我就必须让自己非常强势.","d":"2009.12.18","y":2009,"mo":12},{"i":"15835204","t":"这是我的路,没有人可以陪伴,没有人可以阻断,没有人可以停留,没有人可以改变.命令自己继续.","d":"2009.12.18","y":2009,"mo":12},{"i":"15833674","t":"目前的修行,是为了夺回我过去有的,侵占我现在失去的.","d":"2009.12.18","y":2009,"mo":12},{"i":"15720721","t":"要尽力爱惜自己,尽力不浪费每一个现在,要尽力谨慎安全的活着,要活的精彩,要为无限的未来活着,要坚强,要尽力快乐.我爱我的老爸和妈咪,我爱外公外婆和奶奶,我爱我自己.","d":"2009.12.18","y":2009,"mo":12,"c":2},{"i":"15712000","t":"这两天,回忆起地震的事,兼着今天这桩噩耗,深深感觉能够活着,现在,就是最大的恩赐.","d":"2009.12.18","y":2009,"mo":12},{"i":"15655393","t":"我后面的女生,我们年级第一,父亲去世了.那也是我们学校的老师.这件事给我非常沉痛的打击,昨天她还跟我说起她爸爸...我直接被吓哭了...","d":"2009.12.18","y":2009,"mo":12,"c":1},{"i":"15642928","t":"I take Vancouver as my Heaven from now~","d":"2009.12.18","y":2009,"mo":12},{"i":"15642635","t":"The awful side-effect on my heart of coffee-drinking has amazingly disapeared~Besides, it gives me so much optimistic energy~","d":"2009.12.18","y":2009,"mo":12},{"i":"15614522","t":"我有充分的改变自己的能力.因此我确信自己的路能带来我的愿望.我这一路有舍才有得,我知道每一步自己都是如何走过的.事物发展道路的哲理是前途光明,道路曲折,但方法论不是走弯路.我要坚持现在的自己,勤力向前冲~","d":"2009.12.18","y":2009,"mo":12},{"i":"15613238","t":"又是一轮新的降温天气,温暖永远有限的可怜.","d":"2009.12.17","y":2009,"mo":12},{"i":"15599897","t":"其实我的童话有且只有骗骗自己的功能~打败孤单与寂寞~明天就可以回成都了~","d":"2009.12.17","y":2009,"mo":12,"c":1},{"i":"15598825","t":"我是在宇宙的漩涡里,所以要以光速穿越地球,把六十七年七十六年的周期折合为零,就可以遇见我的哈雷了.So that they lived happily ever after,as a happy ending.","d":"2009.12.17","y":2009,"mo":12},{"i":"15597792","t":"很满意现在的自己没有把自己真正的脆弱暴露.thanks to我的不懂倾诉.也没有什么可说的,我找不到那个听我说的人.只是偶尔看书的时候会难过着发呆一阵子.一会儿就好了.因为我很忙~可笑的理由叭?","d":"2009.12.17","y":2009,"mo":12,"c":1},{"i":"15329400","t":"我的字不好看,尤其是在课堂在上赶着记录的时候.所以我习惯准备两个本本,一个供课堂乱涂乱画,另一个周末认真誊抄顺便复习补充.但现在对高三偌大的笔记量和用什么本子还没有主意.","d":"2009.12.16","y":2009,"mo":12,"c":1},{"i":"15271635","t":"我现在的举动只是一次一次证明这样是错的,还改不了.大概要严厉的惩罚措施才奏效.绝对不能纵容姑息.","d":"2009.12.16","y":2009,"mo":12},{"i":"15171608","t":"放弃与挽留都是在评估将来的彼此是否会有交集.我不能因为偶尔的脆弱就折损了自己去联系过去.这是自贬身价的.于我无益.","d":"2009.12.16","y":2009,"mo":12,"c":1},{"i":"15161811","t":"当然很多时候还是觉得自己是\"猪脑袋\"(腰孽攻语),比如完全没有空间感...","d":"2009.12.16","y":2009,"mo":12},{"i":"15107873","t":"温柔受说:下面我们请同学来证明一下,(三秒以后...)我看同学们都吓到了那还是我自己证叭...(全班倒~)","d":"2009.12.16","y":2009,"mo":12},{"i":"15045147","t":"在我可怜兮兮的新电话本里,八个人里竟然有七个名字是以L开头的~","d":"2009.12.15","y":2009,"mo":12,"c":2},{"i":"15038816","t":"终于跟妈妈说清楚了食堂的问题.今后我也的确要好好吃饭的.不能害了自己.","d":"2009.12.15","y":2009,"mo":12},{"i":"15029105","t":"我知道妈妈是为了我好让我好好吃饭,可我真的不想去食堂也不想去外面乱吃什么.我觉得现在的食物很健康,水果牛奶全麦面包度日有什么不好?而且周末回家又可以吃很多很多好东西,这不就够了麽?!","d":"2009.12.15","y":2009,"mo":12},{"i":"15002926","t":"讨厌的立体几何,Too two to two.","d":"2009.12.15","y":2009,"mo":12},{"i":"14986136","t":"刚快速的翻完<昕微>,把想要去买零食当晚餐的愿望打消得非常彻底~","d":"2009.12.15","y":2009,"mo":12,"c":1},{"i":"14962333","t":"现在在多功能厅,高二年级一到十五班女生心理讲座...","d":"2009.12.15","y":2009,"mo":12},{"i":"14899422","t":"羡慕班上唯一的一组班对,不管他们实际如何,但俩人能够彼此扶持一路前行着实不易.羡慕里也有我的一些私心,Hs smile is on the way to my heart.","d":"2009.12.15","y":2009,"mo":12,"c":6},{"i":"14887086","t":"大学设立养老系?开什么玩笑?又不是职高技校?!","d":"2009.12.15","y":2009,"mo":12},{"i":"14855109","t":"今天本学期第一次组织做操,高一两千人,我们高二一千七百人,塞满了四百米的操场,中国计划生育工作不到位...","d":"2009.12.15","y":2009,"mo":12},{"i":"14802918","t":"我想如果时间是战争的话,我在每一天胜利的忍耐与度过之后,终究会一败涂地.","d":"2009.12.15","y":2009,"mo":12},{"i":"14802535","t":"我懂得许多事故是无意义的.比如追忆过往与奢求未来.但有时能克制,有时又情不自禁.已经停止每日的记录几天,没有原因,就是不知道我该记得记录什么.","d":"2009.12.15","y":2009,"mo":12},{"i":"14798168","t":"我的归宿就是健康与才干,一个人终究可以信赖的,不过是他自己.(今天手机报上的话~)","d":"2009.12.14","y":2009,"mo":12},{"i":"14794851","t":"清溪远黛殷色虹,莞然低眉留不留.(我的不韵绝句~今天的语文作业~)","d":"2009.12.14","y":2009,"mo":12},{"i":"14773140","t":"我想,给自己设定哈雷的存在,便是一块警示牌的作用.要自己骄矜毋喜,忘记过去,全意向前走.所以说,I will never QUIT u,Halley.","d":"2009.12.14","y":2009,"mo":12},{"i":"14521212","t":"我愿意朝着这种未来前进,并努力做到.","d":"2009.12.13","y":2009,"mo":12,"c":2},{"i":"14470802","t":"我现在是非常深刻的体会着周日上学抑郁症.","d":"2009.12.13","y":2009,"mo":12},{"i":"14176041","t":"If the God replied my prayer,his answer could only be:NO.","d":"2009.12.12","y":2009,"mo":12},{"i":"14161068","t":"我知道如果不这么做我就一定会后悔.而我不会让后悔的悲剧重演.从这一点看我有隐约的天蝎气质,这是我维持理性并克服天秤闲散状态的唯一办法.说服自己静下心来,但也不要想太多给自己添麻烦.我很好,我在我的轨道上.","d":"2009.12.12","y":2009,"mo":12,"c":1},{"i":"14160400","t":"目前学习的意义就是改变.每周一次上网我都觉得恍惚不快,因为不再能找到自己的位置.许多人觉得我在湮没于主流价值观,我自己也觉得失去了过去特立独行的部分.但我认为这是我最好的取舍办法.目前高考是唯一指挥棒.","d":"2009.12.12","y":2009,"mo":12,"c":3},{"i":"14159487","t":"说不羡慕不嫉妒不在乎都是假的.不过这事情对我来说太小,也没有深究的必要.我不能总把心思放在无聊的事上,他的消失是挪开了我的绊脚石.","d":"2009.12.12","y":2009,"mo":12},{"i":"14134858","t":"命运有不可争辩的生杀予夺之权,但对于幸福的追求也是不可转让的天赋人权.我相信我可以努力可以达到我想要去往的金字塔尖端,活着不辜负时光的馈赠.看清这个世界,并爱它如己.","d":"2009.12.12","y":2009,"mo":12},{"i":"14134301","t":"晚上烦乱无心作业,刚看完<2012>,我第一次看完灾难片.宇宙与人心都是无限.我们存在的意义就是存在.用心度过时间,就没有遗憾.晚安.","d":"2009.12.12","y":2009,"mo":12},{"i":"14075802","t":"热闹是他们的,我一无所有.","d":"2009.12.11","y":2009,"mo":12,"c":2},{"i":"13984169","t":"如果政治课Candy抽我背哲理,我就立马装死~","d":"2009.12.11","y":2009,"mo":12},{"i":"13982111","t":"下午有政治,今天中午没睡觉晚上也一点才睡怕熬不住,又投入咖啡的怀抱.我就不信我的心脏差到这个地步一点点咖啡因都受不了.早上被Blair指出我的黑眼圈和黄头发觉得好可怜,可没办法~","d":"2009.12.11","y":2009,"mo":12},{"i":"13934013","t":"刚溜达到高一雅居乐楼那儿,那些孩子活蹦乱跳的又比赛又社团...年轻就是好~我老了...也就是星期五课间才不忙着做作业能出去走走了...","d":"2009.12.11","y":2009,"mo":12,"c":1},{"i":"13873480","t":"明天想买些小羊角面包和豆沙糕带回家,周末完美假期~","d":"2009.12.10","y":2009,"mo":12},{"i":"13857177","t":"成年以后一定要拥有一双Miu Miu高根鞋.明年十七岁生日妈咪会送我一身旗袍.","d":"2009.12.10","y":2009,"mo":12},{"i":"13856386","t":"成年以后一定要拥有一双Miu Miu的高根鞋.明年生日妈咪答应送我一身旗袍.","d":"2009.12.10","y":2009,"mo":12,"c":1},{"i":"13854948","t":"热爱Lady Gaga,皇帝柑与栗子饼.","d":"2009.12.10","y":2009,"mo":12,"c":1},{"i":"13830002","t":"借鲁迅之口抒我对实外高尔夫球课的感想:我已无话可说.我后面的女生初中也是实外,觉得有曾经沧海难为水的感觉.特别是看到DRINK ME以后,我沸腾了,她烧着了.","d":"2009.12.10","y":2009,"mo":12,"c":1},{"i":"13815364","t":"八十分钟的数学限时作业太难~最终全班拒绝交卷...温柔受没办法只好把卷子变成作业...可就算我晚上不睡觉想到爆也做不完嘛...","d":"2009.12.10","y":2009,"mo":12},{"i":"13740599","t":"语文书第三册p30注释9有误,语文读本第三册p129注释2有误.不过没关系了,孩子们都在用新教材了,新教材就是个笑话,我的高一就是被课改新教材毁了.","d":"2009.12.10","y":2009,"mo":12},{"i":"13727347","t":"我们教室所在的这幢综合楼横幅由\"不比阔气比志气,不比现在比未来,不比聪明比勤奋\"变成\"读书点燃激情,共建书香氛围\"...","d":"2009.12.10","y":2009,"mo":12,"c":1},{"i":"13720619","t":"下午似乎有广播操比赛,虽然是我在天津已经做过一年的操,但为了\"合群\"还是不想好好做.","d":"2009.12.10","y":2009,"mo":12},{"i":"13635362","t":"限时作业=定时炸弹 英语也\"限\"了,老师们都赶在一周快结束但大家归心还未起的周四来考试, 我们只有任由宰割的份...","d":"2009.12.10","y":2009,"mo":12,"c":3},{"i":"13607826","t":"其实我并不确定,也不知道是否应该与可以,作内个冒险家,赌c你还在那里,赌你仍旧可以给我慰籍.但我畏惧会失却自己的衿傲,况且联系到你的机会如此微茫.我知道我们必将输给时间.","d":"2009.12.10","y":2009,"mo":12,"c":1},{"i":"1 function hl(node,text){

 el.appendChild(f);return el}

function more(){
